  if (tg) return [['telegram', 'Светлая тема', {theme: 'light'}], ['telegram', 'Тёмная тема', {theme: 'dark'}]];
  if (ig && kind === 'reel') return [['reels', 'Reels', {}], ['grid', 'Сетка профиля', {}], ['story', 'История-анонс', {}]];
  if (ig) return [[kind === 'carousel' ? 'carousel' : 'feed', kind === 'carousel' ? 'Карусель в ленте' : 'Лента', {}], ['grid', 'Сетка профиля', {}]];
  return [[kind === 'reel' ? 'reels' : 'feed', 'Как в ленте', {}]];
}
function nxBlock(host, {caps, kind, base, seen, onSeen, ask}) {
  if (!window.Preview) return;
  const rows = caps.map((c, i) => {
    const views = nxViews(c.platform, kind);
    const warn = views.reduce((n, [v, , o]) => n + Preview.checks(v, {...base, ...o, caption: c.text, platform: c.platform}).length, 0);
    const key = `${c.platform || 'Площадка'}`;
    return {c, i, views, warn, key, seen: seen?.[key]};
  });
  const box = document.createElement('div');
  box.className = 'blk';
  box.innerHTML = `<span class="lbl">Как увидят · пролистай каждую площадку как подписчик</span>
    ${rows.map((r) => `<div class="nx-row"><span style="flex: 1; min-width: 0"><b>${esc(r.c.platform || 'Площадка')}</b>${r.c.account ? ` <span class="small muted">${esc(r.c.account)}</span>` : ''}<div class="small muted">${r.views.map((v) => v[1]).join(' · ')}</div></span>
      <span class="nx-st ${r.warn ? 'w' : r.seen ? 'ok' : ''}">${r.warn ? `⚠ ${r.warn}` : r.seen ? '✓ видел' : ''}</span><button type="button" class="btn" data-nx="${r.i}">${svg('eye', 14)}${r.seen ? 'Ещё раз' : 'Открыть'}</button></div>`).join('')}
    ${rows.some((r) => !r.seen) ? '<span class="small muted">Отметка «видел» ставится, когда открыл площадку и пролистал её.</span>' : ''}`;
  host.prepend(box);
  box.querySelectorAll('[data-nx]').forEach((b) => (b.onclick = () => nxOpen(rows[Number(b.dataset.nx)], base, onSeen, ask)));
}
function nxOpen(row, base, onSeen, ask) {
  let at = 0, zones = true, slide = 0;
  const ov = document.createElement('div');
  ov.className = 'nx-ov';
  const draw = () => {
    const [v, label, o] = row.views[at];
    const opts = {...base, ...o, caption: row.c.text, platform: row.c.platform, account: row.c.account || base.account, zones, slide};
    const warns = Preview.checks(v, opts);
    ov.innerHTML = `<div class="nx-box" role="dialog" aria-label="Как увидят: ${esc(row.c.platform || '')}"><div>${Preview.frame(v, opts)}</div>
      <div style="display: flex; flex-direction: column; gap: 14px; min-width: 0"><div class="row"><b style="font-size: 18px; flex: 1">${esc(row.c.platform || 'Площадка')}</b><button type="button" class="btn" id="nxX" aria-label="Закрыть">✕</button></div>
        <div class="tabs" style="margin: 0">${row.views.map((x, i) => `<button type="button" class="${i === at ? 'on' : ''}" data-v="${i}">${esc(x[1])}</button>`).join('')}</div>
        ${['reels', 'story'].includes(v) ? `<label class="row small" style="gap: 8px"><input type="checkbox" id="nxZ" ${zones ? 'checked' : ''}>Зоны «не ставить текст» — штриховкой</label>` : ''}
        ${v === 'carousel' && (base.slides || []).length > 1 ? `<div class="row" style="gap: 6px"><button type="button" class="btn" id="nxPrev">‹</button><span class="small muted">слайд ${slide + 1} из ${base.slides.length}</span><button type="button" class="btn" id="nxNext">›</button></div>` : ''}
        ${['reels', 'story', 'grid'].includes(v) && base.kind === 'reel' && !base.reel?.template && ask ? `<div class="small muted" style="display: flex; flex-direction: column; gap: 6px">Ролик собран без шаблона — где стоят плашки, по геометрии не узнать.<button type="button" class="btn" id="nxAsk" style="align-self: flex-start">Попросить Claude проверить зоны</button></div>` : ''}
        ${warns.map((w, i) => `<div class="nx-warn"><span>⚠ ${esc(w.text)}</span>${ask ? `<div class="row" style="gap: 8px"><button type="button" class="btn" data-fix="${i}">Исправить</button><span class="small">или выложить так</span></div>` : ''}</div>`).join('') || '<div class="small" style="color: var(--green)">✓ По геометрии всё на месте: текст вне интерфейса площадки, подпись читается.</div>'}
        <span class="small muted">Интерфейс нарисован студией для предпросмотра; цифры лайков и просмотров — для примера.</span>
        <div class="row" style="margin-top: auto; gap: 8px"><button type="button" class="btn primary" id="nxOk">✓ Видел</button>${at < row.views.length - 1 ? '<button type="button" class="btn" id="nxNx">Дальше: ' + esc(row.views[at + 1][1]) + '</button>' : ''}</div></div></div>`;
    ov.querySelector('#nxX').onclick = () => ov.remove();
    ov.querySelectorAll('[data-v]').forEach((b) => (b.onclick = () => { at = Number(b.dataset.v); slide = 0; draw(); }));
    ov.querySelector('#nxZ')?.addEventListener('change', (e) => { zones = e.target.checked; draw(); });
    ov.querySelector('#nxPrev')?.addEventListener('click', () => { slide = Math.max(0, slide - 1); draw(); });
    ov.querySelector('#nxNext')?.addEventListener('click', () => { slide = Math.min(base.slides.length - 1, slide + 1); draw(); });
    ov.querySelector('#nxNx')?.addEventListener('click', () => { at++; slide = 0; draw(); });
    ov.querySelectorAll('[data-fix]').forEach((b) => (b.onclick = () => { ask(warns[Number(b.dataset.fix)].fix); ov.remove(); }));
    ov.querySelector('#nxAsk')?.addEventListener('click', () => { ask(`Проверь текущую версию по зонам площадки «${row.c.platform}» (${label}): ${Preview.ZONES[v === 'grid' ? 'reels' : v]?.map((z) => `${z.label} — ${Math.round(z.x0 * 100)}–${Math.round(z.x1 * 100)}% по ширине, ${Math.round(z.y0 * 100)}–${Math.round(z.y1 * 100)}% по высоте`).join('; ') || 'сетка режет кадр до 3:4, видно 12–88 % высоты'}. Посмотри кадры, где текст или плашки заходят в эти зоны, и предложи, как сдвинуть.`); ov.remove(); });
    ov.querySelector('#nxOk').onclick = async () => { await onSeen(row.key); ov.remove(); };
  };
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  document.body.append(ov);
  draw();
}

// ---------- posts (POSTS.md, web/posts.mjs) ----------
// One editor for a text post, a post with a photo and a carousel; the stages depend on the kind.
const postStages = (k) => k === 'carousel' ? [['struct', 'Структура'], ['slides', 'Слайды'], ['publish', 'Подпись и выкладка']]
  : [['text', k === 'photo' ? 'Текст и фото' : 'Текст'], ['publish', 'Выкладка']];

async function vPost(id, stage) {
  const data = await api('/api/post?post=' + encodeURIComponent(id)).catch(() => null);
  if (!data) { view.innerHTML = '<div class="page"><p class="muted">Такого поста нет. <a href="#/all/posts">Все посты</a></p></div>'; return; }
  const p = data.post;
  const stages = postStages(p.kind);
  const at = data.summary?.stage === 'done' ? 'publish' : data.summary?.stage;
  if (!stages.some(([k]) => k === stage)) stage = stages.some(([k]) => k === at) ? at : stages[0][0];
  const atI = stages.findIndex(([k]) => k === at);
  title(p.title || 'Пост');
  const chatName = {text: 'Чат поста', struct: 'Чат карусели', slides: 'Чат карусели', publish: 'Чат выкладки'}[stage];
  view.innerHTML = `<div class="work"><div class="rmain">
    <div class="chead"><div style="flex: 1; min-width: 220px"><div class="small muted"><a href="#/all/posts">Посты</a> › ${esc(projName())}</div><h1 style="font-size: 20px; display: flex; align-items: center; gap: 10px">${esc(p.title || 'Пост')} ${kindBadge(p.kind)}</h1></div>
      <nav class="stg" aria-label="Этапы">${stages.map(([k, t], i) => `<a href="#/post/${esc(id)}/${k}" class="${k === stage ? 'on' : i < atI ? 'done' : ''}">${t}</a>`).join('')}</nav>
      ${canEdit() ? `<select class="f" id="kindSel" aria-label="Тип поста" style="width: auto; min-height: 36px">${[['text', 'Текст'], ['photo', 'С фото'], ['carousel', 'Карусель']].map(([k, t]) => `<option value="${k}" ${k === p.kind ? 'selected' : ''}>${t}</option>`).join('')}</select>` : ''}</div>
    ${await lifeBar('post', id)}
    <div id="reelHost" style="flex: 1; overflow-y: auto"></div></div>
    <aside class="chatcol" aria-label="${chatName}"><div class="chead" style="padding: 12px 16px"><b style="flex: 1">${chatName}</b>${canEdit() ? '<button type="button" class="btn" id="resetChat">Новый чат</button>' : ''}</div>
      <div class="ctx">Claude знает: <span class="chip">бриф</span><span class="chip">правила</span><span class="chip">дизайн-систему</span><span class="chip">этот пост</span></div>
      <div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></aside></div>`;
  wireLifeBar(view);
  const box = chatBox('post-' + id, {onDone: () => { sidebar(); drawPost(id, stage); }});
  $('#chatHost').append(box);
  $('#resetChat')?.addEventListener('click', async () => { if (confirm('Начать чат поста заново? Тексты и картинки останутся.')) { await post('/api/chat/reset', {key: 'post-' + id}); vPost(id, stage); } });
  $('#kindSel')?.addEventListener('change', async (e) => { await post('/api/post/save', {post: id, patch: {kind: e.target.value}}); location.hash = '#/post/' + id; vPost(id); });
  drawPost(id, stage, data);
  const pending = sessionStorage.getItem('firstMsg:post-' + id);
  if (pending) { sessionStorage.removeItem('firstMsg:post-' + id); const {text, shown} = JSON.parse(pending); await box.ready; box.say(text, shown); }
}

async function drawPost(id, stage, data) {
  data ||= await api('/api/post?post=' + encodeURIComponent(id));
  const host = $('#reelHost');
  if (!host) return;
  const save = (patch) => post('/api/post/save', {post: id, patch});
  ({text: postText, struct: postStruct, slides: postSlides, publish: postPublish})[stage](id, data, host, save);
}

// Текст (и фото) — EdPost: three variants, the chosen one outlined; photo with 4:5 / 1:1 and «Светлее».
function postText(id, data, host, save) {
  const p = data.post, texts = p.texts || [];
  const chosenPhoto = (p.photos || []).find((x) => x.chosen && x.out) || (p.photos || []).find((x) => x.out);
  const outUrl = chosenPhoto && data.images.find((f) => f.name === chosenPhoto.out.split('/').pop())?.url;
  let src = chosenPhoto?.file || data.sources[0]?.name, crop = chosenPhoto?.crop || '4:5', bright = !!chosenPhoto?.bright;
  host.innerHTML = `<div style="display: flex; min-height: 100%">
    ${p.kind === 'photo' ? `<div style="flex: 0 0 360px; padding: 26px 26px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--hov)">
      <span class="lbl">Фото${data.sources.length ? ' · ' + data.sources.length : ''}</span>
      <div style="aspect-ratio: ${crop === '1:1' ? '1' : '4 / 5'}; border-radius: 14px; background: var(--soft) center / cover no-repeat; ${outUrl ? `background-image: url('${outUrl}')` : ''}" id="phBig">${outUrl ? '' : '<span class="small muted" style="display: grid; place-items: center; height: 100%; padding: 20px; text-align: center">Загрузи фото — выбери и кадрируй</span>'}</div>
      ${canEdit() && data.sources.length ? `<div class="row" style="gap: 6px">${[['4:5', '4:5'], ['1:1', '1:1'], ['orig', 'Как есть']].map(([k, t]) => `<button type="button" class="chip" data-crop="${k}" style="${k === crop ? 'border-color: var(--ink); font-weight: 600' : ''}">${t}</button>`).join('')}<button type="button" class="chip" id="brightBtn" style="${bright ? 'border-color: var(--ink); font-weight: 600' : ''}">Светлее</button></div>` : ''}
      <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px">${data.sources.filter((f) => /\.(jpe?g|png|webp|heic)$/i.test(f.name)).map((f) => `<button type="button" data-src="${esc(f.name)}" title="${esc(f.name)}" style="aspect-ratio: 1; border-radius: 8px; border: 0; padding: 0; background: var(--soft) center / cover no-repeat; background-image: url('${f.url}'); ${f.name === src ? 'outline: 2px solid var(--ink); outline-offset: 1px' : ''}"></button>`).join('')}
        ${canEdit() ? '<label style="aspect-ratio: 1; border-radius: 8px; border: 1.5px dashed var(--line); display: grid; place-items: center; color: var(--muted); cursor: pointer">+<input type="file" accept="image/*" multiple hidden id="phUp"></label>' : ''}</div>
      ${p.why ? `<span class="small muted">${esc(p.why)}</span>` : ''}
    </div>` : ''}
    <div style="flex: 1; min-width: 0; padding: 26px 32px; display: flex; flex-direction: column; gap: 14px">
      <div class="row" style="gap: 12px"><b style="font-size: 18px; font-weight: 600">Текст${texts.length ? ' · ' + texts.length + ' варианта' : ''}</b><span class="small muted">выбери вариант, правки — словами в чате</span></div>
      ${texts.map((t, i) => `<button type="button" class="var ${i === (p.chosen || 0) ? 'on' : ''}" data-pick="${i}"><span class="small muted" style="font-weight: 500">${esc(t.style || 'Вариант ' + (i + 1))}${i === (p.chosen || 0) ? ' · выбран' : ''}</span><span style="font-size: 15px; line-height: 1.6; white-space: pre-wrap">${esc(t.text)}</span></button>`).join('')
        || `<p class="muted">Вариантов пока нет.${canEdit() ? ' <button type="button" class="btn" id="mkTexts">Написать 3 варианта</button>' : ''}</p>`}
      ${texts.length ? `<div class="row small muted" style="gap: 10px">${(texts[p.chosen || 0]?.text || '').length} знаков · подписи для площадок — на выкладке ${canEdit() ? `<a class="btn primary" style="margin-left: auto" href="#/post/${esc(id)}/publish">Дальше: выкладка</a>` : ''}</div>` : ''}
    </div></div>`;
  host.querySelectorAll('[data-pick]').forEach((b) => (b.onclick = async () => { if (!canEdit()) return; await save({chosen: Number(b.dataset.pick)}); drawPost(id, 'text'); }));
  $('#mkTexts')?.addEventListener('click', () => chatOf().say('Напиши три варианта текста этого поста в разных стилях (первым — стиль рубрики) в post.json.', 'Написать 3 варианта'));
  const apply = async () => { if (!src) return; const r = await post('/api/post/photo', {post: id, file: src, crop, bright}).catch((e) => ({error: e.message})); if (r.error) toast('Не получилось: ' + r.error); drawPost(id, 'text'); };
  host.querySelectorAll('[data-crop]').forEach((b) => (b.onclick = () => { crop = b.dataset.crop; apply(); }));
  $('#brightBtn')?.addEventListener('click', () => { bright = !bright; apply(); });
  host.querySelectorAll('[data-src]').forEach((b) => (b.onclick = () => { src = b.dataset.src; apply(); }));
  $('#phUp')?.addEventListener('change', async (e) => {
    for (const f of e.target.files) await fetch(`/api/upload?project=${encodeURIComponent(P)}&post=${encodeURIComponent(id)}&name=${encodeURIComponent(f.name)}`, {method: 'POST', body: f});
    toast(`Загружено: ${e.target.files.length}`);
    drawPost(id, 'text');
  });
}

// Структура — EdCarStruct: slides as rows, drag to reorder, 5/6/7, «Собрать слайды».
function postStruct(id, data, host, save) {
  const p = data.post, slides = p.slides || [], T = data.templates;
  host.innerHTML = `<div class="page" style="max-width: 900px; gap: 16px">
    <div class="row" style="gap: 12px"><div style="flex: 1"><b style="font-size: 18px; font-weight: 600">Из чего будет карусель</b><div class="small muted">Claude делит тему на слайды и подбирает шаблон каждому</div></div>
      ${canEdit() ? `<span class="small muted">Слайдов</span><span class="seg">${[5, 6, 7].map((n) => `<button type="button" data-n="${n}" class="${slides.length === n ? 'on' : ''}">${n}</button>`).join('')}</span>` : ''}</div>
    <div id="srows" style="display: flex; flex-direction: column; gap: 8px">${slides.map((x, i) => `<div class="srow" draggable="${canEdit()}" data-i="${i}"><span class="h" aria-hidden="true">⋮⋮</span><b style="width: 22px">${i + 1}</b><span style="flex: 1; min-width: 0"><b style="font-weight: 600">${esc(x.title || '')}</b><div class="small muted" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${esc((x.items || []).join(' · ') || x.text || '')}</div></span><span class="kind">${esc(T[x.template] || x.template)}</span></div>`).join('')
      || `<p class="muted">Слайдов пока нет.${canEdit() ? ' <button type="button" class="btn" id="mkStruct">Разбить тему на слайды</button>' : ''}</p>`}</div>
    ${canEdit() && slides.length ? `<div class="row"><button type="button" class="btn" id="addSlide">+ Слайд</button><span class="small muted">Перетащи, чтобы поменять порядок · 5–7 слайдов листают до конца чаще</span><button type="button" class="btn primary" id="build" style="margin-left: auto">Собрать слайды</button></div>` : ''}
  </div>`;
  $('#mkStruct')?.addEventListener('click', () => chatOf().say('Разбей тему на 5–7 слайдов и подбери шаблон каждому в post.json (slides).', 'Разбить на слайды'));
  host.querySelectorAll('[data-n]').forEach((b) => (b.onclick = () => chatOf().say(`Сделай карусель из ${b.dataset.n} слайдов: перестрой slides в post.json.`, `${b.dataset.n} слайдов`)));
  $('#addSlide')?.addEventListener('click', async () => { await save({slides: [...slides, {template: 'list', title: 'Новый слайд', items: []}]}); drawPost(id, 'struct'); });
  let from = null;
  host.querySelectorAll('.srow').forEach((row) => {
    row.ondragstart = () => { from = Number(row.dataset.i); row.classList.add('drag'); };
    row.ondragend = () => row.classList.remove('drag');
    row.ondragover = (e) => e.preventDefault();
    row.ondrop = async (e) => { e.preventDefault(); const to = Number(row.dataset.i); if (from === null || from === to) return; const next = [...slides]; next.splice(to, 0, next.splice(from, 1)[0]); await save({slides: next}); drawPost(id, 'struct'); };
  });
  $('#build')?.addEventListener('click', async (e) => { e.target.disabled = true; e.target.textContent = 'Собираю…'; const r = await post('/api/post/slides', {post: id}).catch((x) => ({error: x.message})); if (r.error) { toast('Не получилось: ' + r.error); e.target.disabled = false; e.target.textContent = 'Собрать слайды'; return; } location.hash = '#/post/' + id + '/slides'; });
}

// Слайды — EdCarousel: the strip, the chosen slide large, its template and texts; looks come from the design system.
function postSlides(id, data, host, save) {
  const p = data.post, slides = p.slides || [], T = data.templates;
  const png = (i) => data.images.find((f) => f.name === `slide-${String(i + 1).padStart(2, '0')}.png`)?.url;
  let cur = Number(sessionStorage.getItem('slide:' + id) || 0);
  if (cur >= slides.length) cur = 0;
  const x = slides[cur] || {};
  const bust = '&t=' + Date.now();
  host.innerHTML = !slides.length ? `<div class="page"><p class="muted">Сначала структура: <a href="#/post/${esc(id)}/struct">разбить тему на слайды</a>.</p></div>` : `<div class="page" style="gap: 18px">
    <div class="strip">${slides.map((s, i) => `<button type="button" data-s="${i}" class="${i === cur ? 'on' : ''}" style="${png(i) ? `background-image: url('${png(i)}${bust}')` : ''}"><span>${i + 1} · ${esc(T[s.template] || s.template)}</span></button>`).join('')}</div>
    <div class="split" style="gap: 28px">
      <div style="flex: 0 0 380px"><div style="aspect-ratio: 4 / 5; border-radius: 14px; border: 1px solid var(--line); background: var(--soft) center / cover no-repeat; ${png(cur) ? `background-image: url('${png(cur)}${bust}')` : ''}"></div><div class="small muted" style="margin-top: 8px">${cur + 1} / ${slides.length} · 1080×1350</div></div>
      <div style="flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 12px">
        <span class="lbl">Шаблон слайда</span><div class="row" style="gap: 6px">${Object.entries(T).map(([k, t]) => `<button type="button" class="chip" data-t="${k}" style="${k === x.template ? 'border-color: var(--ink); font-weight: 600' : ''}" ${canEdit() ? '' : 'disabled'}>${t}</button>`).join('')}</div>
        <label class="lbl" for="sTitle">Заголовок</label><input class="f" id="sTitle" value="${esc(x.title || '')}" ${canEdit() ? '' : 'readonly'}>
        ${['list', 'check', 'summary'].includes(x.template) ? `<label class="lbl" for="sItems">Пункты · до 6, по одному в строке${x.template === 'check' ? ' («что — цена»)' : ''}</label><textarea class="f" id="sItems" ${canEdit() ? '' : 'readonly'}>${esc((x.items || []).join('\n'))}</textarea>` : ''}
        ${['cover', 'summary', 'cta'].includes(x.template) ? `<label class="lbl" for="sText">Текст</label><textarea class="f" id="sText" style="min-height: 70px" ${canEdit() ? '' : 'readonly'}>${esc(x.text || '')}</textarea>` : ''}
        ${x.template === 'check' ? `<label class="lbl" for="sTotal">Итого</label><input class="f" id="sTotal" value="${esc(x.total || '')}" ${canEdit() ? '' : 'readonly'}>` : ''}
        <span class="small muted">Цвета, шрифт и отступы — из дизайн-системы проекта, руками не меняются.</span>
        ${canEdit() ? `<div class="row"><button type="button" class="btn primary" id="sSave">Сохранить и перерисовать</button>${data.images.some((f) => /^slide-/.test(f.name)) ? `<a class="btn" href="#/post/${esc(id)}/publish">Дальше: подпись</a>` : ''}</div>` : ''}
        <div class="row small" style="gap: 10px">${slides.map((_, i) => png(i) ? `<a href="${png(i)}&dl=1">слайд ${i + 1} ↓</a>` : '').join('')}</div>
      </div></div></div>`;
  host.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => { sessionStorage.setItem('slide:' + id, b.dataset.s); drawPost(id, 'slides', data); }));
  const collect = () => ({...x, title: $('#sTitle').value, ...($('#sItems') ? {items: $('#sItems').value.split('\n').map((l) => l.trim()).filter(Boolean).slice(0, 6)} : {}), ...($('#sText') ? {text: $('#sText').value} : {}), ...($('#sTotal') ? {total: $('#sTotal').value} : {})});
  const rerender = async (next) => { await save({slides: next}); const r = await post('/api/post/slides', {post: id}).catch((e) => ({error: e.message})); if (r.error) toast('Не получилось: ' + r.error); drawPost(id, 'slides'); };
  host.querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => { const next = [...slides]; next[cur] = {...collect(), template: b.dataset.t}; rerender(next); }));
  $('#sSave')?.addEventListener('click', (e) => { e.target.disabled = true; e.target.textContent = 'Рисую…'; const next = [...slides]; next[cur] = collect(); rerender(next); });
}

// Выкладка — EdPostPublish / EdCarCaption: native captions per platform with their own time, checks, a package to Telegram.
function postPublish(id, data, host, save) {
  const p = data.post;
  const chosen = (p.texts || [])[p.chosen || 0]?.text || '';
  const caps = (p.captions || []).length ? p.captions : [{platform: p.kind === 'text' ? 'Телеграм' : 'Instagram RU', text: chosen}];
  const d = new Date(Date.now() + 3600e3); d.setMinutes(0, 0, 0);
  const local = (t) => { const x = t ? new Date(t) : d; return new Date(x - x.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); };
  const pics = p.kind === 'carousel' ? data.images.filter((f) => /^slide-/.test(f.name)) : data.images.filter((f) => (p.photos || []).some((x) => x.chosen && x.out?.endsWith(f.name)));
  host.innerHTML = `<div class="page" style="gap: 18px; max-width: 1000px">
    ${pics.length ? `<div class="strip">${pics.map((f) => `<a href="${f.url}&dl=1" title="Скачать" style="flex: none; width: 92px; aspect-ratio: 4 / 5; border-radius: 8px; background: var(--soft) center / cover no-repeat; background-image: url('${f.url}')"></a>`).join('')}</div>` : p.kind !== 'text' ? '<p class="small muted">Картинок пока нет — вернись на прошлый этап.</p>' : ''}
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px">${caps.map((c, i) => `<div class="cap">
      <div class="row" style="gap: 8px"><b>${esc(c.platform || 'Площадка')}</b><span class="small muted">${esc(c.account || '')}</span>${canEdit() ? `<input class="f" type="datetime-local" data-at="${i}" value="${local(c.at)}" style="width: auto; margin-left: auto; min-height: 34px">` : ''}</div>
      <label class="lbl" for="cap${i}">Подпись · <span data-len="${i}">${(c.text || '').length}</span> знаков${/EN/.test(c.platform || '') ? ' · своя версия, не перевод' : /телеграм/i.test(c.platform || '') ? ' · длиннее, без хэштегов' : ''}</label>
      <textarea class="f" id="cap${i}" data-cap="${i}" ${canEdit() ? '' : 'readonly'}>${esc(c.text || '')}</textarea></div>`).join('')}</div>
    ${!(p.captions || []).length && canEdit() ? '<p class="small muted">Подписи для Instagram RU и EN и для Телеграма пишет Claude. <button type="button" class="btn" id="mkCaps">Написать подписи</button></p>' : ''}
    ${(p.checks || []).length ? `<div class="blk"><span class="lbl">Перед выкладкой</span>${p.checks.map((c) => `<div class="row" style="gap: 10px"><span style="color: ${c.ok ? 'var(--green)' : 'var(--amber)'}; font-weight: 700">${c.ok ? '✓' : '!'}</span><span>${esc(c.text)}</span></div>`).join('')}</div>` : ''}
    ${(p.after || []).length ? `<div class="blk"><span class="lbl">Что после</span>${p.after.map((a, i) => `<label class="row" style="gap: 10px"><input type="checkbox" data-after="${i}" ${a.on ? 'checked' : ''} ${canEdit() ? '' : 'disabled'}>${esc(a.text)}</label>`).join('')}</div>` : ''}
    ${canEdit() ? `<div class="card" style="display: flex; flex-direction: column; gap: 10px"><b>Запланировать все</b><span class="small muted">В своё время бот пришлёт в Телеграм подпись и ${p.kind === 'carousel' ? 'слайды' : p.kind === 'photo' ? 'фото' : 'текст'} для каждой площадки — выложишь с телефона.</span><div class="row"><button type="button" class="btn" id="capSave">Сохранить подписи</button><button type="button" class="btn primary" id="pubAll">Запланировать все · ${caps.length}</button>${p.kind === 'carousel' && (p.slidesEn || []).length ? '<button type="button" class="btn" id="buildEn">Собрать EN-слайды</button>' : ''}</div></div>` : ''}
    ${data.outbox?.length ? `<div class="blk"><span class="lbl">Запланировано</span>${data.outbox.map((o) => `<div class="li"><span style="flex: 1">${new Date(o.at).toLocaleString('ru', {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})}${o.platform ? ' · ' + esc(o.platform) : ''}</span><span class="small muted">${o.sent ? (o.error ? 'не ушло: ' + esc(o.error) : 'отправлено в Телеграм') : 'ждёт · ' + esc(o.by)}</span>${!o.sent && canEdit() ? `<button type="button" class="btn" data-cancel="${esc(o.id)}">Отменить</button>` : ''}</div>`).join('')}</div>` : ''}
  </div>`;
  const current = () => caps.map((c, i) => ({...c, text: $('#cap' + i).value, at: host.querySelector(`[data-at="${i}"]`)?.value || c.at}));
  nxBlock(host.querySelector('.page'), {caps, kind: p.kind === 'carousel' ? 'carousel' : 'post', seen: p.seen, ask: canEdit() ? (t) => chatOf().say(t, 'Исправить: ' + t.slice(0, 60)) : null,
    base: {media: pics[0] ? {type: 'image', url: pics[0].url} : null, slides: pics.map((f) => f.url), cover: pics[0]?.url, name: projName(), grid: (OV?.reels || []).filter((r) => r.thumb).slice(0, 8).map((r) => ({url: r.thumb, kind: 'reel'}))},
    onSeen: async (key) => { await save({seen: {...p.seen, [key]: {by: ME?.name, at: Date.now()}}}); drawPost(id, 'publish'); }});
  host.querySelectorAll('[data-cap]').forEach((t) => (t.oninput = () => { host.querySelector(`[data-len="${t.dataset.cap}"]`).textContent = t.value.length; }));
  $('#mkCaps')?.addEventListener('click', () => chatOf().say('Напиши подписи для Instagram RU, Instagram EN (своя версия, не перевод) и Телеграм-канала (длиннее, без хэштегов), проверку перед выкладкой и «что после» в post.json.', 'Написать подписи'));
  $('#capSave')?.addEventListener('click', async () => { await save({captions: current()}); toast('Сохранено'); });
  host.querySelectorAll('[data-after]').forEach((b) => (b.onchange = () => save({after: p.after.map((a, i) => (i === Number(b.dataset.after) ? {...a, on: b.checked} : a))})));
  $('#buildEn')?.addEventListener('click', async () => { const r = await post('/api/post/slides', {post: id, lang: 'en'}).catch((e) => ({error: e.message})); toast(r.error ? 'Не получилось: ' + r.error : 'EN-слайды собраны'); });
  $('#pubAll')?.addEventListener('click', async () => {
    const list = current();
    await save({captions: list});
    let ok = 0;
    for (const c of list) {
      const it = await post('/api/publish', {post: id, at: new Date(c.at || local()).toISOString(), caption: c.text, platform: c.platform, lang: /EN/.test(c.platform || '') ? 'en' : 'ru'}).catch(() => null);
      if (it) ok++;
    }
    toast(`Запланировано: ${ok} из ${list.length} — бот пришлёт пакеты в Телеграм`);
    drawPost(id, 'publish');
  });
  host.querySelectorAll('[data-cancel]').forEach((b) => (b.onclick = async () => { await post('/api/publish/cancel', {id: b.dataset.cancel}); drawPost(id, 'publish'); }));
}

  const host = $('#reelHost');
  const sc = Array.isArray(data?.scenes) ? data.scenes : null;
  const stColor = (t) => /готов/i.test(t || '') ? 'var(--green)' : /пересн/i.test(t || '') ? 'var(--amber)' : 'var(--blue)';
  host.innerHTML = `<div class="page" style="max-width: 1000px">
    ${sc ? `<section><div class="row" style="justify-content: space-between; margin-bottom: 6px"><h2>Готовность · ${sc.filter((x) => /готов/i.test(x.status || '')).length} из ${sc.length}</h2>${canEdit() ? '<button type="button" class="btn" id="shotList">Шот-лист в Телеграм</button>' : ''}</div>
      <div class="grid4 lbl" style="border-top: 0"><span>Сцена</span><span>Что нужно</span><span>Что есть</span><span>Статус</span></div>
      ${sc.map((x, i) => `<div class="grid4"><b style="font-weight: 600">${i + 1} · ${esc(x.name || '')}</b><span class="muted">${esc(x.need || x.screen || '')}</span><span class="small muted">${esc(x.have || '—')}</span><span class="st" style="color: ${stColor(x.status)}">${esc(x.status || 'нужно')}</span></div>`).join('')}</section>`
      : canEdit() ? '<p class="small muted">Что снять по сценам, Claude соберёт в шот-лист. <button type="button" class="btn" id="shotList" style="margin-left: 6px">Составить шот-лист</button></p>' : ''}
    ${canEdit() ? `<label class="drop" id="drop"><input type="file" multiple hidden id="up"><b style="color: var(--ink); font-weight: 600">Перетащи сюда референсы, исходники, музыку</b><br><span class="small">или нажми, чтобы выбрать файлы · они попадут в материалы этого рилса, Claude их увидит</span></label>` : ''}
    <section><div class="row" style="justify-content: space-between; margin-bottom: 10px"><h2>Материалы</h2><span class="small muted" id="srcInfo"></span></div><div class="fgrid" id="src"></div></section>
    <section><div class="row" style="justify-content: space-between; margin-bottom: 10px"><h2>Итог и версии</h2><span class="small muted">старые версии сжимаются по правилам хранения</span></div><div class="fgrid" id="res"></div></section>
  </div>`;
  const card = (f, del) => `<div class="fcard"><a class="pv" href="${f.url}" target="_blank" rel="noopener" ${f.kind === 'image' ? `style="background-image: url('${f.url}')"` : ''}>${f.kind === 'video' ? `<video src="${f.url}#t=0.5" preload="metadata" muted playsinline></video>` : f.kind === 'image' ? '' : esc((f.name.split('.').pop() || 'файл').toUpperCase())}</a>
    <div class="meta"><b title="${esc(f.name)}">${esc(f.name)}</b><span class="muted">${mb(f.size)} · ${ago(f.at)}</span><span class="acts"><a href="${f.url}&dl=1">Скачать</a>${del ? `<a href="#" data-del="${esc(f.name)}" style="color: #B4231A">Удалить</a>` : ''}</span></div></div>`;
  async function load() {
    const f = await api('/api/files?reel=' + encodeURIComponent(id));
    $('#src').innerHTML = f.sources.map((x) => card(x, canEdit())).join('') || '<p class="small muted">Пока пусто. Загрузи референсы или исходники — или прикрепи их в чате рилса.</p>';
    $('#srcInfo').textContent = f.sources.length ? `${f.sources.length} файлов · ${mb(f.sources.reduce((a, x) => a + x.size, 0))}` : '';
    $('#res').innerHTML = f.results.map((x) => card(x, false)).join('') || '<p class="small muted">Готовых файлов пока нет.</p>';
    host.querySelectorAll('[data-del]').forEach((a) => (a.onclick = async (e) => { e.preventDefault(); if (!confirm(`Удалить ${a.dataset.del}?`)) return; await post('/api/files/delete', {reel: id, name: a.dataset.del}); load(); }));
  }
  async function upload(files) {
    const drop = $('#drop');
    for (const [i, f] of [...files].entries()) {
      drop.querySelector('b').textContent = `Загружаю ${i + 1} из ${files.length}: ${f.name}…`;
      await fetch(`/api/upload?project=${encodeURIComponent(P)}&reel=${encodeURIComponent(id)}&name=${encodeURIComponent(f.name)}`, {method: 'POST', body: f});
    }
    drop.querySelector('b').textContent = 'Перетащи сюда референсы, исходники, музыку';
    toast(`Загружено: ${files.length}`);
    load();
  }
  $('#shotList')?.addEventListener('click', () => chatOf().say('Составь шот-лист по сценам: что снять, как держать телефон, сколько секунд; отметь, что уже есть в материалах. Обнови scenes.json и пришли шот-лист сюда.', 'Шот-лист'));
  const drop = $('#drop');
  if (drop) {
    $('#up').onchange = (e) => e.target.files.length && upload(e.target.files);
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files.length) upload(e.dataTransfer.files); };
  }
  load();
}

// What the README says about one version: its line under «## Версии», first sentence.
const versionNote = (readme, v) => {
  const line = String(readme || '').split('\n').find((l) => new RegExp(`^\\s*[-*]\\s*${v}\\b`).test(l));
  return line ? line.replace(/^\s*[-*]\s*\S+\s*(\([^)]*\))?:?\s*/, '').split(/(?<=\.)\s/)[0] : '';
};
const section = (readme, name) => (new RegExp(`^## ${name}[^\\n]*\\n([\\s\\S]*?)(?=^## |$(?![\\s\\S]))`, 'm').exec(String(readme || '')) || [])[1] || '';

// Правки по секундам (Д3, VE1, VP1–VP6): a list of notes for the next version, each at a second,
// typed or spoken (Whisper on the server), optionally with a point on the frame.
function editsBlock(edits, cur, nextV) {
  const open = edits.filter((x) => x.state === 'open'), sent = edits.filter((x) => x.state === 'sent' && x.forV === nextV), done = edits.filter((x) => x.state === 'done' && x.forV === cur.v);
  const row = (x, i, kind) => `<div class="li" style="align-items: flex-start; gap: 10px"><span class="enum ${kind}">${kind === 'done' ? '✓' : i + 1}</span><span style="flex: 1; min-width: 0"><button type="button" class="tcx" data-eseek="${x.t}">${x.stage === 'script' ? 'Сценарий' : x.stage === 'scenes' ? `Сцена ${(x.scene ?? 0) + 1}` : tc(x.t)}</button> ${esc(kind === 'done' && x.result ? x.result : x.text)}${x.quote ? ` <span class="muted">— к словам «${esc(x.quote)}»</span>` : ''}
    <div class="small muted">${kind === 'done' ? esc(x.text) : [x.voice ? 'голосом' : 'текстом', x.shape ? ({rect: 'обведено на кадре', brush: 'кистью на кадре', point: 'точка на кадре', frame: 'весь кадр'})[x.shape.kind] : x.point ? 'точка на кадре' : '', esc(x.by || '')].filter(Boolean).join(' · ')}</div></span>${kind === 'open' && canEdit() ? `<button type="button" class="btn" data-erm="${esc(x.id)}" aria-label="Убрать правку">✕</button>` : ''}</div>`;
  return `${done.length ? `<div class="blk"><span class="lbl">Что поменялось в ${esc(cur.v)} · ${done.length}</span>${done.map((x, i) => row(x, i, 'done')).join('')}</div>` : ''}
    <div class="blk"><span class="lbl">Правки к ${esc(nextV)} · ${open.length}</span>
      ${open.map((x, i) => row(x, i, 'open')).join('') || `<span class="small muted">${sent.length ? `Отправлено ${sent.length} — Claude собирает ${esc(nextV)}.` : 'Пока нет. Останови видео и скажи или напиши, что поменять.'}</span>`}
      ${sent.length && open.length ? `<span class="small muted">Ещё ${sent.length} уже у Claude.</span>` : ''}
      ${open.length && canEdit() ? `<button type="button" class="btn primary" id="eBuild" style="align-self: flex-start; margin-top: 6px">Собрать ${esc(nextV)} · правок: ${open.length}</button>` : ''}</div>`;
}

function wireEdits(id, rv, form, cur, nextV) {
  let point = null, voice = false, rec = null, pinMode = false;
  const tEl = $('#eT'), layer = $('#pinL'), hint = $('#eHint');
  const upd = () => { tEl.textContent = tc(rv.currentTime); };
  rv.addEventListener('timeupdate', upd); rv.addEventListener('seeked', upd); rv.addEventListener('pause', upd);
  $('#eText').addEventListener('focus', () => rv.pause());
  // Point on the frame: a layer over the paused video takes one click.
  $('#ePt').onclick = () => { rv.pause(); pinMode = !pinMode; layer.hidden = !pinMode; $('#ePt').classList.toggle('primary', pinMode); hint.textContent = pinMode ? 'Нажми на кадр, где поправить' : ''; };
  layer.onclick = (e) => {
    const r = layer.getBoundingClientRect();
    point = {x: Math.round(100 * (e.clientX - r.left) / r.width), y: Math.round(100 * (e.clientY - r.top) / r.height)};
    layer.innerHTML = `<span class="pin" style="left: ${point.x}%; top: ${point.y}%">●</span>`;
    pinMode = false; $('#ePt').classList.remove('primary'); layer.style.pointerEvents = 'none'; hint.textContent = `Точка: ${point.x}% слева, ${point.y}% сверху`;
  };
  // Voice: record, the server writes it out with Whisper, the text lands in the field.
  $('#eMic').onclick = async () => {
    if (rec) { rec.stop(); return; }
    rv.pause();
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); } catch { toast('Нет доступа к микрофону'); return; }
    const chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach((x) => x.stop());
      const type = rec.mimeType || 'audio/webm'; rec = null;
      $('#eMic').textContent = '… распознаю'; $('#eMic').disabled = true;
      const r = await fetch(`/api/reel/voice?project=${encodeURIComponent(P)}&reel=${encodeURIComponent(id)}`, {method: 'POST', headers: {'content-type': type}, body: new Blob(chunks, {type})}).then((x) => x.json()).catch(() => ({}));
      $('#eMic').textContent = '🎙 Голосом'; $('#eMic').disabled = false; $('#eMic').classList.remove('primary');
      if (r.text) { $('#eText').value = ($('#eText').value ? $('#eText').value + ' ' : '') + r.text; voice = true; } else toast('Не расслышал — напиши словами');
    };
    rec.start(); $('#eMic').textContent = '■ Стоп'; $('#eMic').classList.add('primary'); hint.textContent = 'Говори — нажми «Стоп», когда закончишь';
  };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const text = $('#eText').value.trim();
    if (!text) return $('#eText').focus();
    await post('/api/reel/edits', {reel: id, action: 'add', t: rv.currentTime, text, point, voice});
    renderVersions(id);
  };
}

// Which version the «Монтаж» player shows, per reel: the current one unless another variant is picked.
const VIEWV = {};
const vName = (v) => `${v.v}${v.variant ? ' · ' + v.variant : ''}`;

async function renderVersions(id, data) {
  data ||= await api('/api/reel?reel=' + encodeURIComponent(id));
  const el = $('#vers');
  if (!el) return;
  const vs = data.versions;
  const kindName = {master: 'Мастер', copy: 'Instagram', cover: 'Обложка', thumb: 'Кадр', other: 'Файл'};
  const files = (v) => v.files.filter((f) => f.kind !== 'thumb' && f.kind !== 'other').sort((a, b) => ['copy', 'master', 'cover'].indexOf(a.kind) - ['copy', 'master', 'cover'].indexOf(b.kind));
  const fileLinks = (v) => files(v).map((f) => `<a class="chip" href="${f.url}&dl=1">${kindName[f.kind]} · ${mb(f.size)} ↓</a>`).join('');
  const video = (v) => v.files.filter((f) => /\.(mp4|mov|webm)$/i.test(f.name)).sort((a, b) => a.size - b.size)[0];
  const thumb = (v) => v.files.find((f) => f.kind === 'thumb' || f.kind === 'cover');
  // A reel can have several finished variants (e.g. RU v1 and EN v2): every version that still has
  // its video is a full row with its own master; the rest are snapshots that can be rebuilt.
  const cur = vs[0], prev = vs.find((v) => v.state === 'previous' && video(v)), live = vs.filter((v) => v !== cur && video(v)), old = vs.filter((v) => v !== cur && !video(v));
  const hasMaster = (v) => v.files.some((f) => f.kind === 'master');
  const masterBtn = (v) => canEdit() && !hasMaster(v) ? `<button type="button" class="btn" data-master="${esc(v.v)}">Собрать мастер 1440p</button>` : '';
  const vNote = (v) => { const n = versionNote(data.readme, v.v); return n ? `<span class="small" style="flex-basis: 100%; line-height: 1.5">${esc(n)}</span>` : ''; };
  const sel = vs.find((v) => v.v === VIEWV[id]) || cur;
  const note = sel && versionNote(data.readme, sel.v);
  const nextV = cur ? 'v' + (Number(cur.v.replace(/\D/g, '')) + 1) : 'v1';
  const script = section(data.readme, 'Сценарий');
  // The top button gives the master of the newest accepted version (the biggest file, 1440p over 1080p);
  // until a version is accepted it gives the current review copy.
  const mv = sel && hasMaster(sel) ? sel : vs.find((v) => v.files.some((f) => f.kind === 'master'));
  const master = mv && mv.files.filter((f) => f.kind === 'master').sort((a, b) => b.size - a.size)[0];
  const dl = master || cur && files(cur).find((f) => f.kind === 'copy') || cur && files(cur)[0];
  $('#dlTop').innerHTML = dl ? `<a class="btn primary" href="${dl.url}&dl=1">${master ? `Скачать мастер ${esc(vName(mv))}` : `Скачать ${esc(cur.v)}`}</a>` : '';
  // Variants switcher above the player: every version, the current one first.
  const switcher = vs.length > 1 ? `<div class="row" style="gap: 6px; flex-wrap: wrap">${vs.map((v) => `<button type="button" class="btn${v === sel ? ' primary' : ''}" data-viewv="${esc(v.v)}" style="min-height: 34px; padding: 0 12px">${esc(vName(v))}${v === cur ? ' · текущая' : ''}${video(v) ? '' : ' · нет видео'}${hasMaster(v) ? ' ✓' : ''}</button>`).join('')}</div>` : '';
  const nameBtn = (v) => canEdit() ? `<button type="button" class="btn" data-vlabel="${esc(v.v)}" data-cur="${esc(v.variant || '')}">${v.variant ? 'Переименовать вариант' : 'Назвать вариант (RU, EN…)'}</button>` : '';
  el.innerHTML = `<div class="rvid">${switcher}${sel && sel !== cur
      ? `${video(sel) ? `<div class="vwrap"><video src="${video(sel).url}" controls playsinline preload="metadata" ${thumb(sel) ? `poster="${thumb(sel).url}"` : ''}></video></div>` : `<div class="vph" style="${thumb(sel) ? `background: #000 center / contain no-repeat url('${thumb(sel).url}'); color: #fff` : ''}">Видео ${esc(sel.v)} не сохранено — можно пересобрать</div>`}
        <span class="small muted" style="text-align: center">Смотришь ${esc(vName(sel))}. Правки пишутся к текущей ${esc(cur.v)}.</span>
        <div class="row" style="gap: 8px; flex-wrap: wrap; justify-content: center">${hasMaster(sel) ? '' : masterBtn(sel)}${nameBtn(sel)}<button type="button" class="btn" data-viewv="${esc(cur.v)}">К текущей ${esc(cur.v)}</button></div>`
      : cur && video(cur)
      ? `<div class="vwrap"><video id="rv" src="${video(cur).url}" controls playsinline preload="metadata" ${thumb(cur) ? `poster="${thumb(cur).url}"` : ''}></video><div class="pinlayer" id="pinL" hidden></div></div>
        ${canEdit() ? `<form class="ecomp" id="eComp"><div class="row" style="gap: 6px"><b id="eT" class="tcx">0:00</b><span class="small muted">правка к ${esc(nextV)}</span></div>
          <textarea class="f" id="eText" rows="2" placeholder="Что поменять в этот момент — словами или голосом"></textarea>
          <div class="row" style="gap: 6px"><button type="button" class="btn" id="eMic" title="Сказать голосом">🎙 Голосом</button><button type="button" class="btn" id="ePt" title="Показать место на кадре">◎ Точка на кадре</button><button type="submit" class="btn primary" style="margin-left: auto">Добавить</button></div>
          <span class="small muted" id="eHint">Останови видео в нужный момент — правка привяжется к секунде</span></form>` : `<span class="small muted" style="text-align: center">${esc(cur.v)} · ${ago(cur.at)}</span>`}
        ${prev ? `<a class="btn" href="#/reel/${esc(id)}/compare">Сравнить с ${esc(prev.v)}</a>` : ''}
        ${canEdit() && !cur.files.some((f) => f.kind === 'master') ? `<button type="button" class="btn primary" id="acceptV">Принять ${esc(cur.v)} — собрать мастер 1440p</button>` : ''}
        ${vs.length > 1 || cur.variant ? `<div class="row" style="justify-content: center">${nameBtn(cur)}</div>` : ''}`
      : '<div class="vph">Видео появится, когда Claude смонтирует первую версию</div>'}</div>
    <div class="rinfo">
      ${cur ? editsBlock(data.edits || [], cur, nextV) : ''}
      ${note ? `<div class="blk"><span class="lbl">Что в ${esc(vName(sel))}</span><span style="font-size: 15px; line-height: 1.55">${esc(note)}</span></div>` : ''}
      <div class="blk"><span class="lbl">Версии · ${vs.length}</span>
        ${!cur ? '<p class="small muted">Версий пока нет. Напиши в чате справа, что снять или смонтировать.</p>' : `
        <div class="li" style="border-top: 0"><b style="font-weight: 600">${esc(vName(cur))} · текущая</b><span class="small muted">${ago(cur.at)}${hasMaster(cur) ? ' · мастер готов' : ''}</span><div class="row" style="flex-basis: 100%; gap: 8px">${fileLinks(cur)}${masterBtn(cur)}</div></div>`}
        ${live.map((v) => `<div class="li"><b style="font-weight: 600">${esc(vName(v))}</b><span class="small muted">${ago(v.at)}${hasMaster(v) ? ' · мастер готов' : ''}</span>${vNote(v)}<details style="flex-basis: 100%"><summary class="small">Смотреть</summary><video src="${video(v).url}" controls playsinline preload="none" style="width: 220px; border-radius: 10px; margin-top: 8px; background: #000"></video></details><div class="row" style="flex-basis: 100%; gap: 8px">${fileLinks(v)}${masterBtn(v)}</div></div>`).join('')}
        ${old.map((v) => `<div class="li"><div class="th" style="width: 28px; height: 50px; ${thumb(v) ? `background-image: url('${thumb(v).url}')` : ''}"></div><span style="flex: 1"><b style="font-weight: 600">${esc(v.v)}</b> <span class="small muted">· ${ago(v.at)} · кадр и снимок проекта${v.archived ? ` · освобождено ${mb(v.archived.freed)}` : ''}</span></span>${canEdit() ? `<button type="button" class="btn" data-rebuild="${esc(v.v)}">Пересобрать</button>` : ''}</div>`).join('')}
        <a class="small muted" href="#/memory/files" style="padding-top: 8px">Место на сервере →</a></div>
      ${script.trim() ? `<div class="blk"><span class="lbl">Сценарий</span><div class="md" style="font-size: 14px">${md(script)}</div></div>` : ''}
    </div>`;
  $('#acceptV')?.addEventListener('click', () => chatOf().say(`Принимаю ${cur.v}. Собери мастер 1440p этой версии (без --draft, 1440×2560, CRF 15) и скажи, когда будет готов.`, `Принять ${cur.v}`));
  el.querySelectorAll('[data-master]').forEach((b) => (b.onclick = () => chatOf().say(`Собери мастер 1440p версии ${b.dataset.master} (без --draft, 1440×2560, CRF 15) из её снимка проекта versions/${b.dataset.master}/project-snapshot. Если снимка нет — восстанови эту версию по README (что в ней было) и сохранённым файлам проекта (например, тексты на другом языке) во временной копии project/, не трогая текущую версию. Скажи, когда будет готов.`, `Мастер ${b.dataset.master}`)));
  el.querySelectorAll('[data-viewv]').forEach((b) => (b.onclick = () => { VIEWV[id] = b.dataset.viewv === cur.v ? null : b.dataset.viewv; renderVersions(id, data); }));
  el.querySelectorAll('[data-vlabel]').forEach((b) => (b.onclick = async () => {
    const label = prompt(`Как назвать вариант ${b.dataset.vlabel}? Например: RU, EN, короткая. Пусто — снять метку.`, b.dataset.cur || '');
    if (label == null) return;
    await post('/api/reel/variant', {reel: id, v: b.dataset.vlabel, label}).catch(() => null);
    renderVersions(id);
  }));
  const rv = $('#rv'), form = $('#eComp');
  if (rv && form) wireEdits(id, rv, form, cur, nextV);
  el.querySelectorAll('[data-erm]').forEach((b) => (b.onclick = async () => { await post('/api/reel/edits', {reel: id, action: 'remove', id: b.dataset.erm}); renderVersions(id); }));
  el.querySelectorAll('[data-eseek]').forEach((b) => (b.onclick = () => { if (rv) { rv.currentTime = Number(b.dataset.eseek); rv.pause(); } }));
  $('#eBuild')?.addEventListener('click', async () => {
    const open = (data.edits || []).filter((x) => x.state === 'open');
    await post('/api/reel/edits', {reel: id, action: 'send', forV: nextV});
    chatOf().say(`Правки к ${nextV}:\n${open.map((x, i) => `${i + 1}. ${tc(x.t)} — ${x.text}${x.point ? ` (точка на кадре: ${x.point.x}% слева, ${x.point.y}% сверху)` : ''}`).join('\n')}\nСобери ${nextV} черновиком и отметь в edits.json, что сделано.`, `Собрать ${nextV} · правок: ${open.length}`);
    renderVersions(id);
  });
  el.querySelectorAll('[data-rebuild]').forEach((b) => (b.onclick = () => {
    const box = $('#chatHost > div');
    box.say(`Пересобери версию ${b.dataset.rebuild} этого рилса из её снимка versions/${b.dataset.rebuild}/project-snapshot/ и пришли её.`, `Пересобрать ${b.dataset.rebuild}`);
  }));
}

const rubricColor = (st, id) => (st.rubrics || []).find((x) => x.id === id || x.name === id)?.color || '#A3A3A3';
