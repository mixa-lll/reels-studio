// Reel stages from the canvas (Сценарий · Материалы · Монтаж · Выкладка): each is a tab of the reel;
// the one the reel is at is marked by what it already has.
const STAGES = [['script', 'Сценарий'], ['materials', 'Материалы'], ['edit', 'Монтаж'], ['publish', 'Выкладка']];
const stageAt = (r) => !r?.version ? 'script' : ['done', 'published'].includes(r.status) ? 'publish' : 'edit';
function stages(r, tab) {
  if (!r) return `<span class="stg" aria-label="Этап">${STAGES.map(([, t], i) => `<span class="${i ? '' : 'on'}">${t}</span>`).join('')}</span>`;
  const at = STAGES.findIndex(([k]) => k === stageAt(r));
  return `<nav class="stg" aria-label="Этапы">${STAGES.map(([k, t], i) => `<a href="#/reel/${esc(r.id)}/${k}" class="${k === tab ? 'on' : i < at ? 'done' : ''}" ${k === tab ? 'aria-current="page"' : ''}>${t}</a>`).join('')}</nav>`;
}

// Switching tabs inside one release reuses its data and its chat column: the tab draws at once
// from memory and the data refreshes behind it. post() and a finished chat turn drop the copy.
const getReel = (id) => api('/api/reel?reel=' + encodeURIComponent(id)).then((d) => { REEL_CACHE.set(id, {data: d, at: Date.now()}); return d; });
const reelTab = () => /^#\/reel\/[\w-]+\/(\w+)/.exec(location.hash)?.[1];
async function vReel(id, tab) {
  const isNew = id.startsWith('new-');
  const cached = !isNew && REEL_CACHE.get(id);
  const warm = cached && Date.now() - cached.at < 120000;
  const req = isNew ? null : getReel(id).catch(() => null);
  const [data] = warm ? [cached.data] : await Promise.all([req, loadItems().catch(() => null)]);
  if (warm) req.then((d) => { if (d && JSON.stringify(d) !== JSON.stringify(cached.data) && location.hash.startsWith('#/reel/' + id) && $('#reelHost')) drawStage(id, reelTab() || tab, d); });
  const r = data?.reel;
  if (r && (!tab || tab === 'files')) tab = tab === 'files' ? 'materials' : stageAt(r);
  const nav = r ? await relHead('reel', id, REEL_STEPS, tab, `#/reel/${id}/`, `${r.num} · ${r.title}`) : '';
  title(r ? `${r.num} ${r.title}` : 'Новый выпуск');
  const head = nav || `<div class="chead"><div style="flex: 1; min-width: 200px"><div class="small muted"><a href="#/all">Выпуски</a> › рилс</div><h1 style="font-size: 20px">${r ? `${esc(r.num)} · ${esc(r.title)}` : 'Новый выпуск'}</h1></div>
      ${stages(r, tab)}<span id="dlTop" class="row" style="gap: 8px"></span></div>`;
  const ctx = `<div class="ctx">Claude знает: <span class="chip">бриф</span><span class="chip">правила</span><span class="chip">дизайн-систему</span>${r ? `<span class="chip">сценарий и правки ${esc(r.num)}</span>` : ''}</div>`;
  const chatName = {script: 'Чат сценария', materials: 'Чат материалов', edit: 'Чат выпуска', compare: 'Чат выпуска', publish: 'Чат выкладки'}[tab] || 'Чат выпуска';
  // A reel that exists: its stage in the middle, its chat as a column on the right (CleanReel, CleanText…).
  const keep = !isNew && REEL_CHAT?.id === id && view.contains(REEL_CHAT.box) ? REEL_CHAT.box : null;
  view.innerHTML = isNew || !r
    ? `<div class="work"><div class="chat">${head}${ctx}<div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></div></div>`
    : `<div class="work"><div class="rmain">${head}<div id="reelHost" style="flex: 1; overflow-y: auto"></div></div>
      <aside class="chatcol" aria-label="${chatName}"><div class="chead" style="padding: 12px 16px"><b style="flex: 1">${chatName}</b>${canEdit() ? '<button type="button" class="btn" id="resetChat" title="История чата сотрётся, рилс и файлы останутся">Новый чат</button>' : ''}</div>${ctx}<div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></aside></div>`;
  const box = keep || chatBox(id, {
    onRebind: (k) => { history.replaceState(null, '', '#/reel/' + k); sidebar(); },
    onDone: (k) => {
      REEL_CACHE.delete(k); sidebar();
      if (k.startsWith('new-')) return;
      const t = reelTab() || tab;
      if (isNew) vReel(k); else if (['edit', 'script', 'publish'].includes(t) && location.hash.startsWith('#/reel/' + k)) drawStage(k, t);
    },
  });
  REEL_CHAT = isNew ? null : {id, box};
  $('#chatHost').append(box);
  $('#resetChat')?.addEventListener('click', async () => { if (confirm('Начать чат выпуска заново? Рилс, версии и файлы останутся.')) { await post('/api/chat/reset', {key: id}); vReel(id, tab); } });
  wireRelHead(view, () => vReel(id, tab));
  if (r && tab === 'idea') drawIdea($('#reelHost'), 'reel', id);
  else if (r) drawStage(id, tab, data);
  const pending = sessionStorage.getItem('firstMsg:' + id);
  if (pending) { sessionStorage.removeItem('firstMsg:' + id); const {text, shown} = JSON.parse(pending); await box.ready; box.say(text, shown); }
}

const chatOf = () => $('#chatHost > div');
// Puts text into the reel chat's input (a timecode, a scene) without sending it.
function draft(text) {
  const ta = $('#chatHost textarea');
  if (!ta) return;
  ta.value = text + (ta.value ? ' ' + ta.value : '');
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.dispatchEvent(new Event('input'));
}
const tc = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

async function drawStage(id, tab, data) {
  data ||= await getReel(id);
  if (tab === 'script') return stageScript(id, data);
  if (tab === 'materials') return reelFiles(id, data);
  if (tab === 'compare') return stageCompare(id, data);
  if (tab === 'publish') return stagePublish(id, data);
  $('#reelHost').innerHTML = '<div id="vers" aria-label="Сборка"></div>';
  return renderVersions(id, data);
}

// Сценарий (CleanText): scenes on the left, each scene as a card; clicking a scene drafts a note about it.
function stageScript(id, data) {
  const sc = Array.isArray(data.scenes) ? data.scenes : null;
  const host = $('#reelHost');
  const script = section(data.readme, 'Сценарий'), look = section(data.readme, 'Вид');
  const field = (t, v) => v ? `<div class="f"><span class="small muted" style="padding-top: 2px">${t}</span><span>${esc(v)}</span></div>` : '';
  host.innerHTML = `<div style="display: flex; min-height: 100%">
    ${sc ? `<nav style="flex: 0 0 190px; padding: 26px 12px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--hov)" aria-label="Сцены"><span class="lbl" style="padding: 0 10px 8px">Сцены · ${sc.length}</span>
      ${sc.map((x, i) => `<a class="scn" href="#sc${i}" data-sc="${i}"><span>${esc(x.t || '')}</span>${esc(x.name || 'Сцена ' + (i + 1))}</a>`).join('')}</nav>` : ''}
    <div style="flex: 1; min-width: 0; padding: 26px 32px; display: flex; flex-direction: column; gap: 14px">
      ${sc ? sc.map((x, i) => `<section class="scard" id="sc${i}"><div class="row" style="gap: 10px; padding-bottom: 4px"><b style="font-size: 16px; font-weight: 600">${i + 1} · ${esc(x.name || '')}</b><span class="small muted">${esc(x.t || '')}</span>${canEdit() ? `<button type="button" class="btn" style="margin-left: auto" data-edit="${i}">Правка сцены</button>` : ''}</div>
          ${field('На экране', x.screen)}${field('Текст на экране', x.text)}${field('Звук', x.sound)}</section>`).join('')
        : `<div class="md" style="max-width: 820px">${md(script) || '<p class="muted">Сценария пока нет. Опиши идею в чате справа — Claude напишет сценарий.</p>'}</div>
           ${look.trim() ? `<div class="blk"><span class="lbl">Как выглядит</span><div class="md" style="font-size: 14px">${md(look)}</div></div>` : ''}
           ${canEdit() && script.trim() ? '<div><button type="button" class="btn" id="toScenes">Разложить по сценам</button> <span class="small muted">Claude разобьёт сценарий на сцены с таймкодами — их можно править по одной</span></div>' : ''}`}
    </div></div>`;
  host.querySelectorAll('[data-sc]').forEach((a) => (a.onclick = (e) => { e.preventDefault(); $('#sc' + a.dataset.sc).scrollIntoView({behavior: 'smooth', block: 'start'}); }));
  host.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => { const x = sc[b.dataset.edit]; draft(`Сцена ${Number(b.dataset.edit) + 1} «${x.name}» (${x.t}) —`); }));
  $('#toScenes')?.addEventListener('click', () => chatOf().say('Разложи сценарий этого рилса по сценам в scenes.json: таймкод, название, что на экране, текст на экране, звук, какой материал нужен и есть ли он.', 'Разложить сценарий по сценам'));
}

// Сравнение (CleanCompare): two versions side by side, playing in sync.
// Сравнение версий (кусок 17; холст LR2): two players play in sync, the differences of the newer one
// (its done notes in edits.json) are a list and dots on the strip; ← → jump from one to the next.
function stageCompare(id, data) {
  const vid = (v) => v?.files.filter((f) => /\.(mp4|mov|webm)$/i.test(f.name)).sort((a, b) => a.size - b.size)[0];
  const withVideo = data.versions.filter((v) => vid(v));
  const nb = withVideo.find((v) => v.v === VIEWV[id]) || withVideo[0];
  const b = nb, a = withVideo[withVideo.indexOf(nb) + 1];
  const host = $('#reelHost');
  if (!a) { host.innerHTML = '<div class="page"><p class="muted">Сравнивать пока нечего: нужна ещё одна версия с видео. Старые версии хранятся кадром — их можно пересобрать на «Сборке».</p></div>'; return; }
  const diffs = (data.edits || []).filter((x) => x.state === 'done' && x.forV === b.v).sort((p, q) => p.t - q.t);
  host.innerHTML = `<div class="page" style="gap: 18px">
    <div class="cmp2">${[a, b].map((v, i) => `<div class="cmpv"><span class="small muted">${esc(vName(v))} · ${ago(v.at)}</span><video id="cv${i}" src="${vid(v).url}" playsinline preload="metadata" ${i ? 'controls' : 'muted'}></video></div>`).join('')}</div>
    <span class="small muted" style="text-align: center">Обе версии играют синхронно. Пробел — пауза, ← → — к соседнему отличию.</span>
    <div class="bstrip" id="cStrip" style="max-width: 720px; width: 100%; align-self: center"><span class="bline"></span></div>
    <div style="max-width: 720px; width: 100%; align-self: center"><div class="ln-lh">Отличия ${esc(b.v)} от ${esc(a.v)} · ${diffs.length}</div>
      ${diffs.map((x, i) => `<div class="ed" data-di="${i}"><button type="button" class="tc g" data-dgo="${i}">${tc(x.t)}</button><span class="tx">${esc(x.result || x.text)}<small>${x.by === 'Claude' ? 'Claude сам' : `правка «${esc(x.text)}»`}</small></span>${x.accepted ? '<span class="eacc on">✓ принято</span>' : ''}</div>`).join('') || `<p class="small muted" style="margin: 10px 2px">Claude не отметил, что поменял в ${esc(b.v)}. Смотрите по видео — плееры идут вместе.</p>`}</div>
    <div class="row" style="gap: 8px; justify-content: center"><a class="btn" href="#/reel/${esc(id)}/edit">Закрыть сравнение</a>${canEdit() ? `<button type="button" class="btn" id="keepOld">Вернуть ${esc(a.v)} целиком</button><button type="button" class="btn primary" id="keepNew">Оставить ${esc(b.v)}</button>` : ''}</div></div>`;
  const [v0, v1] = [$('#cv0'), $('#cv1')];
  v1.onplay = () => { v0.currentTime = v1.currentTime; v0.play(); };
  v1.onpause = () => v0.pause();
  v1.onseeked = () => { v0.currentTime = v1.currentTime; };
  let at = -1;
  const go = (i) => {
    if (!diffs.length) return;
    at = (i + diffs.length) % diffs.length;
    v1.pause(); v1.currentTime = diffs[at].t; v0.currentTime = diffs[at].t;
    host.querySelectorAll('[data-di]').forEach((r) => r.classList.toggle('on', Number(r.dataset.di) === at));
  };
  host.querySelectorAll('[data-dgo]').forEach((x) => (x.onclick = () => go(Number(x.dataset.dgo))));
  const strip = $('#cStrip');
  const dots = () => { if (!v1.duration) return; strip.innerHTML = `<span class="bline"></span>${diffs.map((x, i) => `<button type="button" class="bdot" style="left: ${Math.min(100, (x.t / v1.duration) * 100)}%; background: #2E8A4F" data-dgo="${i}" aria-label="${tc(x.t)} — ${esc(x.result || x.text)}" title="${tc(x.t)} — ${esc(x.result || x.text)}"></button>`).join('')}`; strip.querySelectorAll('[data-dgo]').forEach((x) => (x.onclick = () => go(Number(x.dataset.dgo)))); };
  v1.addEventListener('loadedmetadata', dots); if (v1.readyState >= 1) dots();
  const keys = (e) => {
    if (!$('#cv1')) return document.removeEventListener('keydown', keys);
    if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(at + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(at - 1); }
    else if (e.key === ' ') { e.preventDefault(); v1.paused ? v1.play() : v1.pause(); }
  };
  document.addEventListener('keydown', keys);
  $('#keepOld')?.addEventListener('click', () => chatOf().say(`Верни ${a.v} как текущую версию: пересобери её и пришли.`, `Вернуть ${a.v}`));
  $('#keepNew')?.addEventListener('click', async () => { await post('/api/reel/ready', {reel: id, v: b.v}); toast(`${b.v} идёт в «Готово»`); location.hash = `#/reel/${id}/edit`; });
}

// Выкладка (CleanPublish): captions per platform, checks, and a package the bot sends to Telegram on time.
function stagePublish(id, data) {
  const pub = data.publish || {};
  const caps = Array.isArray(pub.captions) && pub.captions.length ? pub.captions : [{platform: 'Instagram', text: section(data.readme, 'Подпись').trim() || section(data.readme, 'Caption').trim()}];
  const cur = data.versions[0];
  // Every version that still has a video can be published; the newest one with a master goes first.
  const isMaster = (v) => v.files.some((f) => f.kind === 'master');
  const pubVers = data.versions.filter((v) => v.files.some((f) => f.kind === 'master' || f.kind === 'copy'));
  const pubDefault = pubVers.find((v) => v.v === data.ready) || pubVers.find(isMaster) || pubVers[0];
  const host = $('#reelHost');
  const d = new Date(Date.now() + 3600e3); d.setMinutes(0, 0, 0);
  const local = new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
  // «Готовые файлы»: a card per version that has a video — a reel may have RU and EN masters,
  // and each needs its own obvious download, its cover and a word on what that version is.
  const pick = (v, k) => v.files.filter((f) => f.kind === k).sort((a, b) => b.size - a.size)[0];
  const mastersLabel = (n) => `${n} ${n % 10 === 1 && n % 100 !== 11 ? 'мастер' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'мастера' : 'мастеров'}`;
  const readyCard = (v) => {
    const master = pick(v, 'master'), copy = pick(v, 'copy'), cover = pick(v, 'cover') || pick(v, 'thumb');
    const note = versionNote(data.readme, v.v);
    const res = master ? (/1440p/i.test(master.name) ? '1440p' : /1080p/i.test(master.name) ? '1080p' : 'мастер') : '';
    return `<div class="card" style="display: flex; gap: 14px; align-items: flex-start">
      <div style="flex: none; width: 66px; aspect-ratio: 9 / 16; border-radius: 10px; background: var(--soft) center / cover no-repeat; ${cover ? `background-image: url('${cover.url}')` : ''}"></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
        <div class="row" style="gap: 8px; flex-wrap: wrap"><b>${esc(vName(v))}${v === cur ? ' · текущая' : ''}</b>${master ? `<span class="small" style="color: var(--green); font-weight: 600">✓ мастер ${res}</span>` : `<span class="small" style="color: var(--amber); font-weight: 600">${copy ? 'мастер не собран' : 'видео не сохранено — можно пересобрать'}</span>`}</div>
        ${note ? `<span class="small" style="line-height: 1.45">${esc(note)}</span>` : ''}
        <div class="row" style="gap: 8px; flex-wrap: wrap; margin-top: 4px">
          ${master ? `<a class="btn primary" href="${master.url}&dl=1">Скачать мастер ${esc(v.v)} · ${mb(master.size)} ↓</a>` : canEdit() ? `<button type="button" class="btn primary" data-pubmaster="${esc(v.v)}">Собрать мастер 1440p</button>` : ''}
          ${cover ? `<a class="btn" href="${cover.url}&dl=1">Обложка ↓</a>` : ''}
          ${copy ? `<a class="small muted" href="${copy.url}&dl=1" style="align-self: center">лёгкая копия · ${mb(copy.size)}</a>` : ''}
        </div></div></div>`;
  };
  host.innerHTML = `<div class="page" style="gap: 22px; max-width: 980px">
    ${!cur ? '<p class="muted">Выкладывать пока нечего — сначала смонтируйте первую версию.</p>' : ''}
    ${pubVers.length ? `<div class="blk"><span class="lbl">Готовые файлы · ${mastersLabel(pubVers.filter(isMaster).length)}</span>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px">${data.versions.map(readyCard).join('')}</div></div>` : ''}
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
      ${caps.map((c, i) => `<div class="cap"><div class="row" style="gap: 8px"><b>${esc(c.platform || 'Площадка')}</b><span class="small muted">${esc(c.account || '')}</span></div>
        <label class="lbl" for="cap${i}">Подпись · <span data-len="${i}">${(c.text || '').length}</span> знаков</label><textarea class="f" id="cap${i}" ${canEdit() ? '' : 'readonly'}>${esc(c.text || '')}</textarea></div>`).join('')}
    </div>
    ${!pub.captions ? `<p class="small muted">Подписи Claude пишет в publish.json — попроси в чате справа: «напиши подписи для RU и EN».${canEdit() ? ' <button type="button" class="btn" id="mkCaps" style="margin-left: 6px">Написать подписи</button>' : ''}</p>` : ''}
    ${Array.isArray(pub.checks) && pub.checks.length ? `<div class="blk"><span class="lbl">Перед выкладкой</span>${pub.checks.map((c) => `<div class="row" style="gap: 10px"><span style="color: ${c.ok ? 'var(--green)' : 'var(--amber)'}; font-weight: 700">${c.ok ? '✓' : '!'}</span><span>${esc(c.text)}</span></div>`).join('')}</div>` : ''}
    ${cur && canEdit() ? `<div class="card" style="display: flex; flex-direction: column; gap: 12px"><b>Прислать пакет в Телеграм</b>
      <span class="small muted">В нужное время бот пришлёт тебе подпись, видео выбранной версии и обложку — выложишь с телефона за минуту. Мастер больше 50 МБ Телеграм от бота не пропускает — его скачай кнопкой «Скачать мастер».</span>
      <div class="row" style="gap: 10px; flex-wrap: wrap"><label class="small muted" for="pubAt">Когда</label><input class="f" type="datetime-local" id="pubAt" value="${local}" style="width: auto"><select class="f" id="pubVer" style="width: auto">${pubVers.map((v) => `<option value="${esc(v.v)}" ${v === pubDefault ? 'selected' : ''}>${esc(vName(v))}${isMaster(v) ? ' · мастер' : ''}</option>`).join('')}</select><select class="f" id="pubCap" style="width: auto">${caps.map((c, i) => `<option value="${i}">${esc(c.platform || 'Подпись ' + (i + 1))}</option>`).join('')}</select><button type="button" class="btn primary" id="pubGo">Запланировать</button></div></div>` : ''}
    ${data.outbox?.length ? `<div class="blk"><span class="lbl">Запланировано</span>${data.outbox.map((o) => `<div class="li"><span style="flex: 1">${new Date(o.at).toLocaleString('ru', {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})} · ${esc(o.version)}${o.platform ? ' · ' + esc(o.platform) : ''}</span><span class="small muted">${o.sent ? (o.error ? 'не ушло: ' + esc(o.error) : 'отправлено в Телеграм') : 'ждёт · ' + esc(o.by)}</span>${!o.sent && canEdit() ? `<button type="button" class="btn" data-cancel="${esc(o.id)}">Отменить</button>` : ''}</div>`).join('')}</div>` : ''}
  </div>`;
  if (cur) {
    const vid = cur.files.filter((f) => /\.(mp4|mov|webm)$/i.test(f.name)).sort((a, b) => a.size - b.size)[0];
    const cover = cur.files.find((f) => f.kind === 'cover' || f.kind === 'thumb');
    nxBlock(host.querySelector('.page'), {caps, kind: 'reel', seen: pub.seen, ask: canEdit() ? (t) => chatOf().say(t, 'Исправить: ' + t.slice(0, 60)) : null,
      base: {kind: 'reel', media: vid ? {type: 'video', url: vid.url} : null, cover: cover?.url, name: projName(), reel: data.template, grid: (OV?.reels || []).filter((r) => r.id !== id && r.thumb).slice(0, 8).map((r) => ({url: r.thumb, kind: 'reel'}))},
      onSeen: async (key) => { await post('/api/reel/seen', {reel: id, key}); drawStage(id, 'publish'); }});
  }
  {
    if (!ITEMS) loadItems().then(() => ITEMS && location.hash.startsWith('#/reel/' + id) && drawStage(id, 'publish')).catch(() => {});
    const it = ITEMS?.items.find((x) => x.ref?.kind === 'reel' && x.ref.id === id);
    const ig = igPublished(it, () => drawStage(id, 'publish'));
    if (ig) host.querySelector('.page').prepend(ig);
  }
  // A master button per version that has one (RU v1, EN v2…), then the current copy and cover.
  const masterOf = (v) => v.files.filter((f) => f.kind === 'master').sort((a, b) => b.size - a.size)[0];
  const masters = data.versions.filter(isMaster);
  if (cur) $('#dlTop').innerHTML = masters.map((v) => `<a class="btn primary" href="${masterOf(v).url}&dl=1">Скачать мастер ${esc(v.v)} ↓</a>`).join('') +
    cur.files.filter((f) => ['copy', 'cover'].includes(f.kind)).map((f) => `<a class="btn" href="${f.url}&dl=1">${f.kind === 'cover' ? 'Обложка' : 'Видео ' + esc(cur.v)} ↓</a>`).join('');
  host.querySelectorAll('[data-pubmaster]').forEach((b) => (b.onclick = () => chatOf().say(`Собери мастер 1440p версии ${b.dataset.pubmaster} (без --draft, 1440×2560, CRF 15) из её снимка проекта versions/${b.dataset.pubmaster}/project-snapshot. Если снимка нет — восстанови эту версию по README (что в ней было) и сохранённым файлам проекта (например, тексты на другом языке) во временной копии project/, не трогая текущую версию. Скажи, когда будет готов.`, `Мастер ${b.dataset.pubmaster}`)));
  host.querySelectorAll('textarea.f').forEach((t, i) => (t.oninput = () => { host.querySelector(`[data-len="${i}"]`).textContent = t.value.length; }));
  $('#mkCaps')?.addEventListener('click', () => chatOf().say('Напиши подписи к этому рилсу для каждой площадки и проверку перед выкладкой в publish.json.', 'Написать подписи'));
  $('#pubGo')?.addEventListener('click', async () => {
    const i = Number($('#pubCap').value);
    const it = await post('/api/publish', {reel: id, version: $('#pubVer').value, at: new Date($('#pubAt').value).toISOString(), caption: $('#cap' + i).value, platform: caps[i].platform}).catch(() => null);
    toast(it ? 'Запланировано — бот пришлёт пакет в Телеграм' : 'Не получилось запланировать');
    drawStage(id, 'publish');
  });
  host.querySelectorAll('[data-cancel]').forEach((b) => (b.onclick = async () => { await post('/api/publish/cancel', {id: b.dataset.cancel}); drawStage(id, 'publish'); }));
}

// ---------- «Как увидят» (NX0–NX7): the release in the platform's own interface, before «Выложить» ----------
// One row per platform from the captions; each opens the platform's frames (web/preview.js) with
// the zones, the warnings and «Исправить» (a request to Claude); looking marks the row «видел».
function nxViews(platform, kind) {
  const ig = /insta/i.test(platform || ''), tg = /телеграм|telegram|канал|\btg\b/i.test(platform || '');
  if (tg) return [['telegram', 'Светлая тема', {theme: 'light'}], ['telegram', 'Тёмная тема', {theme: 'dark'}]];
  if (ig && kind === 'reel') return [['reels', 'Reels', {}], ['grid', 'Сетка профиля', {}], ['story', 'История-анонс', {}]];
  if (ig) return [[kind === 'carousel' ? 'carousel' : 'feed', kind === 'carousel' ? 'Карусель в ленте' : 'Лента', {}], ['grid', 'Сетка профиля', {}]];
  return [[kind === 'reel' ? 'reels' : 'feed', 'Как в ленте', {}]];
}
function nxBlock(host, {caps, kind, base, seen, onSeen, ask}) {
  if (!window.Preview) return;
  const rows = caps.map((c, i) => {
    const views = nxViews(c.platform, kind);
    const warn = views.reduce((n, [v, , o]) => n + Preview.checks(v, {...base, ...o, caption: c.text, platform: c.platform}).length, 0);
    const key = `${c.platform || 'Площадка'}`;
    return {c, i, views, warn, key, seen: seen?.[key]};
  });
  const box = document.createElement('div');
  box.className = 'blk';
  box.innerHTML = `<span class="lbl">Как увидят · пролистай каждую площадку как подписчик</span>
    ${rows.map((r) => `<div class="nx-row"><span style="flex: 1; min-width: 0"><b>${esc(r.c.platform || 'Площадка')}</b>${r.c.account ? ` <span class="small muted">${esc(r.c.account)}</span>` : ''}<div class="small muted">${r.views.map((v) => v[1]).join(' · ')}</div></span>
      <span class="nx-st ${r.warn ? 'w' : r.seen ? 'ok' : ''}">${r.warn ? `⚠ ${r.warn}` : r.seen ? '✓ видел' : ''}</span><button type="button" class="btn" data-nx="${r.i}">${svg('eye', 14)}${r.seen ? 'Ещё раз' : 'Открыть'}</button></div>`).join('')}
    ${rows.some((r) => !r.seen) ? '<span class="small muted">Отметка «видел» ставится, когда открыл площадку и пролистал её.</span>' : ''}`;
  host.prepend(box);
  box.querySelectorAll('[data-nx]').forEach((b) => (b.onclick = () => nxOpen(rows[Number(b.dataset.nx)], base, onSeen, ask)));
  if (!rows.length || !Preview.phone) return;
  const live = document.createElement('div');
  live.className = 'nx-live';
  let pick = 0, w = 300;
  // «Готово» fits the window (кусок 17): the phones scale to the free height under them, up to
  // their natural size, so on a laptop nothing scrolls.
  const fit = () => {
    const ph = live.querySelector('.nx-phones'), sc = live.closest('#reelHost, .page') || document.scrollingElement;
    if (!ph || !live.isConnected) return w;
    const free = window.innerHeight - (ph.getBoundingClientRect().top + (sc.scrollTop || 0)) - 44;
    return Math.max(170, Math.min(330, Math.floor(free / 2.17), Math.floor((ph.clientWidth - 28) / 2)));
  };
  const draw = () => {
    const row = rows[pick];
    live.innerHTML = `<div class="row" style="gap: 12px; flex-wrap: wrap">${rows.length > 1 ? `<span class="ln-seg">${rows.map((r, i) => `<button type="button" class="${i === pick ? 'on' : ''}" data-pick="${i}">${esc(r.c.platform || 'Площадка')}</button>`).join('')}</span>` : `<b>${esc(row.c.platform || 'Как увидят')}</b>`}
      <span class="small muted">Так увидят подписчики${row.c.account ? ' ' + esc(row.c.account) : igFor(row.c) ? ' @' + esc(igFor(row.c).account) : ''}${igFor(row.c) ? ` · профиль: ${igWhen(igFor(row.c))}` : ''}. Нажмите на телефон — зоны и проверка.</span></div>
      <div class="nx-phones">${row.views.slice(0, 2).map(([v, label, o], j) => { const opts = {...base, ...o, caption: row.c.text, platform: row.c.platform, account: row.c.account || base.account, profile: igFor(row.c)}; return `<button type="button" class="nx-ph" data-vi="${j}" aria-label="${esc(label)}">${`<span class="nx-fit" style="width: ${w}px; height: ${Math.round(w * 2.17)}px"><span style="transform: scale(${w / 330})">${Preview.phone(Preview.frame(v, opts), {light: Preview.light(v, o)})}</span></span>`}<span class="small">${esc(label)}</span></button>`; }).join('')}</div>`;
    live.querySelectorAll('[data-pick]').forEach((b) => (b.onclick = () => { pick = Number(b.dataset.pick); draw(); }));
    live.querySelectorAll('[data-vi]').forEach((b) => (b.onclick = () => nxOpen(rows[pick], base, onSeen, ask, Number(b.dataset.vi))));
  };
  draw();
  host.prepend(live);
  const refit = () => { const n = fit(); if (Math.abs(n - w) > 2) { w = n; draw(); } };
  requestAnimationFrame(refit);
  let t = 0;
  const onResize = () => { if (!live.isConnected) return window.removeEventListener('resize', onResize); clearTimeout(t); t = setTimeout(refit, 120); };
  window.addEventListener('resize', onResize);
}
function nxOpen(row, base, onSeen, ask, start = 0) {
  let at = start, zones = true, slide = 0;
  const ov = document.createElement('div');
  ov.className = 'nx-ov';
  const draw = () => {
    const [v, label, o] = row.views[at];
    const opts = {...base, ...o, caption: row.c.text, platform: row.c.platform, account: row.c.account || base.account, profile: igFor(row.c), zones, slide};
    const warns = Preview.checks(v, opts);
    ov.innerHTML = `<div class="nx-box" role="dialog" aria-label="Как увидят: ${esc(row.c.platform || '')}"><div>${Preview.frame(v, opts)}</div>
      <div style="display: flex; flex-direction: column; gap: 14px; min-width: 0"><div class="row"><b style="font-size: 18px; flex: 1">${esc(row.c.platform || 'Площадка')}</b><button type="button" class="btn" id="nxX" aria-label="Закрыть">✕</button></div>
        <div class="tabs" style="margin: 0">${row.views.map((x, i) => `<button type="button" class="${i === at ? 'on' : ''}" data-v="${i}">${esc(x[1])}</button>`).join('')}</div>
        ${['reels', 'story'].includes(v) ? `<label class="row small" style="gap: 8px"><input type="checkbox" id="nxZ" ${zones ? 'checked' : ''}>Зоны «не ставить текст» — штриховкой</label>` : ''}
        ${v === 'carousel' && (base.slides || []).length > 1 ? `<div class="row" style="gap: 6px"><button type="button" class="btn" id="nxPrev">‹</button><span class="small muted">слайд ${slide + 1} из ${base.slides.length}</span><button type="button" class="btn" id="nxNext">›</button></div>` : ''}
        ${['reels', 'story', 'grid'].includes(v) && base.kind === 'reel' && !base.reel?.template && ask ? `<div class="small muted" style="display: flex; flex-direction: column; gap: 6px">Ролик собран без шаблона — где стоят плашки, по геометрии не узнать.<button type="button" class="btn" id="nxAsk" style="align-self: flex-start">Попросить Claude проверить зоны</button></div>` : ''}
        ${warns.map((w, i) => `<div class="nx-warn"><span>⚠ ${esc(w.text)}</span>${ask ? `<div class="row" style="gap: 8px"><button type="button" class="btn" data-fix="${i}">Исправить</button><span class="small">или выложить так</span></div>` : ''}</div>`).join('') || '<div class="small" style="color: var(--green)">✓ По геометрии всё на месте: текст вне интерфейса площадки, подпись читается.</div>'}
        <span class="small muted">${opts.profile ? `Аватар, имя и подписчики — с @${esc(opts.profile.account)} (${igWhen(opts.profile)}); лайки — обычные для последних публикаций, в сетке ваши настоящие посты.` : 'Интерфейс нарисован студией для предпросмотра; цифры лайков и просмотров — для примера.'}</span>
        <div class="row" style="margin-top: auto; gap: 8px"><button type="button" class="btn primary" id="nxOk">✓ Видел</button>${at < row.views.length - 1 ? '<button type="button" class="btn" id="nxNx">Дальше: ' + esc(row.views[at + 1][1]) + '</button>' : ''}</div></div></div>`;
    ov.querySelector('#nxX').onclick = () => ov.remove();
    ov.querySelectorAll('[data-v]').forEach((b) => (b.onclick = () => { at = Number(b.dataset.v); slide = 0; draw(); }));
    ov.querySelector('#nxZ')?.addEventListener('change', (e) => { zones = e.target.checked; draw(); });
    ov.querySelector('#nxPrev')?.addEventListener('click', () => { slide = Math.max(0, slide - 1); draw(); });
    ov.querySelector('#nxNext')?.addEventListener('click', () => { slide = Math.min(base.slides.length - 1, slide + 1); draw(); });
    ov.querySelector('#nxNx')?.addEventListener('click', () => { at++; slide = 0; draw(); });
    ov.querySelectorAll('[data-fix]').forEach((b) => (b.onclick = () => { ask(warns[Number(b.dataset.fix)].fix); ov.remove(); }));
    ov.querySelector('#nxAsk')?.addEventListener('click', () => { ask(`Проверь текущую версию по зонам площадки «${row.c.platform}» (${label}): ${Preview.ZONES[v === 'grid' ? 'reels' : v]?.map((z) => `${z.label} — ${Math.round(z.x0 * 100)}–${Math.round(z.x1 * 100)}% по ширине, ${Math.round(z.y0 * 100)}–${Math.round(z.y1 * 100)}% по высоте`).join('; ') || 'сетка режет кадр до 3:4, видно 12–88 % высоты'}. Посмотри кадры, где текст или плашки заходят в эти зоны, и предложи, как сдвинуть.`); ov.remove(); });
    ov.querySelector('#nxOk').onclick = async () => { await onSeen(row.key); ov.remove(); };
  };
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  document.body.append(ov);
  draw();
}

// ---------- posts (POSTS.md, web/posts.mjs) ----------
// One editor for a text post, a post with a photo and a carousel; the stages depend on the kind.
const postStages = (k) => k === 'carousel' ? [['struct', 'Структура'], ['slides', 'Слайды'], ['publish', 'Подпись и выкладка']]
  : [['text', k === 'photo' ? 'Текст и фото' : 'Текст'], ['publish', 'Выкладка']];

async function vPost(id, stage) {
  const [data] = await Promise.all([api('/api/post?post=' + encodeURIComponent(id)).catch(() => null), loadItems().catch(() => null)]);
  if (!data) { view.innerHTML = '<div class="page"><p class="muted">Такого поста нет. <a href="#/all/posts">Все посты</a></p></div>'; return; }
  const p = data.post;
  const stages = postStages(p.kind);
  const at = data.summary?.stage === 'done' ? 'publish' : data.summary?.stage;
  if (stage !== 'idea' && !stages.some(([k]) => k === stage)) stage = stages.some(([k]) => k === at) ? at : stages[0][0];
  const atI = stages.findIndex(([k]) => k === at);
  const kindSel = canEdit() ? `<select class="rchip" id="kindSel" aria-label="Тип поста">${[['text', 'Текст'], ['photo', 'С фото'], ['carousel', 'Карусель']].map(([k, t]) => `<option value="${k}" ${k === p.kind ? 'selected' : ''}>${t}</option>`).join('')}</select>` : '';
  const nav = (await relHead('post', id, POST_STEPS(p.kind), stage, `#/post/${id}/`, p.title || 'Пост')).replace('<span id="dlTop"', kindSel + '<span id="dlTop"');
  title(p.title || 'Пост');
  const chatName = {idea: 'Чат поста', text: 'Чат поста', struct: 'Чат карусели', slides: 'Чат карусели', publish: 'Чат выкладки'}[stage];
  view.innerHTML = `<div class="work"><div class="rmain">
    ${nav || `    <div class="chead"><div style="flex: 1; min-width: 220px"><div class="small muted"><a href="#/all">Выпуски</a> › ${esc((KIND[p.kind] || 'пост').toLowerCase())}</div><h1 style="font-size: 20px; display: flex; align-items: center; gap: 10px">${esc(p.title || 'Пост')} ${kindBadge(p.kind)}</h1></div>
      ${nav ? '' : `<nav class="stg" aria-label="Этапы">${stages.map(([k, t], i) => `<a href="#/post/${esc(id)}/${k}" class="${k === stage ? 'on' : i < atI ? 'done' : ''}">${t}</a>`).join('')}</nav>`}
      ${canEdit() ? `<select class="f" id="kindSel" aria-label="Тип поста" style="width: auto; min-height: 36px">${[['text', 'Текст'], ['photo', 'С фото'], ['carousel', 'Карусель']].map(([k, t]) => `<option value="${k}" ${k === p.kind ? 'selected' : ''}>${t}</option>`).join('')}</select>` : ''}</div>`}
    <div id="reelHost" style="flex: 1; overflow-y: auto"></div></div>
    <aside class="chatcol" aria-label="${chatName}"><div class="chead" style="padding: 12px 16px"><b style="flex: 1">${chatName}</b>${canEdit() ? '<button type="button" class="btn" id="resetChat">Новый чат</button>' : ''}</div>
      <div class="ctx">Claude знает: <span class="chip">бриф</span><span class="chip">правила</span><span class="chip">дизайн-систему</span><span class="chip">этот пост</span></div>
      <div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></aside></div>`;
  wireRelHead(view, () => vPost(id, stage));
  const box = chatBox('post-' + id, {onDone: () => { sidebar(); if (stage !== 'idea') drawPost(id, stage); }});
  $('#chatHost').append(box);
  $('#resetChat')?.addEventListener('click', async () => { if (confirm('Начать чат поста заново? Тексты и картинки останутся.')) { await post('/api/chat/reset', {key: 'post-' + id}); vPost(id, stage); } });
  $('#kindSel')?.addEventListener('change', async (e) => { await post('/api/post/save', {post: id, patch: {kind: e.target.value}}); location.hash = '#/post/' + id; vPost(id); });
  if (stage === 'idea') drawIdea($('#reelHost'), 'post', id); else drawPost(id, stage, data);
  const pending = sessionStorage.getItem('firstMsg:post-' + id);
  if (pending) { sessionStorage.removeItem('firstMsg:post-' + id); const {text, shown} = JSON.parse(pending); await box.ready; box.say(text, shown); }
}

async function drawPost(id, stage, data) {
  data ||= await api('/api/post?post=' + encodeURIComponent(id));
  const host = $('#reelHost');
  if (!host) return;
  const save = (patch) => post('/api/post/save', {post: id, patch});
  ({text: postText, struct: postStruct, slides: postSlides, publish: postPublish})[stage](id, data, host, save);
}

// Текст (и фото) — EdPost: three variants, the chosen one outlined; photo with 4:5 / 1:1 and «Светлее».
function postText(id, data, host, save) {
  const p = data.post, texts = p.texts || [];
  const chosenPhoto = (p.photos || []).find((x) => x.chosen && x.out) || (p.photos || []).find((x) => x.out);
  const outUrl = chosenPhoto && data.images.find((f) => f.name === chosenPhoto.out.split('/').pop())?.url;
  let src = chosenPhoto?.file || data.sources[0]?.name, crop = chosenPhoto?.crop || '4:5', bright = !!chosenPhoto?.bright;
  host.innerHTML = `<div style="display: flex; min-height: 100%">
    ${p.kind === 'photo' ? `<div style="flex: 0 0 360px; padding: 26px 26px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--hov)">
      <span class="lbl">Фото${data.sources.length ? ' · ' + data.sources.length : ''}</span>
      <div style="aspect-ratio: ${crop === '1:1' ? '1' : '4 / 5'}; border-radius: 14px; background: var(--soft) center / cover no-repeat; ${outUrl ? `background-image: url('${outUrl}')` : ''}" id="phBig">${outUrl ? '' : '<span class="small muted" style="display: grid; place-items: center; height: 100%; padding: 20px; text-align: center">Загрузи фото — выбери и кадрируй</span>'}</div>
      ${canEdit() && data.sources.length ? `<div class="row" style="gap: 6px">${[['4:5', '4:5'], ['1:1', '1:1'], ['orig', 'Как есть']].map(([k, t]) => `<button type="button" class="chip" data-crop="${k}" style="${k === crop ? 'border-color: var(--ink); font-weight: 600' : ''}">${t}</button>`).join('')}<button type="button" class="chip" id="brightBtn" style="${bright ? 'border-color: var(--ink); font-weight: 600' : ''}">Светлее</button></div>` : ''}
      <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px">${data.sources.filter((f) => /\.(jpe?g|png|webp|heic)$/i.test(f.name)).map((f) => `<button type="button" data-src="${esc(f.name)}" title="${esc(f.name)}" style="aspect-ratio: 1; border-radius: 8px; border: 0; padding: 0; background: var(--soft) center / cover no-repeat; background-image: url('${f.url}'); ${f.name === src ? 'outline: 2px solid var(--ink); outline-offset: 1px' : ''}"></button>`).join('')}
        ${canEdit() ? '<label style="aspect-ratio: 1; border-radius: 8px; border: 1.5px dashed var(--line); display: grid; place-items: center; color: var(--muted); cursor: pointer">+<input type="file" accept="image/*" multiple hidden id="phUp"></label>' : ''}</div>
      ${p.why ? `<span class="small muted">${esc(p.why)}</span>` : ''}
    </div>` : ''}
    <div style="flex: 1; min-width: 0; padding: 26px 32px; display: flex; flex-direction: column; gap: 14px">
      <div class="row" style="gap: 12px"><b style="font-size: 18px; font-weight: 600">Текст${texts.length ? ' · ' + texts.length + ' варианта' : ''}</b><span class="small muted">выбери вариант, правки — словами в чате</span></div>
      ${texts.map((t, i) => `<button type="button" class="var ${i === (p.chosen || 0) ? 'on' : ''}" data-pick="${i}"><span class="small muted" style="font-weight: 500">${esc(t.style || 'Вариант ' + (i + 1))}${i === (p.chosen || 0) ? ' · выбран' : ''}</span><span style="font-size: 15px; line-height: 1.6; white-space: pre-wrap">${esc(t.text)}</span></button>`).join('')
        || `<p class="muted">Вариантов пока нет.${canEdit() ? ' <button type="button" class="btn" id="mkTexts">Написать 3 варианта</button>' : ''}</p>`}
      ${texts.length ? `<div class="row small muted" style="gap: 10px">${(texts[p.chosen || 0]?.text || '').length} знаков · подписи для площадок — на выкладке ${canEdit() ? `<a class="btn primary" style="margin-left: auto" href="#/post/${esc(id)}/publish">Дальше: выкладка</a>` : ''}</div>` : ''}
    </div></div>`;
  host.querySelectorAll('[data-pick]').forEach((b) => (b.onclick = async () => { if (!canEdit()) return; await save({chosen: Number(b.dataset.pick)}); drawPost(id, 'text'); }));
  $('#mkTexts')?.addEventListener('click', () => chatOf().say('Напиши три варианта текста этого поста в разных стилях (первым — стиль рубрики) в post.json.', 'Написать 3 варианта'));
  const apply = async () => { if (!src) return; const r = await post('/api/post/photo', {post: id, file: src, crop, bright}).catch((e) => ({error: e.message})); if (r.error) toast('Не получилось: ' + r.error); drawPost(id, 'text'); };
  host.querySelectorAll('[data-crop]').forEach((b) => (b.onclick = () => { crop = b.dataset.crop; apply(); }));
  $('#brightBtn')?.addEventListener('click', () => { bright = !bright; apply(); });
  host.querySelectorAll('[data-src]').forEach((b) => (b.onclick = () => { src = b.dataset.src; apply(); }));
  $('#phUp')?.addEventListener('change', async (e) => {
    for (const f of e.target.files) await fetch(`/api/upload?project=${encodeURIComponent(P)}&post=${encodeURIComponent(id)}&name=${encodeURIComponent(f.name)}`, {method: 'POST', body: f});
    toast(`Загружено: ${e.target.files.length}`);
    drawPost(id, 'text');
  });
}

// Структура — EdCarStruct: slides as rows, drag to reorder, 5/6/7, «Собрать слайды».
function postStruct(id, data, host, save) {
  const p = data.post, slides = p.slides || [], T = data.templates;
  host.innerHTML = `<div class="page" style="max-width: 900px; gap: 16px">
    <div class="row" style="gap: 12px"><div style="flex: 1"><b style="font-size: 18px; font-weight: 600">Из чего будет карусель</b><div class="small muted">Claude делит тему на слайды и подбирает шаблон каждому</div></div>
      ${canEdit() ? `<span class="small muted">Слайдов</span><span class="seg">${[5, 6, 7].map((n) => `<button type="button" data-n="${n}" class="${slides.length === n ? 'on' : ''}">${n}</button>`).join('')}</span>` : ''}</div>
    <div id="srows" style="display: flex; flex-direction: column; gap: 8px">${slides.map((x, i) => `<div class="srow" draggable="${canEdit()}" data-i="${i}"><span class="h" aria-hidden="true">⋮⋮</span><b style="width: 22px">${i + 1}</b><span style="flex: 1; min-width: 0"><b style="font-weight: 600">${esc(x.title || '')}</b><div class="small muted" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${esc((x.items || []).join(' · ') || x.text || '')}</div></span><span class="kind">${esc(T[x.template] || x.template)}</span></div>`).join('')
      || `<p class="muted">Слайдов пока нет.${canEdit() ? ' <button type="button" class="btn" id="mkStruct">Разбить тему на слайды</button>' : ''}</p>`}</div>
    ${canEdit() && slides.length ? `<div class="row"><button type="button" class="btn" id="addSlide">+ Слайд</button><span class="small muted">Перетащи, чтобы поменять порядок · 5–7 слайдов листают до конца чаще</span><button type="button" class="btn primary" id="build" style="margin-left: auto">Собрать слайды</button></div>` : ''}
  </div>`;
  $('#mkStruct')?.addEventListener('click', () => chatOf().say('Разбей тему на 5–7 слайдов и подбери шаблон каждому в post.json (slides).', 'Разбить на слайды'));
  host.querySelectorAll('[data-n]').forEach((b) => (b.onclick = () => chatOf().say(`Сделай карусель из ${b.dataset.n} слайдов: перестрой slides в post.json.`, `${b.dataset.n} слайдов`)));
  $('#addSlide')?.addEventListener('click', async () => { await save({slides: [...slides, {template: 'list', title: 'Новый слайд', items: []}]}); drawPost(id, 'struct'); });
  let from = null;
  host.querySelectorAll('.srow').forEach((row) => {
    row.ondragstart = () => { from = Number(row.dataset.i); row.classList.add('drag'); };
    row.ondragend = () => row.classList.remove('drag');
    row.ondragover = (e) => e.preventDefault();
    row.ondrop = async (e) => { e.preventDefault(); const to = Number(row.dataset.i); if (from === null || from === to) return; const next = [...slides]; next.splice(to, 0, next.splice(from, 1)[0]); await save({slides: next}); drawPost(id, 'struct'); };
  });
  $('#build')?.addEventListener('click', async (e) => { e.target.disabled = true; e.target.textContent = 'Собираю…'; const r = await post('/api/post/slides', {post: id}).catch((x) => ({error: x.message})); if (r.error) { toast('Не получилось: ' + r.error); e.target.disabled = false; e.target.textContent = 'Собрать слайды'; return; } location.hash = '#/post/' + id + '/slides'; });
}

// Слайды — EdCarousel: the strip, the chosen slide large, its template and texts; looks come from the design system.
function postSlides(id, data, host, save) {
  const p = data.post, slides = p.slides || [], T = data.templates;

  const x = slides[cur] || {};
  const bust = '&t=' + Date.now();
  host.innerHTML = !slides.length ? `<div class="page"><p class="muted">Сначала структура: <a href="#/post/${esc(id)}/struct">разбить тему на слайды</a>.</p></div>` : `<div class="page" style="gap: 18px">
    <div class="strip">${slides.map((s, i) => `<button type="button" data-s="${i}" class="${i === cur ? 'on' : ''}" style="${png(i) ? `background-image: url('${png(i)}${bust}')` : ''}"><span>${i + 1} · ${esc(T[s.template] || s.template)}</span></button>`).join('')}</div>
    <div class="split" style="gap: 28px">
      <div style="flex: 0 0 380px"><div style="aspect-ratio: 4 / 5; border-radius: 14px; border: 1px solid var(--line); background: var(--soft) center / cover no-repeat; ${png(cur) ? `background-image: url('${png(cur)}${bust}')` : ''}"></div><div class="small muted" style="margin-top: 8px">${cur + 1} / ${slides.length} · 1080×1350</div></div>
      <div style="flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 12px">
        <span class="lbl">Шаблон слайда</span><div class="row" style="gap: 6px">${Object.entries(T).map(([k, t]) => `<button type="button" class="chip" data-t="${k}" style="${k === x.template ? 'border-color: var(--ink); font-weight: 600' : ''}" ${canEdit() ? '' : 'disabled'}>${t}</button>`).join('')}</div>
        <label class="lbl" for="sTitle">Заголовок</label><input class="f" id="sTitle" value="${esc(x.title || '')}" ${canEdit() ? '' : 'readonly'}>
        ${['list', 'check', 'summary'].includes(x.template) ? `<label class="lbl" for="sItems">Пункты · до 6, по одному в строке${x.template === 'check' ? ' («что — цена»)' : ''}</label><textarea class="f" id="sItems" ${canEdit() ? '' : 'readonly'}>${esc((x.items || []).join('\n'))}</textarea>` : ''}
        ${['cover', 'summary', 'cta'].includes(x.template) ? `<label class="lbl" for="sText">Текст</label><textarea class="f" id="sText" style="min-height: 70px" ${canEdit() ? '' : 'readonly'}>${esc(x.text || '')}</textarea>` : ''}
        ${x.template === 'check' ? `<label class="lbl" for="sTotal">Итого</label><input class="f" id="sTotal" value="${esc(x.total || '')}" ${canEdit() ? '' : 'readonly'}>` : ''}
        <span class="small muted">Цвета, шрифт и отступы — из дизайн-системы проекта, руками не меняются.</span>

// Выкладка — EdPostPublish / EdCarCaption: native captions per platform with their own time, checks, a package to Telegram.

    $('#srcInfo').textContent = f.sources.length ? `${f.sources.length} файлов · ${mb(f.sources.reduce((a, x) => a + x.size, 0))}` : '';

      await fetch(`/api/upload?project=${encodeURIComponent(P)}&reel=${encodeURIComponent(id)}&name=${encodeURIComponent(f.name)}`, {method: 'POST', body: f});

  }
  load();
}

// What the README says about one version: its line under «## Версии», first sentence.
const versionNote = (readme, v) => {
  const line = String(readme || '').split('\n').find((l) => new RegExp(`^\\s*[-*]\\s*${v}\\b`).test(l));
  return line ? line.replace(/^\s*[-*]\s*\S+\s*(\([^)]*\))?:?\s*/, '').split(/(?<=\.)\s/)[0] : '';
};
const section = (readme, name) => (new RegExp(`^## ${name}[^\\n]*\\n([\\s\\S]*?)(?=^## |$(?![\\s\\S]))`, 'm').exec(String(readme || '')) || [])[1] || '';

// Правки по секундам (Д3, VE1, VP1–VP6): a list of notes for the next version, each at a second,
// typed or spoken (Whisper on the server), optionally with a point on the frame.
function wireEdits(id, rv, form, cur, nextV) {
  let point = null, voice = false, rec = null, pinMode = false;
  const tEl = $('#eT'), layer = $('#pinL'), hint = $('#eHint');
  const upd = () => { tEl.textContent = tc(rv.currentTime); };
  rv.addEventListener('timeupdate', upd); rv.addEventListener('seeked', upd); rv.addEventListener('pause', upd);
  $('#eText').addEventListener('focus', () => rv.pause());
  // Point on the frame: a layer over the paused video takes one click.
  $('#ePt').onclick = () => { rv.pause(); pinMode = !pinMode; layer.hidden = !pinMode; $('#ePt').classList.toggle('primary', pinMode); hint.textContent = pinMode ? 'Нажми на кадр, где поправить' : ''; };
  layer.onclick = (e) => {
    const r = layer.getBoundingClientRect();
    point = {x: Math.round(100 * (e.clientX - r.left) / r.width), y: Math.round(100 * (e.clientY - r.top) / r.height)};
    layer.innerHTML = `<span class="pin" style="left: ${point.x}%; top: ${point.y}%">●</span>`;
    pinMode = false; $('#ePt').classList.remove('primary'); layer.style.pointerEvents = 'none'; hint.textContent = `Точка: ${point.x}% слева, ${point.y}% сверху`;
  };
  // Voice: record, the server writes it out with Whisper, the text lands in the field.
  $('#eMic').onclick = async () => {
    if (rec) { rec.stop(); return; }
    rv.pause();
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); } catch { toast('Нет доступа к микрофону'); return; }
    const chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach((x) => x.stop());
      const type = rec.mimeType || 'audio/webm'; rec = null;
      $('#eMic').textContent = '… распознаю'; $('#eMic').disabled = true;
      const r = await fetch(`/api/reel/voice?project=${encodeURIComponent(P)}&reel=${encodeURIComponent(id)}`, {method: 'POST', headers: {'content-type': type}, body: new Blob(chunks, {type})}).then((x) => x.json()).catch(() => ({}));
      $('#eMic').textContent = '🎙 Голосом'; $('#eMic').disabled = false; $('#eMic').classList.remove('primary');
      if (r.text) { $('#eText').value = ($('#eText').value ? $('#eText').value + ' ' : '') + r.text; voice = true; } else toast('Не расслышал — напиши словами');
    };
    rec.start(); $('#eMic').textContent = '■ Стоп'; $('#eMic').classList.add('primary'); hint.textContent = 'Говори — нажми «Стоп», когда закончишь';
  };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const text = $('#eText').value.trim();
    if (!text) return $('#eText').focus();
    await post('/api/reel/edits', {reel: id, action: 'add', t: rv.currentTime, text, point, voice});
    renderVersions(id);
  };
}

// Which version the «Монтаж» player shows, per reel: the current one unless another variant is picked.
const VIEWV = {};
const vName = (v) => `${v.v}${v.variant ? ' · ' + v.variant : ''}`;

// Сборка (handbook/LEAN.md, кусок 17; холст L5, LR1): a version is one whole cut — v1, v2, v3, each
// with its mp4; a new one comes only from «Собрать vN». One player, the versions as cards in a row
// (a click switches the player), one of them marked «идёт в Готово» (the newest by default), «Что
// изменилось в vN» to check line by line, «Правки к vN+1» that pile up until the build, and on the
// strip under the player green dots — changed in this version, yellow — waiting for the next one.
function editsBlock(edits, view, cur, nextV) {
  const open = edits.filter((x) => x.state === 'open'), sent = edits.filter((x) => x.state === 'sent' && x.forV === nextV);
  const done = edits.filter((x) => x.state === 'done' && x.forV === view.v);
  const ed = canEdit(), ok = done.filter((x) => x.accepted).length;
  const lang = (x) => (x.lang ? `только ${x.lang.toUpperCase()}` : 'RU и EN');
  const how = (x) => [x.voice ? 'голосом' : 'текстом', x.shape ? ({rect: 'обведено на кадре', brush: 'кистью на кадре', point: 'точка на кадре', frame: 'весь кадр'})[x.shape.kind] : x.point ? 'точка на кадре' : ''].filter(Boolean).join(' · ');
  const doneRow = (x) => `<div class="ed"><button type="button" class="tc g" data-eseek="${x.t}">${tc(x.t)}</button><span class="tx">${esc(x.result || x.text)}<small>${x.by === 'Claude' ? 'Claude сам' : `ваша правка «${esc(x.text)}»`}</small></span>
      <span class="ac">${ed ? `<button type="button" class="eacc ${x.accepted ? 'on' : ''}" data-eacc="${x.id}" aria-pressed="${!!x.accepted}">✓ принято</button>` : x.accepted ? '<span class="eacc on">✓ принято</span>' : ''}</span></div>`;
  const openRow = (x) => `<div class="ed" data-erow="${x.id}"><button type="button" class="tc y" data-eseek="${x.t}">${tc(x.t)}</button><span class="tx"><span class="etx" ${ed ? `contenteditable="plaintext-only" data-etext="${x.id}" role="textbox" aria-label="Текст правки"` : ''}>${esc(x.text)}</span><small>${how(x)}</small></span>
      <span class="ac">${ed ? `<select class="elang" data-elang="${x.id}" aria-label="Для каких языков"><option value="" ${x.lang ? '' : 'selected'}>RU и EN</option><option value="ru" ${x.lang === 'ru' ? 'selected' : ''}>только RU</option><option value="en" ${x.lang === 'en' ? 'selected' : ''}>только EN</option></select><button type="button" class="ln-btn s g" data-erm="${x.id}" aria-label="Убрать правку">✕</button>` : `<span class="scp">${lang(x)}</span>`}</span></div>`;
  return `${done.length ? `<div><div class="ln-lh">Что изменилось в ${esc(view.v)} · проверьте<span style="margin-left: auto" class="${ok === done.length ? 'ok' : ''}">${ok} из ${done.length} приняты</span></div>${done.map(doneRow).join('')}</div>` : ''}
    ${view === cur ? `<div><div class="ln-lh">Правки к ${esc(nextV)} · ${open.length}</div>
      ${open.map(openRow).join('') || `<p class="small muted" style="margin: 10px 2px">${sent.length ? `Отправлено ${sent.length} — Claude собирает ${esc(nextV)}.` : 'Пока нет. Остановите видео и скажите, что поменять, — правка встанет сюда с секундой. Можно и словами в чате справа.'}</p>`}
      ${sent.length && open.length ? `<p class="small muted" style="margin: 8px 2px 0">Ещё ${sent.length} уже у Claude.</p>` : ''}</div>` : ''}`;
}

async function renderVersions(id, data) {
  data ||= await api('/api/reel?reel=' + encodeURIComponent(id));
  const el = $('#vers');
  if (!el) return;
  const vs = data.versions, ed = canEdit();
  const video = (v) => v.files.filter((f) => /\.(mp4|mov|webm)$/i.test(f.name)).sort((a, b) => a.size - b.size)[0];
  const thumb = (v) => v.files.find((f) => f.kind === 'thumb' || f.kind === 'cover');
  const mp4 = (v) => v.files.filter((f) => f.kind === 'master').sort((a, b) => b.size - a.size)[0] || v.files.find((f) => f.kind === 'copy') || video(v);
  const hasMaster = (v) => v.files.some((f) => f.kind === 'master');
  const cur = vs[0];
  const sel = vs.find((v) => v.v === VIEWV[id]) || cur;
  const ready = vs.find((v) => v.v === data.ready && video(v)) || vs.find((v) => video(v));
  const nextV = cur ? 'v' + (Number(cur.v.replace(/\D/g, '')) + 1) : 'v1';
  const edits = data.edits || [];
  const open = edits.filter((x) => x.state === 'open');
  const withVideo = vs.filter((v) => video(v));
  const prevOf = (v) => withVideo[withVideo.indexOf(v) + 1];
  const script = section(data.readme, 'Сценарий');
  $('#dlTop').innerHTML = sel && mp4(sel) ? `<a class="btn primary" href="${mp4(sel).url}&dl=1">Скачать ${esc(sel.v)}${hasMaster(sel) ? ' · мастер' : ''}</a>` : '';
  const changes = (v) => edits.filter((x) => x.state === 'done' && x.forV === v.v).length;
  const card = (v) => `<div class="vc ${v === sel ? 'on' : ''}" role="button" tabindex="0" data-viewv="${esc(v.v)}" aria-pressed="${v === sel}">
      <b>${esc(vName(v))}${video(v) && mp4(v) ? `<a class="dl" href="${mp4(v).url}&dl=1" title="Скачать ${esc(v.v)} в mp4" aria-label="Скачать ${esc(v.v)}">↓ mp4</a>` : ''}</b>
      <span>${v === vs.at(-1) ? 'первая сборка' : changes(v) ? `${changes(v)} ${changes(v) === 1 ? 'правка' : changes(v) < 5 ? 'правки' : 'правок'}` : 'сборка'} · ${ago(v.at)}</span>
      <span>${!video(v) ? 'хранится кадром' : hasMaster(v) ? 'мастер готов' : 'черновик'}</span>
      ${v === ready ? '<span class="pick">идёт в «Готово»</span>' : video(v) && ed ? `<button type="button" class="vpick" data-vready="${esc(v.v)}">в «Готово»</button>` : ''}
    </div>`;
  el.innerHTML = `<div class="bld">
    <div class="bplay">
      ${sel && video(sel)
        ? `<div class="vwrap"><video id="rv" src="${video(sel).url}" controls playsinline preload="metadata" ${thumb(sel) ? `poster="${thumb(sel).url}"` : ''}></video><div class="pinlayer" id="pinL" hidden></div></div>
          <div class="bstrip" id="bStrip" aria-label="Отметки на полосе времени"><span class="bline"></span></div>
          <div class="bleg"><span><i style="background: #2E8A4F"></i>изменено в ${esc(sel.v)}</span>${sel === cur ? `<span><i style="background: #E5A33C"></i>правка к ${esc(nextV)}</span>` : ''}</div>
          ${sel === cur && ed ? `<form class="ecomp" id="eComp"><div class="row" style="gap: 6px"><b id="eT" class="tcx">0:00</b><span class="small muted">правка к ${esc(nextV)}</span></div>
            <textarea class="f" id="eText" rows="2" placeholder="Что поменять в этот момент — словами или голосом"></textarea>
            <div class="row" style="gap: 6px"><button type="button" class="btn" id="eMic" title="Сказать голосом">🎙 Голосом</button><button type="button" class="btn" id="ePt" title="Показать место на кадре">◎ Точка на кадре</button><button type="submit" class="btn primary" style="margin-left: auto">Добавить</button></div>
            <span class="small muted" id="eHint">Остановите видео в нужный момент — правка привяжется к секунде</span></form>`
          : sel !== cur ? `<span class="small muted" style="text-align: center">Смотрите ${esc(vName(sel))}. Правки пишутся к ${esc(nextV)}.</span>` : ''}
          ${ed ? `<button type="button" class="linkbtn" data-vlabel="${esc(sel.v)}" data-cur="${esc(sel.variant || '')}" style="align-self: center">${sel.variant ? 'Переименовать вариант' : 'Назвать вариант (RU, EN…)'}</button>` : ''}`
        : sel ? `<div class="vph" style="${thumb(sel) ? `background: #000 center / contain no-repeat url('${thumb(sel).url}'); color: #fff` : ''}">Видео ${esc(sel.v)} не хранится — можно пересобрать из снимка</div>${ed ? `<button type="button" class="btn" data-rebuild="${esc(sel.v)}">Пересобрать ${esc(sel.v)}</button>` : ''}`
        : '<div class="vph">Видео появится, когда Claude смонтирует первую версию</div>'}
    </div>
    <div class="binfo">
      ${cur ? `<div><div class="ln-lh">Версии · ${vs.length}${withVideo.length > 1 ? `<a href="#/reel/${esc(id)}/compare">сравнить ${esc((prevOf(sel) || withVideo[1]).v)} ↔ ${esc((prevOf(sel) ? sel : withVideo[0]).v)}</a>` : ''}</div>
        <div class="vcards">${vs.map(card).join('')}</div></div>` : '<p class="small muted">Версий пока нет. Напишите в чате справа, что снять или смонтировать.</p>'}
      ${cur ? editsBlock(edits, sel, cur, nextV) : ''}
      ${cur && ed && sel === cur && !hasMaster(cur) ? `<p class="small muted" style="margin: 0">Нравится ${esc(cur.v)} как есть? <button type="button" class="linkbtn" id="acceptV">Принять и собрать мастер 1440p</button></p>` : ''}
      ${script.trim() ? `<details class="blk"><summary class="lbl" style="cursor: pointer">Сценарий</summary><div class="md" style="font-size: 14px">${md(script)}</div></details>` : ''}
    </div>
  </div>
  ${cur && ed ? `<div class="bfoot">${open.length ? `<span class="small muted">${open.length} ${open.length === 1 ? 'правка' : open.length < 5 ? 'правки' : 'правок'} к ${esc(nextV)}</span>` : `<span class="small muted">Новая версия собирается только по кнопке — правки сначала копятся.</span>`}
    <span style="flex: 1"></span><a class="btn" href="#/reel/${esc(id)}/publish">${svg('eye', 14)}Как увидят</a>
    <button type="button" class="btn primary" id="eBuild" ${open.length ? '' : 'disabled'}>Собрать ${esc(nextV)}${open.length ? ` · правок: ${open.length}` : ''}</button></div>` : ''}`;
  // The strip: where this version changed (green) and the notes waiting for the next one (yellow).
  const rv = $('#rv'), strip = $('#bStrip');
  const dots = () => {
    if (!strip || !rv || !Number.isFinite(rv.duration) || !rv.duration) return;
    const at = (t) => Math.min(100, Math.max(0, (t / rv.duration) * 100));
    const marks = [...edits.filter((x) => x.state === 'done' && x.forV === sel.v).map((x) => [x, '#2E8A4F', x.result || x.text]), ...(sel === cur ? open.map((x) => [x, '#E5A33C', x.text]) : [])];
    strip.innerHTML = `<span class="bline"></span><i class="bhead" id="bHead"></i>${marks.map(([x, c, t]) => `<button type="button" class="bdot" style="left: ${at(x.t)}%; background: ${c}" data-eseek="${x.t}" title="${tc(x.t)} — ${esc(t)}" aria-label="${tc(x.t)} — ${esc(t)}"></button>`).join('')}`;
    strip.querySelectorAll('[data-eseek]').forEach((b) => (b.onclick = () => { rv.currentTime = Number(b.dataset.eseek); rv.pause(); }));
    strip.onclick = (e) => { if (e.target !== strip && !e.target.classList.contains('bline')) return; const r = strip.getBoundingClientRect(); rv.currentTime = rv.duration * (e.clientX - r.left) / r.width; };
  };
  if (rv) {
    rv.addEventListener('loadedmetadata', dots);
    if (rv.readyState >= 1) dots();
    rv.addEventListener('timeupdate', () => { const h = $('#bHead'); if (h && rv.duration) h.style.left = (rv.currentTime / rv.duration) * 100 + '%'; });
  }
  const form = $('#eComp');
  if (rv && form) wireEdits(id, rv, form, cur, nextV);
  el.querySelectorAll('[data-viewv]').forEach((b) => {
    const go = (e) => { if (e.target.closest('a, button')) return; VIEWV[id] = b.dataset.viewv === cur.v ? null : b.dataset.viewv; renderVersions(id, data); };
    b.onclick = go;
    b.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(e); } };
  });
  el.querySelectorAll('[data-vlabel]').forEach((b) => (b.onclick = async () => {
    const label = prompt(`Как назвать вариант ${b.dataset.vlabel}? Например: RU, EN, короткая. Пусто — снять метку.`, b.dataset.cur || '');
    if (label == null) return;
    await post('/api/reel/variant', {reel: id, v: b.dataset.vlabel, label}).catch(() => null);
    renderVersions(id);
  }));
  el.querySelectorAll('[data-vready]').forEach((b) => (b.onclick = async () => { await post('/api/reel/ready', {reel: id, v: b.dataset.vready}); toast(`${b.dataset.vready} идёт в «Готово»`); renderVersions(id); }));
  el.querySelectorAll('[data-eseek]').forEach((b) => b.closest('#bStrip') || (b.onclick = () => { if (rv) { rv.currentTime = Number(b.dataset.eseek); rv.pause(); rv.scrollIntoView({block: 'nearest'}); } }));
  el.querySelectorAll('[data-erm]').forEach((b) => (b.onclick = async () => { await post('/api/reel/edits', {reel: id, action: 'remove', id: b.dataset.erm}); renderVersions(id); }));
  el.querySelectorAll('[data-eacc]').forEach((b) => (b.onclick = async () => { await post('/api/reel/edits', {reel: id, action: 'accept', id: b.dataset.eacc, accepted: b.getAttribute('aria-pressed') !== 'true'}); renderVersions(id); }));
  el.querySelectorAll('[data-elang]').forEach((s) => (s.onchange = () => post('/api/reel/edits', {reel: id, action: 'update', id: s.dataset.elang, lang: s.value}).then(() => toast('Сохранено'))));
  el.querySelectorAll('[data-etext]').forEach((t) => {
    t.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); t.blur(); } };
    t.onblur = () => { const v = t.textContent.trim(), x = open.find((y) => y.id === t.dataset.etext); if (!v || !x || v === x.text) { if (!v) t.textContent = x.text; return; } x.text = v; post('/api/reel/edits', {reel: id, action: 'update', id: x.id, text: v}).then(() => toast('Правка обновлена')); };
  });
  $('#acceptV')?.addEventListener('click', () => chatOf().say(`Принимаю ${cur.v}. Собери мастер 1440p этой версии (без --draft, 1440×2560, CRF 15) и скажи, когда будет готов.`, `Принять ${cur.v}`));
  $('#eBuild')?.addEventListener('click', async () => {
    await post('/api/reel/edits', {reel: id, action: 'send', forV: nextV});
    chatOf().say(`Правки к ${nextV}:\n${open.map((x, i) => `${i + 1}. ${tc(x.t)}${x.lang ? ` (только ${x.lang.toUpperCase()})` : ''} — ${x.text}${x.point ? ` (точка на кадре: ${x.point.x}% слева, ${x.point.y}% сверху)` : ''}`).join('\n')}\nСобери ${nextV} черновиком. В edits.json у каждой правки поставь "state": "done" и "result" — что сделано, в несколько слов; если сам поменял что-то ещё, допиши пункт с "by": "Claude", "state": "done", "forV": "${nextV}", "t" и "result".`, `Собрать ${nextV} · правок: ${open.length}`);
    renderVersions(id);
  });
  el.querySelectorAll('[data-rebuild]').forEach((b) => (b.onclick = () => chatOf().say(`Пересобери версию ${b.dataset.rebuild} этого рилса из её снимка versions/${b.dataset.rebuild}/project-snapshot/ и пришли её.`, `Пересобрать ${b.dataset.rebuild}`)));
}

  draw();
}
