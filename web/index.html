// «Шаблон» of a rubric (TEMPLATES.md): its reels are built from this template's scenes.
function tplBlock(cur, list) {
  const t = list.find((x) => x.id === cur.template);
  const scenes = (x) => x.scenes.map((s) => `<span class="tchip mb" title="${esc(s.kind)}">${s.lock ? '🔒 ' : ''}${esc({hook: 'Хук', photo: 'Кадр', clip: 'В кадре', base: 'Основа', item: 'Пункт', total: 'Итог', tip: 'Совет', compare: 'Сравнение', question: 'Вопрос', answer: 'Ответ', fact: 'Факт', cta: 'Призыв'}[s.kind] || s.kind)}${s.repeat ? ` ×${s.repeat[0]}–${s.repeat[1]}` : ''}</span>`).join(' ');
  return `<div class="blk"><span class="lbl">Шаблон ролика</span>
    <div class="row" style="gap: 10px"><select class="f" id="tplSel" data-rubric="${esc(cur.id)}" style="width: auto"><option value="" ${cur.template ? '' : 'selected'}>Без шаблона — Claude пишет ролик целиком</option>
      <optgroup label="Готовые форматы студии">${list.map((x) => `<option value="${esc(x.id)}" ${x.id === cur.template ? 'selected' : ''}>${esc(x.name)} — для: ${esc(x.fits)}</option>`).join('')}</optgroup></select>${t ? `<span class="small muted">${esc(t.about)}</span>` : ''}</div>
    ${t ? `<div class="row" style="gap: 6px; flex-wrap: wrap">${scenes(t)}</div><span class="small muted">Новый ролик рубрики собирается из этих сцен: материал раскладывается по ним, 🔒 берутся из рубрики. Подходит для: ${esc(t.fits)}.</span>` : '<span class="small muted">С шаблоном ролик собирается быстрее и всегда в виде рубрики. Шаблоны — готовые форматы студии, одинаковые во всех проектах; их можно не выбирать.</span>'}</div>`;
}

async function vKnowledge(tab = 'overview', sel) {
  title('Стратегия');
  const [k, plan] = await Promise.all([api('/api/knowledge'), api('/api/plan')]);
  const st = plan.strategy || {}, plats = st.platforms || [], rubs = st.rubrics || [], slots = st.rhythm?.slots || [];
  const rules = (k.playbook.match(/^\s*- /gm) || []).length;
  const tabs = [['overview', 'Обзор'], ['platforms', 'Площадки · ' + plats.length], ['rubrics', 'Рубрики · ' + rubs.length], ['rhythm', 'Ритм'], ['brief', 'Бриф'], ['rules', 'Правила · ' + rules]];
  const empty = !plats.length && !rubs.length;
  const ask = (t) => `<button type="button" class="btn" data-ask="${esc(t)}">${esc(t)}</button>`;
  const fmtRow = (f) => `<div class="li"><span style="display: inline-flex; gap: 8px; align-items: center; width: 160px">${svg(f.kind === 'photo' || f.kind === 'text' || f.kind === 'carousel' || f.kind === 'reel' || f.kind === 'story' ? f.kind : 'photo', 15)}<b style="font-weight: 600">${esc(KIND[f.kind] || f.kind)}</b></span><span class="small muted" style="flex: 1">${esc([f.spec, f.note].filter(Boolean).join(' · '))}</span><span style="font-weight: 500">${f.perWeek ? f.perWeek + ' в неделю' : ''}</span></div>`;
  const week = () => `<div class="pweekwrap"><div style="display: grid; grid-template-columns: repeat(7, minmax(130px, 1fr)); gap: 10px">${DAYS.map((d, i) => `<div style="display: flex; flex-direction: column; gap: 8px"><span class="small muted" style="font-weight: 600">${d}</span>${slots.filter((x) => Number(x.day) === i + 1).sort((a, b) => String(a.time).localeCompare(String(b.time))).map((x) => `<span style="border-left: 4px solid ${rubricColor(st, x.rubric)}; background: var(--side); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.35; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; gap: 5px; align-items: center">${svg(x.kind || 'photo', 12)}<b style="font-weight: 600">${esc(rubricName(st, x.rubric))}</b></span><span class="muted">${esc([x.time, (plats.find((p) => p.id === x.platform) || {}).name].filter(Boolean).join(' · '))}</span></span>`).join('') || '<span class="small muted">—</span>'}</div>`).join('')}</div></div>`;
  const balance = () => { const total = slots.length; if (!total) return ''; return `<div class="blk"><span class="lbl">Сверка с долями рубрик · ${total} мест в неделю</span>${rubs.map((x) => { const have = slots.filter((s) => s.rubric === x.id || s.rubric === x.name).length; const want = Math.round((x.share || 0) * total / 100); return `<div class="li"><span style="width: 10px; height: 10px; border-radius: 3px; background: ${esc(x.color || '#A3A3A3')}"></span><span style="flex: 1">${esc(x.name)}</span><span class="small muted">${x.share ? x.share + ' %' : 'вне долей'}</span><span style="width: 90px; text-align: right; font-weight: 500; color: ${!x.share || Math.abs(have - want) < 1 ? 'var(--green)' : 'var(--amber)'}">${have} из ${want}${!x.share || have === want ? ' ✓' : have > want ? ' +' + (have - want) : ' −' + (want - have)}</span></div>`; }).join('')}</div>`; };
  let body;
  if (tab === 'brief' || tab === 'rules') body = `<div class="md" style="max-width: 860px">${md(tab === 'rules' ? k.playbook : k.brief) || '<p class="muted">Пусто.</p>'}</div>${tab === 'rules' ? '<p class="small muted">Правила Claude дописывает сам из твоих правок.</p>' : ''}`;
  else if (empty) body = `<div class="card" style="display: flex; flex-direction: column; gap: 12px; max-width: 720px"><b style="font-size: 17px">Стратегии ещё нет</b><span class="muted">Claude соберёт её из брифа и того, что уже вышло: площадки, рубрики с долями и цветами, ритм недели. Потом её видно в календаре и в колонке слева.</span><div>${ask('Собери стратегию из брифа')}</div></div>`;
  else if (tab === 'platforms') { const cur = plats.find((x) => x.id === sel) || plats[0]; body = `<div class="split" style="gap: 28px"><div style="flex: 0 0 260px; display: flex; flex-direction: column; gap: 4px">${plats.map((x) => `<a class="nav ${x === cur ? 'on' : ''}" href="#/knowledge/platforms/${esc(x.id)}" style="padding: 10px 12px"><span><b style="font-weight: 600">${esc(x.name)}</b><div class="small muted">${esc(x.account || '')}</div></span></a>`).join('')}<div style="padding-top: 6px">${ask('Добавь площадку')}</div></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px"><div><h2 style="font-size: 22px">${esc(cur.name)}</h2><span class="muted">${esc(cur.account || '')}</span></div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px">${[['Для кого', cur.audience], ['Язык и цены', cur.lang], ['Лучшее время', cur.time]].filter(([, v]) => v).map(([t, v]) => `<div><div class="small muted">${t}</div>${esc(v)}</div>`).join('')}</div>
        <div class="blk"><span class="lbl">Форматы на этой площадке</span>${(cur.formats || []).map(fmtRow).join('') || '<span class="small muted">—</span>'}</div>
        <div class="blk"><span class="lbl">Память площадки — Claude учитывает это сам</span>${(cur.memory || []).map((m) => `<div class="li">${esc(m)}</div>`).join('') || '<span class="small muted">Пока пусто — заполнится из того, что зашло.</span>'}</div></div></div>`; }
  else if (tab === 'rubrics') { const cur = rubs.find((x) => x.id === sel) || rubs[0]; const own = plan.items.filter((x) => x.rubric === cur.id || x.rubric === cur.name); body = `<div class="split" style="gap: 28px"><div style="flex: 0 0 260px; display: flex; flex-direction: column; gap: 4px">${rubs.map((x) => `<a class="nav ${x === cur ? 'on' : ''}" href="#/knowledge/rubrics/${esc(x.id)}" style="padding: 10px 12px"><span style="width: 12px; height: 12px; border-radius: 4px; background: ${esc(x.color || '#A3A3A3')}; flex: none"></span><span style="flex: 1"><b style="font-weight: 600">${esc(x.name)}</b><div class="small muted">${esc(x.why || '')}</div></span><span class="n">${x.share ? x.share + ' %' : '—'}</span></a>`).join('')}<div style="padding-top: 6px">${ask('Добавь рубрику')}</div></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px"><div class="row" style="gap: 12px"><span style="width: 16px; height: 16px; border-radius: 5px; background: ${esc(cur.color || '#A3A3A3')}"></span><h2 style="font-size: 22px">${esc(cur.name)}</h2><span class="muted">${cur.share ? cur.share + ' % плана' : 'вне долей'} · ${own.length} выпусков</span><a class="btn" style="margin-left: auto" href="#/rubric/${esc(cur.id)}">Все выпуски рубрики</a></div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px">${[['Зачем', cur.why], ['О чём', cur.about], ['Вид', cur.look]].filter(([, v]) => v).map(([t, v]) => `<div><div class="small muted">${t}</div>${esc(v)}</div>`).join('')}</div>
        <div class="blk"><span class="lbl">Куда идёт</span>${slots.filter((x) => x.rubric === cur.id || x.rubric === cur.name).map((x) => `<div class="li"><span style="width: 160px; font-weight: 600">${esc((plats.find((p) => p.id === x.platform) || {}).name || x.platform || '')}</span><span class="small muted" style="flex: 1; display: inline-flex; gap: 6px; align-items: center">${svg(x.kind || 'photo', 14)}${esc(KIND[x.kind] || '')}</span><span>${DAYS[(x.day || 1) - 1]} ${esc(x.time || '')}</span></div>`).join('') || '<span class="small muted">В ритме её пока нет.</span>'}</div>
        ${tplBlock(cur, plan.templates || [])}
        <div class="split" style="gap: 24px"><div class="blk" style="flex: 1"><span class="lbl">Правила рубрики</span>${(cur.rules || []).map((x) => `<div class="li">${x.lock ? '🔒 ' : ''}${esc(x.text || x)}</div>`).join('') || (cur.approve ? '' : '<span class="small muted">—</span>')}${cur.approve?.name ? `<div class="li">✓ Согласует по ссылке: <b>${esc(cur.approve.name)}</b>${cur.approve.note ? ` <span class="small muted">· ${esc(cur.approve.note)}</span>` : ''}<span class="small muted" style="margin-left: auto">ссылка на неделю, без входа</span></div>` : ''}</div><div class="blk" style="flex: 1"><span class="lbl">Серии</span>${(cur.series || []).map((x) => `<div class="li">${esc(x)}</div>`).join('') || '<span class="small muted">—</span>'}</div></div></div></div>`; }
  else if (tab === 'rhythm') body = `<div style="display: flex; flex-direction: column; gap: 18px"><div class="muted">${esc(st.rhythm?.season ? 'Сезон: ' + st.rhythm.season + '. ' : '')}Каждая ячейка становится пустым местом в Календаре — его Claude предлагает заполнить.</div>${week()}${balance()}<div class="row" style="gap: 8px">${ask('Поправь ритм под доли рубрик')}${ask('Сделай ритм на межсезонье')}</div></div>`;
  else body = `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
      <a class="card" href="#/knowledge/platforms" style="text-decoration: none; display: flex; flex-direction: column; gap: 10px"><b>Площадки · ${plats.length}</b>${plats.map((x) => `<div class="row" style="gap: 8px"><span style="flex: 1">${esc(x.name)}</span><span class="row small muted" style="gap: 6px">${(x.formats || []).map((f) => svg(f.kind || 'photo', 14)).join('')}</span></div>`).join('')}</a>
      <a class="card" href="#/knowledge/rubrics" style="text-decoration: none; display: flex; flex-direction: column; gap: 8px"><b>Рубрики · ${rubs.length}</b>${rubs.map((x) => `<div class="row" style="gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: ${esc(x.color || '#A3A3A3')}"></span><span style="flex: 1">${esc(x.name)}</span><span class="small muted">${x.share ? x.share + ' %' : 'вне долей'}</span></div>`).join('')}</a>
    </div><a class="card" href="#/knowledge/rhythm" style="text-decoration: none; display: flex; flex-direction: column; gap: 10px"><b>Ритм недели${st.rhythm?.season ? ' · ' + esc(st.rhythm.season) : ''}</b>${week()}</a>`;
  view.innerHTML = `<div class="work"><div class="rmain"><div style="padding: 28px 36px 0; display: flex; flex-direction: column; gap: 6px"><h1>Стратегия</h1><div class="muted" style="font-size: 15px">Где публикуем, о чём говорим и как часто. Из этого Claude собирает план; меняется редко.</div>
      <div class="utabs" role="tablist" style="margin-top: 14px">${tabs.map(([t, n]) => `<a href="#/knowledge/${t}" class="${t === tab ? 'on' : ''}">${n}</a>`).join('')}</div></div>
      <div style="flex: 1; overflow-y: auto; padding: 24px 36px">${body}</div></div>
    <aside class="chatcol" aria-label="Чат стратегии"><div class="chead" style="padding: 12px 16px"><b style="flex: 1">Чат стратегии</b></div><div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></aside></div>`;
  const box = chatBox('_project', {onDone: () => { sidebar(); vKnowledge(tab, sel); }});
  $('#chatHost').append(box);
  view.querySelectorAll('[data-ask]').forEach((b) => (b.onclick = () => box.say(b.dataset.ask + ' (strategy.json, STRATEGY.md).', b.dataset.ask)));
  $('#tplSel')?.addEventListener('change', async (e) => { await post('/api/strategy/template', {rubric: e.target.dataset.rubric, template: e.target.value || null}); route(); });
}

// Календарь (CleanPlan): a week of reels and posts from plan.json, empty rhythm slots, events; drag to a day.
// План (LeanPlan): ideas on dates first. A hairline month (or week) grid, each item with its rubric,
// format and stage; ideas dashed, Claude's proposals marked. Rubrics on the right.
async function vPlan(offset = 0, month = true) {
  title('План');
  const [plan] = await Promise.all([api('/api/plan'), loadItems()]);
  const st = plan.strategy || {};
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const first = new Date(today.getFullYear(), today.getMonth() + (month ? offset : 0), 1);
  let days;
  if (month) {
    const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
    const weeks = Math.ceil((((first.getDay() + 6) % 7) + new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate()) / 7);
    days = Array.from({length: weeks * 7}, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; });
  } else {
    const mon = new Date(today); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7) + offset * 7);
    days = Array.from({length: 7}, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
  }
  const all = ITEMS.items;
  const onDay = (d) => all.filter((x) => x.at && x.at.slice(0, 10) === ymd(d)).sort((p, q) => p.at.localeCompare(q.at));
  const chip = (x) => `<a class="ln-chip ${x.stage === 'idea' ? 'idea' : ''}" draggable="${canEdit()}" data-id="${x.id}" href="${itemHref(x)}" title="${esc(x.title)}">
      <span class="t"><span class="rsq" style="background: ${esc(itemRubric(x)?.color || '#A3A3A3')}"></span><span>${esc(x.title)}</span></span>
      <span class="m">${FMT_NAME[x.format]?.toLowerCase() || ''}${x.proposed ? ' · предложение' : ''}${month ? '' : ' · ' + esc((x.at || '').slice(11, 16))}${x.proposed ? '' : sdot(x.stage)}</span>
      ${x.proposed && canEdit() ? `<span class="m" style="gap: 8px"><button type="button" class="ln-act" data-take="${x.id}">взять</button><button type="button" class="ln-act" data-other="${x.id}" style="color: var(--muted)">другую</button></span>` : ''}</a>`;
  const cells = days.map((d) => {
    const isToday = ymd(d) === ymd(today), out = month && d.getMonth() !== first.getMonth();
    const ev = (plan.events || []).concat(st.events || []).filter((e) => e.date === ymd(d));
    return `<div class="ln-cell${isToday ? ' today' : ''}${out ? ' out' : ''}" data-day="${ymd(d)}" style="${month ? '' : 'min-height: 420px'}"><span class="dn">${d.getDate()}</span>
      ${ev.map((e) => `<span style="font-size: 11px; background: var(--blueBg); color: var(--blue); border-radius: 6px; padding: 3px 6px; font-weight: 600">${esc(e.title)}</span>`).join('')}${onDay(d).map(chip).join('')}</div>`;
  }).join('');
  const shown = all.filter((x) => !x.proposed && x.at && x.at.slice(0, 10) >= ymd(days[0]) && x.at.slice(0, 10) <= ymd(days.at(-1)));
  const undated = all.filter((x) => !x.at && !x.proposed && x.stage !== 'published');
  const mname = first.toLocaleDateString('ru', {month: 'long'});
  const gen = (m) => m.replace(/ь$/, 'я').replace(/т$/, 'та').replace(/й$/, 'я');
  const range = month ? mname : `${days[0].getDate()} ${gen(days[0].toLocaleDateString('ru', {month: 'long'}))} – ${days[6].getDate()} ${gen(days[6].toLocaleDateString('ru', {month: 'long'}))}`;
  const base = month ? '#/plan/m/' : '#/plan/w/';
  const rubs = ITEMS.rubrics.map((r) => `<a href="#/rubric/${esc(r.id)}" style="display: flex; flex-direction: column; gap: 3px; padding: 10px 0; border-bottom: 1px solid #F0F0F0; text-decoration: none; color: var(--ink)"><span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><span class="rsq" style="background: ${esc(r.color || '#A3A3A3')}"></span>${esc(r.name)}<span class="muted" style="margin-left: auto; font-weight: 400; font-size: 12px">${shown.filter((x) => itemRubric(x)?.id === r.id).length}</span></span>${r.about ? `<span class="muted" style="font-size: 12px; padding-left: 16px">${esc(r.about)}</span>` : ''}</a>`).join('');
  view.innerHTML = `<div style="display: flex; flex-direction: column; height: 100vh; min-width: 0">
    <div class="ln-top"><b>План</b><span>·</span><span>${range}</span>
      <span class="ln-seg" style="margin-left: 12px"><a href="#/plan/w" class="${month ? '' : 'on'}">Неделя</a><a href="#/plan" class="${month ? 'on' : ''}">Месяц</a></span>
      <span style="display: inline-flex; gap: 2px; margin-left: 6px"><a class="ln-btn g s" href="${base}${offset - 1}" aria-label="Назад">‹</a><a class="ln-btn g s" href="${base.slice(0, -1)}">Сейчас</a><a class="ln-btn g s" href="${base}${offset + 1}" aria-label="Вперёд">›</a></span>
      <span style="display: inline-flex; gap: 12px; margin-left: 8px">${LIFE.slice(0, 4).map(([k]) => `${sdot(k)}<span class="muted">${shown.filter((x) => x.stage === k).length}</span>`).join('')}</span>
      <span style="flex: 1"></span>${canEdit() ? `<button type="button" class="ln-btn p" id="lay">${svg('idea', 14)}Расписать идеи на 2 недели</button>` : ''}</div>
    <div style="flex: 1; display: flex; min-height: 0">
      <div style="flex: 1; display: flex; flex-direction: column; padding: 16px 20px 20px; min-width: 0; overflow-y: auto">
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 12px; color: var(--muted); padding: 0 0 8px">${DAYS.map((d, i) => `<span style="padding-left: 8px">${month ? d.toLowerCase() : d.toLowerCase() + ' ' + days[i].getDate()}</span>`).join('')}</div>
        <div class="ln-grid">${cells}</div>
        <p class="small muted" style="margin: 12px 2px 0">Пунктир — пока только идея: дату и рубрику уже видно, снимать ещё нечего. Перетащи выпуск на другой день или в «Без даты».</p>
      </div>
      <aside class="ln-aside">
        <div style="display: flex; align-items: center"><b style="font-weight: 600">Рубрики</b><span class="muted" style="margin-left: auto; font-size: 12px">${month ? 'в этом месяце' : 'на этой неделе'}</span></div>
        <div>${rubs || '<span class="small muted">Рубрик пока нет.</span>'}</div>
        ${canEdit() ? '<button type="button" id="addRub" style="align-self: flex-start; border: 0; background: none; padding: 0; font: inherit; font-size: 13px; color: #2F6FEB; font-weight: 600; cursor: pointer">+ Рубрика</button>' : ''}
        <div class="ln-drop" data-day="" style="display: flex; flex-direction: column; gap: 6px; border-radius: 10px; padding: 2px"><div style="display: flex; align-items: center; margin-top: 8px"><b style="font-weight: 600">Без даты</b><span class="muted" style="margin-left: auto; font-size: 12px">${undated.length}</span></div>${undated.slice(0, 6).map(chip).join('')}${undated.length > 6 ? `<a class="small muted" href="#/all">ещё ${undated.length - 6} — в Выпусках</a>` : ''}</div>
        <a href="#/plan/setup" class="muted" style="font-size: 13px; line-height: 1.5; margin-top: auto; display: inline-flex; gap: 6px; align-items: center; text-decoration: none">${svg('sliders', 14)}Площадки и ритм</a>
      </aside>
    </div></div>`;
  const redraw = () => vPlan(offset, month);
  $('#lay')?.addEventListener('click', () => { sessionStorage.setItem('planLay', '1'); location.hash = '#/plan/draft'; });
  $('#addRub')?.addEventListener('click', async () => { const name = prompt('Название рубрики'); if (!name?.trim()) return; const {rubric} = await post('/api/strategy/edit', {rubric: {name}}); location.hash = '#/rubric/' + rubric.id; });
  view.querySelectorAll('[data-take]').forEach((b) => (b.onclick = async (e) => { e.preventDefault(); e.stopPropagation(); b.disabled = true; await post('/api/items/set', {id: b.dataset.take, take: true}); toast('Взято в план'); redraw(); }));
  view.querySelectorAll('[data-other]').forEach((b) => (b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); const x = all.find((y) => y.id === b.dataset.other); sessionStorage.setItem('planAsk', JSON.stringify({text: `Замени идею «${x.title}» на ${(x.at || '').slice(0, 10)} другой — той же рубрики, не повторяя уже вышедшее. Старую убери из ideas.md, новую добавь в «My ideas» с теми же Date: и Rubric:.`, shown: `Другую вместо «${x.title}»`})); location.hash = '#/plan/draft'; }));
  let drag = null;
  view.querySelectorAll('.ln-chip').forEach((c) => { c.ondragstart = () => { drag = c.dataset.id; }; });
  view.querySelectorAll('.ln-cell, .ln-drop').forEach((d) => {
    d.ondragover = (e) => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = async (e) => {
      e.preventDefault(); d.classList.remove('over');
      if (!drag || !canEdit()) return;
      const it = all.find((x) => x.id === drag);
      const time = it?.at?.slice(11, 16) || (st.rhythm?.slots || []).find((s) => s.rubric === it?.rubric)?.time || '19:00';
      await post('/api/items/set', {id: drag, at: d.dataset.day ? `${d.dataset.day}T${time}` : null});
      redraw();
    };
  });
}

// Расписать идеи (LeanPlanDraft): Claude's proposals for the next two weeks by rubric, to take or
// replace one by one; the plan chat on the right.
async function vPlanDraft() {
  title('Расписать идеи');
  await loadItems();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const to = new Date(today); to.setDate(today.getDate() + 13);
  const list = ITEMS.items.filter((x) => x.proposed && x.at && x.at.slice(0, 10) >= ymd(today) && x.at.slice(0, 10) <= ymd(to)).sort((p, q) => p.at.localeCompare(q.at));
  const byRub = [...ITEMS.rubrics, {id: '', name: 'Без рубрики', color: '#A3A3A3'}].map((r) => [r, list.filter((x) => (itemRubric(x)?.id || '') === r.id)]).filter(([, l]) => l.length);
  const row = (x) => `<div class="ln-li"><span class="muted" style="flex: 0 0 64px; font-size: 13px">${new Date(x.at).toLocaleDateString('ru', {weekday: 'short', day: 'numeric'})}</span><span class="muted" style="display: inline-flex">${svg(FMT_ICON[x.format], 15)}</span><a href="#/item/${x.id}" style="flex: 0 0 300px; font-weight: 600; color: var(--ink); text-decoration: none">${esc(x.title)}</a><span class="s" style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${esc(x.idea?.hook || x.idea?.about || '')}</span>${canEdit() ? `<button type="button" class="ln-btn s" data-take="${x.id}">Взять</button><button type="button" class="ln-btn s g" data-other="${x.id}">Другую</button>` : ''}</div>`;
  view.innerHTML = `<div class="work"><div class="rmain">
    <div class="ln-top"><a href="#/plan" style="color: var(--muted); text-decoration: none">План</a><span>›</span><span>Расписать идеи · ${today.getDate()}–${to.getDate()} ${to.toLocaleDateString('ru', {month: 'long'}).replace(/ь$/, 'я').replace(/т$/, 'та').replace(/й$/, 'я')}</span><span style="flex: 1"></span><a class="ln-btn g" href="#/plan">Готово</a>${list.length && canEdit() ? `<button type="button" class="ln-btn p" id="takeAll">Взять все ${list.length} в план</button>` : ''}</div>
    <div style="flex: 1; overflow-y: auto; padding: 22px 36px">
      <div style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 6px"><h1 style="font-size: 24px">${list.length ? `${list.length} ${list.length === 1 ? 'идея' : list.length < 5 ? 'идеи' : 'идей'} на две недели` : 'Идей на две недели пока нет'}</h1><div class="muted" style="font-size: 15px; line-height: 1.5">По рубрикам и ритму плана, без повторов того, что уже вышло. Это только концепции — снимать ничего не надо, пока не возьмёте.</div></div>
      ${byRub.map(([r, l]) => `<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 16px 0 6px"><span class="rsq" style="background: ${esc(r.color || '#A3A3A3')}"></span>${esc(r.name)}</div>${l.map(row).join('')}`).join('') || '<p class="muted" style="margin-top: 16px">Claude сейчас распишет — ответ справа, идеи появятся здесь.</p>'}
    </div></div>
    <aside class="chatcol" aria-label="Поправить словами"><div class="chead" style="padding: 12px 16px"><b style="flex: 1">Поправить словами</b></div><div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></aside></div>`;
  const box = chatBox('_project', {onDone: () => { sidebar(); vPlanDraft(); }});
  $('#chatHost').append(box);
  view.querySelectorAll('[data-take]').forEach((b) => (b.onclick = async () => { b.disabled = true; await post('/api/items/set', {id: b.dataset.take, take: true}); toast('Взято в план'); vPlanDraft(); }));
  view.querySelectorAll('[data-other]').forEach((b) => (b.onclick = () => { const x = list.find((y) => y.id === b.dataset.other); box.say(`Замени идею «${x.title}» на ${x.at.slice(0, 10)} другой — той же рубрики, не повторяя уже вышедшее. Старую убери из ideas.md, новую добавь в «My ideas» с теми же Date: и Rubric:.`, `Другую вместо «${x.title}»`); }));
  $('#takeAll')?.addEventListener('click', async (e) => { e.target.disabled = true; for (const x of list) await post('/api/items/set', {id: x.id, take: true}); toast(`Взято ${list.length}`); location.hash = '#/plan'; });
  await box.ready;
  const ask = sessionStorage.getItem('planAsk');
  if (ask) { sessionStorage.removeItem('planAsk'); const {text, shown} = JSON.parse(ask); box.say(text, shown); }
  else if (sessionStorage.getItem('planLay')) { sessionStorage.removeItem('planLay'); box.say(layIdeasText(ymd(today), ymd(to)), 'Расписать идеи на 2 недели'); }
}


// Рубрика (CleanRubric): its issues, from the strategy and plan.json.
// Рубрика (LeanRubric): a simple group — formula, usual format, day, and its ideas and releases.
async function vRubric(id) {
  const [plan] = await Promise.all([api('/api/plan'), loadItems()]);
  const st = plan.strategy || {}, r = (st.rubrics || []).find((x) => x.id === id);
  if (!r) { view.innerHTML = '<div class="page"><p class="muted">Такой рубрики нет. <a href="#/plan">План</a></p></div>'; return; }
  title(r.name);
  const ed = canEdit();
  const own = ITEMS.items.filter((x) => !x.proposed && itemRubric(x)?.id === r.id).sort((p, q) => String(q.at || '').localeCompare(String(p.at || '')));
  const ideas = ITEMS.items.filter((x) => x.proposed && itemRubric(x)?.id === r.id).length;
  const DAYNAMES = ['по понедельникам', 'по вторникам', 'по средам', 'по четвергам', 'по пятницам', 'по субботам', 'по воскресеньям'];
  const card = (label, inner) => `<div style="border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px"><span class="lbl">${label}</span>${inner}</div>`;
  const plain = 'border: 0; padding: 0; font: inherit; font-size: 15px; background: none; color: var(--ink); width: 100%';
  view.innerHTML = `<div class="ln-top"><a href="#/plan" style="color: var(--muted); text-decoration: none">План</a><span>›</span><span>Рубрика</span><span style="flex: 1"></span>
      ${ed ? `<button type="button" class="ln-btn" id="rAsk">${svg('idea', 14)}Предложить 3 идеи</button><a class="ln-btn p" href="#/new" id="rNew">${svg('plus', 14)}Идея в рубрику</a>` : ''}</div>
    <div style="flex: 1; overflow-y: auto"><div style="max-width: 1120px; padding: 30px 48px; display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; align-items: center; gap: 12px">${ed ? `<input type="color" id="rColor" value="${esc(r.color || '#737373')}" aria-label="Цвет рубрики" style="width: 22px; height: 22px; border: 0; padding: 0; background: none; cursor: pointer">` : `<span style="width: 16px; height: 16px; border-radius: 5px; background: ${esc(r.color)}"></span>`}<input id="rName" aria-label="Название рубрики" value="${esc(r.name)}" ${ed ? '' : 'readonly'} style="border: 0; padding: 0; font: inherit; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; background: none; color: var(--ink); flex: 1"></div>
      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px">
        ${card('Формула — что объединяет', `<input id="rAbout" value="${esc(r.about || '')}" placeholder="Например: «сколько стоит X в Гудаури — честно, с чеком»" ${ed ? '' : 'readonly'} style="${plain}">`)}
        ${card('Обычно', `<select id="rFormat" ${ed ? '' : 'disabled'} style="${plain}"><option value="">любой формат</option>${['reel', 'post', 'carousel', 'telegram'].map((k) => `<option value="${k}" ${r.format === k ? 'selected' : ''}>${FMT_NAME[k].toLowerCase()}</option>`).join('')}</select>`)}
        ${card('Ритм', `<select id="rDay" ${ed ? '' : 'disabled'} style="${plain}"><option value="">по поводу</option>${DAYNAMES.map((t, i) => `<option value="${i + 1}" ${String(r.day) === String(i + 1) ? 'selected' : ''}>${t}</option>`).join('')}</select>`)}
      </div>
      <div><div class="ln-lh">Идеи и выпуски · ${own.length}${ideas ? `<a href="#/all/proposed">ещё ${ideas} предложений Claude</a>` : ''}</div>
        ${own.map((x) => `<a class="ln-li" href="${itemHref(x)}"><span class="muted" style="display: inline-flex">${svg(FMT_ICON[x.format], 15)}</span><span style="flex: 0 0 380px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${esc(x.title)}</span><span class="s" style="flex: 1">${whenText(x.at)}</span>${sdot(x.stage)}</a>`).join('') || '<p class="small muted" style="padding: 10px 2px">Пока ни одного выпуска.</p>'}</div>
      <p class="small muted" style="margin: 0">Больше в рубрике ничего нет: ни шаблонов, ни серий, ни каскада правил. Claude держит формулу и прошлые выпуски, чтобы новые были похожи.${r.rules?.length || r.series?.length || r.template ? ` Старые настройки рубрики (правила, серии, шаблон) остаются в <a href="#/knowledge/rubrics/${esc(r.id)}">прежней Стратегии</a>.` : ''}</p>
      ${ed ? '<button type="button" class="ln-btn g" id="rDel" style="align-self: flex-start; color: #B42318">Удалить рубрику</button>' : ''}
    </div></div>`;
  const save = (patch) => post('/api/strategy/edit', {rubric: {id: r.id, ...patch}}).then(() => toast('Сохранено'));
  $('#rName')?.addEventListener('change', (e) => save({name: e.target.value}).then(() => sidebar()));
  $('#rColor')?.addEventListener('change', (e) => save({color: e.target.value}));
  $('#rAbout')?.addEventListener('change', (e) => save({about: e.target.value}));
  $('#rFormat')?.addEventListener('change', (e) => save({format: e.target.value}));
  $('#rDay')?.addEventListener('change', (e) => save({day: e.target.value}));
  $('#rDel')?.addEventListener('click', async () => { if (!confirm(`Удалить рубрику «${r.name}»? Выпуски останутся, просто без рубрики.`)) return; await post('/api/strategy/edit', {rubric: {id: r.id, remove: true}}); location.hash = '#/plan'; });
  $('#rAsk')?.addEventListener('click', () => { sessionStorage.setItem('planAsk', JSON.stringify({text: `Предложи 3 идеи в рубрику «${r.name}» (id ${r.id}${r.about ? ', формула: ' + r.about : ''}${r.format ? ', обычно ' + FMT_NAME[r.format].toLowerCase() : ''}) на ближайшие две недели, не повторяя её прошлые выпуски. Каждую добавь в ideas.md в «My ideas» со строками «Date: YYYY-MM-DDTHH:MM» и «Rubric: ${r.id}».`, shown: `3 идеи в «${r.name}»`})); location.hash = '#/plan/draft'; });
  $('#rNew')?.addEventListener('click', () => sessionStorage.setItem('newRubric', r.id));
}

// Площадки и ритм (LeanPlanSetup): where we post and how often; Claude counts ideas per week from it.
async function vPlanSetup() {
  title('Площадки и ритм');
  const plan = await api('/api/plan');
  const st = plan.strategy || {};
  const plats = st.platforms || [];
  const per = (p) => p.perWeek ?? (p.formats || []).reduce((n, f) => n + (f.perWeek || 0), 0);
  const off = new Set((st.rhythm?.daysOff || []).map(Number));
  const ed = canEdit();
  const total = plats.reduce((n, p) => n + per(p), 0);
  view.innerHTML = `<div class="ln-top"><a href="#/plan" style="color: var(--muted); text-decoration: none">План</a><span>›</span><span>Площадки и ритм</span><span style="flex: 1"></span><a class="ln-btn p" href="#/plan">Готово</a></div>
    <div style="flex: 1; overflow-y: auto"><div style="max-width: 1100px; padding: 30px 48px; display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; flex-direction: column; gap: 6px"><h1 style="font-size: 24px">Где выходим и как часто</h1><div class="muted" style="font-size: 15px">От этого Claude считает, сколько идей ставить на неделю и какого формата.</div></div>
      <div><div class="ln-lh">Площадки</div>
        ${plats.map((p) => `<div class="ln-li" style="padding: 13px 4px">${svg(/tg|telegram|телеграм/i.test(p.id + p.name) ? 'text' : 'photo', 16)}<span style="font-weight: 600; flex: 0 0 220px">${esc(p.name)}</span><span class="s" style="flex: 1">${esc((p.formats || []).map((f) => KIND[f.kind] || f.kind).join(', ').toLowerCase() || p.account || '')}</span>
          <span class="ln-seg">${ed ? `<button type="button" data-pl="${esc(p.id)}" data-d="-1" aria-label="Реже">−</button>` : ''}<span class="on" style="padding: 5px 12px; border-radius: 8px; font-size: 13px">${per(p)} в нед.</span>${ed ? `<button type="button" data-pl="${esc(p.id)}" data-d="1" aria-label="Чаще">+</button>` : ''}</span></div>`).join('') || '<p class="small muted" style="padding: 10px 2px">Площадок пока нет — расскажите о них в чате проекта.</p>'}
        <a class="ln-li" href="#/chat/_project" style="color: #A3A3A3">${svg('plus', 16)}<span>Площадка: YouTube Shorts, VK, TikTok — добавить через чат</span></a></div>
      <div><div class="ln-lh">Дни, когда не выходим</div><div style="display: flex; gap: 8px; padding-top: 12px">${DAYS.map((d, i) => `<button type="button" class="ln-pill ${off.has(i + 1) ? 'on' : ''}" data-off="${i + 1}" ${ed ? '' : 'disabled'}>${d.toLowerCase()}</button>`).join('')}</div></div>
      <div style="border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; background: #FAFAFA"><span class="muted">${svg('idea', 18)}</span><span style="font-size: 14px">Итого ≈ ${total} ${total === 1 ? 'выпуск' : total > 1 && total < 5 ? 'выпуска' : 'выпусков'} в неделю${off.size ? ` · не выходим: ${[...off].sort().map((d) => DAYS[d - 1].toLowerCase()).join(', ')}` : ''}.</span></div>
      <p class="small muted" style="margin: 0">Подробности площадок — аудитория, время, форматы — в <a href="#/knowledge/platforms">прежней Стратегии</a>.</p>
    </div></div>`;
  view.querySelectorAll('[data-pl]').forEach((b) => (b.onclick = async () => { const p = plats.find((x) => x.id === b.dataset.pl); await post('/api/strategy/edit', {platform: {id: p.id, perWeek: per(p) + Number(b.dataset.d)}}); vPlanSetup(); }));
  view.querySelectorAll('[data-off]').forEach((b) => (b.onclick = async () => { const d = Number(b.dataset.off); off.has(d) ? off.delete(d) : off.add(d); await post('/api/strategy/edit', {daysOff: [...off]}); vPlanSetup(); }));
}

// Project settings: title + tabs on top, each tab is one of the older pages rendered below.
// Память (handbook/LEAN.md, кусок 2): what Claude knows and checks in every release.
// For now its tabs are the old Settings and Strategy ones; facts with dates come in кусок 9.
const MEMORY_TABS = ['facts', 'brief', 'voice', 'rules', 'ds', 'files'];
async function vBrief() {
  const k = await api('/api/knowledge');
  view.innerHTML = `<div class="page" style="max-width: 980px; padding: 22px 36px"><div class="md">${md(k.brief) || '<p class="muted">Пусто. Расскажите о проекте в <a href="#/chat/_project">чате проекта</a> — Claude запишет.</p>'}</div></div>`;
}
async function vTabs(base, head, tabs, tab, note = '') {
  const cur = tabs.find(([k]) => k === tab) || tabs[0];
  view.innerHTML = `<div class="ln-top"><b>${head}</b>${note ? `<span>·</span><span>${note}</span>` : ''}</div><div style="padding: 20px 40px 0">
    <div class="utabs" role="tablist">${tabs.map(([k, t]) => `<a href="#/${base}/${k}" class="${k === cur[0] ? 'on' : ''}">${t}</a>`).join('')}</div></div>
    <div id="tabHost" style="flex: 1; display: flex; flex-direction: column; min-height: 0"></div>`;
  const main = view;
  view = $('#tabHost');
  try { await cur[2](); } finally { view = main; }
  title(head);
}
const vMemory = (tab) => vTabs('memory', 'Память', [['facts', 'Факты и цены', vFacts], ['voice', 'Голос и стиль', vVoice], ['rules', 'Правила', vRules], ['ds', 'Дизайн', vDs], ['files', 'Файлы', vFiles], ['brief', 'О проекте', vBrief]], tab, 'всё, что Claude знает о проекте и проверяет в каждом выпуске');
async function vSettings(tab = 'team', sub) {
  if (tab === 'access') tab = 'team';
  if (MEMORY_TABS.includes(tab)) return location.replace('#/memory/' + tab);
  return vTabs('settings', 'Настройки', [['team', 'Команда', () => vTeam(sub)], ...(isOwner() ? [['tests', 'Тестовые аккаунты', vTests]] : [])], tab);
}

// ---------- team (handbook/ROADMAP.md этап 5; canvas D1–D5 «Доступ и роли») ----------
const ago2 = (t) => t ? ago(t) : '—';
const teamChips = (x) => `<span class="tchip ${x.role === 'editor' ? 'ed' : 'mb'}">${x.role === 'editor' ? 'редактор' : 'участник'}</span>${x.isOwner ? '<span class="tchip own">владелец</span>' : ''}${x.deputyUntil ? `<span class="tchip dep">замещает до ${new Date(x.deputyUntil).toLocaleDateString('ru', {day: 'numeric', month: 'short'})}</span>` : ''}${x.onCamera ? `<span class="tchip cam">${svg('cam', 12)}в кадре</span>` : ''}`;
const where = (x) => `${x.bot || x.telegram ? `<span class="ch2">${svg('tg', 12)}бот</span>` : ''}${x.role === 'editor' || x.web ? `<span class="ch2">${svg('web', 12)}веб</span>` : ''}`;
const avatar = (n) => `<span class="av2">${esc((n || '?')[0].toUpperCase())}</span>`;
// «Как подключить»: one card per invite — the Telegram link (tap → «Запустить»), a QR for
// handing a phone over, the 6-digit code for typing into the bot, the web link, and the
// whole invitation as one message to forward.
const linkBox = (inv) => {
  const abs = (u) => u && (u.startsWith('/') ? location.origin + u : u);
  const tg = abs(inv.link.telegram), web = abs(inv.link.web);
  const bot = tg ? tg.replace(/^https:\/\/t\.me\/([^?]+).*/, '@$1') : '';
  const pin = inv.pin ? inv.pin.replace(/(\d{3})(\d{3})/, '$1 $2') : '';
  const msg = [`${inv.name}, привет! Подключайся к команде «${projName()}».`,
    tg ? `В Телеграме: ${tg} — откроется бот, нажми «Запустить».${pin ? ` Если ссылка не открылась — найди ${bot} и отправь ему код ${pin}.` : ''}` : '',
    web ? `${tg ? 'На компьютере' : 'Вход'}: ${web}` : '', 'Ссылка одноразовая, действует 7 дней.'].filter(Boolean).join('\n');
  const step = (n, t, body) => `<div style="display: flex; gap: 12px"><span class="stepn">${n}</span><div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px"><b>${t}</b>${body}</div></div>`;
  const field = (u) => `<div class="row" style="flex-wrap: nowrap; gap: 8px"><input class="f" readonly value="${esc(u)}"><button type="button" class="btn" data-copy="${esc(u)}">Скопировать</button></div>`;
  return `<div class="card" style="border: 1.5px solid var(--ink); display: flex; flex-direction: column; gap: 16px"><div class="row"><b style="font-size: 16px; flex: 1">Как подключить: ${esc(inv.name)}</b><span class="small muted">7 дней, один раз</span></div>
    ${tg ? step(1, `Отправьте ссылку на бот ${esc(bot)}`, `${field(tg)}<div class="row" style="gap: 8px"><a class="btn primary" href="https://t.me/share/url?url=${encodeURIComponent(tg)}&text=${encodeURIComponent('Подключайся к команде — нажми «Запустить» в боте')}" target="_blank" rel="noopener">${svg('tg', 14)}Отправить в Телеграм</a><button type="button" class="btn" data-qr="${esc(tg)}">QR-код</button></div><div class="qrbox"></div>`)
      + step(2, 'Человек нажимает «Запустить» — и всё', '<span class="small muted">Телеграм откроет бот и сам передаст приглашение. Бот поздоровается по имени и покажет кнопки его роли. Пароля и кода вводить не нужно.</span>')
      + (pin ? step(3, 'Если ссылка не открылась', `<span class="small muted">Найти в Телеграме ${esc(bot)} и отправить боту этот код:</span><span class="pin">${pin}</span>`) : '') : ''}
    ${tg ? '' : `<div class="small" style="background: var(--soft); border-radius: 10px; padding: 10px 12px"><b>Телеграм-бот не подключён к этой студии.</b> Ссылки на бот нет — ${web ? 'пока только вход через веб' : 'без бота участник подключиться не сможет'}. Когда бот заработает, нажмите «Новая ссылка входа» в карточке человека.</div>`}
    ${web ? step(tg ? (pin ? 4 : 3) : 1, tg ? 'Вход с компьютера' : 'Ссылка для входа', `${field(web)}<span class="small muted">Открыть в браузере на компьютере → «Войти». Вход запомнится на этом устройстве.</span>`) : ''}
    <div class="row" style="gap: 8px; padding-top: 12px; border-top: 1px solid var(--hov)"><button type="button" class="btn dark" data-copy="${esc(msg)}">Скопировать приглашение целиком</button><span class="small muted">текст со ссылками и кодом — переслать в мессенджер</span></div></div>`;
};
// QR drawn by qrcodejs from cdnjs, loaded only when someone asks for a QR.
function showQr(btn) {
  const box = btn.closest('div').parentElement.querySelector('.qrbox');
  const draw = () => { box.innerHTML = ''; new window.QRCode(box, {text: btn.dataset.qr, width: 180, height: 180}); box.insertAdjacentHTML('beforeend', '<span class="small muted">Наведите камеру телефона — откроется бот</span>'); };
  if (window.QRCode) return draw();
  const sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  sc.onload = draw;
  sc.onerror = () => toast('QR не загрузился — отправьте ссылку');
  document.head.append(sc);
}
const wireCopy = (root) => { root.querySelectorAll('[data-copy]').forEach((b) => (b.onclick = () => navigator.clipboard.writeText(b.dataset.copy).then(() => toast('Скопировано')))); root.querySelectorAll('[data-qr]').forEach((b) => (b.onclick = () => showQr(b))); };

      keep();
      if (!st.name?.trim()) return $('#invName').focus();
      const r = await post('/api/access', {action: 'invite', name: st.name, note: st.note, role: st.role, web: st.web, onCamera: st.role === 'member' && st.onCamera, deputyUntil: st.role === 'member' && st.deputy ? st.deputyUntil : null}).catch(() => null);
      if (!r?.invite) return toast('Не получилось');
      $('#invOut').innerHTML = linkBox(r.invite);
      wireCopy($('#invOut'));
    };
  };
  const keep = () => { st.name = $('#invName')?.value; st.note = $('#invNote')?.value; st.deputyUntil = $('#invUntil')?.value || st.deputyUntil; };
  draw();
}

      <p class="muted" style="margin-top: 6px">Архив канала или чата помогает Claude понять, о чём вы уже пишете, что заходит и как выглядят ваши посты. Студия сама распакует его: прочитает тексты и откроет фото, чтобы увидеть дизайн.</p></div>
    <div>

      ${step(3, 'Выберите, что сохранить', 'Отметьте <b>Фото</b> — на них ваш дизайн. Видео можно не брать: архив выйдет меньше. Формат — «Машиночитаемый JSON» (HTML тоже подойдёт). Период — последние 6–12 месяцев хватит.')}
      ${step(4, 'Нажмите «Экспортировать»', 'Telegram сохранит папку вида <code>ChatExport_2026-10-28</code>, обычно в «Загрузки» › Telegram Desktop.')}
      ${step(5, 'Сожмите папку в ZIP', 'Mac: правой кнопкой по папке → «Сжать». Windows: правой кнопкой → «Отправить» → «Сжатая ZIP-папка».')}
      ${step(6, 'Перетащите архив в общий чат проекта', 'Или нажмите скрепку. Можно приложить пару слов: «это наш канал, ведём его с весны».')}
    </div>
    <div class="card" style="display: flex; flex-direction: column; gap: 6px"><b>Если пункта «Экспорт» нет</b><span class="muted">В канале включён запрет на сохранение материалов — его снимает админ в настройках канала, или экспортируйте с аккаунта админа. Если не выходит, просто опишите канал словами в чате.</span></div>
    <div><a class="btn primary" href="#/chat/_project">Вернуться в чат</a></div></div>`;
}

// Настройки › Голос и стили, Правила (Д2): from strategy.json «voice» and PLAYBOOK.md; edits go through the project chat.
// Память › Факты и цены (LeanMemory): every fact with its source and the date it was confirmed;
// older than 30 days — «устарело?». A new price said in words goes to Claude, who updates facts.json.
async function vFacts() {
  const {facts} = await api('/api/facts');
  const ed = canEdit();
  const old = (x) => !x.at || Date.now() - new Date(x.at) > 30 * 864e5;
  const KINDF = {price: 'Цены', date: 'Даты', people: 'Люди', other: 'Другое'};
  let kind = sessionStorage.getItem('factKind') || '';
  const draw = () => {
    const list = facts.filter((x) => !kind || (kind === 'old' ? old(x) : x.kind === kind));
    const ago = (x) => { if (!x.at) return 'без даты'; const n = Math.round((Date.now() - new Date(x.at)) / 864e5); return n <= 0 ? 'сегодня' : n === 1 ? 'вчера' : n < 5 ? `${n} дня назад` : `${n} дней назад`; };
    $('#factBody').innerHTML = `
      <div class="row" style="gap: 8px; flex-wrap: wrap">${[['', 'Все'], ...Object.entries(KINDF).slice(0, 3), ['old', `Устарели · ${facts.filter(old).length}`]].map(([k, t]) => `<button type="button" class="ln-pill ${k === kind ? 'on' : ''}" data-k="${k}" style="${k === 'old' && facts.some(old) ? 'color: var(--amber)' : ''}">${t}</button>`).join('')}
        ${ed ? `<button type="button" class="ln-btn" id="fAdd" style="margin-left: auto">${svg('plus', 14)}Добавить</button>` : ''}</div>
      <div id="fNew"></div>
      <div>${list.map((x) => `<div class="ln-li" data-id="${x.id}" style="padding: 12px 4px"><span style="flex: 0 0 320px; min-width: 0">${esc(x.text)}</span><b style="font-weight: 600; flex: 0 0 170px">${esc(x.value || '—')}</b>${x.source ? `<span class="tag" style="font-size: 11px; color: var(--ink2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px">${esc(x.source)}</span>` : ''}<span class="r" style="${old(x) ? 'color: var(--amber)' : ''}">${old(x) ? 'устарело? · ' : ''}${ago(x)}${ed ? `<button type="button" class="ln-act" data-edit="${x.id}">править</button><button type="button" class="ln-act" data-ok="${x.id}" style="color: var(--muted)" title="Проверено — поставить сегодняшнюю дату">✓ верно</button>` : ''}</span></div>`).join('') || `<p class="muted" style="padding: 14px 2px">${facts.length ? 'В этом фильтре пусто.' : 'Фактов пока нет. Claude соберёт их с сайта и из брифа: цены, даты, кто есть кто.'}</p>`}</div>`;
    $('#factBody').querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { kind = b.dataset.k; sessionStorage.setItem('factKind', kind); draw(); }));
    $('#factBody').querySelectorAll('[data-ok]').forEach((b) => (b.onclick = async () => { const x = facts.find((y) => y.id === b.dataset.ok); const {fact} = await post('/api/facts/set', {id: x.id}); Object.assign(x, fact); toast('Отмечено: верно на сегодня'); draw(); }));
    const form = (x = {}) => `<form class="ln-li" id="fForm" style="gap: 8px; padding: 10px 4px"><input class="f" name="text" placeholder="Что: «Урок с инструктором, 2 ч»" value="${esc(x.text || '')}" style="flex: 0 0 300px" required><input class="f" name="value" placeholder="Сколько или когда" value="${esc(x.value || '')}" style="flex: 0 0 160px"><input class="f" name="source" placeholder="Откуда: сайт, прайс…" value="${esc(x.source || '')}" style="flex: 1"><select class="f" name="kind" style="width: auto">${Object.entries(KINDF).map(([k, t]) => `<option value="${k}" ${x.kind === k ? 'selected' : ''}>${t.toLowerCase()}</option>`).join('')}</select><button class="ln-btn p">Сохранить</button>${x.id ? '<button type="button" class="ln-btn g" id="fDel">Удалить</button>' : ''}</form>`;
    const open = (x) => {
      $('#fNew').innerHTML = form(x);
      $('#fForm').onsubmit = async (e) => { e.preventDefault(); const v = Object.fromEntries(new FormData(e.target)); await post('/api/facts/set', {id: x?.id, ...v}); vMemory('facts'); };
      $('#fDel')?.addEventListener('click', async () => { await post('/api/facts/set', {id: x.id, remove: true}); vMemory('facts'); });
      $('#fForm').text.focus();
    };
    $('#fAdd')?.addEventListener('click', () => open());
    $('#factBody').querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => open(facts.find((y) => y.id === b.dataset.edit))));
  };
  view.innerHTML = `<div style="flex: 1; overflow-y: auto"><div style="max-width: 1100px; padding: 22px 40px; display: flex; flex-direction: column; gap: 18px">
    <div id="factBody" style="display: flex; flex-direction: column; gap: 16px"></div>
    ${ed ? `<form class="box" id="fSay" style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 24px rgba(0,0,0,.04)"><input id="fSayIn" placeholder="«ски-пасс теперь 70 лари» — запомню с сегодняшней датой" style="flex: 1; border: 0; font: inherit; font-size: 15px; outline: none"><button class="icon go" style="width: 30px; height: 30px" aria-label="Отправить">↑</button></form>
      ${facts.length ? '' : '<button type="button" class="ln-btn" id="fCollect" style="align-self: flex-start">Собрать факты с сайта и из брифа</button>'}` : ''}
  </div></div>`;
  const say = (text, shown) => { sessionStorage.setItem('firstMsg:_project', JSON.stringify({text, shown})); location.hash = '#/chat/_project'; };
  $('#fSay')?.addEventListener('submit', (e) => { e.preventDefault(); const t = $('#fSayIn').value.trim(); if (t) say(`${t}\nЗапомни это в facts.json с сегодняшней датой и источником «сказал ${ME.name}».`, t); });
  $('#fCollect')?.addEventListener('click', () => say('Собери факты проекта в facts.json: цены, даты, кто есть кто — с сайта, из брифа и вышедших выпусков. У каждого источник и дата проверки. Коротко перечисли, что записал.', 'Собрать факты'));
  draw();
}

    view.innerHTML = `<div class="page" style="max-width: 760px; padding: 40px 32px; gap: 16px"><h1>Скинуть материал</h1><div class="muted" style="font-size: 15px; margin-top: -8px">Как есть, без подписей — тексты напишет Claude, решает редактор.</div>${drop}${bot ? `<p class="small muted">С телефона удобнее через бот: <a href="${bot}" target="_blank" rel="noopener">открыть в Телеграме</a>.</p>` : ''}</div>`;
  } else if (h === '#/mine') {
    title('Мои материалы');
    view.innerHTML = `<div class="page" style="max-width: 900px; padding: 32px; gap: 14px"><h1>Мои материалы</h1><div class="small muted">Что вы присылали и что с этим стало. Убрать своё или отозвать согласие на лицо — в боте, «📚 Мои материалы».</div>${mine(MEM.sent)}</div>`;
  } else {
    title('Мои задания');
    const h1 = new Date().getHours();
    view.innerHTML = `<div class="page" style="max-width: 1100px; padding: 40px 32px; gap: 18px"><div><h1>${h1 < 12 ? 'Доброе утро' : h1 < 18 ? 'Добрый день' : 'Добрый вечер'}, ${esc(ME.name)}</h1><div class="muted" style="font-size: 15px; margin-top: 4px">${MEM.tasks.length ? `${MEM.tasks.length} ${MEM.tasks.length === 1 ? 'задание' : 'задания'} на неделю.` : 'Заданий сейчас нет.'} Скидывайте фото и видео как есть — тексты напишет Claude.</div></div>
      <div class="split" style="gap: 24px; align-items: flex-start"><div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px"><span class="lbl">Задания</span>

    }
    toast(`Отправлено: ${files.length}. Редактор увидит во «Входящих».`);
    route();
  };
  const d = $('#mDrop');

    $('#mUp').onchange = (e) => e.target.files.length && up(e.target.files);
    d.ondragover = (e) => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = (e) => { e.preventDefault(); d.classList.remove('over'); if (e.dataTransfer.files.length) up(e.dataTransfer.files); };
  }
}

  document.body.classList.toggle('side-mini', on);
  UI.set('side', on ? 'mini' : 'open');
  document.querySelectorAll('[data-fold="side"]').forEach((b) => { b.title = on ? 'Развернуть панель (⌘\\)' : 'Свернуть панель (⌘\\)'; b.setAttribute('aria-label', b.title); });
}
function foldChat(on = !document.body.classList.contains('chat-mini')) {
  document.body.classList.toggle('chat-mini', on);
  UI.set('chat', on ? 'mini' : 'open');
}
// Every chat column gets a fold button in its header and a thin rail to bring it back.
function decorateChat() {
  document.querySelectorAll('aside.chatcol').forEach((a) => {
    if (a.querySelector('.crail')) return;
    const name = a.getAttribute('aria-label') || 'Чат';
    a.insertAdjacentHTML('afterbegin', `<button type="button" class="crail" title="Развернуть чат (⌘⇧\\)" aria-label="Развернуть: ${esc(name)}">${svg('chat2', 18)}<span>${esc(name)}</span></button>`);
    a.querySelector('.crail').onclick = () => foldChat(false);
    const head = a.querySelector('.chead');
    if (head) { head.insertAdjacentHTML('beforeend', `<button type="button" class="fold" title="Свернуть чат (⌘⇧\\)" aria-label="Свернуть чат">${svg('panelR', 16)}</button>`); head.lastElementChild.onclick = () => foldChat(true); }
  });
}
document.addEventListener('click', (e) => { if (e.target.closest('[data-fold="side"]')) foldSide(); });
document.addEventListener('keydown', (e) => {
  if (!(e.metaKey || e.ctrlKey) || e.key !== '\\' && e.code !== 'Backslash') return;
  e.preventDefault();
  if (e.shiftKey) foldChat(); else foldSide();
});
new MutationObserver(decorateChat).observe(document.getElementById('view'), {childList: true, subtree: true});
document.body.classList.toggle('side-mini', UI.get('side') === 'mini');
document.body.classList.toggle('chat-mini', UI.get('chat') === 'mini');

async function route() {
  document.body.classList.remove('menu');
  const h = location.hash || '#/';
  try {
    await sidebar();
    foldSide(document.body.classList.contains('side-mini'));
    let m;
    view = $('#view');
    if (isMember()) await vMember(h);
    else if ((m = /^#\/reel\/([\w-]+)(?:\/(\w+))?/.exec(h))) await vReel(m[1], m[2]);
    else if ((m = /^#\/chat\/(_project)/.exec(h))) await vChat(m[1]);
    else if (h === '#/new') await vNew();
    else if ((m = /^#\/knowledge(?:\/(\w+))?(?:\/([\w-]+))?/.exec(h))) await vKnowledge(m[1], m[2]);
    else if (h === '#/plan/draft') await vPlanDraft();
    else if (h === '#/plan/setup') await vPlanSetup();
    else if ((m = /^#\/plan(?:\/(m|w))?(?:\/(-?\d+))?$/.exec(h))) await vPlan(Number(m[2] || 0), m[1] !== 'w');
    else if ((m = /^#\/rubric\/([\w-]+)/.exec(h))) await vRubric(m[1]);
    else if ((m = /^#\/settings(?:\/(\w+))?(?:\/([\w-]+))?/.exec(h))) await vSettings(m[1], m[2]);
    else if ((m = /^#\/memory(?:\/(\w+))?/.exec(h))) await vMemory(m[1]);
    else if (h === '#/inbox') await vInbox();
    else if (h === '#/help/telegram-export') vHelpExport();
    else if (h === '#/tasks') await vTasks();
    else if (h === '#/ds') location.replace('#/memory/ds');
    else if (h === '#/files') location.replace('#/memory/files');
    else if (h === '#/access') location.replace('#/settings/access');
    else if ((m = /^#\/all(?:\/(\w+))?$/.exec(h))) await vAll(m[1]);
    else if ((m = /^#\/item\/([\w-]+)/.exec(h))) await vItem(m[1]);
    else if ((m = /^#\/post\/([\w-]+)(?:\/(\w+))?/.exec(h))) await vPost(m[1], m[2]);
    else await vToday();
  } catch (e) {
    view.innerHTML = `<div class="page"><p class="muted">Не получилось загрузить: ${esc(e.message)}. <a href="#/">На главную</a></p></div>`;
  }
}
$('#menuBtn').onclick = () => document.body.classList.toggle('menu');
document.addEventListener('click', (e) => { if (document.body.classList.contains('menu') && !e.target.closest('nav.side, #menuBtn')) document.body.classList.remove('menu'); });
// ---------- downloads on a phone ----------
// Telegram's in-app browser cannot download at all, and on an iPhone a plain download lands in
// «Files», not «Photos». So on a phone a video download is fetched here with a progress bar,
// then «Сохранить в Фото» opens the system share sheet (Save Video); in Telegram — how to get out.
const inTelegram = () => !!window.TelegramWebviewProxy || /Telegram/i.test(navigator.userAgent);
const onPhone = () => /iPhone|iPad|Android/i.test(navigator.userAgent);
function sheet(html) {
  document.querySelector('#dlSheet')?.remove();
  const el = document.createElement('div');
  el.id = 'dlSheet';
  el.style.cssText = 'position: fixed; inset: auto 12px 12px 12px; z-index: 60; padding: 16px; border-radius: 16px; background: var(--card, #fff); color: inherit; box-shadow: 0 10px 40px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 10px; font-size: 15px';
  el.innerHTML = html + '<button type="button" class="btn" id="dlClose">Закрыть</button>';
  document.body.append(el);
  el.querySelector('#dlClose').onclick = () => el.remove();
  return el;
}
document.addEventListener('click', async (e) => {
  const a = e.target.closest('a[href*="/media?"][href*="dl=1"]');
  if (!a || !onPhone()) return;
  const name = decodeURIComponent(new URL(a.href, location.href).searchParams.get('p') || '').split('/').pop();
  if (!/\.(mp4|mov)$/i.test(name)) return;
  e.preventDefault();
  if (inTelegram()) {
    const el = sheet('<b>В браузере Телеграма файлы не скачиваются</b><span class="small">Нажми <b>⋯</b> вверху справа → <b>«Открыть в Safari»</b> (или в браузере) и войди своим паролем — там скачивание работает.</span><button type="button" class="btn primary" id="dlCopy">Скопировать адрес студии</button>');
    el.querySelector('#dlCopy').onclick = async () => { try { await navigator.clipboard.writeText(location.origin + '/' + location.hash); toast('Скопировано — вставь в Safari'); } catch { toast(location.origin); } };
    return;
  }
  const el = sheet(`<b>${esc(name)}</b><div style="height: 8px; border-radius: 4px; background: var(--soft, #eee); overflow: hidden"><div id="dlBar" style="height: 100%; width: 0; background: var(--green, #2a2)"></div></div><span class="small" id="dlTxt">Загружаю…</span>`);
  try {
    const r = await fetch(a.href);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const total = Number(r.headers.get('content-length')) || 0;
    const reader = r.body.getReader();
    const parts = [];
    let got = 0;
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      parts.push(value);
      got += value.length;
      if (!el.isConnected) return reader.cancel();
      el.querySelector('#dlBar').style.width = total ? Math.round(got / total * 100) + '%' : '50%';
      el.querySelector('#dlTxt').textContent = `Загружено ${mb(got)}${total ? ' из ' + mb(total) : ''}`;
    }
    const file = new File(parts, name, {type: 'video/mp4'});
    const url = URL.createObjectURL(file);
    el.querySelector('#dlTxt').textContent = 'Готово. Сохрани видео:';
    const go = document.createElement('div');
    go.style.cssText = 'display: flex; gap: 8px; flex-wrap: wrap';
    go.innerHTML = (navigator.canShare?.({files: [file]}) ? '<button type="button" class="btn primary" id="dlShare">Сохранить в Фото / Поделиться</button>' : '') + `<a class="btn" href="${url}" download="${esc(name)}">Сохранить в Файлы</a>`;
    el.querySelector('#dlClose').before(go);
    el.querySelector('#dlShare')?.addEventListener('click', () => navigator.share({files: [file]}).catch(() => {}));
  } catch (err) {
    el.querySelector('#dlTxt').textContent = 'Не получилось загрузить: ' + err.message + '. Попробуй ещё раз.';
  }
});
window.addEventListener('hashchange', route);
(async () => {
  await loadMe();
  route();
})();

</script>
