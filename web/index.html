<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рилсы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* One design system (handbook/ROADMAP.md): Manrope, neutral greys, black primary button. */
  :root { --bg:#FFFFFF; --side:#FAFAFA; --card:#fff; --ink:#171717; --ink2:#525252; --muted:#737373; --line:#EBEBEB; --soft:#F4F4F4; --hov:#F0F0F0; --sel:#E8E8E8; --accent:#171717; --blue:#1D4ED8; --blueBg:#EEF3FD; --amber:#B45309; --green:#1E7A3D; --me:#F0F0F0; --meInk:#171717; --badge:#2F6FEB; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 Manrope, -apple-system, system-ui, sans-serif; letter-spacing: -0.005em; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .app { display: flex; min-height: 100%; }
  nav.side { width: 248px; flex: none; border-right: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; height: 100vh; position: sticky; top: 0; overflow-y: auto; background: var(--side); }
  .proj { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 10px; }
  .proj .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
  .proj select { border: 0; background: none; font-weight: 600; width: 100%; padding: 0; appearance: none; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px; text-decoration: none; color: var(--ink2); font-size: 14px; line-height: 1.2; min-height: 32px; }
  .nav:hover { background: var(--hov); }
  .nav.on { background: var(--sel); color: var(--ink); font-weight: 600; }
  .nav svg { flex: none; color: var(--muted); } .nav.on svg { color: var(--ink); }
  .gh { font-size: 12px; color: var(--muted); padding: 16px 8px 5px; font-weight: 500; }
  .bdg { margin-left: auto; font-size: 11px; font-weight: 600; color: #fff; background: var(--badge); border-radius: 999px; padding: 1px 7px; }
  .srch { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--muted); font-size: 13px; width: 100%; text-align: left; }
  .srch kbd { margin-left: auto; font-family: inherit; font-size: 11px; }
  .ph { display: flex; align-items: center; gap: 9px; padding: 4px 6px 10px; }
  .ph .logo { width: 24px; height: 24px; border-radius: 7px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; flex: none; }
  .ph select { border: 0; background: none; font-weight: 600; font-size: 14px; flex: 1; min-width: 0; padding: 0; appearance: none; cursor: pointer; }
  .me { display: flex; align-items: center; gap: 8px; padding: 8px; font-size: 13px; border-top: 1px solid var(--line); margin-top: 6px; }
  .me i { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg,#C7D2FE,#A5B4FC); flex: none; }
  .nav .n { margin-left: auto; color: var(--muted); font-size: 12px; }
  .label { font-size: 12px; color: var(--muted); padding: 0 10px 4px; display: flex; justify-content: space-between; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
  .s-work { background: var(--amber); } .s-review { background: var(--blue); } .s-done { background: var(--green); } .s-published { background: var(--ink); } .s-none { background: #B9B7B1; }
  .meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; } .meter i { display: block; height: 100%; background: var(--ink); }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { display: none; }
  .page { padding: 28px 36px; display: flex; flex-direction: column; gap: 22px; max-width: 1400px; width: 100%; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 0 13px; border: 1px solid var(--line); background: var(--card); border-radius: 9px; text-decoration: none; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.danger { color: #B4231A; }
  .pill { border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--soft); color: var(--ink2); }
  .pill.review { background: var(--blueBg); color: var(--blue); } .pill.cur { background: var(--ink); color: #fff; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; } .stats .card { flex: 1 1 200px; padding: 14px 16px; } .stats b { display: block; font-size: 24px; font-weight: 600; }
  .board { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .col { flex: 1 1 250px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .colh { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .rc { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-decoration: none; }
  .rc:hover { border-color: var(--ink); }
  .th { width: 48px; height: 84px; border-radius: 7px; background: #2A3640 center/cover no-repeat; flex: none; }
  /* chat */
  .work { display: flex; flex: 1; min-height: 0; }
  .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  .chead { padding: 14px 28px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .ctx { padding: 8px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: 13px; color: var(--ink2); white-space: nowrap; }
  button.chip:hover { border-color: var(--ink); }
  .log { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .log .in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--me); color: var(--meInk); }
  .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
  .msg.err { align-self: flex-start; color: #C0392B; font-size: 14px; }
  .msg .by { font-size: 11px; opacity: .7; display: block; }
  .msg video, .msg img.media { display: block; width: 100%; max-width: 300px; border-radius: 10px; background: #000; margin-bottom: 6px; }
  .msg audio { width: 100%; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; white-space: normal; }
  .btns button, .keys button { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: 14px; text-align: left; }
  .btns button:hover, .keys button:hover { border-color: var(--ink); }
  .cur-opt { border-color: var(--accent) !important; }
  .status { display: none; max-width: 760px; margin: 0 auto 6px; padding: 0 24px; width: 100%; color: var(--muted); font-size: 14px; align-items: center; gap: 10px; }
  .status.on { display: flex; }
  .spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 1s linear infinite; flex: none; }
  @keyframes s { to { transform: rotate(360deg); } }
  .keys { max-width: 760px; margin: 0 auto; padding: 0 24px 6px; width: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
  .keys:empty { display: none; }
  form.send { border-top: 1px solid var(--line); padding: 10px 24px calc(10px + env(safe-area-inset-bottom)); }
  form.send .in { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  form.send textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); max-height: 160px; min-height: 44px; }
  .icon { width: 44px; height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; display: grid; place-items: center; flex: none; }
  .icon.go { background: var(--ink); border-color: var(--ink); color: #fff; border-radius: 50%; }
  .hint { color: var(--muted); text-align: center; margin: 12vh auto 0; max-width: 420px; }
  aside.vers { width: 360px; flex: none; border-left: 1px solid var(--line); background: var(--card); padding: 16px; display: flex; flex-direction: column; gap: 14px; height: 100vh; overflow-y: auto; }
  .ver { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .ver.cur { border-color: var(--ink); }
  .ver video { width: 100%; max-height: 360px; border-radius: 8px; background: #000; }
  .dl { display: flex; justify-content: space-between; align-items: center; min-height: 42px; border: 1px solid var(--line); border-radius: 9px; padding: 0 12px; text-decoration: none; font-size: 14px; }
  .dl:hover { border-color: var(--ink); }
  .arch { display: flex; gap: 10px; align-items: center; font-size: 13px; }
  .arch .th { width: 28px; height: 50px; }
  /* misc */
  /* Switches are plain text tabs with an underline, never plates (Д1). */
  .tabs, .seg, .stg { display: inline-flex; gap: 18px; flex-wrap: wrap; align-items: center; background: none; border: 0; padding: 0; }
  .tabs a, .seg a, .seg button, .stg a, .stg span { padding: 6px 0 7px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; font-size: 14px; color: var(--muted); text-decoration: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; box-shadow: none; }
  .tabs a:hover, .seg a:hover, .seg button:hover, .stg a:hover { color: var(--ink); }
  .tabs a.on, .seg .on, .stg .on { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); background: none; box-shadow: none; }
  .stg .done { color: var(--ink2); } .stg .done::before { content: '✓'; color: var(--green); font-size: 12px; }
  .md h1 { font-size: 20px; margin: 4px 0 8px; } .md h2 { font-size: 16px; margin: 18px 0 6px; } .md h3 { font-size: 14px; margin: 14px 0 4px; color: var(--muted); }
  .md ul { padding-left: 18px; margin: 6px 0; } .md li { margin: 4px 0; } .md code { font-family: 'Geist Mono', monospace; font-size: 13px; background: var(--soft); padding: 1px 5px; border-radius: 5px; }
  .md p { margin: 6px 0; }
  #tabHost h1, #tabHost .row > div > .small.muted:first-child { display: none; } /* tab title is the settings header */
  .rmain { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  .rbody { display: flex; gap: 32px; padding: 26px 32px; align-items: flex-start; }
  .rvid { width: 300px; flex: none; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 0; }
  .rvid video, .vph { width: 100%; aspect-ratio: 9 / 16; border-radius: 18px; background: #000; object-fit: contain; }
  .vph { background: var(--soft); color: var(--muted); display: grid; place-items: center; text-align: center; padding: 24px; font-size: 13px; }
  .rinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 24px; }
  .blk { display: flex; flex-direction: column; gap: 6px; }

  /* «Как увидят» (NX0–NX7): the release inside each platform's interface, before publishing */
  .nx-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .nx-row:first-of-type { border-top: 0; }
  .nx-st { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .nx-st.w { color: var(--amber); } .nx-st.ok { color: var(--green); }
  .nx-ov { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; display: grid; place-items: center; padding: 20px; }
  .nx-box { background: var(--bg); border-radius: 18px; width: min(900px, 100%); max-height: calc(100vh - 40px); overflow: auto; display: grid; grid-template-columns: minmax(260px, 380px) 1fr; gap: 24px; padding: 24px; }
  @media (max-width: 720px) { .nx-box { grid-template-columns: 1fr; } }
  .nx-warn { background: #FFF7E6; color: #7A4B00; border-radius: 12px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; display: flex; flex-direction: column; gap: 8px; }
  .vwrap { position: relative; } .vwrap video { display: block; }
  .pinlayer { position: absolute; inset: 0 0 48px 0; cursor: crosshair; z-index: 2; }
  .pinlayer .pin { position: absolute; transform: translate(-50%, -50%); width: 24px; height: 24px; border-radius: 50%; background: #2F6FEB; color: #fff; font-size: 10px; display: grid; place-items: center; box-shadow: 0 0 0 4px rgba(47,111,235,.35); }
  .ecomp { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .ecomp textarea.f { min-height: 60px; }
  .tcx { font-size: 12px; font-weight: 700; color: #2F6FEB; background: #EEF4FE; border-radius: 6px; padding: 2px 7px; border: 0; }
  .enum { width: 24px; height: 24px; border-radius: 50%; background: #2F6FEB; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; flex: none; }
  .enum.done { background: var(--green); }
  .lbl { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .02em; text-transform: uppercase; }
  aside.chatcol { width: 380px; flex: none; border-left: 1px solid var(--line); display: flex; flex-direction: column; height: 100vh; }
  aside.chatcol .log, aside.chatcol form.send, aside.chatcol .keys, aside.chatcol .status, aside.chatcol .ctx { padding-left: 16px; padding-right: 16px; }
  aside.chatcol .msg { max-width: 92%; }
  .kind { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; white-space: nowrap; font-weight: 500; }
  .tcard { flex: 1 1 180px; min-width: 0; border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px; text-align: left; background: #fff; }
  .tcard.on { border: 2px solid var(--ink); padding: 17px; } .tcard:disabled { opacity: .55; }
  .var { padding: 16px 18px; border-radius: 14px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; text-align: left; background: #fff; width: 100%; }
  .var.on { border: 2px solid var(--ink); padding: 15px 17px; }
  .igrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .igrid > * { aspect-ratio: 4 / 5; background: var(--soft) center / cover no-repeat; position: relative; display: block; }
  .igrid .when { position: absolute; left: 5px; bottom: 5px; font-size: 11px; font-weight: 600; background: #fff; border-radius: 5px; padding: 2px 6px; }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .strip button { flex: none; width: 92px; aspect-ratio: 4 / 5; border-radius: 8px; border: 1px solid var(--line); background: var(--soft) center / cover no-repeat; padding: 0; position: relative; }
  .strip button.on { outline: 2px solid var(--ink); outline-offset: 2px; }
  .strip button span { position: absolute; left: 4px; bottom: 4px; font-size: 10px; background: #fff; border-radius: 4px; padding: 1px 5px; }
  .srow { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .srow.drag { opacity: .4; } .srow .h { cursor: grab; color: var(--muted); }
  .pweekwrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px 6px; }
  .pweek { display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 10px; }
  .pday { min-height: 320px; border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; background: #fff; }
  .pday .dh { display: flex; align-items: baseline; gap: 6px; padding-bottom: 4px; color: var(--muted); font-size: 13px; }
  .pday .dh b { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink2); }
  .pday.today { border-color: var(--ink); } .pday.today .dh b { color: var(--ink); }
  .pday.over, .pdrop.over { background: var(--side); border-color: var(--ink); }
  .pchip { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); border-left: 4px solid #A3A3A3; border-radius: 10px; padding: 9px 10px; font-size: 13px; line-height: 1.35; text-decoration: none; background: #fff; cursor: grab; }
  .pchip b { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pslot { display: flex; flex-direction: column; gap: 4px; border: 1.5px dashed #D4D4D4; border-radius: 10px; padding: 9px 10px; font-size: 13px; line-height: 1.35; text-align: left; background: none; color: var(--ink2); }
  /* Folding panels: the sidebar becomes an icon rail, the chat a thin rail on the right (remembered). */
  nav.side, aside.chatcol { transition: width .18s ease, padding .18s ease; }
  .fold { width: 28px; height: 28px; border: 0; background: none; border-radius: 7px; color: var(--muted); display: grid; place-items: center; flex: none; padding: 0; }
  .fold:hover { background: var(--hov); color: var(--ink); }
  .crail { display: none; }
  @media (min-width: 861px) {
    body.side-mini nav.side { width: 64px; padding: 12px 8px; overflow-x: hidden; }
    body.side-mini nav.side .ph select, body.side-mini nav.side .ph .icon, body.side-mini nav.side .ph b, body.side-mini nav.side .gh, body.side-mini nav.side .srch span, body.side-mini nav.side .srch kbd, body.side-mini nav.side .me span, body.side-mini nav.side .nav > span:not(:first-child) { display: none; }
    body.side-mini nav.side .ph { flex-direction: column; gap: 10px; padding: 4px 0 10px; }
    body.side-mini nav.side .nav, body.side-mini nav.side .srch { justify-content: center; padding: 8px 0; position: relative; }
    body.side-mini nav.side .srch { border-color: transparent; background: none; }
    body.side-mini nav.side .gh { display: block; height: 0; padding: 8px 0; border-top: 1px solid var(--line); margin: 6px 8px 0; font-size: 0; }
    body.side-mini nav.side .nav .bdg { display: block; position: absolute; top: 3px; right: 9px; padding: 0; width: 8px; height: 8px; font-size: 0; }
    body.side-mini nav.side .me { justify-content: center; padding: 8px 0; }
    body.chat-mini aside.chatcol { width: 48px; }
    body.chat-mini aside.chatcol > :not(.crail) { display: none; }
    body.chat-mini aside.chatcol .crail { display: flex; }
    .crail { flex-direction: column; align-items: center; gap: 10px; padding: 12px 0; height: 100%; width: 100%; border: 0; background: none; color: var(--muted); cursor: pointer; }
    .crail:hover { background: var(--side); color: var(--ink); }
    .crail span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  }
  .pslot:hover { background: var(--side); }
  .stepn { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; }
  .pin { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 28px; font-weight: 600; letter-spacing: .12em; }
  .qrbox:empty { display: none; } .qrbox { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; } .qrbox img, .qrbox canvas { border: 8px solid #fff; box-shadow: 0 0 0 1px var(--line); border-radius: 8px; }
  .tchip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .tchip.ed { background: var(--ink); color: #fff; } .tchip.mb { background: #F0F0F0; color: #404040; } .tchip.own { background: #FEF6E7; color: #8F5C12; } .tchip.dep { background: #EEF4FE; color: #1D4ED8; } .tchip.cam { background: #ECF7EF; color: #1E7A3D; }
  .ch2 { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink2); border: 1px solid var(--line); border-radius: 7px; padding: 2px 8px; white-space: nowrap; }
  .av2 { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: #E8E8E8; flex: none; }
  .ttbl { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; container-type: inline-size; }
  /* Narrow table: «Где работает» and «Был» go, then the role drops under the name. */
  @container (max-width: 640px) { .ttr { grid-template-columns: minmax(0, 1fr) auto; } .ttr > :nth-child(3), .ttr > :nth-child(4) { display: none; } }

  };

  $('#srchIn').oninput = (e) => draw(e.target.value);
  $('#srchIn').onkeydown = (e) => { if (e.key === 'Escape') close(); if (e.key === 'Enter') { const a = $('#srchList a'); if (a) { location.hash = a.getAttribute('href'); close(); } } };

// ---------- chat ----------
function chatBox(key, {onDone, onRebind} = {}) {
  const el = document.createElement('div');
  el.style.cssText = 'display: flex; flex-direction: column; flex: 1; min-height: 0';
  el.innerHTML = `<div class="log"><div class="in"></div></div>
    <div class="status"><i class="spin"></i><span style="display: flex; flex-direction: column; min-width: 0"><span class="stext">Думаю…</span><span class="shint small"></span></span><button class="btn" type="button" style="margin-left: auto; min-height: 32px">Стоп</button></div>
    <div class="keys"></div>
    ${canEdit() ? `<form class="send"><div class="in">
      <button type="button" class="icon clip" aria-label="Прикрепить файл"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"></path></svg></button>
      <input type="file" multiple hidden>
      <label style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)" for="ta-${esc(key)}">Сообщение</label>
      <textarea id="ta-${esc(key)}" rows="1" placeholder="Сообщение или правка…"></textarea>
      <button class="icon go" aria-label="Отправить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </div></form>` : '<p class="small muted" style="text-align: center; padding: 12px">У тебя доступ только на просмотр.</p>'}`;
  const log = $('.log .in', el), keysEl = $('.keys', el), st = $('.status', el), ta = $('textarea', el);
  let busy = false;
  const setBusy = (on, text) => {
    busy = on; st.classList.toggle('on', on);
    if (text) { $('.stext', st).textContent = text; $('.shint', st).textContent = /рендер/i.test(text) ? 'Это нормально: монтаж идёт на сервере. Страницу можно закрыть — версия появится сама.' : ''; }
    el.querySelectorAll('.btns button, .keys button, .go').forEach((b) => (b.disabled = on));
  };
  $('button', st).onclick = () => post('/api/stop');
  const buttons = (list, under) => {
    const box = document.createElement('div'); box.className = 'btns';
    for (const label of list) { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = () => say(`(pressed button "${label}" under: "${short(under)}")`, label); box.append(b); }
    return box;
  };
  const menuEl = (menu) => {
    const box = document.createElement('div');
    if (menu.title) box.innerHTML = `<b>${esc(menu.title)}</b>`;
    for (const s of menu.sections || []) {
      const sec = document.createElement('div'); sec.style.marginTop = '10px'; sec.style.whiteSpace = 'normal';
      sec.innerHTML = `${esc(s.title)}${s.prompt ? `<div class="small muted">${esc(s.prompt)}</div>` : ''}`;
      const row = document.createElement('div'); row.className = 'btns';
      for (const o of s.options || []) {
        const b = document.createElement('button'); b.type = 'button';
        b.innerHTML = esc(o.label) + (o.note ? ` <span class="small muted">${esc(o.note)}</span>` : '');
        if (o.value !== undefined && o.value === s.current) b.className = 'cur-opt';
        b.onclick = () => say(`(menu «${menu.title}»: ${s.title} → «${o.label}»)`, `${s.title}: ${o.label}`);
        row.append(b);
      }
      sec.append(row); box.append(sec);
    }
    return box;
  };
  const showKeys = (keys) => {
    keysEl.innerHTML = '';
    for (const k of keys) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = k; b.disabled = busy;
      b.onclick = () => say(/^🎲/.test(k) ? '(tapped «🎲 Другие идеи»: pitch a fresh batch of 4 NEW ideas per «1. Ideas» in REELS.md — none of the ones already shown; those stay in ideas.md. Keyboard: only the new ones, via --ideas.)' : `(tapped keyboard button "${k}")`, k);
      keysEl.append(b);
    }
  };
  const render = (m) => {
    $('.hint', log)?.remove();
    const d = document.createElement('div');
    if (m.from === 'me') { d.className = 'msg me'; d.innerHTML = (m.by && m.by !== ME.name ? `<span class="by">${esc(m.by)}</span>` : '') + esc(m.text); }
    else if (m.kind === 'error') { d.className = 'msg err'; d.textContent = '⚠️ ' + m.text; }
    else {
      d.className = 'msg bot';
      if (m.kind === 'file') {
        const dl = m.url ? m.url + '&dl=1' : null;
        if (!m.url) d.insertAdjacentHTML('beforeend', `<div>📄 ${esc(m.name)}</div>`);
        else if (/\.(mp4|mov|webm)$/.test(m.ext) && !m.document) d.insertAdjacentHTML('beforeend', `<video src="${m.url}" controls playsinline preload="metadata"></video><a href="${dl}" class="small">Скачать</a>`);
        else if (/\.(png|jpe?g|webp|gif)$/.test(m.ext)) d.insertAdjacentHTML('beforeend', `<img class="media" src="${m.url}" alt="">`);
        else if (/\.(mp3|m4a|wav|ogg)$/.test(m.ext)) d.insertAdjacentHTML('beforeend', `<audio src="${m.url}" controls></audio>`);
        else d.insertAdjacentHTML('beforeend', `<a href="${dl}">📄 ${esc(m.name)}</a>`);
        if (m.caption) d.insertAdjacentHTML('beforeend', `<div>${chatMd(m.caption)}</div>`);
      } else if (m.text) d.innerHTML = chatMd(m.text);
      if (m.buttons?.length && canEdit()) d.append(buttons(m.buttons, m.caption || m.text));
      if (m.menu && canEdit()) d.append(menuEl(m.menu));
    }
    log.append(d);
    d.scrollIntoView({block: 'end'});
    if (m.from === 'bot' && canEdit()) showKeys(m.keys || []);
  };
  async function say(text, shown) {
    if (busy || !text.trim()) return;
    showKeys([]);
    render({from: 'me', text: shown || text});
    setBusy(true, 'Думаю…');
    try {
      const r = await fetch(`/api/chat?project=${encodeURIComponent(P)}`, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({key, text, shown})});
      if (r.status === 429) throw new Error('Claude сейчас занят в другом чате — дождись, пока он закончит');
      if (!r.ok) throw new Error('Ошибка ' + r.status);
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const {value, done} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const ev = JSON.parse(buf.slice(6, i)); buf = buf.slice(i + 2);
          if (ev.status) setBusy(true, ev.status);
          if (ev.msg) render(ev.msg);
          if (ev.rebind) { key = ev.rebind; onRebind?.(key); }
          if (ev.freed) toast(`Освобождено ${mb(ev.freed)}: старые версии ушли в архив`);
        }
      }
    } catch (err) { render({from: 'bot', kind: 'error', text: err.message}); }
    setBusy(false);
    onDone?.(key);
    ta?.focus();
  }
  async function load() {
    const h = await api('/api/chat?key=' + encodeURIComponent(key));
    log.innerHTML = '';
    if (!h.messages.length) log.innerHTML = `<p class="hint">${key === '_ds' ? 'Опиши, какой должна быть дизайн-система, или попроси собрать её из того, что уже есть в рилсах.' : key === '_project' ? 'Общий чат проекта: идеи, бриф, правила, настройки. Сами рилсы делаются в своих чатах.' : key.startsWith('post-') ? 'Напиши, что сделать с этим постом.' : 'Напиши, что сделать с этим рилсом.'}</p>`;
    h.messages.forEach(render);
    if (h.busy) {
      setBusy(true, h.status || 'Работаю… обновлю, когда закончу');
      setTimeout(() => location.hash.includes(key) && load().then(() => sidebar()), 4000);
    } else if (busy) setBusy(false);
  }
  if (ta) {
    const form = $('form', el), file = $('input[type=file]', el), clip = $('.clip', el);
    ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
    ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
    clip.onclick = () => file.click();
    file.onchange = () => { clip.style.borderColor = file.files.length ? 'var(--accent)' : ''; clip.title = [...file.files].map((f) => f.name).join(', '); };
    form.onsubmit = async (e) => {
      e.preventDefault();
      const files = [...file.files], text = ta.value.trim();
      if ((!text && !files.length) || busy) return;
      ta.value = ''; ta.style.height = 'auto';
      const parts = [];
      for (const f of files) {
        setBusy(true, `Загружаю ${f.name}…`);
        const toReel = !key.startsWith('_') && !key.startsWith('new-') ? `&reel=${encodeURIComponent(key)}` : '';
        const r = await fetch(`/api/upload?project=${encodeURIComponent(P)}${toReel}&name=${encodeURIComponent(f.name)}`, {method: 'POST', body: f});
        if (r.ok) parts.push(`(attached file → ${(await r.json()).path})`);
      }
      setBusy(false);
      file.value = ''; clip.style.borderColor = ''; clip.title = '';
      say([text, ...parts].filter(Boolean).join('\n'), [text, ...files.map((f) => '📎 ' + f.name)].filter(Boolean).join('\n'));
    };
  }
  el.say = say;
  el.ready = load();
  return el;
}

  const draw = () => {

      : stats + `<section><h2 style="margin-bottom: 10px; display: flex; gap: 8px; align-items: center">${svg('reel')}Рилсы</h2>${reelsBoard()}</section><section><h2 style="margin-bottom: 10px; display: flex; gap: 8px; align-items: center">${svg('photo')}Посты</h2>${postsView('')}</section>`;
    body.querySelectorAll('[data-type]').forEach((b) => (b.onclick = () => { type = b.dataset.type; draw(); }));
  };
  draw();
}

// Reel stages from the canvas (Сценарий · Материалы · Монтаж · Выкладка): each is a tab of the reel;
// the one the reel is at is marked by what it already has.
const STAGES = [['script', 'Сценарий'], ['materials', 'Материалы'], ['edit', 'Монтаж'], ['publish', 'Выкладка']];
const stageAt = (r) => !r?.version ? 'script' : ['done', 'published'].includes(r.status) ? 'publish' : 'edit';
function stages(r, tab) {
  if (!r) return `<span class="stg" aria-label="Этап">${STAGES.map(([, t], i) => `<span class="${i ? '' : 'on'}">${t}</span>`).join('')}</span>`;
  const at = STAGES.findIndex(([k]) => k === stageAt(r));
  return `<nav class="stg" aria-label="Этапы">${STAGES.map(([k, t], i) => `<a href="#/reel/${esc(r.id)}/${k}" class="${k === tab ? 'on' : i < at ? 'done' : ''}" ${k === tab ? 'aria-current="page"' : ''}>${t}</a>`).join('')}</nav>`;
}

async function vReel(id, tab) {
  const isNew = id.startsWith('new-');
  const data = isNew ? null : await api('/api/reel?reel=' + encodeURIComponent(id)).catch(() => null);
  const r = data?.reel;
  if (r && (!tab || tab === 'files')) tab = tab === 'files' ? 'materials' : stageAt(r);
  title(r ? `${r.num} ${r.title}` : 'Новый выпуск');
  const head = `<div class="chead"><div style="flex: 1; min-width: 200px"><div class="small muted"><a href="#/all">Все выпуски</a> › ${esc(projName())}</div><h1 style="font-size: 20px">${r ? `${esc(r.num)} · ${esc(r.title)}` : 'Новый выпуск'}</h1></div>
      ${stages(r, tab)}<span id="dlTop" class="row" style="gap: 8px"></span></div>`;
  const ctx = `<div class="ctx">Claude знает: <span class="chip">бриф</span><span class="chip">правила</span><span class="chip">дизайн-систему</span>${r ? `<span class="chip">сценарий и правки ${esc(r.num)}</span>` : ''}</div>`;
  const chatName = {script: 'Чат сценария', materials: 'Чат материалов', edit: 'Чат выпуска', compare: 'Чат выпуска', publish: 'Чат выкладки'}[tab] || 'Чат выпуска';
  // A reel that exists: its stage in the middle, its chat as a column on the right (CleanReel, CleanText…).
  view.innerHTML = isNew || !r
    ? `<div class="work"><div class="chat">${head}${ctx}<div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></div></div>`
    : `<div class="work"><div class="rmain">${head}<div id="reelHost" style="flex: 1; overflow-y: auto"></div></div>
      <aside class="chatcol" aria-label="${chatName}"><div class="chead" style="padding: 12px 16px"><b style="flex: 1">${chatName}</b>${canEdit() ? '<button type="button" class="btn" id="resetChat" title="История чата сотрётся, рилс и файлы останутся">Новый чат</button>' : ''}</div>${ctx}<div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></aside></div>`;
  const box = chatBox(id, {
    onRebind: (k) => { history.replaceState(null, '', '#/reel/' + k); sidebar(); },
    onDone: (k) => { sidebar(); if (!k.startsWith('new-')) { if (isNew) vReel(k); else if (['edit', 'script', 'publish'].includes(tab)) drawStage(k, tab); } },
  });
  $('#chatHost').append(box);
  $('#resetChat')?.addEventListener('click', async () => { if (confirm('Начать чат выпуска заново? Рилс, версии и файлы останутся.')) { await post('/api/chat/reset', {key: id}); vReel(id, tab); } });
  if (r) drawStage(id, tab, data);
  const pending = sessionStorage.getItem('firstMsg:' + id);
  if (pending) { sessionStorage.removeItem('firstMsg:' + id); const {text, shown} = JSON.parse(pending); await box.ready; box.say(text, shown); }
}

const chatOf = () => $('#chatHost > div');
// Puts text into the reel chat's input (a timecode, a scene) without sending it.
function draft(text) {
  const ta = $('#chatHost textarea');
  if (!ta) return;
  ta.value = text + (ta.value ? ' ' + ta.value : '');
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.dispatchEvent(new Event('input'));
}
const tc = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

async function drawStage(id, tab, data) {
  data ||= await api('/api/reel?reel=' + encodeURIComponent(id));
  if (tab === 'script') return stageScript(id, data);
  if (tab === 'materials') return reelFiles(id, data);
  if (tab === 'compare') return stageCompare(id, data);
  if (tab === 'publish') return stagePublish(id, data);
  $('#reelHost').innerHTML = '<div class="rbody" id="vers" aria-label="Версии"></div>';
  return renderVersions(id, data);
}

// Сравнение (CleanCompare): two versions side by side, playing in sync.
function stageCompare(id, data) {
  const vid = (v) => v?.files.filter((f) => /\.(mp4|mov|webm)$/i.test(f.name)).sort((a, b) => a.size - b.size)[0];
  const withVideo = data.versions.filter((v) => vid(v));
  const [b, a] = withVideo;
  const host = $('#reelHost');
  if (!a) { host.innerHTML = '<div class="page"><p class="muted">Сравнивать пока нечего: нужна ещё одна версия с видео. Старые версии хранятся кадром — их можно пересобрать на вкладке «Монтаж».</p></div>'; return; }
  host.innerHTML = `<div class="page" style="gap: 20px"><div class="row" style="justify-content: space-between"><div><b>Сравнение ${esc(a.v)} ↔ ${esc(b.v)}</b> <span class="small muted">играют синхронно: пауза и перемотка на одной — на обеих</span></div>
      <div class="row" style="gap: 8px"><a class="btn" href="#/reel/${esc(id)}/edit">Закрыть сравнение</a>${canEdit() ? `<button type="button" class="btn" id="keepOld">Вернуть ${esc(a.v)}</button><button type="button" class="btn primary" id="keepNew">Оставить ${esc(b.v)}</button>` : ''}</div></div>
    <div class="cmp">${[a, b].map((v, i) => `<div style="display: flex; flex-direction: column; gap: 8px; align-items: center"><video id="cv${i}" src="${vid(v).url}" playsinline preload="metadata" ${i ? 'controls' : 'muted'}></video><span class="small muted">${esc(v.v)}${i ? ' · текущая' : ''} · ${ago(v.at)}</span></div>`).join('')}</div>
    ${versionNote(data.readme, b.v) ? `<div class="blk" style="max-width: 640px; margin: 0 auto"><span class="lbl">Что поменялось в ${esc(b.v)}</span><span>${esc(versionNote(data.readme, b.v))}</span></div>` : ''}</div>`;
  const [v0, v1] = [$('#cv0'), $('#cv1')];
  v1.onplay = () => { v0.currentTime = v1.currentTime; v0.play(); };
  v1.onpause = () => v0.pause();
  v1.onseeked = () => { v0.currentTime = v1.currentTime; };
  $('#keepOld')?.addEventListener('click', () => chatOf().say(`Верни ${a.v} как текущую версию: пересобери её и пришли.`, `Вернуть ${a.v}`));
  $('#keepNew')?.addEventListener('click', () => chatOf().say(`Оставляем ${b.v}. Прошлые версии можно сжать по правилам хранения.`, `Оставить ${b.v}`));
}

// Выкладка (CleanPublish): captions per platform, checks, and a package the bot sends to Telegram on time.
function stagePublish(id, data) {
  const pub = data.publish || {};
  const caps = Array.isArray(pub.captions) && pub.captions.length ? pub.captions : [{platform: 'Instagram', text: section(data.readme, 'Подпись').trim() || section(data.readme, 'Caption').trim()}];

        <label class="lbl" for="cap${i}">Подпись · <span data-len="${i}">${(c.text || '').length}</span> знаков</label><textarea class="f" id="cap${i}" ${canEdit() ? '' : 'readonly'}>${esc(c.text || '')}</textarea></div>`).join('')}

    ${Array.isArray(pub.checks) && pub.checks.length ? `<div class="blk"><span class="lbl">Перед выкладкой</span>${pub.checks.map((c) => `<div class="row" style="gap: 10px"><span style="color: ${c.ok ? 'var(--green)' : 'var(--amber)'}; font-weight: 700">${c.ok ? '✓' : '!'}</span><span>${esc(c.text)}</span></div>`).join('')}</div>` : ''}
    ${cur && canEdit() ? `<div class="card" style="display: flex; flex-direction: column; gap: 12px"><b>Прислать пакет в Телеграм</b>
      <span class="small muted">В нужное время бот пришлёт тебе подпись, видео ${esc(cur.v)} и обложку — выложишь с телефона за минуту.</span>
      <div class="row" style="gap: 10px"><label class="small muted" for="pubAt">Когда</label><input class="f" type="datetime-local" id="pubAt" value="${local}" style="width: auto"><select class="f" id="pubCap" style="width: auto">${caps.map((c, i) => `<option value="${i}">${esc(c.platform || 'Подпись ' + (i + 1))}</option>`).join('')}</select><button type="button" class="btn primary" id="pubGo">Запланировать</button></div></div>` : ''}
    ${data.outbox?.length ? `<div class="blk"><span class="lbl">Запланировано</span>${data.outbox.map((o) => `<div class="li"><span style="flex: 1">${new Date(o.at).toLocaleString('ru', {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})} · ${esc(o.version)}${o.platform ? ' · ' + esc(o.platform) : ''}</span><span class="small muted">${o.sent ? (o.error ? 'не ушло: ' + esc(o.error) : 'отправлено в Телеграм') : 'ждёт · ' + esc(o.by)}</span>${!o.sent && canEdit() ? `<button type="button" class="btn" data-cancel="${esc(o.id)}">Отменить</button>` : ''}</div>`).join('')}</div>` : ''}

    nxBlock(host.querySelector('.page'), {caps, kind: 'reel', seen: pub.seen, ask: canEdit() ? (t) => chatOf().say(t, 'Исправить: ' + t.slice(0, 60)) : null,
      base: {kind: 'reel', media: vid ? {type: 'video', url: vid.url} : null, cover: cover?.url, name: projName(), reel: data.template, grid: (OV?.reels || []).filter((r) => r.id !== id && r.thumb).slice(0, 8).map((r) => ({url: r.thumb, kind: 'reel'}))},
      onSeen: async (key) => { await post('/api/reel/seen', {reel: id, key}); drawStage(id, 'publish'); }});

  host.querySelectorAll('[data-cancel]').forEach((b) => (b.onclick = async () => { await post('/api/publish/cancel', {id: b.dataset.cancel}); drawStage(id, 'publish'); }));
}

// ---------- «Как увидят» (NX0–NX7): the release in the platform's own interface, before «Выложить» ----------
// One row per platform from the captions; each opens the platform's frames (web/preview.js) with
// the zones, the warnings and «Исправить» (a request to Claude); looking marks the row «видел».
function nxViews(platform, kind) {
  const ig = /insta/i.test(platform || ''), tg = /телеграм|telegram|канал|\btg\b/i.test(platform || '');
  if (tg) return [['telegram', 'Светлая тема', {theme: 'light'}], ['telegram', 'Тёмная тема', {theme: 'dark'}]];
  if (ig && kind === 'reel') return [['reels', 'Reels', {}], ['grid', 'Сетка профиля', {}], ['story', 'История-анонс', {}]];
  if (ig) return [[kind === 'carousel' ? 'carousel' : 'feed', kind === 'carousel' ? 'Карусель в ленте' : 'Лента', {}], ['grid', 'Сетка профиля', {}]];
  return [[kind === 'reel' ? 'reels' : 'feed', 'Как в ленте', {}]];
}
function nxBlock(host, {caps, kind, base, seen, onSeen, ask}) {
  if (!window.Preview) return;
  const rows = caps.map((c, i) => {
    const views = nxViews(c.platform, kind);
    const warn = views.reduce((n, [v, , o]) => n + Preview.checks(v, {...base, ...o, caption: c.text, platform: c.platform}).length, 0);
    const key = `${c.platform || 'Площадка'}`;
    return {c, i, views, warn, key, seen: seen?.[key]};
  });
  const box = document.createElement('div');
  box.className = 'blk';
  box.innerHTML = `<span class="lbl">Как увидят · пролистай каждую площадку как подписчик</span>
    ${rows.map((r) => `<div class="nx-row"><span style="flex: 1; min-width: 0"><b>${esc(r.c.platform || 'Площадка')}</b>${r.c.account ? ` <span class="small muted">${esc(r.c.account)}</span>` : ''}<div class="small muted">${r.views.map((v) => v[1]).join(' · ')}</div></span>
      <span class="nx-st ${r.warn ? 'w' : r.seen ? 'ok' : ''}">${r.warn ? `⚠ ${r.warn}` : r.seen ? '✓ видел' : ''}</span><button type="button" class="btn" data-nx="${r.i}">${svg('eye', 14)}${r.seen ? 'Ещё раз' : 'Открыть'}</button></div>`).join('')}
    ${rows.some((r) => !r.seen) ? '<span class="small muted">Отметка «видел» ставится, когда открыл площадку и пролистал её.</span>' : ''}`;
  host.prepend(box);
  box.querySelectorAll('[data-nx]').forEach((b) => (b.onclick = () => nxOpen(rows[Number(b.dataset.nx)], base, onSeen, ask)));
}
function nxOpen(row, base, onSeen, ask) {
  let at = 0, zones = true, slide = 0;
  const ov = document.createElement('div');
  ov.className = 'nx-ov';
  const draw = () => {
    const [v, label, o] = row.views[at];
    const opts = {...base, ...o, caption: row.c.text, platform: row.c.platform, account: row.c.account || base.account, zones, slide};
    const warns = Preview.checks(v, opts);
    ov.innerHTML = `<div class="nx-box" role="dialog" aria-label="Как увидят: ${esc(row.c.platform || '')}"><div>${Preview.frame(v, opts)}</div>
      <div style="display: flex; flex-direction: column; gap: 14px; min-width: 0"><div class="row"><b style="font-size: 18px; flex: 1">${esc(row.c.platform || 'Площадка')}</b><button type="button" class="btn" id="nxX" aria-label="Закрыть">✕</button></div>
        <div class="tabs" style="margin: 0">${row.views.map((x, i) => `<button type="button" class="${i === at ? 'on' : ''}" data-v="${i}">${esc(x[1])}</button>`).join('')}</div>
        ${['reels', 'story'].includes(v) ? `<label class="row small" style="gap: 8px"><input type="checkbox" id="nxZ" ${zones ? 'checked' : ''}>Зоны «не ставить текст» — штриховкой</label>` : ''}
        ${v === 'carousel' && (base.slides || []).length > 1 ? `<div class="row" style="gap: 6px"><button type="button" class="btn" id="nxPrev">‹</button><span class="small muted">слайд ${slide + 1} из ${base.slides.length}</span><button type="button" class="btn" id="nxNext">›</button></div>` : ''}
        ${['reels', 'story', 'grid'].includes(v) && base.kind === 'reel' && !base.reel?.template && ask ? `<div class="small muted" style="display: flex; flex-direction: column; gap: 6px">Ролик собран без шаблона — где стоят плашки, по геометрии не узнать.<button type="button" class="btn" id="nxAsk" style="align-self: flex-start">Попросить Claude проверить зоны</button></div>` : ''}
        ${warns.map((w, i) => `<div class="nx-warn"><span>⚠ ${esc(w.text)}</span>${ask ? `<div class="row" style="gap: 8px"><button type="button" class="btn" data-fix="${i}">Исправить</button><span class="small">или выложить так</span></div>` : ''}</div>`).join('') || '<div class="small" style="color: var(--green)">✓ По геометрии всё на месте: текст вне интерфейса площадки, подпись читается.</div>'}
        <span class="small muted">Интерфейс нарисован студией для предпросмотра; цифры лайков и просмотров — для примера.</span>
        <div class="row" style="margin-top: auto; gap: 8px"><button type="button" class="btn primary" id="nxOk">✓ Видел</button>${at < row.views.length - 1 ? '<button type="button" class="btn" id="nxNx">Дальше: ' + esc(row.views[at + 1][1]) + '</button>' : ''}</div></div></div>`;
    ov.querySelector('#nxX').onclick = () => ov.remove();
    ov.querySelectorAll('[data-v]').forEach((b) => (b.onclick = () => { at = Number(b.dataset.v); slide = 0; draw(); }));
    ov.querySelector('#nxZ')?.addEventListener('change', (e) => { zones = e.target.checked; draw(); });
    ov.querySelector('#nxPrev')?.addEventListener('click', () => { slide = Math.max(0, slide - 1); draw(); });
    ov.querySelector('#nxNext')?.addEventListener('click', () => { slide = Math.min(base.slides.length - 1, slide + 1); draw(); });
    ov.querySelector('#nxNx')?.addEventListener('click', () => { at++; slide = 0; draw(); });
    ov.querySelectorAll('[data-fix]').forEach((b) => (b.onclick = () => { ask(warns[Number(b.dataset.fix)].fix); ov.remove(); }));
    ov.querySelector('#nxAsk')?.addEventListener('click', () => { ask(`Проверь текущую версию по зонам площадки «${row.c.platform}» (${label}): ${Preview.ZONES[v === 'grid' ? 'reels' : v]?.map((z) => `${z.label} — ${Math.round(z.x0 * 100)}–${Math.round(z.x1 * 100)}% по ширине, ${Math.round(z.y0 * 100)}–${Math.round(z.y1 * 100)}% по высоте`).join('; ') || 'сетка режет кадр до 3:4, видно 12–88 % высоты'}. Посмотри кадры, где текст или плашки заходят в эти зоны, и предложи, как сдвинуть.`); ov.remove(); });
    ov.querySelector('#nxOk').onclick = async () => { await onSeen(row.key); ov.remove(); };
  };
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  document.body.append(ov);
  draw();
}

// ---------- posts (POSTS.md, web/posts.mjs) ----------
// One editor for a text post, a post with a photo and a carousel; the stages depend on the kind.
const postStages = (k) => k === 'carousel' ? [['struct', 'Структура'], ['slides', 'Слайды'], ['publish', 'Подпись и выкладка']]
  : [['text', k === 'photo' ? 'Текст и фото' : 'Текст'], ['publish', 'Выкладка']];

async function vPost(id, stage) {
  const data = await api('/api/post?post=' + encodeURIComponent(id)).catch(() => null);
  if (!data) { view.innerHTML = '<div class="page"><p class="muted">Такого поста нет. <a href="#/all/posts">Все посты</a></p></div>'; return; }
  const p = data.post;
  const stages = postStages(p.kind);
  const at = data.summary?.stage === 'done' ? 'publish' : data.summary?.stage;
  if (!stages.some(([k]) => k === stage)) stage = stages.some(([k]) => k === at) ? at : stages[0][0];
  const atI = stages.findIndex(([k]) => k === at);
  title(p.title || 'Пост');
  const chatName = {text: 'Чат поста', struct: 'Чат карусели', slides: 'Чат карусели', publish: 'Чат выкладки'}[stage];
  view.innerHTML = `<div class="work"><div class="rmain">
    <div class="chead"><div style="flex: 1; min-width: 220px"><div class="small muted"><a href="#/all/posts">Посты</a> › ${esc(projName())}</div><h1 style="font-size: 20px; display: flex; align-items: center; gap: 10px">${esc(p.title || 'Пост')} ${kindBadge(p.kind)}</h1></div>
      <nav class="stg" aria-label="Этапы">${stages.map(([k, t], i) => `<a href="#/post/${esc(id)}/${k}" class="${k === stage ? 'on' : i < atI ? 'done' : ''}">${t}</a>`).join('')}</nav>
      ${canEdit() ? `<select class="f" id="kindSel" aria-label="Тип поста" style="width: auto; min-height: 36px">${[['text', 'Текст'], ['photo', 'С фото'], ['carousel', 'Карусель']].map(([k, t]) => `<option value="${k}" ${k === p.kind ? 'selected' : ''}>${t}</option>`).join('')}</select>` : ''}</div>
    <div id="reelHost" style="flex: 1; overflow-y: auto"></div></div>
    <aside class="chatcol" aria-label="${chatName}"><div class="chead" style="padding: 12px 16px"><b style="flex: 1">${chatName}</b>${canEdit() ? '<button type="button" class="btn" id="resetChat">Новый чат</button>' : ''}</div>
      <div class="ctx">Claude знает: <span class="chip">бриф</span><span class="chip">правила</span><span class="chip">дизайн-систему</span><span class="chip">этот пост</span></div>
      <div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></aside></div>`;
  const box = chatBox('post-' + id, {onDone: () => { sidebar(); drawPost(id, stage); }});
  $('#chatHost').append(box);
  $('#resetChat')?.addEventListener('click', async () => { if (confirm('Начать чат поста заново? Тексты и картинки останутся.')) { await post('/api/chat/reset', {key: 'post-' + id}); vPost(id, stage); } });
  $('#kindSel')?.addEventListener('change', async (e) => { await post('/api/post/save', {post: id, patch: {kind: e.target.value}}); location.hash = '#/post/' + id; vPost(id); });
  drawPost(id, stage, data);
  const pending = sessionStorage.getItem('firstMsg:post-' + id);
  if (pending) { sessionStorage.removeItem('firstMsg:post-' + id); const {text, shown} = JSON.parse(pending); await box.ready; box.say(text, shown); }
}

async function drawPost(id, stage, data) {
  data ||= await api('/api/post?post=' + encodeURIComponent(id));
  const host = $('#reelHost');
  if (!host) return;
  const save = (patch) => post('/api/post/save', {post: id, patch});
  ({text: postText, struct: postStruct, slides: postSlides, publish: postPublish})[stage](id, data, host, save);
}

// Текст (и фото) — EdPost: three variants, the chosen one outlined; photo with 4:5 / 1:1 and «Светлее».
function postText(id, data, host, save) {
  const p = data.post, texts = p.texts || [];
  const chosenPhoto = (p.photos || []).find((x) => x.chosen && x.out) || (p.photos || []).find((x) => x.out);
  const outUrl = chosenPhoto && data.images.find((f) => f.name === chosenPhoto.out.split('/').pop())?.url;
  let src = chosenPhoto?.file || data.sources[0]?.name, crop = chosenPhoto?.crop || '4:5', bright = !!chosenPhoto?.bright;
  host.innerHTML = `<div style="display: flex; min-height: 100%">
    ${p.kind === 'photo' ? `<div style="flex: 0 0 360px; padding: 26px 26px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--hov)">
      <span class="lbl">Фото${data.sources.length ? ' · ' + data.sources.length : ''}</span>
      <div style="aspect-ratio: ${crop === '1:1' ? '1' : '4 / 5'}; border-radius: 14px; background: var(--soft) center / cover no-repeat; ${outUrl ? `background-image: url('${outUrl}')` : ''}" id="phBig">${outUrl ? '' : '<span class="small muted" style="display: grid; place-items: center; height: 100%; padding: 20px; text-align: center">Загрузи фото — выбери и кадрируй</span>'}</div>
      ${canEdit() && data.sources.length ? `<div class="row" style="gap: 6px">${[['4:5', '4:5'], ['1:1', '1:1'], ['orig', 'Как есть']].map(([k, t]) => `<button type="button" class="chip" data-crop="${k}" style="${k === crop ? 'border-color: var(--ink); font-weight: 600' : ''}">${t}</button>`).join('')}<button type="button" class="chip" id="brightBtn" style="${bright ? 'border-color: var(--ink); font-weight: 600' : ''}">Светлее</button></div>` : ''}
      <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px">${data.sources.filter((f) => /\.(jpe?g|png|webp|heic)$/i.test(f.name)).map((f) => `<button type="button" data-src="${esc(f.name)}" title="${esc(f.name)}" style="aspect-ratio: 1; border-radius: 8px; border: 0; padding: 0; background: var(--soft) center / cover no-repeat; background-image: url('${f.url}'); ${f.name === src ? 'outline: 2px solid var(--ink); outline-offset: 1px' : ''}"></button>`).join('')}
        ${canEdit() ? '<label style="aspect-ratio: 1; border-radius: 8px; border: 1.5px dashed var(--line); display: grid; place-items: center; color: var(--muted); cursor: pointer">+<input type="file" accept="image/*" multiple hidden id="phUp"></label>' : ''}</div>
      ${p.why ? `<span class="small muted">${esc(p.why)}</span>` : ''}
    </div>` : ''}
    <div style="flex: 1; min-width: 0; padding: 26px 32px; display: flex; flex-direction: column; gap: 14px">
      <div class="row" style="gap: 12px"><b style="font-size: 18px; font-weight: 600">Текст${texts.length ? ' · ' + texts.length + ' варианта' : ''}</b><span class="small muted">выбери вариант, правки — словами в чате</span></div>
      ${texts.map((t, i) => `<button type="button" class="var ${i === (p.chosen || 0) ? 'on' : ''}" data-pick="${i}"><span class="small muted" style="font-weight: 500">${esc(t.style || 'Вариант ' + (i + 1))}${i === (p.chosen || 0) ? ' · выбран' : ''}</span><span style="font-size: 15px; line-height: 1.6; white-space: pre-wrap">${esc(t.text)}</span></button>`).join('')
        || `<p class="muted">Вариантов пока нет.${canEdit() ? ' <button type="button" class="btn" id="mkTexts">Написать 3 варианта</button>' : ''}</p>`}
      ${texts.length ? `<div class="row small muted" style="gap: 10px">${(texts[p.chosen || 0]?.text || '').length} знаков · подписи для площадок — на выкладке ${canEdit() ? `<a class="btn primary" style="margin-left: auto" href="#/post/${esc(id)}/publish">Дальше: выкладка</a>` : ''}</div>` : ''}
    </div></div>`;
  host.querySelectorAll('[data-pick]').forEach((b) => (b.onclick = async () => { if (!canEdit()) return; await save({chosen: Number(b.dataset.pick)}); drawPost(id, 'text'); }));
  $('#mkTexts')?.addEventListener('click', () => chatOf().say('Напиши три варианта текста этого поста в разных стилях (первым — стиль рубрики) в post.json.', 'Написать 3 варианта'));
  const apply = async () => { if (!src) return; const r = await post('/api/post/photo', {post: id, file: src, crop, bright}).catch((e) => ({error: e.message})); if (r.error) toast('Не получилось: ' + r.error); drawPost(id, 'text'); };
  host.querySelectorAll('[data-crop]').forEach((b) => (b.onclick = () => { crop = b.dataset.crop; apply(); }));
  $('#brightBtn')?.addEventListener('click', () => { bright = !bright; apply(); });
  host.querySelectorAll('[data-src]').forEach((b) => (b.onclick = () => { src = b.dataset.src; apply(); }));
  $('#phUp')?.addEventListener('change', async (e) => {
    for (const f of e.target.files) await fetch(`/api/upload?project=${encodeURIComponent(P)}&post=${encodeURIComponent(id)}&name=${encodeURIComponent(f.name)}`, {method: 'POST', body: f});
    toast(`Загружено: ${e.target.files.length}`);
    drawPost(id, 'text');
  });
}

// Структура — EdCarStruct: slides as rows, drag to reorder, 5/6/7, «Собрать слайды».
function postStruct(id, data, host, save) {
  const p = data.post, slides = p.slides || [], T = data.templates;
  host.innerHTML = `<div class="page" style="max-width: 900px; gap: 16px">
    <div class="row" style="gap: 12px"><div style="flex: 1"><b style="font-size: 18px; font-weight: 600">Из чего будет карусель</b><div class="small muted">Claude делит тему на слайды и подбирает шаблон каждому</div></div>
      ${canEdit() ? `<span class="small muted">Слайдов</span><span class="seg">${[5, 6, 7].map((n) => `<button type="button" data-n="${n}" class="${slides.length === n ? 'on' : ''}">${n}</button>`).join('')}</span>` : ''}</div>
    <div id="srows" style="display: flex; flex-direction: column; gap: 8px">${slides.map((x, i) => `<div class="srow" draggable="${canEdit()}" data-i="${i}"><span class="h" aria-hidden="true">⋮⋮</span><b style="width: 22px">${i + 1}</b><span style="flex: 1; min-width: 0"><b style="font-weight: 600">${esc(x.title || '')}</b><div class="small muted" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${esc((x.items || []).join(' · ') || x.text || '')}</div></span><span class="kind">${esc(T[x.template] || x.template)}</span></div>`).join('')
      || `<p class="muted">Слайдов пока нет.${canEdit() ? ' <button type="button" class="btn" id="mkStruct">Разбить тему на слайды</button>' : ''}</p>`}</div>
    ${canEdit() && slides.length ? `<div class="row"><button type="button" class="btn" id="addSlide">+ Слайд</button><span class="small muted">Перетащи, чтобы поменять порядок · 5–7 слайдов листают до конца чаще</span><button type="button" class="btn primary" id="build" style="margin-left: auto">Собрать слайды</button></div>` : ''}
  </div>`;
  $('#mkStruct')?.addEventListener('click', () => chatOf().say('Разбей тему на 5–7 слайдов и подбери шаблон каждому в post.json (slides).', 'Разбить на слайды'));
  host.querySelectorAll('[data-n]').forEach((b) => (b.onclick = () => chatOf().say(`Сделай карусель из ${b.dataset.n} слайдов: перестрой slides в post.json.`, `${b.dataset.n} слайдов`)));
  $('#addSlide')?.addEventListener('click', async () => { await save({slides: [...slides, {template: 'list', title: 'Новый слайд', items: []}]}); drawPost(id, 'struct'); });
  let from = null;
  host.querySelectorAll('.srow').forEach((row) => {
    row.ondragstart = () => { from = Number(row.dataset.i); row.classList.add('drag'); };
    row.ondragend = () => row.classList.remove('drag');
    row.ondragover = (e) => e.preventDefault();
    row.ondrop = async (e) => { e.preventDefault(); const to = Number(row.dataset.i); if (from === null || from === to) return; const next = [...slides]; next.splice(to, 0, next.splice(from, 1)[0]); await save({slides: next}); drawPost(id, 'struct'); };
  });
  $('#build')?.addEventListener('click', async (e) => { e.target.disabled = true; e.target.textContent = 'Собираю…'; const r = await post('/api/post/slides', {post: id}).catch((x) => ({error: x.message})); if (r.error) { toast('Не получилось: ' + r.error); e.target.disabled = false; e.target.textContent = 'Собрать слайды'; return; } location.hash = '#/post/' + id + '/slides'; });
}

// Слайды — EdCarousel: the strip, the chosen slide large, its template and texts; looks come from the design system.
function postSlides(id, data, host, save) {
  const p = data.post, slides = p.slides || [], T = data.templates;
  const png = (i) => data.images.find((f) => f.name === `slide-${String(i + 1).padStart(2, '0')}.png`)?.url;
  let cur = Number(sessionStorage.getItem('slide:' + id) || 0);
  if (cur >= slides.length) cur = 0;
  const x = slides[cur] || {};
  const bust = '&t=' + Date.now();
  host.innerHTML = !slides.length ? `<div class="page"><p class="muted">Сначала структура: <a href="#/post/${esc(id)}/struct">разбить тему на слайды</a>.</p></div>` : `<div class="page" style="gap: 18px">
    <div class="strip">${slides.map((s, i) => `<button type="button" data-s="${i}" class="${i === cur ? 'on' : ''}" style="${png(i) ? `background-image: url('${png(i)}${bust}')` : ''}"><span>${i + 1} · ${esc(T[s.template] || s.template)}</span></button>`).join('')}</div>
    <div class="split" style="gap: 28px">
      <div style="flex: 0 0 380px"><div style="aspect-ratio: 4 / 5; border-radius: 14px; border: 1px solid var(--line); background: var(--soft) center / cover no-repeat; ${png(cur) ? `background-image: url('${png(cur)}${bust}')` : ''}"></div><div class="small muted" style="margin-top: 8px">${cur + 1} / ${slides.length} · 1080×1350</div></div>
      <div style="flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 12px">
        <span class="lbl">Шаблон слайда</span><div class="row" style="gap: 6px">${Object.entries(T).map(([k, t]) => `<button type="button" class="chip" data-t="${k}" style="${k === x.template ? 'border-color: var(--ink); font-weight: 600' : ''}" ${canEdit() ? '' : 'disabled'}>${t}</button>`).join('')}</div>
        <label class="lbl" for="sTitle">Заголовок</label><input class="f" id="sTitle" value="${esc(x.title || '')}" ${canEdit() ? '' : 'readonly'}>
        ${['list', 'check', 'summary'].includes(x.template) ? `<label class="lbl" for="sItems">Пункты · до 6, по одному в строке${x.template === 'check' ? ' («что — цена»)' : ''}</label><textarea class="f" id="sItems" ${canEdit() ? '' : 'readonly'}>${esc((x.items || []).join('\n'))}</textarea>` : ''}
        ${['cover', 'summary', 'cta'].includes(x.template) ? `<label class="lbl" for="sText">Текст</label><textarea class="f" id="sText" style="min-height: 70px" ${canEdit() ? '' : 'readonly'}>${esc(x.text || '')}</textarea>` : ''}
        ${x.template === 'check' ? `<label class="lbl" for="sTotal">Итого</label><input class="f" id="sTotal" value="${esc(x.total || '')}" ${canEdit() ? '' : 'readonly'}>` : ''}
        <span class="small muted">Цвета, шрифт и отступы — из дизайн-системы проекта, руками не меняются.</span>
        ${canEdit() ? `<div class="row"><button type="button" class="btn primary" id="sSave">Сохранить и перерисовать</button>${data.images.some((f) => /^slide-/.test(f.name)) ? `<a class="btn" href="#/post/${esc(id)}/publish">Дальше: подпись</a>` : ''}</div>` : ''}
        <div class="row small" style="gap: 10px">${slides.map((_, i) => png(i) ? `<a href="${png(i)}&dl=1">слайд ${i + 1} ↓</a>` : '').join('')}</div>
      </div></div></div>`;
  host.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => { sessionStorage.setItem('slide:' + id, b.dataset.s); drawPost(id, 'slides', data); }));
  const collect = () => ({...x, title: $('#sTitle').value, ...($('#sItems') ? {items: $('#sItems').value.split('\n').map((l) => l.trim()).filter(Boolean).slice(0, 6)} : {}), ...($('#sText') ? {text: $('#sText').value} : {}), ...($('#sTotal') ? {total: $('#sTotal').value} : {})});
  const rerender = async (next) => { await save({slides: next}); const r = await post('/api/post/slides', {post: id}).catch((e) => ({error: e.message})); if (r.error) toast('Не получилось: ' + r.error); drawPost(id, 'slides'); };
  host.querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => { const next = [...slides]; next[cur] = {...collect(), template: b.dataset.t}; rerender(next); }));
  $('#sSave')?.addEventListener('click', (e) => { e.target.disabled = true; e.target.textContent = 'Рисую…'; const next = [...slides]; next[cur] = collect(); rerender(next); });
}

// Выкладка — EdPostPublish / EdCarCaption: native captions per platform with their own time, checks, a package to Telegram.
function postPublish(id, data, host, save) {
  const p = data.post;
  const chosen = (p.texts || [])[p.chosen || 0]?.text || '';
  const caps = (p.captions || []).length ? p.captions : [{platform: p.kind === 'text' ? 'Телеграм' : 'Instagram RU', text: chosen}];
  const d = new Date(Date.now() + 3600e3); d.setMinutes(0, 0, 0);
  const local = (t) => { const x = t ? new Date(t) : d; return new Date(x - x.getTimezoneOffset() * 6e4).toISOString().slice(0, 16); };
  const pics = p.kind === 'carousel' ? data.images.filter((f) => /^slide-/.test(f.name)) : data.images.filter((f) => (p.photos || []).some((x) => x.chosen && x.out?.endsWith(f.name)));
  host.innerHTML = `<div class="page" style="gap: 18px; max-width: 1000px">
    ${pics.length ? `<div class="strip">${pics.map((f) => `<a href="${f.url}&dl=1" title="Скачать" style="flex: none; width: 92px; aspect-ratio: 4 / 5; border-radius: 8px; background: var(--soft) center / cover no-repeat; background-image: url('${f.url}')"></a>`).join('')}</div>` : p.kind !== 'text' ? '<p class="small muted">Картинок пока нет — вернись на прошлый этап.</p>' : ''}
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px">${caps.map((c, i) => `<div class="cap">
      <div class="row" style="gap: 8px"><b>${esc(c.platform || 'Площадка')}</b><span class="small muted">${esc(c.account || '')}</span>${canEdit() ? `<input class="f" type="datetime-local" data-at="${i}" value="${local(c.at)}" style="width: auto; margin-left: auto; min-height: 34px">` : ''}</div>
      <label class="lbl" for="cap${i}">Подпись · <span data-len="${i}">${(c.text || '').length}</span> знаков${/EN/.test(c.platform || '') ? ' · своя версия, не перевод' : /телеграм/i.test(c.platform || '') ? ' · длиннее, без хэштегов' : ''}</label>
      <textarea class="f" id="cap${i}" data-cap="${i}" ${canEdit() ? '' : 'readonly'}>${esc(c.text || '')}</textarea></div>`).join('')}</div>
    ${!(p.captions || []).length && canEdit() ? '<p class="small muted">Подписи для Instagram RU и EN и для Телеграма пишет Claude. <button type="button" class="btn" id="mkCaps">Написать подписи</button></p>' : ''}
    ${(p.checks || []).length ? `<div class="blk"><span class="lbl">Перед выкладкой</span>${p.checks.map((c) => `<div class="row" style="gap: 10px"><span style="color: ${c.ok ? 'var(--green)' : 'var(--amber)'}; font-weight: 700">${c.ok ? '✓' : '!'}</span><span>${esc(c.text)}</span></div>`).join('')}</div>` : ''}
    ${(p.after || []).length ? `<div class="blk"><span class="lbl">Что после</span>${p.after.map((a, i) => `<label class="row" style="gap: 10px"><input type="checkbox" data-after="${i}" ${a.on ? 'checked' : ''} ${canEdit() ? '' : 'disabled'}>${esc(a.text)}</label>`).join('')}</div>` : ''}

    ${data.outbox?.length ? `<div class="blk"><span class="lbl">Запланировано</span>${data.outbox.map((o) => `<div class="li"><span style="flex: 1">${new Date(o.at).toLocaleString('ru', {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})}${o.platform ? ' · ' + esc(o.platform) : ''}</span><span class="small muted">${o.sent ? (o.error ? 'не ушло: ' + esc(o.error) : 'отправлено в Телеграм') : 'ждёт · ' + esc(o.by)}</span>${!o.sent && canEdit() ? `<button type="button" class="btn" data-cancel="${esc(o.id)}">Отменить</button>` : ''}</div>`).join('')}</div>` : ''}

  $('#capSave')?.addEventListener('click', async () => { await save({captions: current()}); toast('Сохранено'); });

    <section><div class="row" style="justify-content: space-between; margin-bottom: 10px"><h2>Итог и версии</h2><span class="small muted">старые версии сжимаются по правилам хранения</span></div><div class="fgrid" id="res"></div></section>

  const card = (f, del) => `<div class="fcard"><a class="pv" href="${f.url}" target="_blank" rel="noopener" ${f.kind === 'image' ? `style="background-image: url('${f.url}')"` : ''}>${f.kind === 'video' ? `<video src="${f.url}#t=0.5" preload="metadata" muted playsinline></video>` : f.kind === 'image' ? '' : esc((f.name.split('.').pop() || 'файл').toUpperCase())}</a>

    $('#srcInfo').textContent = f.sources.length ? `${f.sources.length} файлов · ${mb(f.sources.reduce((a, x) => a + x.size, 0))}` : '';

  }
  async function upload(files) {
    const drop = $('#drop');
    for (const [i, f] of [...files].entries()) {
      drop.querySelector('b').textContent = `Загружаю ${i + 1} из ${files.length}: ${f.name}…`;
      await fetch(`/api/upload?project=${encodeURIComponent(P)}&reel=${encodeURIComponent(id)}&name=${encodeURIComponent(f.name)}`, {method: 'POST', body: f});

  $('#shotList')?.addEventListener('click', () => chatOf().say('Составь шот-лист по сценам: что снять, как держать телефон, сколько секунд; отметь, что уже есть в материалах. Обнови scenes.json и пришли шот-лист сюда.', 'Шот-лист'));
