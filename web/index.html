<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рилсы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* One design system (handbook/ROADMAP.md): Manrope, neutral greys, black primary button. */
  :root { --bg:#FFFFFF; --side:#FAFAFA; --card:#fff; --ink:#171717; --ink2:#525252; --muted:#737373; --line:#EBEBEB; --soft:#F4F4F4; --hov:#F0F0F0; --sel:#E8E8E8; --accent:#171717; --blue:#1D4ED8; --blueBg:#EEF3FD; --amber:#B45309; --green:#1E7A3D; --me:#F0F0F0; --meInk:#171717; --badge:#2F6FEB; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 Manrope, -apple-system, system-ui, sans-serif; letter-spacing: -0.005em; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .app { display: flex; min-height: 100%; }
  nav.side { width: 248px; flex: none; border-right: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; height: 100vh; position: sticky; top: 0; overflow-y: auto; background: var(--side); }
  .proj { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 10px; }
  .proj .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
  .proj select { border: 0; background: none; font-weight: 600; width: 100%; padding: 0; appearance: none; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px; text-decoration: none; color: var(--ink2); font-size: 14px; line-height: 1.2; min-height: 32px; }
  .nav:hover { background: var(--hov); }
  .nav.on { background: var(--sel); color: var(--ink); font-weight: 600; }
  .nav svg { flex: none; color: var(--muted); } .nav.on svg { color: var(--ink); }
  .gh { font-size: 12px; color: var(--muted); padding: 16px 8px 5px; font-weight: 500; }
  .bdg { margin-left: auto; font-size: 11px; font-weight: 600; color: #fff; background: var(--badge); border-radius: 999px; padding: 1px 7px; }
  .srch { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--muted); font-size: 13px; width: 100%; text-align: left; }
  .srch kbd { margin-left: auto; font-family: inherit; font-size: 11px; }
  .ph { display: flex; align-items: center; gap: 9px; padding: 4px 6px 10px; }
  .ph .logo { width: 24px; height: 24px; border-radius: 7px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; flex: none; }
  .ph select { border: 0; background: none; font-weight: 600; font-size: 14px; flex: 1; min-width: 0; padding: 0; appearance: none; cursor: pointer; }
  .me { display: flex; align-items: center; gap: 8px; padding: 8px; font-size: 13px; border-top: 1px solid var(--line); margin-top: 6px; }
  .me i { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg,#C7D2FE,#A5B4FC); flex: none; }
  .nav .n { margin-left: auto; color: var(--muted); font-size: 12px; }
  .label { font-size: 12px; color: var(--muted); padding: 0 10px 4px; display: flex; justify-content: space-between; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
  .s-work { background: var(--amber); } .s-review { background: var(--blue); } .s-done { background: var(--green); } .s-published { background: var(--ink); } .s-none { background: #B9B7B1; }
  .meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; } .meter i { display: block; height: 100%; background: var(--ink); }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { display: none; }
  .page { padding: 28px 36px; display: flex; flex-direction: column; gap: 22px; max-width: 1400px; width: 100%; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 0 13px; border: 1px solid var(--line); background: var(--card); border-radius: 9px; text-decoration: none; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.danger { color: #B4231A; }
  .pill { border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--soft); color: var(--ink2); }
  .pill.review { background: var(--blueBg); color: var(--blue); } .pill.cur { background: var(--ink); color: #fff; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; } .stats .card { flex: 1 1 200px; padding: 14px 16px; } .stats b { display: block; font-size: 24px; font-weight: 600; }
  .board { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .col { flex: 1 1 250px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .colh { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .rc { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-decoration: none; }
  .rc:hover { border-color: var(--ink); }
  .th { width: 48px; height: 84px; border-radius: 7px; background: #2A3640 center/cover no-repeat; flex: none; }
  /* chat */
  .work { display: flex; flex: 1; min-height: 0; }
  .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  .chead { padding: 14px 28px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .ctx { padding: 8px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: 13px; color: var(--ink2); white-space: nowrap; }
  button.chip:hover { border-color: var(--ink); }
  .log { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .log .in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--me); color: var(--meInk); }
  .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
  .msg.err { align-self: flex-start; color: #C0392B; font-size: 14px; }
  .msg .by { font-size: 11px; opacity: .7; display: block; }
  .msg video, .msg img.media { display: block; width: 100%; max-width: 300px; border-radius: 10px; background: #000; margin-bottom: 6px; }
  .msg audio { width: 100%; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; white-space: normal; }
  .btns button, .keys button { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: 14px; text-align: left; }
  .btns button:hover, .keys button:hover { border-color: var(--ink); }
  .cur-opt { border-color: var(--accent) !important; }
  .status { display: none; max-width: 760px; margin: 0 auto 6px; padding: 0 24px; width: 100%; color: var(--muted); font-size: 14px; align-items: center; gap: 10px; }
  .status.on { display: flex; }
  .spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 1s linear infinite; flex: none; }
  @keyframes s { to { transform: rotate(360deg); } }
  .keys { max-width: 760px; margin: 0 auto; padding: 0 24px 6px; width: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
  .keys:empty { display: none; }
  form.send { border-top: 1px solid var(--line); padding: 10px 24px calc(10px + env(safe-area-inset-bottom)); }
  form.send .in { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  form.send .files { max-width: 760px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  form.send .files:empty { display: none; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 6px 6px 10px; font-size: 13px; }
  .fchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fchip small { color: var(--muted); }
  .fchip button { border: 0; background: none; color: var(--muted); width: 22px; height: 22px; border-radius: 6px; cursor: pointer; }
  .fchip button:hover { background: var(--soft); color: var(--ink); }
  .msg.me .fchip { margin-top: 6px; background: rgba(255,255,255,.55); border-color: transparent; padding-right: 10px; }
  .msg.me .fchip:first-child { margin-top: 0; }
  .dropzone { position: relative; }
  .dropzone.over::after { content: 'Отпустите, чтобы прикрепить'; position: absolute; inset: 8px; display: grid; place-items: center; border: 2px dashed var(--accent); border-radius: 16px; background: color-mix(in srgb, var(--card) 88%, transparent); font-weight: 600; color: var(--ink); pointer-events: none; z-index: 5; }
  form.send textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); max-height: 160px; min-height: 44px; }
  .icon { width: 44px; height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; display: grid; place-items: center; flex: none; }
  .icon.go { background: var(--ink); border-color: var(--ink); color: #fff; border-radius: 50%; }
  .hint { color: var(--muted); text-align: center; margin: 12vh auto 0; max-width: 420px; }
  aside.vers { width: 360px; flex: none; border-left: 1px solid var(--line); background: var(--card); padding: 16px; display: flex; flex-direction: column; gap: 14px; height: 100vh; overflow-y: auto; }
  .ver { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .ver.cur { border-color: var(--ink); }
  .ver video { width: 100%; max-height: 360px; border-radius: 8px; background: #000; }
  .dl { display: flex; justify-content: space-between; align-items: center; min-height: 42px; border: 1px solid var(--line); border-radius: 9px; padding: 0 12px; text-decoration: none; font-size: 14px; }
  .dl:hover { border-color: var(--ink); }
  .arch { display: flex; gap: 10px; align-items: center; font-size: 13px; }
  .arch .th { width: 28px; height: 50px; }
  /* misc */
  /* Switches are plain text tabs with an underline, never plates (Д1). */
  .tabs, .seg, .stg { display: inline-flex; gap: 18px; flex-wrap: wrap; align-items: center; background: none; border: 0; padding: 0; }
  .tabs a, .seg a, .seg button, .stg a, .stg span { padding: 6px 0 7px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; font-size: 14px; color: var(--muted); text-decoration: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; box-shadow: none; }
  .tabs a:hover, .seg a:hover, .seg button:hover, .stg a:hover { color: var(--ink); }
  .tabs a.on, .seg .on, .stg .on { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); background: none; box-shadow: none; }
  .stg .done { color: var(--ink2); } .stg .done::before { content: '✓'; color: var(--green); font-size: 12px; }
  .md h1 { font-size: 20px; margin: 4px 0 8px; } .md h2 { font-size: 16px; margin: 18px 0 6px; } .md h3 { font-size: 14px; margin: 14px 0 4px; color: var(--muted); }
  .md ul { padding-left: 18px; margin: 6px 0; } .md li { margin: 4px 0; } .md code { font-family: 'Geist Mono', monospace; font-size: 13px; background: var(--soft); padding: 1px 5px; border-radius: 5px; }
  .md p { margin: 6px 0; }
  #tabHost h1, #tabHost .row > div > .small.muted:first-child { display: none; } /* tab title is the settings header */
  .rmain { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  .rbody { display: flex; gap: 32px; padding: 26px 32px; align-items: flex-start; }
  .rvid { width: 300px; flex: none; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 0; }
  .rvid video, .vph { width: 100%; aspect-ratio: 9 / 16; border-radius: 18px; background: #000; object-fit: contain; }
  .vph { background: var(--soft); color: var(--muted); display: grid; place-items: center; text-align: center; padding: 24px; font-size: 13px; }
  .rinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 24px; }
  .blk { display: flex; flex-direction: column; gap: 6px; }

  /* «Как увидят» (NX0–NX7): the release inside each platform's interface, before publishing */
  .nx-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .nx-row:first-of-type { border-top: 0; }
  .nx-st { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .nx-st.w { color: var(--amber); } .nx-st.ok { color: var(--green); }
  .nx-ov { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; display: grid; place-items: center; padding: 20px; }
  .nx-box { background: var(--bg); border-radius: 18px; width: min(900px, 100%); max-height: calc(100vh - 40px); overflow: auto; display: grid; grid-template-columns: minmax(260px, 380px) 1fr; gap: 24px; padding: 24px; }
  @media (max-width: 720px) { .nx-box { grid-template-columns: 1fr; } }
  .nx-warn { background: #FFF7E6; color: #7A4B00; border-radius: 12px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; display: flex; flex-direction: column; gap: 8px; }
  .vwrap { position: relative; } .vwrap video { display: block; }
  .pinlayer { position: absolute; inset: 0 0 48px 0; cursor: crosshair; z-index: 2; }
  .pinlayer .pin { position: absolute; transform: translate(-50%, -50%); width: 24px; height: 24px; border-radius: 50%; background: #2F6FEB; color: #fff; font-size: 10px; display: grid; place-items: center; box-shadow: 0 0 0 4px rgba(47,111,235,.35); }
  .ecomp { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .ecomp textarea.f { min-height: 60px; }
  .tcx { font-size: 12px; font-weight: 700; color: #2F6FEB; background: #EEF4FE; border-radius: 6px; padding: 2px 7px; border: 0; }
  .enum { width: 24px; height: 24px; border-radius: 50%; background: #2F6FEB; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; flex: none; }
  .enum.done { background: var(--green); }
  .lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
  aside.chatcol { width: 380px; flex: none; border-left: 1px solid var(--line); display: flex; flex-direction: column; height: 100vh; }
  aside.chatcol .log, aside.chatcol form.send, aside.chatcol .keys, aside.chatcol .status, aside.chatcol .ctx { padding-left: 16px; padding-right: 16px; }
  aside.chatcol .msg { max-width: 92%; }
  .kind { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; white-space: nowrap; font-weight: 500; }
  .tcard { flex: 1 1 180px; min-width: 0; border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px; text-align: left; background: #fff; }
  .tcard.on { border: 2px solid var(--ink); padding: 17px; } .tcard:disabled { opacity: .55; }
  .var { padding: 16px 18px; border-radius: 14px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; text-align: left; background: #fff; width: 100%; }
  .var.on { border: 2px solid var(--ink); padding: 15px 17px; }
  .igrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .igrid > * { aspect-ratio: 4 / 5; background: var(--soft) center / cover no-repeat; position: relative; display: block; }
  .igrid .when { position: absolute; left: 5px; bottom: 5px; font-size: 11px; font-weight: 600; background: #fff; border-radius: 5px; padding: 2px 6px; }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .strip button { flex: none; width: 92px; aspect-ratio: 4 / 5; border-radius: 8px; border: 1px solid var(--line); background: var(--soft) center / cover no-repeat; padding: 0; position: relative; }
  .strip button.on { outline: 2px solid var(--ink); outline-offset: 2px; }
  .strip button span { position: absolute; left: 4px; bottom: 4px; font-size: 10px; background: #fff; border-radius: 4px; padding: 1px 5px; }
  .srow { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .srow.drag { opacity: .4; } .srow .h { cursor: grab; color: var(--muted); }
  .pweekwrap { flex: none; overflow-x: auto; margin: 0 -4px; padding: 0 4px 6px; }
  .pweek { display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 10px; }
  .pday { min-height: 320px; border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; background: #fff; }
  .pday .dh { display: flex; align-items: baseline; gap: 6px; padding-bottom: 4px; color: var(--muted); font-size: 13px; }
  .pday .dh b { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink2); }
  .pday.today { border-color: var(--ink); } .pday.today .dh b { color: var(--ink); }
  .pday.over, .pdrop.over { background: var(--side); border-color: var(--ink); }
  .pchip { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); border-left: 4px solid #A3A3A3; border-radius: 10px; padding: 9px 10px; font-size: 13px; line-height: 1.35; text-decoration: none; background: #fff; cursor: grab; }
  .pchip b { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pslot { display: flex; flex-direction: column; gap: 4px; border: 1.5px dashed #D4D4D4; border-radius: 10px; padding: 9px 10px; font-size: 13px; line-height: 1.35; text-align: left; background: none; color: var(--ink2); }
  /* Folding panels: the sidebar becomes an icon rail, the chat a thin rail on the right (remembered). */
  nav.side, aside.chatcol { transition: width .18s ease, padding .18s ease; }
  .fold { width: 28px; height: 28px; border: 0; background: none; border-radius: 7px; color: var(--muted); display: grid; place-items: center; flex: none; padding: 0; }
  .fold:hover { background: var(--hov); color: var(--ink); }
  .crail { display: none; }
  @media (min-width: 861px) {
    body.side-mini nav.side { width: 64px; padding: 12px 8px; overflow-x: hidden; }
    body.side-mini nav.side .ph select, body.side-mini nav.side .ph .icon, body.side-mini nav.side .ph b, body.side-mini nav.side .gh, body.side-mini nav.side .srch span, body.side-mini nav.side .srch kbd, body.side-mini nav.side .me span, body.side-mini nav.side .nav > span:not(:first-child) { display: none; }
    body.side-mini nav.side .ph { flex-direction: column; gap: 10px; padding: 4px 0 10px; }
    body.side-mini nav.side .nav, body.side-mini nav.side .srch { justify-content: center; padding: 8px 0; position: relative; }
    body.side-mini nav.side .srch { border-color: transparent; background: none; }
    body.side-mini nav.side .gh { display: block; height: 0; padding: 8px 0; border-top: 1px solid var(--line); margin: 6px 8px 0; font-size: 0; }
    body.side-mini nav.side .nav .bdg { display: block; position: absolute; top: 3px; right: 9px; padding: 0; width: 8px; height: 8px; font-size: 0; }
    body.side-mini nav.side .me { justify-content: center; padding: 8px 0; }
    body.chat-mini aside.chatcol { width: 48px; }
    body.chat-mini aside.chatcol > :not(.crail) { display: none; }
    body.chat-mini aside.chatcol .crail { display: flex; }
    .crail { flex-direction: column; align-items: center; gap: 10px; padding: 12px 0; height: 100%; width: 100%; border: 0; background: none; color: var(--muted); cursor: pointer; }
    .crail:hover { background: var(--side); color: var(--ink); }
    .crail span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  }
  .pslot:hover { background: var(--side); }
  .stepn { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; }
  .pin { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 28px; font-weight: 600; letter-spacing: .12em; }

async function loadMe() { const d = await (await fetch('/api/me?project=' + encodeURIComponent(P))).json(); ME = d.me; PROJECTS = d.projects; TEAM = d.team || 1; P = d.project || P; PLAN = d.plan || null; TEST = !!d.test; localStorage.setItem('project', P); }
const api = async (path, opts) => {

// ⌘K: jump to any reel or screen by name.
function search() {
  if ($('#srch')) return;
  const items = [
    ...OV.reels.map((r) => [`${r.num} ${r.title}`, '#/reel/' + r.id, STATUS[r.status]]),
    ...(OV.posts || []).map((x) => [x.title, '#/post/' + x.id, KIND[x.kind]]),
    ['Сегодня', '#/', ''], ['Выпуски', '#/all', ''], ['План', '#/plan', ''], ['Память', '#/memory', ''], ['Настройки', '#/settings', ''],
    ['Идеи', '#/new', ''], ['Стратегия: площадки, рубрики, ритм', '#/knowledge', ''],
    ...(OV.rubrics || []).map((x) => [x.name, '#/rubric/' + x.id, 'рубрика']),
  ];
  const d = document.createElement('div');
  d.id = 'srch';
  d.style.cssText = 'position: fixed; inset: 0; background: rgba(0,0,0,.18); z-index: 20; display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 0';
  d.innerHTML = `<div class="card" role="dialog" aria-label="Поиск" style="width: 100%; max-width: 560px; padding: 8px; box-shadow: 0 16px 48px rgba(0,0,0,.12)">
    <input class="f" id="srchIn" placeholder="Выпуск или раздел…" autocomplete="off" style="border: 0; font-size: 15px">
    <div id="srchList" style="max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding-top: 6px; border-top: 1px solid var(--line)"></div></div>`;
  document.body.append(d);
  const close = () => d.remove();
  const draw = (q) => {
    const hits = items.filter(([t]) => t.toLowerCase().includes(q.toLowerCase())).slice(0, 12);
    $('#srchList').innerHTML = hits.map(([t, h, x], i) => `<a class="nav ${i ? '' : 'on'}" href="${h}"><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${esc(t)}</span><span class="n">${esc(x)}</span></a>`).join('') || '<p class="small muted" style="padding: 8px">Ничего не нашлось</p>';
  };
  d.onclick = (e) => { if (e.target === d || e.target.closest('a')) close(); };
  $('#srchIn').oninput = (e) => draw(e.target.value);
  $('#srchIn').onkeydown = (e) => { if (e.key === 'Escape') close(); if (e.key === 'Enter') { const a = $('#srchList a'); if (a) { location.hash = a.getAttribute('href'); close(); } } };
  draw('');
  $('#srchIn').focus();
}
document.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && ME) { e.preventDefault(); search(); } });

// ---------- chat ----------
function chatBox(key, {onDone, onRebind} = {}) {
  const el = document.createElement('div');
  el.style.cssText = 'display: flex; flex-direction: column; flex: 1; min-height: 0';
  el.innerHTML = `<div class="log"><div class="in"></div></div>
    <div class="status"><i class="spin"></i><span style="display: flex; flex-direction: column; min-width: 0"><span class="stext">Думаю…</span><span class="shint small"></span></span><button class="btn" type="button" style="margin-left: auto; min-height: 32px">Стоп</button></div>
    <div class="keys"></div>
    ${canEdit() ? `<form class="send"><div class="files" aria-live="polite"></div><div class="in">
      <button type="button" class="icon clip" aria-label="Прикрепить файл"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"></path></svg></button>
      <input type="file" multiple hidden>
      <label style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)" for="ta-${esc(key)}">Сообщение</label>
      <textarea id="ta-${esc(key)}" rows="1" placeholder="Сообщение или правка…"></textarea>
      <button class="icon go" aria-label="Отправить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </div></form>` : '<p class="small muted" style="text-align: center; padding: 12px">У тебя доступ только на просмотр.</p>'}`;
  const log = $('.log .in', el), keysEl = $('.keys', el), st = $('.status', el), ta = $('textarea', el);
  let busy = false;
  const setBusy = (on, text) => {
    busy = on; st.classList.toggle('on', on);
    if (text) { $('.stext', st).textContent = text; $('.shint', st).textContent = /рендер/i.test(text) ? 'Это нормально: монтаж идёт на сервере. Страницу можно закрыть — версия появится сама.' : ''; }
    el.querySelectorAll('.btns button, .keys button, .go').forEach((b) => (b.disabled = on));
  };
  $('button', st).onclick = () => post('/api/stop');
  const buttons = (list, under) => {
    const box = document.createElement('div'); box.className = 'btns';
    for (const label of list) { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = () => say(`(pressed button "${label}" under: "${short(under)}")`, label); box.append(b); }
    return box;
  };
  const menuEl = (menu) => {
    const box = document.createElement('div');
    if (menu.title) box.innerHTML = `<b>${esc(menu.title)}</b>`;
    for (const s of menu.sections || []) {
      const sec = document.createElement('div'); sec.style.marginTop = '10px'; sec.style.whiteSpace = 'normal';
      sec.innerHTML = `${esc(s.title)}${s.prompt ? `<div class="small muted">${esc(s.prompt)}</div>` : ''}`;
      const row = document.createElement('div'); row.className = 'btns';
      for (const o of s.options || []) {
        const b = document.createElement('button'); b.type = 'button';
        b.innerHTML = esc(o.label) + (o.note ? ` <span class="small muted">${esc(o.note)}</span>` : '');
        if (o.value !== undefined && o.value === s.current) b.className = 'cur-opt';
        b.onclick = () => say(`(menu «${menu.title}»: ${s.title} → «${o.label}»)`, `${s.title}: ${o.label}`);
        row.append(b);
      }
      sec.append(row); box.append(sec);
    }
    return box;
  };
  const showKeys = (keys) => {
    keysEl.innerHTML = '';
    for (const k of keys) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = k; b.disabled = busy;
      b.onclick = () => say(/^🎲/.test(k) ? '(tapped «🎲 Другие идеи»: pitch a fresh batch of 4 NEW ideas per «1. Ideas» in REELS.md — none of the ones already shown; those stay in ideas.md. Keyboard: only the new ones, via --ideas.)' : `(tapped keyboard button "${k}")`, k);
      keysEl.append(b);
    }
  };
  const render = (m) => {
    $('.hint', log)?.remove();
    const d = document.createElement('div');
    if (m.from === 'me') {
      d.className = 'msg me';
      // Attachments travel as «📎 name» lines of the shown text; they come back as chips.
      const lines = String(m.text || '').split('\n'), files = lines.filter((l) => l.startsWith('📎 ')), text = lines.filter((l) => !l.startsWith('📎 ')).join('\n').trim();
      d.innerHTML = (m.by && m.by !== ME.name ? `<span class="by">${esc(m.by)}</span>` : '') + (text ? `<div>${esc(text)}</div>` : '')
        + files.map((l) => `<div class="fchip">${svg('clip', 14)}<span>${esc(l.slice(3))}</span></div>`).join('');
    }
    else if (m.kind === 'error') { d.className = 'msg err'; d.textContent = '⚠️ ' + m.text; }
    else {
      d.className = 'msg bot';
      if (m.kind === 'file') {
        const dl = m.url ? m.url + '&dl=1' : null;
        if (!m.url) d.insertAdjacentHTML('beforeend', `<div>📄 ${esc(m.name)}</div>`);
        else if (/\.(mp4|mov|webm)$/.test(m.ext) && !m.document) d.insertAdjacentHTML('beforeend', `<video src="${m.url}" controls playsinline preload="metadata"></video><a href="${dl}" class="small">Скачать</a>`);
        else if (/\.(png|jpe?g|webp|gif)$/.test(m.ext)) d.insertAdjacentHTML('beforeend', `<img class="media" src="${m.url}" alt="">`);
        else if (/\.(mp3|m4a|wav|ogg)$/.test(m.ext)) d.insertAdjacentHTML('beforeend', `<audio src="${m.url}" controls></audio>`);
        else d.insertAdjacentHTML('beforeend', `<a href="${dl}">📄 ${esc(m.name)}</a>`);
        if (m.caption) d.insertAdjacentHTML('beforeend', `<div>${chatMd(m.caption)}</div>`);
      } else if (m.text) d.innerHTML = chatMd(m.text);
      if (m.buttons?.length && canEdit()) d.append(buttons(m.buttons, m.caption || m.text));
      if (m.menu && canEdit()) d.append(menuEl(m.menu));
    }
    log.append(d);
    d.scrollIntoView({block: 'end'});
    if (m.from === 'bot' && canEdit()) showKeys(m.keys || []);
  };
  async function say(text, shown) {
    if (busy || !text.trim()) return;
    showKeys([]);
    render({from: 'me', text: shown || text});
    setBusy(true, 'Думаю…');
    try {
      const r = await fetch(`/api/chat?project=${encodeURIComponent(P)}`, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({key, text, shown})});
      if (r.status === 429) throw new Error('Claude сейчас занят в другом чате — дождись, пока он закончит');
      if (!r.ok) throw new Error('Ошибка ' + r.status);
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const {value, done} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const ev = JSON.parse(buf.slice(6, i)); buf = buf.slice(i + 2);
          if (ev.status) setBusy(true, ev.status);
          if (ev.msg) render(ev.msg);
          if (ev.rebind) { key = ev.rebind; onRebind?.(key); }
          if (ev.freed) toast(`Освобождено ${mb(ev.freed)}: старые версии ушли в архив`);
        }
      }
    } catch (err) { render({from: 'bot', kind: 'error', text: err.message}); }
    setBusy(false);
    onDone?.(key);
    ta?.focus();
  }
  async function load() {
    const h = await api('/api/chat?key=' + encodeURIComponent(key));
    log.innerHTML = '';
    if (!h.messages.length) log.innerHTML = `<p class="hint">${key === '_ds' ? 'Опиши, какой должна быть дизайн-система, или попроси собрать её из того, что уже есть в рилсах.' : key === '_project' ? 'Общий чат проекта: идеи, бриф, правила, настройки. Сами рилсы делаются в своих чатах.' : key.startsWith('post-') ? 'Напиши, что сделать с этим постом.' : 'Напиши, что сделать с этим рилсом.'}</p>`;
    h.messages.forEach(render);
    if (h.busy) {
      setBusy(true, h.status || 'Работаю… обновлю, когда закончу');
      setTimeout(() => location.hash.includes(key) && load().then(() => sidebar()), 4000);
    } else if (busy) setBusy(false);
  }
  if (ta) {
    const form = $('form', el), file = $('input[type=file]', el), clip = $('.clip', el), chips = $('.files', el);
    let picked = [];
    const showPicked = () => {
      chips.innerHTML = picked.map((f, i) => `<div class="fchip">${svg('clip', 14)}<span>${esc(f.name)}</span><small>${f.size < 1e6 ? Math.max(1, Math.round(f.size / 1e3)) + ' КБ' : mb(f.size)}</small><button type="button" data-rm="${i}" aria-label="Убрать ${esc(f.name)}">✕</button></div>`).join('');
      chips.querySelectorAll('[data-rm]').forEach((b) => (b.onclick = () => { picked.splice(+b.dataset.rm, 1); showPicked(); }));
    };
    const add = (list) => { picked.push(...list); showPicked(); ta.focus(); };
    ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
    ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
    clip.onclick = () => file.click();
    file.onchange = () => { add([...file.files]); file.value = ''; };
    // Files dropped anywhere on the chat are attached like the clip does.
    el.classList.add('dropzone');
    let depth = 0;
    const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
    el.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); depth++; el.classList.add('over'); });
    el.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
    el.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; el.classList.remove('over'); } });
    el.addEventListener('drop', (e) => { if (!hasFiles(e)) return; e.preventDefault(); depth = 0; el.classList.remove('over'); if (!busy) add([...e.dataTransfer.files]); });
    form.onsubmit = async (e) => {
      e.preventDefault();
      const files = [...picked], text = ta.value.trim();
      if ((!text && !files.length) || busy) return;
      const parts = [], shown = [];
      try {
        for (const f of files) {
          setBusy(true, `Загружаю ${f.name}…`);
          const toReel = !key.startsWith('_') && !key.startsWith('new-') ? `&reel=${encodeURIComponent(key)}` : '';
          const r = await fetch(`/api/upload?project=${encodeURIComponent(P)}${toReel}&name=${encodeURIComponent(f.name)}`, {method: 'POST', body: f});
          if (!r.ok) throw new Error(r.status === 413 ? `${f.name} слишком большой для загрузки` : `${f.name} не загрузился (ошибка ${r.status})`);
          const u = await r.json();
          parts.push(`(attached file → ${u.path})`);
          if (u.digest) parts.push(`(Telegram export «${u.digest.name}», ${u.digest.count} messages unpacked → ${u.digest.path}; ${u.digest.photos} photos it links are in photos/ beside it — open them to see the design)`);
          shown.push('📎 ' + f.name + (u.digest ? ` · выгрузка Telegram: ${u.digest.count} сообщ., ${u.digest.photos} фото` : ''));
        }
      } catch (err) {
        // Nothing is sent: the text and the files stay in the box to try again.
        setBusy(false);
        toast(err.message === 'Failed to fetch' ? 'Файл не загрузился: связь оборвалась. Текст и вложения остались — попробуйте ещё раз' : err.message);
        return;
      }
      setBusy(false);
      ta.value = ''; ta.style.height = 'auto';
      picked = []; showPicked();
      say([text, ...parts].filter(Boolean).join('\n'), [text, ...shown].filter(Boolean).join('\n'));
    };
  }
  el.say = say;
  el.ready = load();
  return el;
}

// ---------- views ----------
let view = $('#view');
const title = (t) => { $('#topTitle').textContent = t; document.title = t + ' · Рилсы'; };

// Сегодня (LeanToday): the week by stages, and what waits for you, from the content items.
async function vToday() {
  title('Сегодня');
  await loadItems().catch(() => (ITEMS = {items: [], rubrics: []}));
  const recent = [...OV.reels].sort((x, y) => y.updated - x.updated).slice(0, 4);
  const h = new Date().getHours();
  const hello = h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const mon = new Date(today); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  const week = Array.from({length: 7}, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
  const mine = ITEMS.items.filter((x) => !x.proposed);
  const dayOf = (x) => x.at?.slice(0, 10);
  const inDays = (x) => x.at ? Math.round((new Date(x.at.slice(0, 10)) - today) / 864e5) : null;
  const dayName = (x) => { const n = inDays(x); return n === 0 ? 'сегодня' : n === 1 ? 'завтра' : n < 0 ? 'дата прошла' : new Date(x.at).toLocaleDateString('ru', {weekday: 'short', day: 'numeric'}); };
  const onWeek = mine.filter((x) => dayOf(x) >= ymd(week[0]) && dayOf(x) <= ymd(week[6]));
  // What waits: a new version to look at, material to send, an idea close to its date, a ready one to post.
  const review = new Set(OV.reels.filter((r) => r.status === 'review').map((r) => r.id));
  const ver = Object.fromEntries(OV.reels.map((r) => [r.id, r.version]));
  const waits = [];
  for (const x of mine) {
    const n = inDays(x);
    const missing = (x.need || []).filter((y) => !y.done);
    if (x.stage === 'build' && x.ref?.kind === 'reel' && review.has(x.ref.id)) waits.push([2, x, `${ver[x.ref.id] || 'версия'} собрана — посмотреть`, 'сборка']);
    else if (x.stage === 'material' && (missing.length || n !== null && n <= 7)) waits.push([1, x, missing.length ? `не хватает: ${missing.slice(0, 2).map((y) => y.text).join(', ')}${missing.length > 2 ? ` и ещё ${missing.length - 2}` : ''}` : 'материал — пришли, что есть', 'материал']);
    else if (x.stage === 'idea' && n !== null && n >= 0 && n <= 7) waits.push([n <= 3 ? 1 : 3, x, `идея на ${dayName(x)} — пора решить, что снять`, 'идея']);
    else if (x.stage === 'ready' && n !== null && n <= 2) waits.push([n < 0 ? 0 : 3, x, n < 0 ? 'готово, дата прошла — выложить' : `готово, выйдет ${dayName(x)}`, 'готово']);
  }
  waits.sort((p, q) => p[0] - q[0] || String(p[1].at || '9').localeCompare(String(q[1].at || '9')));
  const pitches = ITEMS.items.filter((x) => x.proposed && x.at && inDays(x) >= 0 && inDays(x) <= 14).length;
  const wline = ([, x, note, tag]) => `<a class="wl" href="${itemHref(x)}"><span class="rsq" style="background: ${esc(itemRubric(x)?.color || '#A3A3A3')}"></span><span style="display: inline-flex; gap: 6px; align-items: center">${svg(FMT_ICON[x.format], 14)}${esc(x.title)}</span><span class="small muted">${esc(note)}</span><span class="r"><span class="tag">${tag}</span>${x.at ? '&nbsp;&nbsp;' + dayName(x) : ''}</span></a>`;
  const dayCell = (d) => {
    const list = onWeek.filter((x) => dayOf(x) === ymd(d));
    const isToday = ymd(d) === ymd(today);
    const head = `<span class="small" style="color: ${isToday ? 'var(--ink)' : 'var(--muted)'}; font-weight: ${isToday ? 700 : 500}">${DAYS[(d.getDay() + 6) % 7].toLowerCase()} ${d.getDate()}</span>`;
    if (!list.length) return `<div style="flex: 1; min-width: 0; border: 1px dashed #D4D4D4; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-height: 104px; background: #FCFCFC">${head}${d >= today && canEdit() ? `<button type="button" class="small" data-day="${ymd(d)}" style="margin-top: auto; border: 0; background: none; padding: 0; text-align: left; color: var(--blue); font-weight: 600; cursor: pointer">Предложить идею</button>` : ''}</div>`;
    const x = list[0];
    return `<a href="${itemHref(x)}" style="flex: 1; min-width: 0; border: 1px ${x.stage === 'idea' ? 'dashed #D4D4D4' : 'solid var(--line)'}; ${isToday ? 'border-color: var(--ink);' : ''} border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 5px; min-height: 104px; text-decoration: none; color: var(--ink)">${head}
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0"><span class="rsq" style="background: ${esc(itemRubric(x)?.color || '#A3A3A3')}"></span><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${esc(x.title)}</span></span>
      <span class="small muted">${FMT_NAME[x.format].toLowerCase()}${list.length > 1 ? ` · ещё ${list.length - 1}` : ''}</span><span style="margin-top: auto">${sdot(x.stage)}</span></a>`;
  };
  const ideaN = onWeek.filter((x) => x.stage === 'idea').length, matN = mine.filter((x) => x.stage === 'material').length;
  view.innerHTML = `<div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 56px 20px 40px">
    <div style="width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; flex-direction: column; gap: 6px"><h1 style="font-size: 30px">${hello}, ${esc(ME.name)}</h1>
        <div class="muted" style="font-size: 15px">${onWeek.length ? `На неделе ${onWeek.length} ${onWeek.length === 1 ? 'выпуск' : onWeek.length < 5 ? 'выпуска' : 'выпусков'}${ideaN ? `, ${ideaN} пока ${ideaN === 1 ? 'идея' : 'идеи'}` : ''}` : 'На этой неделе в плане пусто'}${matN ? ` · ждут материала: ${matN}` : ''}</div></div>
      ${canEdit() ? `<form class="box" id="todayForm" style="padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 10px">
        <textarea id="todayIn" rows="2" placeholder="Скажи идею, попроси предложить — или скинь фото и видео" style="border: 0; resize: none; font-size: 15px; outline: none; padding: 0"></textarea>
        <div class="row" style="color: var(--muted); gap: 8px"><a href="#/new" class="icon" style="width: 30px; height: 30px; border: 0" title="Новый выпуск" aria-label="Новый выпуск">${svg('plus')}</a><span class="small">Ответ — в чате проекта</span><button type="submit" class="icon go" style="margin-left: auto; width: 32px; height: 32px" aria-label="Отправить">↑</button></div></form>
      <div class="row" style="gap: 8px; margin-top: -14px"><button type="button" class="chip" id="layWeek">Расписать идеи на 2 недели</button>${['Что снять на этой неделе', 'Предложи 3 идеи в пустые дни'].map((t) => `<button type="button" class="chip" data-say="${esc(t)}">${t}</button>`).join('')}</div>` : ''}
      <div><div class="lh">Эта неделя<a href="#/plan">открыть План</a></div><div style="display: flex; gap: 8px; padding-top: 12px">${week.map(dayCell).join('')}</div></div>
      <div><div class="lh">Ждёт тебя<a href="#/all">все выпуски</a></div>${waits.slice(0, 8).map(wline).join('') || '<p class="small muted">Пусто — можно начинать новое.</p>'}
        ${pitches ? `<a class="wl" href="#/plan/draft"><span class="muted">◌</span><span>${pitches} ${pitches === 1 ? 'предложение' : pitches < 5 ? 'предложения' : 'предложений'} Claude на ближайшие две недели</span><span class="small muted">взять или заменить</span><span class="r"><span class="tag">план</span></span></a>` : ''}</div>
      <div><div class="lh">Недавнее</div>${recent.map((r) => `<a class="wl" href="#/reel/${r.id}"><span class="muted">◌</span><span>${esc(r.num)} ${esc(r.title)}</span><span class="small muted">${STATUS[r.status]}${r.version ? ' · ' + esc(r.version) : ''}</span><span class="r">${ago(r.updated)}</span></a>`).join('')}</div>
    </div></div>`;
  const go = (text, shown = text) => { if (!text.trim()) return; sessionStorage.setItem('firstMsg:_project', JSON.stringify({text, shown})); location.hash = '#/chat/_project'; };
  $('#todayForm')?.addEventListener('submit', (e) => { e.preventDefault(); go($('#todayIn').value); });
  $('#todayIn')?.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(e.target.value); } });
  view.querySelectorAll('[data-say]').forEach((b) => (b.onclick = () => go(b.dataset.say + (b.dataset.say.includes('идеи') ? '. Каждую добавь в ideas.md в «My ideas» со строками «Date: YYYY-MM-DDTHH:MM» и «Rubric: <id рубрики>».' : ''), b.dataset.say)));
  view.querySelectorAll('[data-day]').forEach((b) => (b.onclick = () => go(`Предложи идею на ${b.dataset.day} по рубрикам и ритму из strategy.json. Добавь её в ideas.md в «My ideas» со строками «Date: ${b.dataset.day}T19:00» и «Rubric: <id рубрики>».`, `Идея на ${b.dataset.day.slice(5)}`)));
  $('#layWeek')?.addEventListener('click', () => { sessionStorage.setItem('planLay', '1'); location.hash = '#/plan/draft'; });
}
const layIdeasText = (from, to) => `Распиши идеи на две недели, с ${from} по ${to}: по площадкам, рубрикам и ритму из strategy.json, не повторяя то, что уже вышло или стоит в плане. Это только концепции — снимать пока ничего не надо. Каждую идею добавь в ideas.md в раздел «My ideas», как обычно (Format:, Hook:, Plot:), и ещё две строки: «Date: YYYY-MM-DDTHH:MM» и «Rubric: <id рубрики из strategy.json>». Потом коротко перечисли их здесь.`;

// «Все выпуски» with the format switch inside (решение 2026-10-28): Все · Рилсы · Посты.
// Единицы контента (web/items.mjs): one item per format, idea → material → build → ready → published.
const LIFE = [['idea', 'Идея'], ['material', 'Материал'], ['build', 'Сборка'], ['ready', 'Готово'], ['published', 'Вышло']];
const LIFE_COLOR = {idea: '#8B8B8B', material: '#B7791F', build: '#2F6FEB', ready: '#2E8A4F', published: '#171717'};
const FMT_NAME = {reel: 'Рилс', post: 'Пост', carousel: 'Карусель', telegram: 'Телеграм', story: 'История'};
const FMT_ICON = {reel: 'reel', post: 'photo', carousel: 'carousel', telegram: 'text', story: 'story'};
let ITEMS = null;
const loadItems = async () => (ITEMS = await api('/api/items'));
const itemRubric = (x) => (ITEMS?.rubrics || []).find((r) => r.id === x.rubric || r.name === x.rubric);
const itemHref = (x) => x.ref?.kind === 'reel' ? '#/reel/' + x.ref.id : x.ref?.kind === 'post' ? '#/post/' + x.ref.id : '#/item/' + x.id;
const sdot = (s) => `<span class="sdot" style="color: ${LIFE_COLOR[s]}"><i style="${s === 'idea' ? 'border: 1.5px dashed ' + LIFE_COLOR[s] : 'background: ' + LIFE_COLOR[s]}"></i>${LIFE.find(([k]) => k === s)?.[1] || ''}</span>`;
const whenText = (at) => at ? new Date(at).toLocaleString('ru', {weekday: 'short', day: 'numeric', month: 'short'}) : 'без даты';
function itemCard(x) {
  const r = itemRubric(x);
  const need = x.need || [];
  const extra = x.stage === 'material' && need.length ? ` · снято ${need.filter((n) => n.done).length} из ${need.length}` : '';
  const sib = x.group ? ITEMS.items.filter((y) => y.group === x.group && y.id !== x.id).length : 0;
  return `<a class="icard ${x.stage === 'idea' ? 'idea' : ''}" href="${itemHref(x)}">
    <span class="ich">${r ? `<span class="rsq" style="background: ${esc(r.color || '#A3A3A3')}"></span>${esc(r.name)}` : '<span class="muted">без рубрики</span>'}<span class="muted" style="margin-left: auto; display: inline-flex" title="${FMT_NAME[x.format]}">${svg(FMT_ICON[x.format] || 'reel', 14)}</span></span>
    <b>${esc(x.title)}</b>
    <span class="small muted">${whenText(x.at)}${extra}${sib ? ` · ещё ${sib} из того же материала` : ''}${x.missing ? ' · папка пропала' : ''}</span></a>`;
}
// Выпуски (LeanAll): five columns by stage; format and rubric are filters, Claude's pitches a separate list.
async function vAll(fmt = 'all') {
  title('Выпуски');
  fmt = {reels: 'reel', posts: 'post'}[fmt] || fmt;
  await loadItems();
  const mine = ITEMS.items.filter((x) => !x.proposed);
  const pitches = ITEMS.items.filter((x) => x.proposed);
  let rub = sessionStorage.getItem('allRubric') || '';
  const fmts = [['all', 'Все форматы'], ...['reel', 'post', 'carousel', 'telegram'].map((k) => [k, FMT_NAME[k]])];
  const n = (k) => mine.filter((x) => k === 'all' || x.format === k).length;
  view.innerHTML = `<div class="ln-top"><b>Выпуски</b><span style="flex: 1"></span>${canEdit() ? `<a class="ln-btn p" href="#/new">${svg('plus', 14)}Новый выпуск</a>` : ''}</div>
  <div style="flex: 1; overflow-y: auto; padding: 22px 28px; display: flex; flex-direction: column; gap: 16px">
    <div class="row" style="gap: 8px; flex-wrap: wrap">${fmts.map(([k, t]) => `<a class="ln-pill ${k === fmt ? 'on' : ''}" href="#/all${k === 'all' ? '' : '/' + k}">${k === 'all' ? '' : svg(FMT_ICON[k], 14)}${t} · ${n(k)}</a>`).join('')}
      <span style="width: 1px; height: 22px; background: var(--line); margin: 0 6px"></span>
      <select class="ln-pill" id="rubSel" aria-label="Рубрика"><option value="">Рубрика: все</option>${ITEMS.rubrics.map((r) => `<option value="${esc(r.id)}" ${r.id === rub ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select>
      <a class="ln-pill ${fmt === 'proposed' ? 'on' : ''}" href="#/all/proposed" style="margin-left: auto">${svg('idea', 14)}Предложения Claude · ${pitches.length}</a></div>
    <div id="allBody"></div></div>`;
  const draw = () => {
    const pass = (x) => (!rub || x.rubric === rub || itemRubric(x)?.id === rub);
    if (fmt === 'proposed') {
      const list = pitches.filter(pass);
      $('#allBody').innerHTML = `<p class="small muted" style="margin: 0 0 8px">Идеи из ideas.md, которые ещё никто не взял. Взятая идея встаёт в колонку «Идея», дату можно поставить в Плане.</p>` + (list.map((x) => `<div class="ln-li"><span class="muted" style="display: inline-flex">${svg(FMT_ICON[x.format], 15)}</span><a href="#/item/${x.id}" style="flex: 1; min-width: 0; text-decoration: none; color: var(--ink)"><b style="font-weight: 600">${esc(x.title)}</b><br><span class="small muted">${esc(x.idea?.hook || x.idea?.about || '').slice(0, 140)}</span></a>${x.at ? `<span class="small muted">${whenText(x.at)}</span>` : ''}<span class="small muted">${x.by === 'owner' ? 'твоя' : 'Claude'}</span>${canEdit() ? `<button type="button" class="ln-btn s" data-take="${x.id}">Взять</button>` : ''}</div>`).join('') || '<p class="small muted">Пусто.</p>');
      $('#allBody').querySelectorAll('[data-take]').forEach((b) => (b.onclick = async () => { b.disabled = true; await post('/api/items/set', {id: b.dataset.take, take: true}); toast('Взято — в колонке «Идея»'); vAll('proposed'); }));
      return;
    }
    const list = mine.filter((x) => (fmt === 'all' || x.format === fmt) && pass(x));
    const order = (a, b) => String(a.at || '9').localeCompare(String(b.at || '9'));
    $('#allBody').innerHTML = `<div class="lboard">${LIFE.map(([k, t]) => { const col = list.filter((x) => x.stage === k).sort(order); return `<section class="lcol" aria-label="${t}"><div class="lcolh">${sdot(k)}<span class="muted" style="margin-left: auto">${col.length}</span></div>${col.map(itemCard).join('') || '<p class="small muted" style="padding: 4px">Пусто.</p>'}</section>`; }).join('')}</div>`;
  };
  $('#rubSel').onchange = (e) => { rub = e.target.value; sessionStorage.setItem('allRubric', rub); draw(); };
  draw();
}

// The life of one item above its editor: five stages, rubric, date; stage and date change by hand.
async function lifeBar(kind, id) {
  await loadItems().catch(() => null);
  const x = ITEMS?.items.find((y) => y.ref?.kind === kind && y.ref.id === id);
  if (!x) return '';
  return lifeBarFor(x);
}
function lifeBarFor(x, {controls = true} = {}) {
  const k = LIFE.findIndex(([s]) => s === x.stage);
  const steps = LIFE.map(([s, t], i) => `<span class="lstep ${i < k ? 'done' : i === k ? 'on' : ''}"><span class="c">${i < k ? '✓' : ''}</span>${t}</span>${i < 4 ? `<span class="lline ${i < k ? 'done' : ''}"></span>` : ''}`).join('');
  const r = itemRubric(x);
  const sibs = x.group ? ITEMS.items.filter((y) => y.group === x.group && y.id !== x.id) : [];
  return `<div class="lbar" data-item="${x.id}">${steps}
    <span style="flex: 1"></span>
    ${sibs.map((y) => `<a class="chip" href="${itemHref(y)}" style="text-decoration: none; display: inline-flex; gap: 6px; align-items: center">${svg(FMT_ICON[y.format], 13)}${FMT_NAME[y.format]} ${sdot(y.stage)}</a>`).join('')}
    ${!controls ? '' : canEdit() ? `<select class="f" data-f="rubric" aria-label="Рубрика" style="width: auto; min-height: 32px; font-size: 13px"><option value="">Без рубрики</option>${ITEMS.rubrics.map((y) => `<option value="${esc(y.id)}" ${r?.id === y.id ? 'selected' : ''}>${esc(y.name)}</option>`).join('')}</select>
      <input class="f" data-f="at" type="datetime-local" aria-label="Дата выхода" value="${esc((x.at || '').slice(0, 16))}" style="width: auto; min-height: 32px; font-size: 13px">
      <select class="f" data-f="stage" aria-label="Этап" style="width: auto; min-height: 32px; font-size: 13px">${LIFE.map(([s, t]) => `<option value="${s}" ${s === x.stage ? 'selected' : ''}>${t}</option>`).join('')}</select>`
    : `${r ? `<span class="ich"><span class="rsq" style="background: ${esc(r.color)}"></span>${esc(r.name)}</span>` : ''}<span class="small muted">${whenText(x.at)}</span>`}</div>`;
}
function wireLifeBar(root, onChange) {
  root.querySelectorAll('.lbar [data-f]').forEach((el) => (el.onchange = async () => {
    const id = el.closest('.lbar').dataset.item;
    await post('/api/items/set', {id, [el.dataset.f]: el.value || null});
    await loadItems();
    toast(el.dataset.f === 'stage' ? 'Этап поменян' : 'Сохранено');
    onChange?.();
  }));
}

// Starts work on an idea: a reel opens a new reel chat (its folder links back to the idea by
// itself), a post, carousel or Telegram text gets its folder now. Returns where to go.
async function startItem(y, {open = true} = {}) {
  const brief = [`«${y.title}»`, y.idea?.about && `О чём: ${y.idea.about}`, y.idea?.hook && `Крючок: ${y.idea.hook}`, (y.idea?.flow || []).length && `Ход: ${y.idea.flow.join(' / ')}`].filter(Boolean).join('\n');
  if (y.format === 'reel') {
    await post('/api/items/set', {id: y.id, take: true, starting: true});
    const key = 'new-' + Date.now();
    sessionStorage.setItem('firstMsg:' + key, JSON.stringify({text: `Новый рилс по идее из плана:\n${brief}\nСначала сценарий и список того, что снять (scenes.json: need/status), — материал я пришлю.`, shown: `${y.title}\nИдея готова — что снять?`}));
    return '#/reel/' + key;
  }
  const kind = {post: 'photo', carousel: 'carousel', telegram: 'text'}[y.format] || 'text';
  const r = await post('/api/post/new', {kind, title: y.title});
  await post('/api/items/set', {id: y.id, take: true, link: {kind: 'post', id: r.id}});
  const ask = kind === 'carousel' ? `Новая карусель по идее из плана:\n${brief}\nРазбей тему на 5–7 слайдов и подбери шаблон каждому (POSTS.md).`
    : kind === 'photo' ? `Новый пост с фото по идее из плана:\n${brief}\nСкажи, какие фото нужны; я загружу их на странице.` : `Новый текст в Телеграм по идее из плана:\n${brief}\nНапиши три варианта текста.`;
  sessionStorage.setItem('firstMsg:post-' + r.id, JSON.stringify({text: ask, shown: y.title}));
  return '#/post/' + r.id;
}

// A bare idea (LeanIdeaStage): the concept is written and talked over before anything is shot.
async function vItem(id) {
  await loadItems();
  const x = ITEMS.items.find((y) => y.id === id);
  if (!x) { view.innerHTML = '<div class="page"><p class="muted">Такого выпуска нет. <a href="#/all">Выпуски</a></p></div>'; return; }
  if (x.ref?.kind === 'reel' || x.ref?.kind === 'post') return location.replace(itemHref(x));
  title(x.title);
  const ed = canEdit();
  const r = itemRubric(x);
  const field = (f, label, v, rows, ph) => `<label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">${label}</span><textarea class="f" data-i="${f}" rows="${rows}" placeholder="${ph}" ${ed ? '' : 'readonly'} style="border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 15px; line-height: 1.55; resize: vertical">${esc(v || '')}</textarea></label>`;
  const prop = (k, v) => `<div style="display: flex; align-items: center; gap: 10px; font-size: 13px"><span class="muted" style="flex: 0 0 72px">${k}</span><span style="flex: 1; display: flex; justify-content: flex-end">${v}</span></div>`;
  const sel = (f, opts, cur) => `<select class="f" data-i="${f}" ${ed ? '' : 'disabled'} style="width: auto; min-height: 30px; font-size: 13px; font-weight: 600; border-color: transparent; text-align: right">${opts.map(([v, t]) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  view.innerHTML = `<div class="work"><div class="rmain">
    <div class="ln-top"><span class="rsq" style="background: ${esc(r?.color || '#A3A3A3')}"></span><b>${esc(x.title)}</b><span>· ${r ? esc(r.name) + ' · ' : ''}${FMT_NAME[x.format].toLowerCase()} · ${whenText(x.at)}</span><span style="flex: 1"></span>${x.proposed ? '<span class="small muted">предложение</span>' : ''}</div>
    ${x.proposed ? '' : lifeBarFor(x, {controls: false}).replace('class="lbar"', 'class="lbar" style="padding: 10px 24px"')}
    <div style="flex: 1; overflow-y: auto; padding: 28px 40px; display: flex; gap: 32px; min-height: 0">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <span class="small muted">${x.by === 'Claude' ? 'Предложил Claude' : x.by === 'owner' ? 'Твоя идея' : x.by ? 'Добавил ' + esc(x.by) : 'Идея'}${x.takenBy ? ' · взял ' + esc(x.takenBy) : ''}</span>
        <label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Название</span><input class="f" data-i="title" value="${esc(x.title)}" ${ed ? '' : 'readonly'} style="border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 15px"></label>
        ${field('about', 'О чём', x.idea?.about, 3, 'Одна-две фразы: о чём выпуск')}
        ${field('hook', 'Крючок — первые 2 секунды', x.idea?.hook, 2, 'Фраза или кадр, на котором остаются')}
        ${field('flow', 'Ход — по строке на шаг', (x.idea?.flow || []).join('\n'), 4, '1 · …\n2 · …\n3 · …')}
        ${ed ? `<div class="row" style="gap: 8px">${['Другой крючок', 'Короче, 15 секунд', 'Распиши ход', 'Сделать каруселью'].map((t) => `<button type="button" class="ln-pill" data-ask="${t}">${t}</button>`).join('')}</div>` : ''}
      </div>
      <div style="flex: 0 0 280px; display: flex; flex-direction: column; gap: 14px">
        <div style="border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
          ${prop('Рубрика', sel('rubric', [['', 'без рубрики'], ...ITEMS.rubrics.map((y) => [y.id, y.name])], r?.id || ''))}
          ${prop('Формат', sel('format', Object.entries(FMT_NAME).filter(([k]) => k !== 'story'), x.format))}
          ${prop('Дата', `<input class="f" data-i="at" type="datetime-local" value="${esc((x.at || '').slice(0, 16))}" ${ed ? '' : 'readonly'} style="width: auto; min-height: 30px; font-size: 13px; border-color: transparent">`)}
        </div>
        ${ed && x.proposed ? '<button type="button" class="ln-btn" id="iTake" style="height: 40px; justify-content: center">Взять в план</button>' : ''}
        ${ed ? '<button type="button" class="ln-btn p" id="iGo" style="height: 44px; justify-content: center">Идея готова — что снять?</button>' : ''}
        <span class="small muted" style="line-height: 1.5">Claude составит список кадров, выпуск перейдёт на этап «Материал». Правки сохраняются сами.</span>
      </div>
    </div></div>
    <aside class="chatcol" aria-label="Обсудить идею"><div class="chead" style="padding: 12px 16px"><b style="flex: 1">Обсудить идею</b></div><div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></aside></div>`;
  wireLifeBar(view, () => vItem(id));
  const box = chatBox('_project', {onDone: () => { sidebar(); vItem(id); }});
  $('#chatHost').append(box);
  const save = async (patch) => { await post('/api/items/set', {id, ...patch}); };
  view.querySelectorAll('[data-i]').forEach((el) => (el.onchange = () => {
    const f = el.dataset.i;
    if (['title', 'format', 'rubric', 'at'].includes(f)) return save({[f]: el.value || null}).then(() => ['rubric', 'at', 'format'].includes(f) && vItem(id));
    const v = (k) => view.querySelector(`[data-i="${k}"]`).value;
    save({idea: {about: v('about'), hook: v('hook'), flow: v('flow').split('\n').map((l) => l.trim()).filter(Boolean)}});
  }));
  // The idea lives in items.json; Claude edits it there, by its id.
  view.querySelectorAll('[data-ask]').forEach((b) => (b.onclick = () => box.say(`Идея «${x.title}» (projects/${P}/items.json, элемент id ${x.id}, поле idea: about, hook, flow). ${b.dataset.ask}${b.dataset.ask === 'Сделать каруселью' ? ': поменяй format на carousel и перепиши ход под 5–7 слайдов' : ''}. Запиши результат в это поле и коротко скажи здесь, что поменял.`, b.dataset.ask)));
  $('#iTake')?.addEventListener('click', async () => { await save({take: true}); toast('Взято в план'); vItem(id); });
  $('#iGo')?.addEventListener('click', async (e) => {
    e.target.disabled = true;
    await loadItems();
    location.hash = await startItem(ITEMS.items.find((z) => z.id === id));
  });
}

// Reel stages from the canvas (Сценарий · Материалы · Монтаж · Выкладка): each is a tab of the reel;
// the one the reel is at is marked by what it already has.
const STAGES = [['script', 'Сценарий'], ['materials', 'Материалы'], ['edit', 'Монтаж'], ['publish', 'Выкладка']];
const stageAt = (r) => !r?.version ? 'script' : ['done', 'published'].includes(r.status) ? 'publish' : 'edit';
function stages(r, tab) {
  if (!r) return `<span class="stg" aria-label="Этап">${STAGES.map(([, t], i) => `<span class="${i ? '' : 'on'}">${t}</span>`).join('')}</span>`;
  const at = STAGES.findIndex(([k]) => k === stageAt(r));
  return `<nav class="stg" aria-label="Этапы">${STAGES.map(([k, t], i) => `<a href="#/reel/${esc(r.id)}/${k}" class="${k === tab ? 'on' : i < at ? 'done' : ''}" ${k === tab ? 'aria-current="page"' : ''}>${t}</a>`).join('')}</nav>`;
}

async function vReel(id, tab) {
  const isNew = id.startsWith('new-');
  const data = isNew ? null : await api('/api/reel?reel=' + encodeURIComponent(id)).catch(() => null);
  const r = data?.reel;
  if (r && (!tab || tab === 'files')) tab = tab === 'files' ? 'materials' : stageAt(r);
  title(r ? `${r.num} ${r.title}` : 'Новый выпуск');
  const head = `<div class="chead"><div style="flex: 1; min-width: 200px"><div class="small muted"><a href="#/all">Все выпуски</a> › ${esc(projName())}</div><h1 style="font-size: 20px">${r ? `${esc(r.num)} · ${esc(r.title)}` : 'Новый выпуск'}</h1></div>
      ${stages(r, tab)}<span id="dlTop" class="row" style="gap: 8px"></span></div>${r ? await lifeBar('reel', id) : ''}`;
  const ctx = `<div class="ctx">Claude знает: <span class="chip">бриф</span><span class="chip">правила</span><span class="chip">дизайн-систему</span>${r ? `<span class="chip">сценарий и правки ${esc(r.num)}</span>` : ''}</div>`;
  const chatName = {script: 'Чат сценария', materials: 'Чат материалов', edit: 'Чат выпуска', compare: 'Чат выпуска', publish: 'Чат выкладки'}[tab] || 'Чат выпуска';
  // A reel that exists: its stage in the middle, its chat as a column on the right (CleanReel, CleanText…).
  view.innerHTML = isNew || !r
    ? `<div class="work"><div class="chat">${head}${ctx}<div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></div></div>`
    : `<div class="work"><div class="rmain">${head}<div id="reelHost" style="flex: 1; overflow-y: auto"></div></div>
      <aside class="chatcol" aria-label="${chatName}"><div class="chead" style="padding: 12px 16px"><b style="flex: 1">${chatName}</b>${canEdit() ? '<button type="button" class="btn" id="resetChat" title="История чата сотрётся, рилс и файлы останутся">Новый чат</button>' : ''}</div>${ctx}<div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></aside></div>`;
  const box = chatBox(id, {
    onRebind: (k) => { history.replaceState(null, '', '#/reel/' + k); sidebar(); },
    onDone: (k) => { sidebar(); if (!k.startsWith('new-')) { if (isNew) vReel(k); else if (['edit', 'script', 'publish'].includes(tab)) drawStage(k, tab); } },
  });
  $('#chatHost').append(box);
  $('#resetChat')?.addEventListener('click', async () => { if (confirm('Начать чат выпуска заново? Рилс, версии и файлы останутся.')) { await post('/api/chat/reset', {key: id}); vReel(id, tab); } });
  wireLifeBar(view);
  if (r) drawStage(id, tab, data);
  const pending = sessionStorage.getItem('firstMsg:' + id);
  if (pending) { sessionStorage.removeItem('firstMsg:' + id); const {text, shown} = JSON.parse(pending); await box.ready; box.say(text, shown); }
}

const chatOf = () => $('#chatHost > div');
// Puts text into the reel chat's input (a timecode, a scene) without sending it.
function draft(text) {
  const ta = $('#chatHost textarea');
  if (!ta) return;
  ta.value = text + (ta.value ? ' ' + ta.value : '');
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.dispatchEvent(new Event('input'));
}
const tc = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

async function drawStage(id, tab, data) {
  data ||= await api('/api/reel?reel=' + encodeURIComponent(id));
  if (tab === 'script') return stageScript(id, data);
  if (tab === 'materials') return reelFiles(id, data);
  if (tab === 'compare') return stageCompare(id, data);
  if (tab === 'publish') return stagePublish(id, data);
  $('#reelHost').innerHTML = '<div class="rbody" id="vers" aria-label="Версии"></div>';
  return renderVersions(id, data);
}

// Сценарий (CleanText): scenes on the left, each scene as a card; clicking a scene drafts a note about it.
function stageScript(id, data) {
  const sc = Array.isArray(data.scenes) ? data.scenes : null;
  const host = $('#reelHost');
  const script = section(data.readme, 'Сценарий'), look = section(data.readme, 'Вид');
  const field = (t, v) => v ? `<div class="f"><span class="small muted" style="padding-top: 2px">${t}</span><span>${esc(v)}</span></div>` : '';
  host.innerHTML = `<div style="display: flex; min-height: 100%">
    ${sc ? `<nav style="flex: 0 0 190px; padding: 26px 12px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--hov)" aria-label="Сцены"><span class="lbl" style="padding: 0 10px 8px">Сцены · ${sc.length}</span>
      ${sc.map((x, i) => `<a class="scn" href="#sc${i}" data-sc="${i}"><span>${esc(x.t || '')}</span>${esc(x.name || 'Сцена ' + (i + 1))}</a>`).join('')}</nav>` : ''}
    <div style="flex: 1; min-width: 0; padding: 26px 32px; display: flex; flex-direction: column; gap: 14px">
      ${sc ? sc.map((x, i) => `<section class="scard" id="sc${i}"><div class="row" style="gap: 10px; padding-bottom: 4px"><b style="font-size: 16px; font-weight: 600">${i + 1} · ${esc(x.name || '')}</b><span class="small muted">${esc(x.t || '')}</span>${canEdit() ? `<button type="button" class="btn" style="margin-left: auto" data-edit="${i}">Правка сцены</button>` : ''}</div>
          ${field('На экране', x.screen)}${field('Текст на экране', x.text)}${field('Звук', x.sound)}</section>`).join('')
        : `<div class="md" style="max-width: 820px">${md(script) || '<p class="muted">Сценария пока нет. Опиши идею в чате справа — Claude напишет сценарий.</p>'}</div>
           ${look.trim() ? `<div class="blk"><span class="lbl">Как выглядит</span><div class="md" style="font-size: 14px">${md(look)}</div></div>` : ''}
           ${canEdit() && script.trim() ? '<div><button type="button" class="btn" id="toScenes">Разложить по сценам</button> <span class="small muted">Claude разобьёт сценарий на сцены с таймкодами — их можно править по одной</span></div>' : ''}`}
    </div></div>`;
  host.querySelectorAll('[data-sc]').forEach((a) => (a.onclick = (e) => { e.preventDefault(); $('#sc' + a.dataset.sc).scrollIntoView({behavior: 'smooth', block: 'start'}); }));
  host.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => { const x = sc[b.dataset.edit]; draft(`Сцена ${Number(b.dataset.edit) + 1} «${x.name}» (${x.t}) —`); }));
  $('#toScenes')?.addEventListener('click', () => chatOf().say('Разложи сценарий этого рилса по сценам в scenes.json: таймкод, название, что на экране, текст на экране, звук, какой материал нужен и есть ли он.', 'Разложить сценарий по сценам'));
}

// Сравнение (CleanCompare): two versions side by side, playing in sync.
function stageCompare(id, data) {
  const vid = (v) => v?.files.filter((f) => /\.(mp4|mov|webm)$/i.test(f.name)).sort((a, b) => a.size - b.size)[0];
  const withVideo = data.versions.filter((v) => vid(v));
  const [b, a] = withVideo;
  const host = $('#reelHost');
  if (!a) { host.innerHTML = '<div class="page"><p class="muted">Сравнивать пока нечего: нужна ещё одна версия с видео. Старые версии хранятся кадром — их можно пересобрать на вкладке «Монтаж».</p></div>'; return; }
  host.innerHTML = `<div class="page" style="gap: 20px"><div class="row" style="justify-content: space-between"><div><b>Сравнение ${esc(a.v)} ↔ ${esc(b.v)}</b> <span class="small muted">играют синхронно: пауза и перемотка на одной — на обеих</span></div>
      <div class="row" style="gap: 8px"><a class="btn" href="#/reel/${esc(id)}/edit">Закрыть сравнение</a>${canEdit() ? `<button type="button" class="btn" id="keepOld">Вернуть ${esc(a.v)}</button><button type="button" class="btn primary" id="keepNew">Оставить ${esc(b.v)}</button>` : ''}</div></div>
    <div class="cmp">${[a, b].map((v, i) => `<div style="display: flex; flex-direction: column; gap: 8px; align-items: center"><video id="cv${i}" src="${vid(v).url}" playsinline preload="metadata" ${i ? 'controls' : 'muted'}></video><span class="small muted">${esc(v.v)}${i ? ' · текущая' : ''} · ${ago(v.at)}</span></div>`).join('')}</div>
    ${versionNote(data.readme, b.v) ? `<div class="blk" style="max-width: 640px; margin: 0 auto"><span class="lbl">Что поменялось в ${esc(b.v)}</span><span>${esc(versionNote(data.readme, b.v))}</span></div>` : ''}</div>`;
  const [v0, v1] = [$('#cv0'), $('#cv1')];
  v1.onplay = () => { v0.currentTime = v1.currentTime; v0.play(); };
  v1.onpause = () => v0.pause();
  v1.onseeked = () => { v0.currentTime = v1.currentTime; };
  $('#keepOld')?.addEventListener('click', () => chatOf().say(`Верни ${a.v} как текущую версию: пересобери её и пришли.`, `Вернуть ${a.v}`));
  $('#keepNew')?.addEventListener('click', () => chatOf().say(`Оставляем ${b.v}. Прошлые версии можно сжать по правилам хранения.`, `Оставить ${b.v}`));
}

// Выкладка (CleanPublish): captions per platform, checks, and a package the bot sends to Telegram on time.
function stagePublish(id, data) {
  const pub = data.publish || {};
  const caps = Array.isArray(pub.captions) && pub.captions.length ? pub.captions : [{platform: 'Instagram', text: section(data.readme, 'Подпись').trim() || section(data.readme, 'Caption').trim()}];
  const cur = data.versions[0];
  // Every version that still has a video can be published; the newest one with a master goes first.
  const isMaster = (v) => v.files.some((f) => f.kind === 'master');
  const pubVers = data.versions.filter((v) => v.files.some((f) => f.kind === 'master' || f.kind === 'copy'));
  const pubDefault = pubVers.find(isMaster) || pubVers[0];
  const host = $('#reelHost');
  const d = new Date(Date.now() + 3600e3); d.setMinutes(0, 0, 0);
  const local = new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
  // «Готовые файлы»: a card per version that has a video — a reel may have RU and EN masters,
  // and each needs its own obvious download, its cover and a word on what that version is.
  const pick = (v, k) => v.files.filter((f) => f.kind === k).sort((a, b) => b.size - a.size)[0];
  const mastersLabel = (n) => `${n} ${n % 10 === 1 && n % 100 !== 11 ? 'мастер' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'мастера' : 'мастеров'}`;
  const readyCard = (v) => {
    const master = pick(v, 'master'), copy = pick(v, 'copy'), cover = pick(v, 'cover') || pick(v, 'thumb');
    const note = versionNote(data.readme, v.v);
    const res = master ? (/1440p/i.test(master.name) ? '1440p' : /1080p/i.test(master.name) ? '1080p' : 'мастер') : '';
    return `<div class="card" style="display: flex; gap: 14px; align-items: flex-start">
      <div style="flex: none; width: 66px; aspect-ratio: 9 / 16; border-radius: 10px; background: var(--soft) center / cover no-repeat; ${cover ? `background-image: url('${cover.url}')` : ''}"></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
        <div class="row" style="gap: 8px; flex-wrap: wrap"><b>${esc(vName(v))}${v === cur ? ' · текущая' : ''}</b>${master ? `<span class="small" style="color: var(--green); font-weight: 600">✓ мастер ${res}</span>` : `<span class="small" style="color: var(--amber); font-weight: 600">${copy ? 'мастер не собран' : 'видео не сохранено — можно пересобрать'}</span>`}</div>
        ${note ? `<span class="small" style="line-height: 1.45">${esc(note)}</span>` : ''}
        <div class="row" style="gap: 8px; flex-wrap: wrap; margin-top: 4px">
          ${master ? `<a class="btn primary" href="${master.url}&dl=1">Скачать мастер ${esc(v.v)} · ${mb(master.size)} ↓</a>` : canEdit() ? `<button type="button" class="btn primary" data-pubmaster="${esc(v.v)}">Собрать мастер 1440p</button>` : ''}
          ${cover ? `<a class="btn" href="${cover.url}&dl=1">Обложка ↓</a>` : ''}
          ${copy ? `<a class="small muted" href="${copy.url}&dl=1" style="align-self: center">лёгкая копия · ${mb(copy.size)}</a>` : ''}
        </div></div></div>`;
  };
  host.innerHTML = `<div class="page" style="gap: 22px; max-width: 980px">
    ${!cur ? '<p class="muted">Выкладывать пока нечего — сначала смонтируйте первую версию.</p>' : ''}
    ${pubVers.length ? `<div class="blk"><span class="lbl">Готовые файлы · ${mastersLabel(pubVers.filter(isMaster).length)}</span>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px">${data.versions.map(readyCard).join('')}</div></div>` : ''}
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
      ${caps.map((c, i) => `<div class="cap"><div class="row" style="gap: 8px"><b>${esc(c.platform || 'Площадка')}</b><span class="small muted">${esc(c.account || '')}</span></div>
        <label class="lbl" for="cap${i}">Подпись · <span data-len="${i}">${(c.text || '').length}</span> знаков</label><textarea class="f" id="cap${i}" ${canEdit() ? '' : 'readonly'}>${esc(c.text || '')}</textarea></div>`).join('')}
    </div>
    ${!pub.captions ? `<p class="small muted">Подписи Claude пишет в publish.json — попроси в чате справа: «напиши подписи для RU и EN».${canEdit() ? ' <button type="button" class="btn" id="mkCaps" style="margin-left: 6px">Написать подписи</button>' : ''}</p>` : ''}
    ${Array.isArray(pub.checks) && pub.checks.length ? `<div class="blk"><span class="lbl">Перед выкладкой</span>${pub.checks.map((c) => `<div class="row" style="gap: 10px"><span style="color: ${c.ok ? 'var(--green)' : 'var(--amber)'}; font-weight: 700">${c.ok ? '✓' : '!'}</span><span>${esc(c.text)}</span></div>`).join('')}</div>` : ''}
    ${cur && canEdit() ? `<div class="card" style="display: flex; flex-direction: column; gap: 12px"><b>Прислать пакет в Телеграм</b>
      <span class="small muted">В нужное время бот пришлёт тебе подпись, видео выбранной версии и обложку — выложишь с телефона за минуту. Мастер больше 50 МБ Телеграм от бота не пропускает — его скачай кнопкой «Скачать мастер».</span>
      <div class="row" style="gap: 10px; flex-wrap: wrap"><label class="small muted" for="pubAt">Когда</label><input class="f" type="datetime-local" id="pubAt" value="${local}" style="width: auto"><select class="f" id="pubVer" style="width: auto">${pubVers.map((v) => `<option value="${esc(v.v)}" ${v === pubDefault ? 'selected' : ''}>${esc(vName(v))}${isMaster(v) ? ' · мастер' : ''}</option>`).join('')}</select><select class="f" id="pubCap" style="width: auto">${caps.map((c, i) => `<option value="${i}">${esc(c.platform || 'Подпись ' + (i + 1))}</option>`).join('')}</select><button type="button" class="btn primary" id="pubGo">Запланировать</button></div></div>` : ''}
    ${data.outbox?.length ? `<div class="blk"><span class="lbl">Запланировано</span>${data.outbox.map((o) => `<div class="li"><span style="flex: 1">${new Date(o.at).toLocaleString('ru', {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})} · ${esc(o.version)}${o.platform ? ' · ' + esc(o.platform) : ''}</span><span class="small muted">${o.sent ? (o.error ? 'не ушло: ' + esc(o.error) : 'отправлено в Телеграм') : 'ждёт · ' + esc(o.by)}</span>${!o.sent && canEdit() ? `<button type="button" class="btn" data-cancel="${esc(o.id)}">Отменить</button>` : ''}</div>`).join('')}</div>` : ''}
  </div>`;
  if (cur) {
    const vid = cur.files.filter((f) => /\.(mp4|mov|webm)$/i.test(f.name)).sort((a, b) => a.size - b.size)[0];
    const cover = cur.files.find((f) => f.kind === 'cover' || f.kind === 'thumb');
    nxBlock(host.querySelector('.page'), {caps, kind: 'reel', seen: pub.seen, ask: canEdit() ? (t) => chatOf().say(t, 'Исправить: ' + t.slice(0, 60)) : null,
      base: {kind: 'reel', media: vid ? {type: 'video', url: vid.url} : null, cover: cover?.url, name: projName(), reel: data.template, grid: (OV?.reels || []).filter((r) => r.id !== id && r.thumb).slice(0, 8).map((r) => ({url: r.thumb, kind: 'reel'}))},
      onSeen: async (key) => { await post('/api/reel/seen', {reel: id, key}); drawStage(id, 'publish'); }});
  }
  // A master button per version that has one (RU v1, EN v2…), then the current copy and cover.
  const masterOf = (v) => v.files.filter((f) => f.kind === 'master').sort((a, b) => b.size - a.size)[0];
  const masters = data.versions.filter(isMaster);
  if (cur) $('#dlTop').innerHTML = masters.map((v) => `<a class="btn primary" href="${masterOf(v).url}&dl=1">Скачать мастер ${esc(v.v)} ↓</a>`).join('') +
    cur.files.filter((f) => ['copy', 'cover'].includes(f.kind)).map((f) => `<a class="btn" href="${f.url}&dl=1">${f.kind === 'cover' ? 'Обложка' : 'Видео ' + esc(cur.v)} ↓</a>`).join('');
  host.querySelectorAll('[data-pubmaster]').forEach((b) => (b.onclick = () => chatOf().say(`Собери мастер 1440p версии ${b.dataset.pubmaster} (без --draft, 1440×2560, CRF 15) из её снимка проекта versions/${b.dataset.pubmaster}/project-snapshot. Если снимка нет — восстанови эту версию по README (что в ней было) и сохранённым файлам проекта (например, тексты на другом языке) во временной копии project/, не трогая текущую версию. Скажи, когда будет готов.`, `Мастер ${b.dataset.pubmaster}`)));
  host.querySelectorAll('textarea.f').forEach((t, i) => (t.oninput = () => { host.querySelector(`[data-len="${i}"]`).textContent = t.value.length; }));
  $('#mkCaps')?.addEventListener('click', () => chatOf().say('Напиши подписи к этому рилсу для каждой площадки и проверку перед выкладкой в publish.json.', 'Написать подписи'));
  $('#pubGo')?.addEventListener('click', async () => {
    const i = Number($('#pubCap').value);
    const it = await post('/api/publish', {reel: id, version: $('#pubVer').value, at: new Date($('#pubAt').value).toISOString(), caption: $('#cap' + i).value, platform: caps[i].platform}).catch(() => null);
    toast(it ? 'Запланировано — бот пришлёт пакет в Телеграм' : 'Не получилось запланировать');
    drawStage(id, 'publish');
  });
  host.querySelectorAll('[data-cancel]').forEach((b) => (b.onclick = async () => { await post('/api/publish/cancel', {id: b.dataset.cancel}); drawStage(id, 'publish'); }));
}

// ---------- «Как увидят» (NX0–NX7): the release in the platform's own interface, before «Выложить» ----------
// One row per platform from the captions; each opens the platform's frames (web/preview.js) with
// the zones, the warnings and «Исправить» (a request to Claude); looking marks the row «видел».
function nxViews(platform, kind) {
  const ig = /insta/i.test(platform || ''), tg = /телеграм|telegram|канал|\btg\b/i.test(platform || '');
