  const fmtRow = (f) => `<div class="li"><span style="display: inline-flex; gap: 8px; align-items: center; width: 160px">${svg(f.kind === 'photo' || f.kind === 'text' || f.kind === 'carousel' || f.kind === 'reel' || f.kind === 'story' ? f.kind : 'photo', 15)}<b style="font-weight: 600">${esc(KIND[f.kind] || f.kind)}</b></span><span class="small muted" style="flex: 1">${esc([f.spec, f.note].filter(Boolean).join(' · '))}</span><span style="font-weight: 500">${f.perWeek ? f.perWeek + ' в неделю' : ''}</span></div>`;
  const week = () => `<div class="pweekwrap"><div style="display: grid; grid-template-columns: repeat(7, minmax(130px, 1fr)); gap: 10px">${DAYS.map((d, i) => `<div style="display: flex; flex-direction: column; gap: 8px"><span class="small muted" style="font-weight: 600">${d}</span>${slots.filter((x) => Number(x.day) === i + 1).sort((a, b) => String(a.time).localeCompare(String(b.time))).map((x) => `<span style="border-left: 4px solid ${rubricColor(st, x.rubric)}; background: var(--side); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.35; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; gap: 5px; align-items: center">${svg(x.kind || 'photo', 12)}<b style="font-weight: 600">${esc(rubricName(st, x.rubric))}</b></span><span class="muted">${esc([x.time, (plats.find((p) => p.id === x.platform) || {}).name].filter(Boolean).join(' · '))}</span></span>`).join('') || '<span class="small muted">—</span>'}</div>`).join('')}</div></div>`;
  const balance = () => { const total = slots.length; if (!total) return ''; return `<div class="blk"><span class="lbl">Сверка с долями рубрик · ${total} мест в неделю</span>${rubs.map((x) => { const have = slots.filter((s) => s.rubric === x.id || s.rubric === x.name).length; const want = Math.round((x.share || 0) * total / 100); return `<div class="li"><span style="width: 10px; height: 10px; border-radius: 3px; background: ${esc(x.color || '#A3A3A3')}"></span><span style="flex: 1">${esc(x.name)}</span><span class="small muted">${x.share ? x.share + ' %' : 'вне долей'}</span><span style="width: 90px; text-align: right; font-weight: 500; color: ${!x.share || Math.abs(have - want) < 1 ? 'var(--green)' : 'var(--amber)'}">${have} из ${want}${!x.share || have === want ? ' ✓' : have > want ? ' +' + (have - want) : ' −' + (want - have)}</span></div>`; }).join('')}</div>`; };
  let body;
  if (tab === 'brief' || tab === 'rules') body = `<div class="md" style="max-width: 860px">${md(tab === 'rules' ? k.playbook : k.brief) || '<p class="muted">Пусто.</p>'}</div>${tab === 'rules' ? '<p class="small muted">Правила Claude дописывает сам из твоих правок.</p>' : ''}`;
  else if (empty) body = `<div class="card" style="display: flex; flex-direction: column; gap: 12px; max-width: 720px"><b style="font-size: 17px">Стратегии ещё нет</b><span class="muted">Claude соберёт её из брифа и того, что уже вышло: площадки, рубрики с долями и цветами, ритм недели. Потом её видно в календаре и в колонке слева.</span><div>${ask('Собери стратегию из брифа')}</div></div>`;
  else if (tab === 'platforms') { const cur = plats.find((x) => x.id === sel) || plats[0]; body = `<div class="split" style="gap: 28px"><div style="flex: 0 0 260px; display: flex; flex-direction: column; gap: 4px">${plats.map((x) => `<a class="nav ${x === cur ? 'on' : ''}" href="#/knowledge/platforms/${esc(x.id)}" style="padding: 10px 12px"><span><b style="font-weight: 600">${esc(x.name)}</b><div class="small muted">${esc(x.account || '')}</div></span></a>`).join('')}<div style="padding-top: 6px">${ask('Добавь площадку')}</div></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px"><div><h2 style="font-size: 22px">${esc(cur.name)}</h2><span class="muted">${esc(cur.account || '')}</span></div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px">${[['Для кого', cur.audience], ['Язык и цены', cur.lang], ['Лучшее время', cur.time]].filter(([, v]) => v).map(([t, v]) => `<div><div class="small muted">${t}</div>${esc(v)}</div>`).join('')}</div>
        <div class="blk"><span class="lbl">Форматы на этой площадке</span>${(cur.formats || []).map(fmtRow).join('') || '<span class="small muted">—</span>'}</div>
        <div class="blk"><span class="lbl">Память площадки — Claude учитывает это сам</span>${(cur.memory || []).map((m) => `<div class="li">${esc(m)}</div>`).join('') || '<span class="small muted">Пока пусто — заполнится из того, что зашло.</span>'}</div></div></div>`; }
  else if (tab === 'rubrics') { const cur = rubs.find((x) => x.id === sel) || rubs[0]; const own = plan.items.filter((x) => x.rubric === cur.id || x.rubric === cur.name); body = `<div class="split" style="gap: 28px"><div style="flex: 0 0 260px; display: flex; flex-direction: column; gap: 4px">${rubs.map((x) => `<a class="nav ${x === cur ? 'on' : ''}" href="#/knowledge/rubrics/${esc(x.id)}" style="padding: 10px 12px"><span style="width: 12px; height: 12px; border-radius: 4px; background: ${esc(x.color || '#A3A3A3')}; flex: none"></span><span style="flex: 1"><b style="font-weight: 600">${esc(x.name)}</b><div class="small muted">${esc(x.why || '')}</div></span><span class="n">${x.share ? x.share + ' %' : '—'}</span></a>`).join('')}<div style="padding-top: 6px">${ask('Добавь рубрику')}</div></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px"><div class="row" style="gap: 12px"><span style="width: 16px; height: 16px; border-radius: 5px; background: ${esc(cur.color || '#A3A3A3')}"></span><h2 style="font-size: 22px">${esc(cur.name)}</h2><span class="muted">${cur.share ? cur.share + ' % плана' : 'вне долей'} · ${own.length} выпусков</span><a class="btn" style="margin-left: auto" href="#/rubric/${esc(cur.id)}">Все выпуски рубрики</a></div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px">${[['Зачем', cur.why], ['О чём', cur.about], ['Вид', cur.look]].filter(([, v]) => v).map(([t, v]) => `<div><div class="small muted">${t}</div>${esc(v)}</div>`).join('')}</div>
        <div class="blk"><span class="lbl">Куда идёт</span>${slots.filter((x) => x.rubric === cur.id || x.rubric === cur.name).map((x) => `<div class="li"><span style="width: 160px; font-weight: 600">${esc((plats.find((p) => p.id === x.platform) || {}).name || x.platform || '')}</span><span class="small muted" style="flex: 1; display: inline-flex; gap: 6px; align-items: center">${svg(x.kind || 'photo', 14)}${esc(KIND[x.kind] || '')}</span><span>${DAYS[(x.day || 1) - 1]} ${esc(x.time || '')}</span></div>`).join('') || '<span class="small muted">В ритме её пока нет.</span>'}</div>
        ${tplBlock(cur, plan.templates || [])}
        <div class="split" style="gap: 24px"><div class="blk" style="flex: 1"><span class="lbl">Правила рубрики</span>${(cur.rules || []).map((x) => `<div class="li">${x.lock ? '🔒 ' : ''}${esc(x.text || x)}</div>`).join('') || (cur.approve ? '' : '<span class="small muted">—</span>')}${cur.approve?.name ? `<div class="li">✓ Согласует по ссылке: <b>${esc(cur.approve.name)}</b>${cur.approve.note ? ` <span class="small muted">· ${esc(cur.approve.note)}</span>` : ''}<span class="small muted" style="margin-left: auto">ссылка на неделю, без входа</span></div>` : ''}</div><div class="blk" style="flex: 1"><span class="lbl">Серии</span>${(cur.series || []).map((x) => `<div class="li">${esc(x)}</div>`).join('') || '<span class="small muted">—</span>'}</div></div></div></div>`; }
  else if (tab === 'rhythm') body = `<div style="display: flex; flex-direction: column; gap: 18px"><div class="muted">${esc(st.rhythm?.season ? 'Сезон: ' + st.rhythm.season + '. ' : '')}Каждая ячейка становится пустым местом в Календаре — его Claude предлагает заполнить.</div>${week()}${balance()}<div class="row" style="gap: 8px">${ask('Поправь ритм под доли рубрик')}${ask('Сделай ритм на межсезонье')}</div></div>`;
  else body = `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
      <a class="card" href="#/knowledge/platforms" style="text-decoration: none; display: flex; flex-direction: column; gap: 10px"><b>Площадки · ${plats.length}</b>${plats.map((x) => `<div class="row" style="gap: 8px"><span style="flex: 1">${esc(x.name)}</span><span class="row small muted" style="gap: 6px">${(x.formats || []).map((f) => svg(f.kind || 'photo', 14)).join('')}</span></div>`).join('')}</a>
      <a class="card" href="#/knowledge/rubrics" style="text-decoration: none; display: flex; flex-direction: column; gap: 8px"><b>Рубрики · ${rubs.length}</b>${rubs.map((x) => `<div class="row" style="gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: ${esc(x.color || '#A3A3A3')}"></span><span style="flex: 1">${esc(x.name)}</span><span class="small muted">${x.share ? x.share + ' %' : 'вне долей'}</span></div>`).join('')}</a>
    </div><a class="card" href="#/knowledge/rhythm" style="text-decoration: none; display: flex; flex-direction: column; gap: 10px"><b>Ритм недели${st.rhythm?.season ? ' · ' + esc(st.rhythm.season) : ''}</b>${week()}</a>`;
  view.innerHTML = `<div class="work"><div class="rmain"><div style="padding: 28px 36px 0; display: flex; flex-direction: column; gap: 6px"><h1>Стратегия</h1><div class="muted" style="font-size: 15px">Где публикуем, о чём говорим и как часто. Из этого Claude собирает план; меняется редко.</div>
      <div class="utabs" role="tablist" style="margin-top: 14px">${tabs.map(([t, n]) => `<a href="#/knowledge/${t}" class="${t === tab ? 'on' : ''}">${n}</a>`).join('')}</div></div>
      <div style="flex: 1; overflow-y: auto; padding: 24px 36px">${body}</div></div>
    <aside class="chatcol" aria-label="Чат стратегии"><div class="chead" style="padding: 12px 16px"><b style="flex: 1">Чат стратегии</b></div><div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></aside></div>`;
  const box = chatBox('_project', {onDone: () => { sidebar(); vKnowledge(tab, sel); }});
  $('#chatHost').append(box);
  view.querySelectorAll('[data-ask]').forEach((b) => (b.onclick = () => box.say(b.dataset.ask + ' (strategy.json, STRATEGY.md).', b.dataset.ask)));
  $('#tplSel')?.addEventListener('change', async (e) => { await post('/api/strategy/template', {rubric: e.target.dataset.rubric, template: e.target.value || null}); route(); });
}

// Календарь (CleanPlan): a week of reels and posts from plan.json, empty rhythm slots, events; drag to a day.
// План (LeanPlan): ideas on dates first. A hairline month (or week) grid, each item with its rubric,
// format and stage; ideas dashed, Claude's proposals marked. Rubrics on the right.
async function vPlan(offset = 0, month = true) {
  title('План');
  const [plan] = await Promise.all([api('/api/plan'), loadItems(), loadIg()]);
  const st = plan.strategy || {};
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const first = new Date(today.getFullYear(), today.getMonth() + (month ? offset : 0), 1);
  let days;
  if (month) {
    const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
    const weeks = Math.ceil((((first.getDay() + 6) % 7) + new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate()) / 7);
    days = Array.from({length: weeks * 7}, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; });
  } else {
    const mon = new Date(today); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7) + offset * 7);
    days = Array.from({length: 7}, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
  }
  const all = ITEMS.items;
  // Posts found in Instagram without an item (offers first): a muted line in their day and a list aside.
  const found = (IG || []).flatMap((a) => [...(a.offers || []).map((o) => ({a, m: a.media.find((m) => m.code === o.code), offer: o})), ...(a.loose || []).map((c) => ({a, m: a.media.find((m) => m.code === c)}))]).filter((x) => x.m);
  const igLoose = (day) => found.filter((x) => ymd(new Date(x.m.timestamp)) === day);
  const onDay = (d) => all.filter((x) => x.at && x.at.slice(0, 10) === ymd(d)).sort((p, q) => p.at.localeCompare(q.at));
  const chip = (x) => `<a class="ln-chip ${x.stage === 'idea' ? 'idea' : ''}" draggable="${canEdit()}" data-id="${x.id}" href="${itemHref(x)}" data-peek="${x.id}" title="${esc(x.title)}">
      <span class="t"><span class="rsq" style="background: ${esc(itemRubric(x)?.color || '#A3A3A3')}"></span><span>${esc(x.title)}</span></span>
      <span class="m">${x.published?.length ? `<span title="Вышло в Instagram" style="display: inline-flex">${svg('ig', 12)}</span>` : ''}${FMT_NAME[x.format]?.toLowerCase() || ''}${x.proposed ? ' · предложение' : ''}${month ? '' : ' · ' + esc((x.at || '').slice(11, 16))}${x.proposed ? '' : sdot(x.stage)}</span>
      ${x.proposed && canEdit() ? `<span class="m" style="gap: 8px"><button type="button" class="ln-act" data-take="${x.id}">взять</button><button type="button" class="ln-act" data-other="${x.id}" style="color: var(--muted)">другую</button></span>` : ''}</a>`;
  const cells = days.map((d) => {
    const isToday = ymd(d) === ymd(today), out = month && d.getMonth() !== first.getMonth();
    const ev = (plan.events || []).concat(st.events || []).filter((e) => e.date === ymd(d));
    return `<div class="ln-cell${isToday ? ' today' : ''}${out ? ' out' : ''}" data-day="${ymd(d)}" style="${month ? '' : 'min-height: 420px'}"><span class="dn">${d.getDate()}</span>
      ${ev.map((e) => `<span style="font-size: 11px; background: var(--blueBg); color: var(--blue); border-radius: 6px; padding: 3px 6px; font-weight: 600">${esc(e.title)}</span>`).join('')}${onDay(d).map(chip).join('')}${igLoose(ymd(d)).length ? `<span class="muted" style="margin-top: auto; font-size: 11.5px; display: inline-flex; gap: 5px; align-items: center" title="Вышло в Instagram, в студии такого выпуска нет">${svg('ig', 12)}+${igLoose(ymd(d)).length} без выпуска</span>` : ''}</div>`;
  }).join('');
  const shown = all.filter((x) => !x.proposed && x.at && x.at.slice(0, 10) >= ymd(days[0]) && x.at.slice(0, 10) <= ymd(days.at(-1)));
  const undated = all.filter((x) => !x.at && !x.proposed && x.stage !== 'published');
  const mname = first.toLocaleDateString('ru', {month: 'long'});
  const gen = (m) => m.replace(/ь$/, 'я').replace(/т$/, 'та').replace(/й$/, 'я');
  const range = month ? mname : `${days[0].getDate()} ${gen(days[0].toLocaleDateString('ru', {month: 'long'}))} – ${days[6].getDate()} ${gen(days[6].toLocaleDateString('ru', {month: 'long'}))}`;
  const base = month ? '#/plan/m/' : '#/plan/w/';
  const rubs = ITEMS.rubrics.map((r) => `<a href="#/rubric/${esc(r.id)}" style="display: flex; flex-direction: column; gap: 3px; padding: 10px 0; border-bottom: 1px solid #F0F0F0; text-decoration: none; color: var(--ink)"><span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><span class="rsq" style="background: ${esc(r.color || '#A3A3A3')}"></span>${esc(r.name)}<span class="muted" style="margin-left: auto; font-weight: 400; font-size: 12px">${shown.filter((x) => itemRubric(x)?.id === r.id).length}</span></span>${r.about ? `<span class="muted" style="font-size: 12px; padding-left: 16px">${esc(r.about)}</span>` : ''}</a>`).join('');
  view.innerHTML = `<div style="display: flex; flex-direction: column; height: 100vh; min-width: 0">
    <div class="ln-top"><b>План</b><span>·</span><span>${range}</span>
      <span class="ln-seg" style="margin-left: 12px"><a href="#/plan/w" class="${month ? '' : 'on'}">Неделя</a><a href="#/plan" class="${month ? 'on' : ''}">Месяц</a></span>
      <span style="display: inline-flex; gap: 2px; margin-left: 6px"><a class="ln-btn g s" href="${base}${offset - 1}" aria-label="Назад">‹</a><a class="ln-btn g s" href="${base.slice(0, -1)}">Сейчас</a><a class="ln-btn g s" href="${base}${offset + 1}" aria-label="Вперёд">›</a></span>
      <span style="display: inline-flex; gap: 12px; margin-left: 8px">${LIFE.slice(0, 4).map(([k]) => `${sdot(k)}<span class="muted">${shown.filter((x) => x.stage === k).length}</span>`).join('')}</span>
      <span style="flex: 1"></span>${canEdit() ? `<button type="button" class="ln-btn p" id="lay">${svg('idea', 14)}Собрать контент-план</button>` : ''}</div>
    <div style="flex: 1; display: flex; min-height: 0">
      <div style="flex: 1; display: flex; flex-direction: column; padding: 16px 20px 20px; min-width: 0; overflow-y: auto">
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 12px; color: var(--muted); padding: 0 0 8px">${DAYS.map((d, i) => `<span style="padding-left: 8px">${month ? d.toLowerCase() : d.toLowerCase() + ' ' + days[i].getDate()}</span>`).join('')}</div>
        <div class="ln-grid">${cells}</div>
        <p class="small muted" style="margin: 12px 2px 0">Пунктир — пока только идея: дату и рубрику уже видно, снимать ещё нечего. Перетащи выпуск на другой день или в «Без даты».</p>
      </div>
      <aside class="ln-aside">
        <div style="display: flex; align-items: center"><b style="font-weight: 600">Рубрики</b><span class="muted" style="margin-left: auto; font-size: 12px">${month ? 'в этом месяце' : 'на этой неделе'}</span></div>
        <div>${rubs || '<span class="small muted">Рубрик пока нет.</span>'}</div>
        ${canEdit() ? '<button type="button" id="addRub" style="align-self: flex-start; border: 0; background: none; padding: 0; font: inherit; font-size: 13px; color: #2F6FEB; font-weight: 600; cursor: pointer">+ Рубрика</button>' : ''}
        <div class="ln-drop" data-day="" style="display: flex; flex-direction: column; gap: 6px; border-radius: 10px; padding: 2px"><div style="display: flex; align-items: center; margin-top: 8px"><b style="font-weight: 600">Без даты</b><span class="muted" style="margin-left: auto; font-size: 12px">${undated.length}</span></div>${undated.slice(0, 6).map(chip).join('')}${undated.length > 6 ? `<a class="small muted" href="#/all">ещё ${undated.length - 6} — в Выпусках</a>` : ''}</div>
        ${found.length ? `<div style="display: flex; flex-direction: column; gap: 2px; margin-top: 8px"><b style="font-weight: 600">Найдено в Instagram</b><span class="small muted" style="line-height: 1.5; padding-bottom: 4px">${found.length} без выпуска в студии. Привяжите свои — остальные можно убрать.</span>
          ${found.slice(0, 5).map(({a, m, offer}) => `<div style="display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F0F0F0"><a href="${esc(m.permalink)}" target="_blank" rel="noopener" style="flex: none"><img src="${esc(m.thumb || '')}" alt="" style="width: 40px; height: 54px; object-fit: cover; border-radius: 6px; display: block"></a>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">${esc((m.caption || 'без подписи').split('\n')[0])}</span><span class="muted" style="font-size: 12px">@${esc(a.account)} · ${new Date(m.timestamp).toLocaleDateString('ru-RU', {day: 'numeric', month: 'short'})}</span>
            ${!canEdit() ? '' : offer ? `<span style="font-size: 12.5px; color: var(--ink2)">похоже на «${esc(offer.title)}»</span><span class="row" style="gap: 10px"><button type="button" class="ln-act" data-igl="${esc(a.account)}|${esc(m.code)}|${esc(offer.item)}">привязать</button><button type="button" class="ln-act" data-igh="${esc(a.account)}|${esc(m.code)}" style="color: var(--muted)">не из студии</button></span>`
              : `<span class="row" style="gap: 10px"><select class="ln-act" data-igs="${esc(a.account)}|${esc(m.code)}" aria-label="Привязать к выпуску" style="max-width: 150px"><option value="">привязать к…</option>${all.filter((x) => !x.proposed && x.stage !== 'idea' && !(x.published || []).some((p) => String(p.account || '').replace(/^@/, '').toLowerCase() === a.account)).slice(-30).reverse().map((x) => `<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</select><button type="button" class="ln-act" data-igh="${esc(a.account)}|${esc(m.code)}" style="color: var(--muted)">не из студии</button></span>`}</span></div>`).join('')}
          ${found.length > 5 ? `<span class="small muted" style="padding-top: 6px">и ещё ${found.length - 5}</span>` : ''}</div>` : ''}
        <a href="#/plan/setup" class="muted" style="font-size: 13px; line-height: 1.5; margin-top: auto; display: inline-flex; gap: 6px; align-items: center; text-decoration: none">${svg('sliders', 14)}Площадки и ритм</a>
      </aside>
    </div></div>`;
  const redraw = () => vPlan(offset, month);
  const igPost = async (b, msg) => { await post('/api/instagram/link', b); await Promise.all([loadIg(), loadItems(true)]); toast(msg); redraw(); };
  view.querySelectorAll('[data-igl]').forEach((b) => (b.onclick = () => { const [account, code, item] = b.dataset.igl.split('|'); igPost({account, code, item}, 'Привязано: вышло в Instagram'); }));
  view.querySelectorAll('[data-igs]').forEach((b) => (b.onchange = () => { const [account, code] = b.dataset.igs.split('|'); if (b.value) igPost({account, code, item: b.value}, 'Привязано: вышло в Instagram'); }));
  view.querySelectorAll('[data-igh]').forEach((b) => (b.onclick = () => { const [account, code] = b.dataset.igh.split('|'); igPost({account, code, hide: true}, 'Убрано из найденного'); }));
  $('#lay')?.addEventListener('click', () => { sessionStorage.setItem('planLay', '1'); location.hash = '#/plan/draft'; });
  $('#addRub')?.addEventListener('click', async () => { const name = prompt('Название рубрики'); if (!name?.trim()) return; const {rubric} = await post('/api/strategy/edit', {rubric: {name}}); location.hash = '#/rubric/' + rubric.id; });
  view.querySelectorAll('[data-take]').forEach((b) => (b.onclick = async (e) => { e.preventDefault(); e.stopPropagation(); b.disabled = true; await post('/api/items/set', {id: b.dataset.take, take: true}); toast('Взято в план'); redraw(); }));
  view.querySelectorAll('[data-other]').forEach((b) => (b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); const x = all.find((y) => y.id === b.dataset.other); sessionStorage.setItem('planAsk', JSON.stringify({text: `Замени идею «${x.title}» на ${(x.at || '').slice(0, 10)} другой — той же рубрики, не повторяя уже вышедшее. Старую убери из ideas.md, новую добавь в «My ideas» с теми же Date: и Rubric:.`, shown: `Другую вместо «${x.title}»`})); location.hash = '#/plan/draft'; }));
  let drag = null;
  view.querySelectorAll('.ln-chip').forEach((c) => { c.ondragstart = () => { drag = c.dataset.id; }; });
  view.querySelectorAll('.ln-cell, .ln-drop').forEach((d) => {
    d.ondragover = (e) => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = async (e) => {
      e.preventDefault(); d.classList.remove('over');
      if (!drag || !canEdit()) return;
      const it = all.find((x) => x.id === drag);
      const time = it?.at?.slice(11, 16) || (st.rhythm?.slots || []).find((s) => s.rubric === it?.rubric)?.time || '19:00';
      await post('/api/items/set', {id: drag, at: d.dataset.day ? `${d.dataset.day}T${time}` : null});
      redraw();
    };
  });
}

// Собрать контент-план (handbook/LEAN.md, кусок 15): what the plan is built from on the left — period,
// releases a week per platform, rubric shares, what to keep in mind; Claude's proposals on a day grid,
// each with why it is on that day; «Почему так» and edits in words on the right.
async function vPlanDraft() {
  title('Собрать контент-план');
  const [plan, mem] = await Promise.all([api('/api/plan'), api('/api/memory').catch(() => ({})), loadItems()]);
  const st = plan.strategy || {}, plats = st.platforms || [], ed = canEdit();
  const KEY = 'build:' + P;
  let opt = {days: 14, events: true, questions: true, fresh: true, facts: true, wish: ''};
  try { opt = {...opt, ...JSON.parse(localStorage.getItem(KEY) || '{}')}; } catch {}
  const keep = () => { try { localStorage.setItem(KEY, JSON.stringify(opt)); } catch {} };
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const to = new Date(today); to.setDate(today.getDate() + opt.days - 1);
  const mon = new Date(today); mon.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const days = Array.from({length: Math.ceil((opt.days + (today.getDay() + 6) % 7) / 7) * 7}, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
  const inRange = (x) => x.at && x.at.slice(0, 10) >= ymd(today) && x.at.slice(0, 10) <= ymd(to);
  const list = ITEMS.items.filter((x) => x.proposed && inRange(x)).sort((p, q) => p.at.localeCompare(q.at));
  const taken = ITEMS.items.filter((x) => !x.proposed && inRange(x));
  const events = (plan.events || []).concat(st.events || []);
  const per = (p) => p.perWeek ?? (p.formats || []).reduce((n, f) => n + (f.perWeek || 0), 0);
  const weekly = plats.reduce((n, p) => n + per(p), 0);
  const want = Math.round(weekly * opt.days / 7);
  const rubs = ITEMS.rubrics;
  const shareSum = rubs.reduce((n, r) => n + (r.share || 0), 0);
  const qn = (mem.questions || []).length;
  const gen = (m) => m.replace(/ь$/, 'я').replace(/т$/, 'та').replace(/й$/, 'я');
  const range = `${today.getDate()} ${gen(today.toLocaleDateString('ru', {month: 'long'}))} – ${to.getDate()} ${gen(to.toLocaleDateString('ru', {month: 'long'}))}`;
  const chip = (x) => `<div class="ln-chip ${x.proposed ? 'idea' : ''}" data-peek="${x.id}" title="${esc(x.title)}" style="cursor: default">
      <span class="t"><span class="rsq" style="background: ${esc(itemRubric(x)?.color || '#A3A3A3')}"></span><span>${esc(x.title)}</span></span>
      <span class="m">${svg(FMT_ICON[x.format], 11)}${FMT_NAME[x.format]?.toLowerCase() || ''}${x.proposed ? '' : ' · в плане'}</span>
      ${x.proposed && x.idea?.why ? `<span class="bwhy">${esc(x.idea.why)}</span>` : ''}
      ${x.proposed && ed ? `<span class="m" style="gap: 10px"><button type="button" class="ln-act" data-take="${x.id}">взять</button><button type="button" class="ln-act" data-other="${x.id}" style="color: var(--muted)">другую</button></span>` : ''}</div>`;
  const cells = days.map((d) => {
    const out = ymd(d) < ymd(today) || ymd(d) > ymd(to), ev = events.filter((e) => e.date === ymd(d));
    const here = [...taken, ...list].filter((x) => x.at.slice(0, 10) === ymd(d));
    return `<div class="ln-cell${ymd(d) === ymd(today) ? ' today' : ''}${out ? ' out' : ''}${ev.length ? ' ev' : ''}" style="min-height: 150px"><span class="dn">${d.getDate()}</span>
      ${ev.map((e) => `<span class="bev">${esc(e.title)}</span>`).join('')}${out ? '' : here.map(chip).join('')}</div>`;
  }).join('');
  const check = (k, label, note) => `<label class="bchk"><input type="checkbox" data-opt="${k}" ${opt[k] ? 'checked' : ''} ${ed ? '' : 'disabled'}><span><b>${label}</b><span class="small muted">${note}</span></span></label>`;
  view.innerHTML = `<div class="work"><div class="rmain">
    <div class="ln-top"><a href="#/plan" style="color: var(--muted); text-decoration: none">План</a><span>›</span><b>Собрать контент-план</b><span>·</span><span>${range}</span><span style="flex: 1"></span><a class="ln-btn g" href="#/plan">Готово</a>${list.length && ed ? `<button type="button" class="ln-btn p" id="takeAll">Взять все ${list.length} в план</button>` : ''}</div>
    <div style="flex: 1; display: flex; min-height: 0">
      <aside class="bset" aria-label="Из чего собираем">
        <b style="font-size: 15px">Из чего собираем</b>
        <div class="blk2"><span class="lbl">Период</span><span class="ln-seg">${[[7, 'Неделя'], [14, '2 недели'], [28, 'Месяц']].map(([n, t]) => `<button type="button" data-days="${n}" class="${opt.days === n ? 'on' : ''}">${t}</button>`).join('')}</span></div>
        <div class="blk2"><span class="lbl">Выпусков в неделю · всего ${weekly}</span>${plats.map((p) => `<div class="brow"><span style="flex: 1; min-width: 0"><b style="font-weight: 600">${esc(p.name)}</b>${p.account ? ` <span class="small muted">${esc(p.account)}</span>` : ''}</span>${ed ? `<button type="button" class="ln-btn s" data-pl="${esc(p.id)}" data-d="-1" aria-label="Меньше">−</button>` : ''}<b style="width: 22px; text-align: center">${per(p)}</b>${ed ? `<button type="button" class="ln-btn s" data-pl="${esc(p.id)}" data-d="1" aria-label="Больше">+</button>` : ''}</div>`).join('') || '<span class="small muted">Площадок нет — <a href="#/plan/setup">добавить</a>.</span>'}</div>
        <div class="blk2"><span class="lbl">Доли рубрик${shareSum && shareSum !== 100 ? ` · сумма ${shareSum} %` : ''}</span>${rubs.map((r) => `<div class="brow"><span class="rsq" style="background: ${esc(r.color || '#A3A3A3')}"></span><span style="flex: 0 0 92px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${esc(r.name)}</span><input type="range" min="0" max="100" step="5" value="${r.share || 0}" data-share="${esc(r.id)}" ${ed ? '' : 'disabled'} aria-label="Доля рубрики ${esc(r.name)}" style="flex: 1; min-width: 0; accent-color: ${esc(r.color || '#171717')}"><b class="bpct" style="width: 40px; text-align: right">${r.share || 0} %</b></div>`).join('') || '<span class="small muted">Рубрик пока нет.</span>'}</div>
        <div class="blk2"><span class="lbl">Учесть</span>
          ${check('events', 'Даты сезона и события', events.length ? events.slice(0, 3).map((e) => esc(e.title)).join(', ') : 'в плане событий нет')}
          ${check('questions', 'Вопросы клиентов', qn ? `${qn} в памяти` : 'в памяти пока нет')}
          ${check('facts', 'Факты и цены', 'сверять цифры с памятью')}
          ${check('fresh', 'Не повторять вышедшее', 'темы и крючки прошлых выпусков')}
          <textarea class="f" id="bWish" rows="3" placeholder="Своё пожелание: «больше про детей», «в пятницу без цен»…" ${ed ? '' : 'readonly'} style="font-size: 13px; resize: vertical">${esc(opt.wish || '')}</textarea></div>
        ${ed ? `<button type="button" class="ln-btn p" id="bGo" style="justify-content: center; height: 40px">${svg('idea', 14)}${list.length ? 'Пересобрать' : 'Собрать'} · ~${want} ${want === 1 ? 'выпуск' : want > 1 && want < 5 ? 'выпуска' : 'выпусков'}</button>` : ''}
      </aside>
      <div style="flex: 1; overflow-y: auto; padding: 18px 22px; min-width: 0">
        <div style="display: flex; align-items: baseline; gap: 12px; padding-bottom: 12px"><div class="mh1" role="heading" aria-level="1">${list.length ? `${list.length} ${list.length === 1 ? 'идея' : list.length < 5 ? 'идеи' : 'идей'} на ${opt.days === 7 ? 'неделю' : opt.days === 14 ? 'две недели' : 'месяц'}` : 'Предложений на этот период пока нет'}</div><span class="muted" style="font-size: 13px">${taken.length ? `и ${taken.length} уже в плане` : ''}</span></div>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 12px; color: var(--muted); padding: 0 0 8px">${DAYS.map((d) => `<span style="padding-left: 8px">${d.toLowerCase()}</span>`).join('')}</div>
        <div class="ln-grid bgrid">${cells}</div>
        <p class="small muted" style="margin: 12px 2px 0">Пунктир — предложение Claude, под ним почему оно в этот день. Сплошные уже в плане. Взятое переходит в План и остаётся идеей, пока не начнёте снимать.</p>
      </div></div></div>
    <aside class="chatcol" aria-label="Почему так"><div class="chead" style="padding: 12px 16px"><b style="flex: 1">Почему так</b><span class="small muted">поправить словами</span></div><div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></aside></div>`;
  const box = chatBox('_project', {onDone: () => { sidebar(); vPlanDraft(); }});
  $('#chatHost').append(box);
  const buildText = () => {
    const shares = rubs.filter((r) => r.share).map((r) => `${r.name} (id ${r.id}) — ${r.share} %`).join(', ');
    const counts = plats.map((p) => `${p.name} — ${per(p)} в неделю`).join(', ');
    const mind = [opt.events && 'даты сезона и события из plan.json и strategy.json', opt.questions && 'вопросы клиентов из memory.json → questions', opt.facts && 'цифры и цены только из facts.json', opt.fresh && 'не повторять темы и крючки уже вышедших и стоящих в плане выпусков'].filter(Boolean);
    return `Собери контент-план с ${ymd(today)} по ${ymd(to)}. Площадки и сколько выпусков в неделю: ${counts || 'по strategy.json'}. Доли рубрик: ${shares || 'по strategy.json'}.${mind.length ? ' Учти: ' + mind.join('; ') + '.' : ''}${opt.wish ? ` Пожелание: ${opt.wish}.` : ''} Это только концепции — снимать пока ничего не надо. Твои ещё не взятые предложения на этот период убери из ideas.md и сложи заново. Каждую идею добавь в ideas.md в «My ideas» (Format:, Hook:, Plot:) и ещё три строки: «Date: YYYY-MM-DDTHH:MM», «Rubric: <id рубрики>» и «Why: <одна фраза — почему она в этот день>». Потом здесь коротко: как разложил по дням и почему так.`;
  };
  view.querySelectorAll('[data-days]').forEach((b) => (b.onclick = () => { opt.days = Number(b.dataset.days); keep(); vPlanDraft(); }));
  view.querySelectorAll('[data-opt]').forEach((b) => (b.onchange = () => { opt[b.dataset.opt] = b.checked; keep(); }));
  $('#bWish')?.addEventListener('change', (e) => { opt.wish = e.target.value.trim(); keep(); });
  view.querySelectorAll('[data-pl]').forEach((b) => (b.onclick = async () => { const p = plats.find((x) => x.id === b.dataset.pl); await post('/api/strategy/edit', {platform: {id: p.id, perWeek: Math.max(0, per(p) + Number(b.dataset.d))}}); vPlanDraft(); }));
  view.querySelectorAll('[data-share]').forEach((b) => {
    b.oninput = () => { b.parentElement.querySelector('.bpct').textContent = b.value + ' %'; };
    b.onchange = () => post('/api/strategy/edit', {rubric: {id: b.dataset.share, share: Number(b.value)}}).then(() => vPlanDraft());
  });
  $('#bGo')?.addEventListener('click', () => { opt.wish = $('#bWish').value.trim(); keep(); box.say(buildText(), `${list.length ? 'Пересобрать' : 'Собрать'} контент-план · ${range}`); });
  view.querySelectorAll('[data-take]').forEach((b) => (b.onclick = async (e) => { e.stopPropagation(); b.disabled = true; await post('/api/items/set', {id: b.dataset.take, take: true}); toast('Взято в план'); vPlanDraft(); }));
  view.querySelectorAll('[data-other]').forEach((b) => (b.onclick = (e) => { e.stopPropagation(); const x = list.find((y) => y.id === b.dataset.other); box.say(`Замени идею «${x.title}» на ${x.at.slice(0, 10)} другой — той же рубрики, не повторяя уже вышедшее. Старую убери из ideas.md, новую добавь в «My ideas» с теми же Date: и Rubric: и новой строкой Why:.`, `Другую вместо «${x.title}»`); }));
  $('#takeAll')?.addEventListener('click', async (e) => { e.target.disabled = true; for (const x of list) await post('/api/items/set', {id: x.id, take: true}); toast(`Взято ${list.length}`); location.hash = '#/plan'; });
  await box.ready;
  const ask = sessionStorage.getItem('planAsk');
  if (ask) { sessionStorage.removeItem('planAsk'); const {text, shown} = JSON.parse(ask); box.say(text, shown); }
  else if (sessionStorage.getItem('planLay')) { sessionStorage.removeItem('planLay'); if (ed) $('#bGo')?.focus(); }
}

// Рубрика (handbook/LEAN.md, кусок 15): one page with tabs — Обзор (formula, how it looks, what is
// next, what Claude keeps), Шаблоны (the studio's templates by seconds), Референсы (what we take from
// whom), Выпуски and Правила. Everything lives on the rubric in strategy.json.
const REF_TAKES = [['hook', 'крючок'], ['edit', 'монтаж'], ['plates', 'плашки'], ['delivery', 'подача'], ['sound', 'звук'], ['cover', 'обложка']];
const KIND_COLOR = {hook: '#C43F34', photo: '#46708A', clip: '#46708A', base: '#E5A33C', item: '#E5A33C', total: '#151612', tip: '#E5A33C', compare: '#E5A33C', question: '#C43F34', answer: '#46708A', fact: '#E5A33C', cta: '#2E8A4F'};
async function vRubric(id, tab = 'overview', sub) {
  const [plan] = await Promise.all([api('/api/plan'), loadItems()]);
  const st = plan.strategy || {}, r = (st.rubrics || []).find((x) => x.id === id);
  if (!r) { view.innerHTML = '<div class="page"><p class="muted">Такой рубрики нет. <a href="#/plan">План</a></p></div>'; return; }
  title(r.name);
  const ed = canEdit(), base = '#/rubric/' + r.id;
  const tpls = plan.templates || [], kinds = plan.kinds || {}, tpl = tpls.find((x) => x.id === r.template);
  const refs = r.refs || [], rules = r.rules || [];
  const mine = ITEMS.items.filter((x) => itemRubric(x)?.id === r.id);
  const own = mine.filter((x) => !x.proposed).sort((p, q) => String(q.at || '').localeCompare(String(p.at || '')));
  const ideas = mine.filter((x) => x.proposed).length;
  const now = new Date().toISOString().slice(0, 16);
  const next = mine.filter((x) => x.stage !== 'published' && (!x.at || x.at >= now)).sort((p, q) => String(p.at || '9').localeCompare(String(q.at || '9')));
  const looks = own.filter((x) => x.thumb).slice(0, 6);
  const DAYNAMES = ['по понедельникам', 'по вторникам', 'по средам', 'по четвергам', 'по пятницам', 'по субботам', 'по воскресеньям'];
  const plain = 'border: 0; padding: 0; font: inherit; font-size: 15px; background: none; color: var(--ink); width: 100%';
  const card = (label, inner) => `<div style="border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0"><span class="lbl">${label}</span>${inner}</div>`;
  const tabs = [['overview', 'Обзор'], ['templates', 'Шаблоны' + (tpl ? ' · 1' : '')], ['refs', 'Референсы · ' + refs.length], ['issues', 'Выпуски · ' + own.length], ['rules', 'Правила · ' + rules.length]];
  const sec = (k) => Math.round((kinds[k.kind]?.dur || 3) * (k.repeat ? (k.repeat[0] + k.repeat[1]) / 2 : 1));
  const tplLen = (t) => t.scenes.reduce((n, k) => n + sec(k), 0);
  const issueRow = (x) => `<a class="ln-li" href="${itemHref(x)}" data-peek="${x.id}"><span class="muted" style="display: inline-flex">${svg(FMT_ICON[x.format], 15)}</span><span style="flex: 0 0 380px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${esc(x.title)}</span><span class="s" style="flex: 1">${whenText(x.at)}</span>${x.proposed ? '<span class="small muted">предложение</span>' : sdot(x.stage)}</a>`;
  const refMedia = (x, h) => {
    const isVid = /\.(mp4|mov|webm|m4v)(&|$)/i.test(x.url) || /\.(mp4|mov|webm|m4v)$/i.test(x.name || '');
    const isImg = /\.(jpe?g|png|webp|gif|heic)(&|$)/i.test(x.url) || /\.(jpe?g|png|webp|gif)$/i.test(x.name || '');
    if (x.file && isVid) return `<video src="${esc(x.url)}" muted playsinline preload="metadata" style="width: 100%; height: ${h}px; object-fit: cover; border-radius: 10px; background: #111; display: block"></video>`;
    if (x.file && isImg) return `<span style="display: block; height: ${h}px; border-radius: 10px; background: #EEE center / cover url('${esc(x.url)}')"></span>`;
    let host = ''; try { host = new URL(x.url, location.href).hostname.replace(/^www\./, ''); } catch {}
    return `<span style="display: grid; place-items: center; height: ${h}px; border-radius: 10px; background: #151612; color: #fff; font-size: 13px; text-align: center; padding: 10px">${svg(/instagram|tiktok|youtu/.test(host) ? 'reel' : 'link', 22)}<span style="opacity: .8">${esc(host || 'ссылка')}</span></span>`;
  };
  const takeChips = (x) => (x.takes || []).map((t) => `<span class="rtk">${REF_TAKES.find(([k]) => k === t)?.[1] || t}</span>`).join('');
  const phone = (inner) => window.Preview ? Preview.phone(inner, {w: 220}) : '';
  const tplPhone = (t) => {
    const bg = 'background: linear-gradient(165deg, #46708A 0%, #2B4556 45%, #151612 100%)';
    const first = kinds[t.scenes[0]?.kind]?.label || 'Хук';
    return phone(`<div style="position: absolute; inset: 0; ${bg}; display: flex; flex-direction: column; justify-content: flex-end; padding: 18% 9%; gap: 8px; font-family: Geist, system-ui, sans-serif">
      <span style="align-self: flex-start; background: #C43F34; color: #fff; font-weight: 600; font-size: 11px; border-radius: 999px; padding: 4px 10px">${esc(r.name)}</span>
      <span style="background: #fff; color: #151612; font-weight: 600; letter-spacing: -0.04em; font-size: 20px; line-height: 1.1; border-radius: 14px; padding: 10px 12px">${esc(next[0]?.idea?.hook || next[0]?.title || first)}</span>
      <span style="color: #fff; font-size: 11px; opacity: .85">${esc(t.name)} · ${tplLen(t)} с</span></div>`);
  };
  let body = '', aside = '';
  if (tab === 'overview') {
    body = `<div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px">

// Память (handbook/LEAN.md, кусок 2): what Claude knows and checks in every release.
// For now its tabs are the old Settings and Strategy ones; facts with dates come in кусок 9.
const MEMORY_TABS = ['overview', 'facts', 'brief', 'questions', 'voice', 'rules', 'ds', 'files', 'ask'];
// «О проекте» (M5): brief.md by its «## » sections, each a card; the sections Claude expects but
// does not have are gaps with «Ответить» — a guiding question by voice.
const BRIEF = [['who', 'Кто мы', /кто мы|о нас|о проекте|^что$/i], ['for', 'Для кого', /для кого|аудитор|клиент/i], ['sell', 'Что продаём', /продаём|продаем|услуг|что делаем/i], ['diff', 'Чем отличаемся', /отлича|почему мы|преимущ/i],
  ['season', 'Сезон', /сезон|даты/i], ['where', 'Площадки', /площадк|аккаунт|соцсет/i], ['works', 'Что работает', /работает|заходит/i], ['goal', 'Цели на сезон', /цел|делает после/i], ['never', 'Чего не обещаем', /не обещ|нельзя|не дела/i], ['like', 'Чьи аккаунты нравятся', /нрав|пример|референс/i]];
// Sections are «## » headings; an onboarding brief's «- **Что:** …» lines count as sections too.
const briefParts = (text) => String(text || '').split(/^## +/m).flatMap((p, i) => {
  if (!i) return [...p.matchAll(/^\s*[-*] \*\*([^*]+?)\*\*:?\s*(.+)$/gm)].map((m) => ({head: m[1].replace(/:$/, ''), body: m[2]}));
  const j = p.indexOf('\n');
  return [{head: (j < 0 ? p : p.slice(0, j)).trim(), body: j < 0 ? '' : p.slice(j + 1).trim()}];
});
// tokens.json from the site ({colors, fonts, radii}) or the reels' own ({color, font, radius}) — one shape.
const normTok = (t) => {
  if (!t) return null;
  const hex = (v) => typeof v === 'string' ? v : v?.hex || v?.value || '';
  const colors = Array.isArray(t.colors) ? t.colors : Object.entries(t.color || {}).filter(([, v]) => /^#/.test(hex(v))).map(([k, v]) => ({name: k, hex: hex(v), role: v?.role || ''}));
  const fonts = Array.isArray(t.fonts) ? t.fonts : Object.entries(t.font || {}).map(([k, v]) => { const m = /^(.*?)\s+(\d+)/.exec(String(v)); return {family: m ? m[1] : String(v), weight: m ? m[2] : '', role: k}; });
  const radii = Array.isArray(t.radii) ? t.radii : Object.values(t.radius || {}).filter((x) => Number.isFinite(x));
  return {...t, colors, fonts, radii, site: t.site || ''};
};
const briefGaps = (text) => { const parts = briefParts(text); return BRIEF.filter(([, , re]) => !parts.some((p) => re.test(p.head) && p.body)); };
const memSay = (text, shown) => { sessionStorage.setItem('firstMsg:_project', JSON.stringify({text, shown})); location.hash = '#/chat/_project'; };

      ${!m.brief.trim() ? '<p class="muted">Пусто. Ответьте голосом на вопросы или бросьте ссылку на сайт в Обзоре — Claude запишет.</p>' : ''}</div>

      ${m.sources.slice(0, 8).map((x) => `<div class="ln-li" style="padding: 9px 2px; font-size: 13px">${svg(x.kind === 'link' ? 'globe' : x.kind === 'voice' ? 'mic' : 'clip', 14)}<span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${esc(x.name)}</span><span class="r">${new Date(x.at).toLocaleDateString('ru', {day: 'numeric', month: 'short'})}</span></div>`).join('') || '<span class="small muted">Источники появятся, когда вы что-то загрузите или ответите голосом.</span>'}

    view.querySelectorAll('[data-at]').forEach((b) => (b.onclick = () => { stop(); at = Number(b.dataset.at); draw(); }));

// Instagram in Подключения (IG1/IG2): one card per account — not connected, a snapshot, refreshing,
// refreshed or an error, in words; «Обновить сейчас» asks the server and watches until it is done.
function igCards() {
  const accs = IG || [];
  if (!accs.length) return `<div style="border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; display: flex; align-items: center; gap: 16px">${svg('ig', 22)}<span style="flex: 1; display: flex; flex-direction: column; gap: 4px"><b style="font-weight: 600">Instagram не подключён</b><span class="small muted">Студия не знает, что вышло: «Вышло» ставите вручную, ссылку вставляете сами.</span></span><a class="ln-btn p" href="${IG_HOWTO}" target="_blank" rel="noopener">Как подключить</a></div>`;
  const card = (a) => {
    const state = a.refreshing ? `<span style="font-weight: 600">обновляем…</span>`
      : a.error ? `<span style="color: #B42318; font-weight: 600">не обновилось — ${esc(a.error.replace(/^Instagram: /, ''))}</span><span class="small muted">данные от ${igAgo(a.fetchedAt)}</span>`
      : a.connected ? `<span style="color: #2E8A4F; font-weight: 600">${svg('check', 13)} подключён</span><span class="small muted" style="white-space: nowrap">обновлено ${igAgo(a.fetchedAt)}</span>`
      : `<span style="font-weight: 600">снимок от ${new Date(a.fetchedAt).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long'})}</span><span class="small muted">сам не обновляется</span>`;
    const btn = !canEdit() ? '' : a.connected ? `<button type="button" class="ln-btn" data-igref="${esc(a.account)}" ${a.refreshing ? 'disabled' : ''}>${svg('refresh', 14)}${a.refreshing ? 'Обновляется…' : a.error ? 'Попробовать ещё' : 'Обновить сейчас'}</button>`
      : `<a class="ln-btn" href="${IG_HOWTO}" target="_blank" rel="noopener">Подключить</a>`;
    const own = (a.linked || []).length, loose = (a.loose || []).length, offers = (a.offers || []).length;
    return `<div style="border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 18px; min-width: 0">
      <div class="row" style="gap: 14px">${a.avatar ? `<img src="${esc(a.avatar)}" alt="" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line)">` : ''}<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><b style="font-size: 16px; font-weight: 600">@${esc(a.account)}</b><span class="small muted">${esc(a.name || '')}</span></span><a class="ln-btn g s" href="https://www.instagram.com/${esc(a.account)}/" target="_blank" rel="noopener" title="Открыть в Instagram" aria-label="Открыть в Instagram">${svg('link', 15)}</a></div>
      <div class="row" style="gap: 22px; flex-wrap: wrap; font-size: 14px"><span><b>${Number(a.followers || 0).toLocaleString('ru-RU')}</b> <span class="muted">подписчиков</span></span><span><b>${Number(a.posts || 0).toLocaleString('ru-RU')}</b> <span class="muted">публикаций</span></span><span class="muted">${a.lang === 'en' ? 'английский' : 'русский'}</span></div>
      <div style="display: flex; gap: 8px; overflow: hidden; flex-wrap: nowrap">${a.media.slice(0, 7).map((m) => `<a href="${esc(m.permalink)}" target="_blank" rel="noopener"><img src="${esc(m.thumb || '')}" alt="" style="width: 50px; height: 68px; object-fit: cover; border-radius: 6px; display: block; background: var(--soft); flex: none"></a>`).join('')}</div>
      <span class="small muted" style="line-height: 1.5">Из ${a.media.length} последних ${own} связаны с выпусками${offers ? `, ${offers} похожи на выпуски` : ''}${loose ? `, <a href="#/plan" style="color: var(--ink)">${loose} без выпуска</a>` : ''}.</span>
      <div class="row" style="gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; flex-wrap: wrap"><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px">${state}</span>${btn}</div>
    </div>`;
  };
  return `<div style="display: flex; flex-direction: column; gap: 6px; padding: 4px 0 10px"><b style="font-size: 18px; font-weight: 600">Instagram</b><span class="muted" style="font-size: 14px">Студия видит, что вышло, и подтягивает лайки и просмотры. Выкладываете по-прежнему вы — пакетом из бота.</span></div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px">${accs.map(card).join('')}</div>
    <span class="small muted" style="padding: 2px 0 14px">${accs.some((a) => a.connected) ? 'Обновляется само каждые 3 часа. ' : ''}Доступ даёт официальный Instagram API; ключ хранится на сервере и нигде не показывается. <a href="${IG_HOWTO}" target="_blank" rel="noopener" style="color: var(--ink)">Как подключить</a></span>
    ${isOwner() ? `<form id="igTok" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 0 0 16px"><label class="small muted" for="igTokIn">Ключ доступа из Meta — для каждого аккаунта свой:</label><input class="f" id="igTokIn" type="password" autocomplete="off" placeholder="IGAA…" style="flex: 1; min-width: 220px; max-width: 420px"><button type="submit" class="ln-btn">Подключить</button></form>` : ''}
    <span class="lbl" style="padding-top: 6px">Остальные подключения</span>`;
}
function igBind(redraw) {
  const f = $('#igTok');
  if (f) f.onsubmit = async (e) => {
    e.preventDefault();
    const inp = $('#igTokIn'), token = inp.value.trim();
    inp.value = '';
    if (!token) return;
    const r = await fetch('/api/instagram/token?project=' + encodeURIComponent(P), {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({token})}).then((x) => x.json()).catch(() => ({error: 'нет связи'}));
    toast(r.account ? `@${r.account} подключён — забираем публикации` : `Не подключилось: ${r.error || 'ошибка'}`);
    await loadIg(); redraw();
  };
  view.querySelectorAll('[data-igref]').forEach((b) => (b.onclick = async () => {
    b.disabled = true;
    try { await post('/api/instagram/refresh', {account: b.dataset.igref}); } catch (e) { toast(e.status === 429 ? 'Обновляли меньше 5 минут назад' : 'Не получилось обновить'); }
    const until = Date.now() + 120e3;
    const tick = async () => { await loadIg(); if (!location.hash.startsWith('#/settings')) return; if ((IG || []).some((a) => a.refreshing) && Date.now() < until) { redraw(); setTimeout(tick, 3000); } else redraw(); };
    tick();
  }));
}

    <div class="row" style="gap: 8px; padding-top: 12px; border-top: 1px solid var(--hov)"><button type="button" class="btn dark" data-copy="${esc(msg)}">Скопировать приглашение целиком</button><span class="small muted">текст со ссылками и кодом — переслать в мессенджер</span></div></div>`;

// QR drawn by qrcodejs from cdnjs, loaded only when someone asks for a QR.
function showQr(btn) {
  const box = btn.closest('div').parentElement.querySelector('.qrbox');
  const draw = () => { box.innerHTML = ''; new window.QRCode(box, {text: btn.dataset.qr, width: 180, height: 180}); box.insertAdjacentHTML('beforeend', '<span class="small muted">Наведите камеру телефона — откроется бот</span>'); };
  if (window.QRCode) return draw();
  const sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  sc.onload = draw;
  sc.onerror = () => toast('QR не загрузился — отправьте ссылку');
  document.head.append(sc);
}
const wireCopy = (root) => { root.querySelectorAll('[data-copy]').forEach((b) => (b.onclick = () => navigator.clipboard.writeText(b.dataset.copy).then(() => toast('Скопировано')))); root.querySelectorAll('[data-qr]').forEach((b) => (b.onclick = () => showQr(b))); };

// How to save a Telegram channel or chat as an archive for the project chat (bot/tgexport.mjs reads it).

// Настройки › Голос и стили, Правила (Д2): from strategy.json «voice» and PLAYBOOK.md; edits go through the project chat.
// Память › Факты и цены (LeanMemory): every fact with its source and the date it was confirmed;
// older than 30 days — «устарело?». A new price said in words goes to Claude, who updates facts.json.
async function vFacts() {
  const {facts} = await api('/api/facts');
  const ed = canEdit();
  const old = (x) => !x.at || Date.now() - new Date(x.at) > 30 * 864e5;
  const KINDF = {price: 'Цены', date: 'Даты', people: 'Люди', other: 'Другое'};
  let kind = sessionStorage.getItem('factKind') || '';
  const draw = () => {
    const list = facts.filter((x) => !kind || (kind === 'old' ? old(x) : x.kind === kind));
    const ago = (x) => { if (!x.at) return 'без даты'; const n = Math.round((Date.now() - new Date(x.at)) / 864e5); return n <= 0 ? 'сегодня' : n === 1 ? 'вчера' : n < 5 ? `${n} дня назад` : `${n} дней назад`; };
    $('#factBody').innerHTML = `
      <div class="row" style="gap: 8px; flex-wrap: wrap">${[['', 'Все'], ...Object.entries(KINDF).slice(0, 3), ['old', `Устарели · ${facts.filter(old).length}`]].map(([k, t]) => `<button type="button" class="ln-pill ${k === kind ? 'on' : ''}" data-k="${k}" style="${k === 'old' && facts.some(old) ? 'color: var(--amber)' : ''}">${t}</button>`).join('')}
        ${ed ? `<button type="button" class="ln-btn" id="fAdd" style="margin-left: auto">${svg('plus', 14)}Добавить</button>` : ''}</div>
      <div id="fNew"></div>
      <div>${list.map((x) => `<div class="ln-li" data-id="${x.id}" style="padding: 12px 4px"><span style="flex: 0 0 320px; min-width: 0">${esc(x.text)}</span><b style="font-weight: 600; flex: 0 0 170px">${esc(x.value || '—')}</b>${x.source ? `<span class="tag" style="font-size: 11px; color: var(--ink2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px">${esc(x.source)}</span>` : ''}<span class="r" style="${old(x) ? 'color: var(--amber)' : ''}">${old(x) ? 'устарело? · ' : ''}${ago(x)}${ed ? `<button type="button" class="ln-act" data-edit="${x.id}">править</button><button type="button" class="ln-act" data-ok="${x.id}" style="color: var(--muted)" title="Проверено — поставить сегодняшнюю дату">✓ верно</button>` : ''}</span></div>`).join('') || `<p class="muted" style="padding: 14px 2px">${facts.length ? 'В этом фильтре пусто.' : 'Фактов пока нет. Claude соберёт их с сайта и из брифа: цены, даты, кто есть кто.'}</p>`}</div>`;
    $('#factBody').querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { kind = b.dataset.k; sessionStorage.setItem('factKind', kind); draw(); }));
    $('#factBody').querySelectorAll('[data-ok]').forEach((b) => (b.onclick = async () => { const x = facts.find((y) => y.id === b.dataset.ok); const {fact} = await post('/api/facts/set', {id: x.id}); Object.assign(x, fact); toast('Отмечено: верно на сегодня'); draw(); }));
    const form = (x = {}) => `<form class="ln-li" id="fForm" style="gap: 8px; padding: 10px 4px"><input class="f" name="text" placeholder="Что: «Урок с инструктором, 2 ч»" value="${esc(x.text || '')}" style="flex: 0 0 300px" required><input class="f" name="value" placeholder="Сколько или когда" value="${esc(x.value || '')}" style="flex: 0 0 160px"><input class="f" name="source" placeholder="Откуда: сайт, прайс…" value="${esc(x.source || '')}" style="flex: 1"><select class="f" name="kind" style="width: auto">${Object.entries(KINDF).map(([k, t]) => `<option value="${k}" ${x.kind === k ? 'selected' : ''}>${t.toLowerCase()}</option>`).join('')}</select><button class="ln-btn p">Сохранить</button>${x.id ? '<button type="button" class="ln-btn g" id="fDel">Удалить</button>' : ''}</form>`;
    const open = (x) => {
      $('#fNew').innerHTML = form(x);
      $('#fForm').onsubmit = async (e) => { e.preventDefault(); const v = Object.fromEntries(new FormData(e.target)); await post('/api/facts/set', {id: x?.id, ...v}); vMemory('facts'); };
      $('#fDel')?.addEventListener('click', async () => { await post('/api/facts/set', {id: x.id, remove: true}); vMemory('facts'); });
      $('#fForm').text.focus();
    };
    $('#fAdd')?.addEventListener('click', () => open());
    $('#factBody').querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => open(facts.find((y) => y.id === b.dataset.edit))));
  };
  view.innerHTML = `<div style="flex: 1; overflow-y: auto"><div style="max-width: 1100px; padding: 22px 40px; display: flex; flex-direction: column; gap: 18px">
    <div id="factBody" style="display: flex; flex-direction: column; gap: 16px"></div>
    ${ed ? `<form class="box" id="fSay" style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 24px rgba(0,0,0,.04)"><input id="fSayIn" placeholder="«ски-пасс теперь 70 лари» — запомню с сегодняшней датой" style="flex: 1; border: 0; font: inherit; font-size: 15px; outline: none"><button class="icon go" style="width: 30px; height: 30px" aria-label="Отправить">↑</button></form>
      ${facts.length ? '' : '<button type="button" class="ln-btn" id="fCollect" style="align-self: flex-start">Собрать факты с сайта и из брифа</button>'}` : ''}
  </div></div>`;
  const say = (text, shown) => { sessionStorage.setItem('firstMsg:_project', JSON.stringify({text, shown})); location.hash = '#/chat/_project'; };
  $('#fSay')?.addEventListener('submit', (e) => { e.preventDefault(); const t = $('#fSayIn').value.trim(); if (t) say(`${t}\nЗапомни это в facts.json с сегодняшней датой и источником «сказал ${ME.name}».`, t); });
  $('#fCollect')?.addEventListener('click', () => say('Собери факты проекта в facts.json: цены, даты, кто есть кто — с сайта, из брифа и вышедших выпусков. У каждого источник и дата проверки. Коротко перечисли, что записал.', 'Собрать факты'));
  draw();
}

// Память › Голос и стиль (LeanVoice): how we speak, as it should and should not sound.
async function vVoice() {
  const plan = await api('/api/plan');
  const v = plan.strategy?.voice || {};

    else if (h === '#/new') await vNew();
    else if ((m = /^#\/knowledge(?:\/(\w+))?(?:\/([\w-]+))?/.exec(h))) await vKnowledge(m[1], m[2]);
    else if (h === '#/start') await vStart();
    else if (h === '#/start/done') await vStartDone();
    else if (h === '#/plan/draft') await vPlanDraft();
    else if (h === '#/plan/setup') await vPlanSetup();
    else if ((m = /^#\/plan(?:\/(m|w))?(?:\/(-?\d+))?$/.exec(h))) await vPlan(Number(m[2] || 0), m[1] !== 'w');
    else if ((m = /^#\/rubric\/([\w-]+)(?:\/(\w+))?(?:\/([\w-]+))?/.exec(h))) await vRubric(m[1], m[2] || 'overview', m[3]);
    else if ((m = /^#\/settings(?:\/(\w+))?(?:\/([\w-]+))?/.exec(h))) await vSettings(m[1], m[2]);
    else if ((m = /^#\/memory(?:\/(\w+))?(?:\/(\w+))?/.exec(h))) await vMemory(m[1], m[2]);
    else if (h === '#/inbox') await vInbox();
    else if (h === '#/help/telegram-export') vHelpExport();
    else if (h === '#/tasks') await vTasks();
    else if (h === '#/ds') location.replace('#/memory/ds');
    else if (h === '#/files') location.replace('#/memory/files');
    else if (h === '#/access') location.replace('#/settings/access');
    else if ((m = /^#\/all(?:\/(\w+))?$/.exec(h))) await vAll(m[1]);
    else if ((m = /^#\/item\/([\w-]+)/.exec(h))) await vItem(m[1]);
    else if ((m = /^#\/post\/([\w-]+)(?:\/(\w+))?/.exec(h))) await vPost(m[1], m[2]);
    else await vToday();
    const next = sessionStorage.getItem('peekNext');
    if (next) { sessionStorage.removeItem('peekNext'); peek(next); }

    view.innerHTML = `<div class="page"><p class="muted">Не получилось загрузить: ${esc(e.message)}. <a href="#/">На главную</a></p></div>`;
  }
}

// ---------- downloads on a phone ----------
// Telegram's in-app browser cannot download at all, and on an iPhone a plain download lands in
// «Files», not «Photos». So on a phone a video download is fetched here with a progress bar,
// then «Сохранить в Фото» opens the system share sheet (Save Video); in Telegram — how to get out.
const inTelegram = () => !!window.TelegramWebviewProxy || /Telegram/i.test(navigator.userAgent);
const onPhone = () => /iPhone|iPad|Android/i.test(navigator.userAgent);
function sheet(html) {
  document.querySelector('#dlSheet')?.remove();
  const el = document.createElement('div');
  el.id = 'dlSheet';
  el.style.cssText = 'position: fixed; inset: auto 12px 12px 12px; z-index: 60; padding: 16px; border-radius: 16px; background: var(--card, #fff); color: inherit; box-shadow: 0 10px 40px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 10px; font-size: 15px';
  el.innerHTML = html + '<button type="button" class="btn" id="dlClose">Закрыть</button>';
  document.body.append(el);
  el.querySelector('#dlClose').onclick = () => el.remove();
  return el;
}
document.addEventListener('click', async (e) => {
  const a = e.target.closest('a[href*="/media?"][href*="dl=1"]');
  if (!a || !onPhone()) return;
  const name = decodeURIComponent(new URL(a.href, location.href).searchParams.get('p') || '').split('/').pop();
  if (!/\.(mp4|mov)$/i.test(name)) return;
  e.preventDefault();
  if (inTelegram()) {
    const el = sheet('<b>В браузере Телеграма файлы не скачиваются</b><span class="small">Нажми <b>⋯</b> вверху справа → <b>«Открыть в Safari»</b> (или в браузере) и войди своим паролем — там скачивание работает.</span><button type="button" class="btn primary" id="dlCopy">Скопировать адрес студии</button>');
    el.querySelector('#dlCopy').onclick = async () => { try { await navigator.clipboard.writeText(location.origin + '/' + location.hash); toast('Скопировано — вставь в Safari'); } catch { toast(location.origin); } };
    return;
  }
  const el = sheet(`<b>${esc(name)}</b><div style="height: 8px; border-radius: 4px; background: var(--soft, #eee); overflow: hidden"><div id="dlBar" style="height: 100%; width: 0; background: var(--green, #2a2)"></div></div><span class="small" id="dlTxt">Загружаю…</span>`);
  try {
    const r = await fetch(a.href);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const total = Number(r.headers.get('content-length')) || 0;
    const reader = r.body.getReader();
    const parts = [];
    let got = 0;
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      parts.push(value);
      got += value.length;
      if (!el.isConnected) return reader.cancel();
      el.querySelector('#dlBar').style.width = total ? Math.round(got / total * 100) + '%' : '50%';
      el.querySelector('#dlTxt').textContent = `Загружено ${mb(got)}${total ? ' из ' + mb(total) : ''}`;
    }
    const file = new File(parts, name, {type: 'video/mp4'});
    const url = URL.createObjectURL(file);
    el.querySelector('#dlTxt').textContent = 'Готово. Сохрани видео:';
    const go = document.createElement('div');
    go.style.cssText = 'display: flex; gap: 8px; flex-wrap: wrap';
    go.innerHTML = (navigator.canShare?.({files: [file]}) ? '<button type="button" class="btn primary" id="dlShare">Сохранить в Фото / Поделиться</button>' : '') + `<a class="btn" href="${url}" download="${esc(name)}">Сохранить в Файлы</a>`;
    el.querySelector('#dlClose').before(go);
    el.querySelector('#dlShare')?.addEventListener('click', () => navigator.share({files: [file]}).catch(() => {}));
  } catch (err) {
    el.querySelector('#dlTxt').textContent = 'Не получилось загрузить: ' + err.message + '. Попробуй ещё раз.';
  }
});
window.addEventListener('hashchange', route);
// «Открыть сбоку» goes back in history; a page restored from the back-forward cache runs no route.
window.addEventListener('pageshow', (e) => { if (e.persisted && sessionStorage.getItem('peekNext')) route(); });
(async () => {
  await loadMe();
  route();
})();

</script>
</body>
