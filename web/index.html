  }
  load();
}

// What the README says about one version: its line under «## Версии», first sentence.
const versionNote = (readme, v) => {
  const line = String(readme || '').split('\n').find((l) => new RegExp(`^\\s*[-*]\\s*${v}\\b`).test(l));
  return line ? line.replace(/^\s*[-*]\s*\S+\s*(\([^)]*\))?:?\s*/, '').split(/(?<=\.)\s/)[0] : '';
};
const section = (readme, name) => (new RegExp(`^## ${name}[^\\n]*\\n([\\s\\S]*?)(?=^## |$(?![\\s\\S]))`, 'm').exec(String(readme || '')) || [])[1] || '';

// Правки по секундам (Д3, VE1, VP1–VP6): a list of notes for the next version, each at a second,
// typed or spoken (Whisper on the server), optionally with a point on the frame.
function editsBlock(edits, cur, nextV) {
  const open = edits.filter((x) => x.state === 'open'), sent = edits.filter((x) => x.state === 'sent' && x.forV === nextV), done = edits.filter((x) => x.state === 'done' && x.forV === cur.v);
  const row = (x, i, kind) => `<div class="li" style="align-items: flex-start; gap: 10px"><span class="enum ${kind}">${kind === 'done' ? '✓' : i + 1}</span><span style="flex: 1; min-width: 0"><button type="button" class="tcx" data-eseek="${x.t}">${x.stage === 'script' ? 'Сценарий' : x.stage === 'scenes' ? `Сцена ${(x.scene ?? 0) + 1}` : tc(x.t)}</button> ${esc(kind === 'done' && x.result ? x.result : x.text)}${x.quote ? ` <span class="muted">— к словам «${esc(x.quote)}»</span>` : ''}
    <div class="small muted">${kind === 'done' ? esc(x.text) : [x.voice ? 'голосом' : 'текстом', x.shape ? ({rect: 'обведено на кадре', brush: 'кистью на кадре', point: 'точка на кадре', frame: 'весь кадр'})[x.shape.kind] : x.point ? 'точка на кадре' : '', esc(x.by || '')].filter(Boolean).join(' · ')}</div></span>${kind === 'open' && canEdit() ? `<button type="button" class="btn" data-erm="${esc(x.id)}" aria-label="Убрать правку">✕</button>` : ''}</div>`;
  return `${done.length ? `<div class="blk"><span class="lbl">Что поменялось в ${esc(cur.v)} · ${done.length}</span>${done.map((x, i) => row(x, i, 'done')).join('')}</div>` : ''}
    <div class="blk"><span class="lbl">Правки к ${esc(nextV)} · ${open.length}</span>
      ${open.map((x, i) => row(x, i, 'open')).join('') || `<span class="small muted">${sent.length ? `Отправлено ${sent.length} — Claude собирает ${esc(nextV)}.` : 'Пока нет. Останови видео и скажи или напиши, что поменять.'}</span>`}
      ${sent.length && open.length ? `<span class="small muted">Ещё ${sent.length} уже у Claude.</span>` : ''}
      ${open.length && canEdit() ? `<button type="button" class="btn primary" id="eBuild" style="align-self: flex-start; margin-top: 6px">Собрать ${esc(nextV)} · правок: ${open.length}</button>` : ''}</div>`;
}

function wireEdits(id, rv, form, cur, nextV) {
  let point = null, voice = false, rec = null, pinMode = false;
  const tEl = $('#eT'), layer = $('#pinL'), hint = $('#eHint');
  const upd = () => { tEl.textContent = tc(rv.currentTime); };
  rv.addEventListener('timeupdate', upd); rv.addEventListener('seeked', upd); rv.addEventListener('pause', upd);
  $('#eText').addEventListener('focus', () => rv.pause());
  // Point on the frame: a layer over the paused video takes one click.
  $('#ePt').onclick = () => { rv.pause(); pinMode = !pinMode; layer.hidden = !pinMode; $('#ePt').classList.toggle('primary', pinMode); hint.textContent = pinMode ? 'Нажми на кадр, где поправить' : ''; };
  layer.onclick = (e) => {
    const r = layer.getBoundingClientRect();
    point = {x: Math.round(100 * (e.clientX - r.left) / r.width), y: Math.round(100 * (e.clientY - r.top) / r.height)};
    layer.innerHTML = `<span class="pin" style="left: ${point.x}%; top: ${point.y}%">●</span>`;
    pinMode = false; $('#ePt').classList.remove('primary'); layer.style.pointerEvents = 'none'; hint.textContent = `Точка: ${point.x}% слева, ${point.y}% сверху`;
  };
  // Voice: record, the server writes it out with Whisper, the text lands in the field.
  $('#eMic').onclick = async () => {
    if (rec) { rec.stop(); return; }
    rv.pause();
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); } catch { toast('Нет доступа к микрофону'); return; }
    const chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach((x) => x.stop());
      const type = rec.mimeType || 'audio/webm'; rec = null;
      $('#eMic').textContent = '… распознаю'; $('#eMic').disabled = true;
      const r = await fetch(`/api/reel/voice?project=${encodeURIComponent(P)}&reel=${encodeURIComponent(id)}`, {method: 'POST', headers: {'content-type': type}, body: new Blob(chunks, {type})}).then((x) => x.json()).catch(() => ({}));
      $('#eMic').textContent = '🎙 Голосом'; $('#eMic').disabled = false; $('#eMic').classList.remove('primary');
      if (r.text) { $('#eText').value = ($('#eText').value ? $('#eText').value + ' ' : '') + r.text; voice = true; } else toast('Не расслышал — напиши словами');
    };
    rec.start(); $('#eMic').textContent = '■ Стоп'; $('#eMic').classList.add('primary'); hint.textContent = 'Говори — нажми «Стоп», когда закончишь';
  };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const text = $('#eText').value.trim();
    if (!text) return $('#eText').focus();
    await post('/api/reel/edits', {reel: id, action: 'add', t: rv.currentTime, text, point, voice});
    renderVersions(id);
  };
}

async function renderVersions(id, data) {
  data ||= await api('/api/reel?reel=' + encodeURIComponent(id));
  const el = $('#vers');
  if (!el) return;
  const vs = data.versions;
  const kindName = {master: 'Мастер', copy: 'Instagram', cover: 'Обложка', thumb: 'Кадр', other: 'Файл'};
  const files = (v) => v.files.filter((f) => f.kind !== 'thumb' && f.kind !== 'other').sort((a, b) => ['copy', 'master', 'cover'].indexOf(a.kind) - ['copy', 'master', 'cover'].indexOf(b.kind));
  const fileLinks = (v) => files(v).map((f) => `<a class="chip" href="${f.url}&dl=1">${kindName[f.kind]} · ${mb(f.size)} ↓</a>`).join('');
  const video = (v) => v.files.filter((f) => /\.(mp4|mov|webm)$/i.test(f.name)).sort((a, b) => a.size - b.size)[0];
  const thumb = (v) => v.files.find((f) => f.kind === 'thumb' || f.kind === 'cover');
  const cur = vs[0], prev = vs.find((v) => v.state === 'previous' && video(v)), old = vs.filter((v) => v !== cur && v !== prev);
  const note = cur && versionNote(data.readme, cur.v);
  const nextV = cur ? 'v' + (Number(cur.v.replace(/\D/g, '')) + 1) : 'v1';
  const script = section(data.readme, 'Сценарий');
  const dl = cur && files(cur).find((f) => f.kind === 'copy') || cur && files(cur)[0];
  $('#dlTop').innerHTML = dl ? `<a class="btn primary" href="${dl.url}&dl=1">Скачать ${esc(cur.v)}</a>` : '';
  el.innerHTML = `<div class="rvid">${cur && video(cur)
      ? `<div class="vwrap"><video id="rv" src="${video(cur).url}" controls playsinline preload="metadata" ${thumb(cur) ? `poster="${thumb(cur).url}"` : ''}></video><div class="pinlayer" id="pinL" hidden></div></div>
        ${canEdit() ? `<form class="ecomp" id="eComp"><div class="row" style="gap: 6px"><b id="eT" class="tcx">0:00</b><span class="small muted">правка к ${esc(nextV)}</span></div>
          <textarea class="f" id="eText" rows="2" placeholder="Что поменять в этот момент — словами или голосом"></textarea>
          <div class="row" style="gap: 6px"><button type="button" class="btn" id="eMic" title="Сказать голосом">🎙 Голосом</button><button type="button" class="btn" id="ePt" title="Показать место на кадре">◎ Точка на кадре</button><button type="submit" class="btn primary" style="margin-left: auto">Добавить</button></div>
          <span class="small muted" id="eHint">Останови видео в нужный момент — правка привяжется к секунде</span></form>` : `<span class="small muted" style="text-align: center">${esc(cur.v)} · ${ago(cur.at)}</span>`}
        ${prev ? `<a class="btn" href="#/reel/${esc(id)}/compare">Сравнить с ${esc(prev.v)}</a>` : ''}
        ${canEdit() && !cur.files.some((f) => f.kind === 'master') ? `<button type="button" class="btn primary" id="acceptV">Принять ${esc(cur.v)} — собрать мастер 1080p</button>` : ''}`
      : '<div class="vph">Видео появится, когда Claude смонтирует первую версию</div>'}</div>
    <div class="rinfo">
      ${cur ? editsBlock(data.edits || [], cur, nextV) : ''}
      ${note ? `<div class="blk"><span class="lbl">Что в ${esc(cur.v)}</span><span style="font-size: 15px; line-height: 1.55">${esc(note)}</span></div>` : ''}
      <div class="blk"><span class="lbl">Версии · ${vs.length}</span>
        ${!cur ? '<p class="small muted">Версий пока нет. Напиши в чате справа, что снять или смонтировать.</p>' : `
        <div class="li" style="border-top: 0"><b style="font-weight: 600">${esc(cur.v)} · текущая</b><span class="small muted">${ago(cur.at)}</span><div class="row" style="flex-basis: 100%; gap: 8px">${fileLinks(cur)}</div></div>`}
        ${prev ? `<div class="li"><b style="font-weight: 600">${esc(prev.v)}</b><span class="small muted">${ago(prev.at)} · лёгкая копия, мастер удалён ради места</span><details style="flex-basis: 100%"><summary class="small">Смотреть для сравнения</summary><video src="${video(prev).url}" controls playsinline preload="none" style="width: 220px; border-radius: 10px; margin-top: 8px; background: #000"></video></details><div class="row" style="flex-basis: 100%; gap: 8px">${fileLinks(prev)}</div></div>` : ''}
        ${old.map((v) => `<div class="li"><div class="th" style="width: 28px; height: 50px; ${thumb(v) ? `background-image: url('${thumb(v).url}')` : ''}"></div><span style="flex: 1"><b style="font-weight: 600">${esc(v.v)}</b> <span class="small muted">· ${ago(v.at)} · кадр и снимок проекта${v.archived ? ` · освобождено ${mb(v.archived.freed)}` : ''}</span></span>${canEdit() ? `<button type="button" class="btn" data-rebuild="${esc(v.v)}">Пересобрать</button>` : ''}</div>`).join('')}
        <a class="small muted" href="#/settings/files" style="padding-top: 8px">Место на сервере →</a></div>
      ${script.trim() ? `<div class="blk"><span class="lbl">Сценарий</span><div class="md" style="font-size: 14px">${md(script)}</div></div>` : ''}
    </div>`;
  $('#acceptV')?.addEventListener('click', () => chatOf().say(`Принимаю ${cur.v}. Собери мастер 1080p этой версии (без --draft) и скажи, когда будет готов.`, `Принять ${cur.v}`));
  const rv = $('#rv'), form = $('#eComp');
  if (rv && form) wireEdits(id, rv, form, cur, nextV);
  el.querySelectorAll('[data-erm]').forEach((b) => (b.onclick = async () => { await post('/api/reel/edits', {reel: id, action: 'remove', id: b.dataset.erm}); renderVersions(id); }));
  el.querySelectorAll('[data-eseek]').forEach((b) => (b.onclick = () => { if (rv) { rv.currentTime = Number(b.dataset.eseek); rv.pause(); } }));
  $('#eBuild')?.addEventListener('click', async () => {
    const open = (data.edits || []).filter((x) => x.state === 'open');
    await post('/api/reel/edits', {reel: id, action: 'send', forV: nextV});
    chatOf().say(`Правки к ${nextV}:\n${open.map((x, i) => `${i + 1}. ${tc(x.t)} — ${x.text}${x.point ? ` (точка на кадре: ${x.point.x}% слева, ${x.point.y}% сверху)` : ''}`).join('\n')}\nСобери ${nextV} черновиком и отметь в edits.json, что сделано.`, `Собрать ${nextV} · правок: ${open.length}`);
    renderVersions(id);
  });
  el.querySelectorAll('[data-rebuild]').forEach((b) => (b.onclick = () => {
    const box = $('#chatHost > div');
    box.say(`Пересобери версию ${b.dataset.rebuild} этого рилса из её снимка versions/${b.dataset.rebuild}/project-snapshot/ и пришли её.`, `Пересобрать ${b.dataset.rebuild}`);
  }));
}

async function vChat(key) {
  title(key === '_project' ? 'Общий чат' : 'Чат');
  view.innerHTML = `<div class="work"><div class="chat"><div class="chead"><div style="flex: 1"><div class="small muted">${esc((PROJECTS.find((x) => x.slug === P) || {}).name)}</div><h1 style="font-size: 20px">Общий чат проекта</h1></div>${canEdit() ? '<button type="button" class="btn" id="resetChat">Новый чат</button>' : ''}</div>
    <div class="ctx">Идеи, бриф, правила, настройки. <a href="#/new">Новый рилс</a> начинается в своём чате.</div><div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></div></div>`;

    ['carousel', 'Карусель', '5–7 слайдов из шаблонов дизайн-системы.', '~30 минут · 3 этапа'],

      <a class="btn" href="#/chat/_project" id="more">Попросить новые идеи</a></div>
    <div class="row" style="gap: 14px; align-items: stretch">${types.map(([k, t, d, m], i) => `<button type="button" class="tcard ${i ? '' : 'on'}" data-kind="${k}" ${k === 'story' ? 'disabled' : ''}><span style="color: var(--ink)">${svg(k, 22)}</span><b style="font-size: 17px; font-weight: 600">${t}</b><span class="small" style="color: var(--ink2); line-height: 1.5">${d}</span><span class="small muted" style="margin-top: auto">${m}</span></button>`).join('')}</div>
    <section id="postNew" class="card" style="display: none; flex-direction: column; gap: 14px; max-width: 820px">
      <label class="small muted" style="display: flex; flex-direction: column; gap: 6px">Тема или пара слов<input class="f" id="pTopic" placeholder="«первый день смены» или «что взять в лагерь»"></label>
      <div><div class="small muted" style="padding-bottom: 6px">Из чего</div><div class="row" style="gap: 8px" id="pFrom">${[['idea', 'Из идеи в бэклоге'], ['photos', 'Из своих фото'], ['scratch', 'С нуля']].map(([k, t], i) => `<button type="button" class="chip ${i === 2 ? 'on' : ''}" data-from="${k}" style="${i === 2 ? 'border-color: var(--ink); font-weight: 600' : ''}">${t}</button>`).join('')}</div></div>
      <select class="f" id="pIdea" style="display: none">${ideas.map((x) => `<option>${esc(x.title.replace(/^[^\p{L}\d«"]+/u, ''))}</option>`).join('')}</select>
      <div class="row"><button type="button" class="btn primary" id="pGo" style="min-height: 46px">Начать</button><span class="small muted" id="pHint">У поста будет свой чат: Claude напишет три варианта текста.</span></div>
    </section>
    <div class="split">
      <section class="side2" style="display: flex; flex-direction: column; gap: 10px" aria-label="Идеи">
        <label class="small muted" style="display: flex; flex-direction: column; gap: 6px">Своя идея<input class="f" id="own" placeholder="Опиши в двух словах или вставь ссылку"></label>
        <div class="small muted" style="margin-top: 6px">Из бэклога · ${ideas.length}</div>
        <div id="ideas" style="display: flex; flex-direction: column; gap: 8px; max-height: 64vh; overflow-y: auto"></div>
      </section>
      <section class="grow card" id="detail" style="display: flex; flex-direction: column; gap: 14px"></section>
    </div></div>`;
  const list = $('#ideas');
  ideas.forEach((x, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'idea';
    b.innerHTML = `<b style="font-weight: 600">${esc(x.title.replace(/^[^\p{L}\d«"]+/u, ''))}</b><div class="small muted">${esc(x.format || x.section)}</div>`;
    b.onclick = () => { pick = x; list.querySelectorAll('.idea').forEach((y) => y.classList.remove('on')); b.classList.add('on'); $('#own').value = ''; detail(); };
    list.append(b);
    if (i === 0) { pick = x; b.classList.add('on'); }
  });
  $('#own').oninput = () => { if ($('#own').value.trim()) { pick = null; list.querySelectorAll('.idea').forEach((y) => y.classList.remove('on')); } detail(); };
  function detail() {
    const own = $('#own').value.trim();
    const t = own || pick?.title.replace(/^[^\p{L}\d«"]+/u, '') || '';
    $('#detail').innerHTML = !t ? '<p class="muted">Выбери идею слева или напиши свою.</p>' : `
      <div><div class="small muted">Рилс ${String(Math.max(0, ...OV.reels.map((r) => Number(r.num))) + 1).padStart(2, '0')} · новый чат</div><h2 style="font-size: 22px; margin-top: 4px">${esc(t)}</h2></div>
      ${pick && !own ? `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 24px; font-size: 14px">
        ${pick.hook ? `<div><div class="small muted">Хук</div>${esc(pick.hook)}</div>` : ''}${pick.plot ? `<div><div class="small muted">Сюжет</div>${esc(pick.plot.slice(0, 320))}${pick.plot.length > 320 ? '…' : ''}</div>` : ''}</div>` : ''}
      <div style="border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px">
        <div class="small muted" style="padding: 8px 0 2px">Новый чат начнётся с</div>
        <div class="li"><span style="flex: 1">Бриф, правила и дизайн-система проекта</span><span class="small muted">всегда</span></div>
        <label class="li"><span style="flex: 1">Взять вид рилса</span><select class="f" id="like" style="max-width: 260px"><option value="">— не нужно —</option>${OV.reels.map((r) => `<option value="${esc(r.id)}">${esc(r.num)} ${esc(r.title)}</option>`).join('')}</select></label>
      </div>
      <div class="row"><button type="button" class="btn primary" data-mode="now" style="min-height: 46px">Сделать сразу</button><button type="button" class="btn" data-mode="steps" style="min-height: 46px">Настроить по шагам: вид, музыка</button></div>
      <p class="small muted" style="margin: 0">У рилса будет свой чат. Общее — правила, вкус, использованные треки — Claude записывает в проект, это видят все чаты.</p>`;
    $('#detail').querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => start(b.dataset.mode, t, own)));
  }
  function start(mode, t, own) {
    const key = 'new-' + Date.now();
    const like = $('#like').value;
    const text = [own ? `Новый рилс по моей идее: ${own}` : `Новый рилс по идее «${t}» из ideas.md.`,
      like ? `Возьми вид (палитру, шрифты, плашки, переходы) рилса reels/${like}/.` : '',
      mode === 'now' ? '(tapped keyboard button "🚀 Сделать сразу")' : '(tapped keyboard button "🎛 Настроить по шагам")'].filter(Boolean).join('\n');
    sessionStorage.setItem('firstMsg:' + key, JSON.stringify({text, shown: `${t}\n${mode === 'now' ? 'Сделать сразу' : 'Настроить по шагам'}${like ? ' · вид как у ' + like.slice(0, 2) : ''}`}));
    location.hash = '#/reel/' + key;
  }
  detail();
  let kind = 'reel', from = 'scratch';
  view.querySelectorAll('[data-kind]').forEach((b) => (b.onclick = () => {
    kind = b.dataset.kind;
    view.querySelectorAll('[data-kind]').forEach((x) => x.classList.toggle('on', x === b));
    $('#postNew').style.display = kind === 'reel' ? 'none' : 'flex';
    view.querySelector('.split').style.display = kind === 'reel' ? '' : 'none';
    $('#pHint').textContent = kind === 'carousel' ? 'Claude разобьёт тему на слайды и подберёт шаблоны.' : 'У поста будет свой чат: Claude напишет три варианта текста.';
  }));
  $('#pFrom').querySelectorAll('[data-from]').forEach((b) => (b.onclick = () => {
    from = b.dataset.from;
    $('#pFrom').querySelectorAll('[data-from]').forEach((x) => { x.style.borderColor = x === b ? 'var(--ink)' : ''; x.style.fontWeight = x === b ? '600' : ''; });
    $('#pIdea').style.display = from === 'idea' ? '' : 'none';
  }));
  $('#pGo').onclick = async () => {
    const topic = from === 'idea' ? $('#pIdea').value : $('#pTopic').value.trim();
    if (!topic) return $('#pTopic').focus();
    const k = kind === 'carousel' ? 'carousel' : from === 'photos' ? 'photo' : 'text';
    const {id} = await post('/api/post/new', {kind: k, title: topic});
    const ask = k === 'carousel' ? `Новая карусель: «${topic}». Разбей тему на 5–7 слайдов и подбери шаблон каждому (POSTS.md).`
      : k === 'photo' ? `Новый пост с фото: «${topic}». Я загружу фото на странице — выбери лучшее и напиши три варианта текста.`
      : `Новый пост: «${topic}». Напиши три варианта текста в разных стилях, первым — стиль рубрики.`;
    sessionStorage.setItem('firstMsg:post-' + id, JSON.stringify({text: ask, shown: topic}));
    location.hash = '#/post/' + id;
  };
}

// Стратегия (StratHub, StratPlatforms, StratRubrics, StratRhythm): strategy.json, edited through the project chat.
const DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const rubricColor = (st, id) => (st.rubrics || []).find((x) => x.id === id || x.name === id)?.color || '#A3A3A3';
const rubricName = (st, id) => (st.rubrics || []).find((x) => x.id === id || x.name === id)?.name || id || '';

// «Шаблон» of a rubric (TEMPLATES.md): its reels are built from this template's scenes.
function tplBlock(cur, list) {
  const t = list.find((x) => x.id === cur.template);
  const scenes = (x) => x.scenes.map((s) => `<span class="tchip mb" title="${esc(s.kind)}">${s.lock ? '🔒 ' : ''}${esc({hook: 'Хук', photo: 'Кадр', clip: 'В кадре', base: 'Основа', item: 'Пункт', total: 'Итог', tip: 'Совет', compare: 'Сравнение', question: 'Вопрос', answer: 'Ответ', fact: 'Факт', cta: 'Призыв'}[s.kind] || s.kind)}${s.repeat ? ` ×${s.repeat[0]}–${s.repeat[1]}` : ''}</span>`).join(' ');
  return `<div class="blk"><span class="lbl">Шаблон ролика</span>
    <div class="row" style="gap: 10px"><select class="f" id="tplSel" data-rubric="${esc(cur.id)}" style="width: auto">${['', ...list.map((x) => x.id)].map((id) => `<option value="${esc(id)}" ${id === (cur.template || '') ? 'selected' : ''}>${id ? esc(list.find((x) => x.id === id).name) : 'Без шаблона — Claude пишет ролик целиком'}</option>`).join('')}</select>${t ? `<span class="small muted">${esc(t.about)}</span>` : ''}</div>
    ${t ? `<div class="row" style="gap: 6px; flex-wrap: wrap">${scenes(t)}</div><span class="small muted">Новый ролик рубрики собирается из этих сцен: материал раскладывается по ним, 🔒 берутся из рубрики. Подходит для: ${esc(t.fits)}.</span>` : '<span class="small muted">С шаблоном ролик собирается быстрее и всегда в виде рубрики.</span>'}</div>`;
}

  const week = () => `<div class="pweekwrap"><div style="display: grid; grid-template-columns: repeat(7, minmax(130px, 1fr)); gap: 10px">${DAYS.map((d, i) => `<div style="display: flex; flex-direction: column; gap: 8px"><span class="small muted" style="font-weight: 600">${d}</span>${slots.filter((x) => Number(x.day) === i + 1).sort((a, b) => String(a.time).localeCompare(String(b.time))).map((x) => `<span style="border-left: 4px solid ${rubricColor(st, x.rubric)}; background: var(--side); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.35; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; gap: 5px; align-items: center">${svg(x.kind || 'photo', 12)}<b style="font-weight: 600">${esc(rubricName(st, x.rubric))}</b></span><span class="muted">${esc([x.time, (plats.find((p) => p.id === x.platform) || {}).name].filter(Boolean).join(' · '))}</span></span>`).join('') || '<span class="small muted">—</span>'}</div>`).join('')}</div></div>`;

// Календарь (CleanPlan): a week of reels and posts from plan.json, empty rhythm slots, events; drag to a day.
async function vPlan(offset = 0) {
  title('Календарь');
  const plan = await api('/api/plan');
  const st = plan.strategy || {}, slots = st.rhythm?.slots || [];
  const now = new Date(); const mon = new Date(now); mon.setHours(0, 0, 0, 0); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7) + offset * 7);
  const days = Array.from({length: 7}, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const onDay = (d) => plan.items.filter((x) => x.at && x.at.slice(0, 10) === ymd(d)).sort((a, b) => a.at.localeCompare(b.at));
  const href = (x) => x.kind === 'reel' ? '#/reel/' + x.id : '#/post/' + x.id;
  const chip = (x) => `<a class="pchip" draggable="true" data-key="${esc(x.key)}" href="${href(x)}" style="border-left-color: ${rubricColor(st, x.rubric)}"><span style="display: flex; gap: 5px; align-items: center">${svg(x.kind, 12)}<b>${esc(x.title)}</b></span><span class="muted">${x.at ? esc(x.at.slice(11, 16)) : ''}${x.rubric ? ' · ' + esc(rubricName(st, x.rubric)) : ''}</span></a>`;
  const gaps = [];
  const cells = days.map((d, i) => {
    const items = onDay(d);
    const free = slots.filter((s) => Number(s.day) === i + 1 && !items.some((x) => (x.rubric === s.rubric || rubricName(st, x.rubric) === rubricName(st, s.rubric))));
    free.forEach((s) => gaps.push([d, s]));
    const ev = (plan.events || []).concat(st.events || []).filter((e) => e.date === ymd(d));
    const today = ymd(d) === ymd(new Date());
    return `<div class="pday${today ? ' today' : ''}" data-day="${ymd(d)}"><div class="dh"><b>${d.getDate()}</b><span>${DAYS[i].toLowerCase()}${today ? ' · сегодня' : ''}</span></div>
      ${ev.map((e) => `<span class="small" style="background: var(--blueBg); color: var(--blue); border-radius: 6px; padding: 3px 6px; font-weight: 600">${esc(e.title)}</span>`).join('')}
      ${items.map(chip).join('')}
      ${free.map((s) => `<button type="button" class="pslot" data-fill="${ymd(d)}|${esc(s.time || '')}|${esc(rubricName(st, s.rubric))}|${esc(s.kind || '')}" style="border-color: ${rubricColor(st, s.rubric)}"><span style="display: flex; gap: 5px; align-items: center">${svg(s.kind || 'photo', 12)}${esc(rubricName(st, s.rubric))}</span><span class="muted">${esc(s.time || '')} · пусто</span></button>`).join('')}</div>`;
  }).join('');
  const undated = plan.items.filter((x) => !x.at && !['done', 'published'].includes(x.status)).slice(0, 12);
  const range = `${days[0].getDate()} ${days[0].toLocaleDateString('ru', {month: 'long'}).replace(/ь$/, 'я')} – ${days[6].getDate()} ${days[6].toLocaleDateString('ru', {month: 'long'})}`;
  const filled = slots.length - gaps.length;
  view.innerHTML = `<div class="work"><div class="rmain"><div class="chead" style="padding: 0 28px; min-height: 56px"><b style="font-size: 14px">Календарь</b><span class="row" style="gap: 4px; margin-left: 12px"><a class="btn" href="#/plan/${offset - 1}" aria-label="Прошлая неделя">‹</a><a class="btn" href="#/plan">Сегодня</a><a class="btn" href="#/plan/${offset + 1}" aria-label="Следующая неделя">›</a></span><span class="muted" style="margin-left: 10px">${range}</span><span style="flex: 1"></span>${slots.length ? `<span class="small muted">заполнено ${filled} из ${slots.length} мест</span>` : '<a class="btn" href="#/knowledge/rhythm">Задать ритм недели</a>'}</div>
      <div style="flex: 1; overflow-y: auto; padding: 22px 28px; display: flex; flex-direction: column; gap: 22px">
        <div class="pweekwrap"><div class="pweek">${cells}</div></div>
        <div class="small muted">${(st.rubrics || []).map((x) => `<span style="display: inline-flex; align-items: center; gap: 5px; margin-right: 14px"><span style="width: 8px; height: 8px; border-radius: 3px; background: ${esc(x.color || '#A3A3A3')}"></span>${esc(x.name)}</span>`).join('')} пунктир — пустое место, клик — чем заполнить; перетащи выпуск на нужный день</div>
        <div class="split" style="gap: 24px">
          <div class="blk" style="flex: 1"><span class="lbl">Требует внимания · ${gaps.length + undated.length ? gaps.length : 0}</span>${gaps.map(([d, s]) => `<div class="li"><span style="width: 8px; height: 8px; border-radius: 3px; background: ${rubricColor(st, s.rubric)}"></span><span style="flex: 1">Пустое место: ${esc(rubricName(st, s.rubric))}</span><span class="small muted">${DAYS[(d.getDay() + 6) % 7].toLowerCase()} ${esc(s.time || '')}</span></div>`).join('') || '<span class="small muted">Всё на месте.</span>'}</div>
          <div class="blk pdrop" style="flex: 1" data-day=""><span class="lbl">Без даты · ${undated.length}</span><div style="display: flex; flex-direction: column; gap: 6px">${undated.map(chip).join('') || '<span class="small muted">Пусто.</span>'}</div></div>
        </div></div></div>
    <aside class="chatcol" aria-label="Чат плана"><div class="chead" style="padding: 12px 16px"><b style="flex: 1">Чат плана</b></div><div id="chatHost" style="display: flex; flex-direction: column; flex: 1; min-height: 0"></div></aside></div>`;
  const box = chatBox('_project', {onDone: () => { sidebar(); vPlan(offset); }});
  $('#chatHost').append(box);
  view.querySelectorAll('[data-fill]').forEach((b) => (b.onclick = () => { const [d, t, r, k] = b.dataset.fill.split('|'); box.say(`Чем заполнить пустое место ${d} ${t}: рубрика «${r}»${k ? ', ' + KIND[k] : ''}? Предложи 2–3 варианта из идей и выпусков в работе.`, `Чем заполнить: ${r}, ${d.slice(5)} ${t}`); }));
  let drag = null;
  view.querySelectorAll('.pchip').forEach((c) => { c.ondragstart = () => { drag = c.dataset.key; }; });
  view.querySelectorAll('.pday, .pdrop').forEach((d) => {
    d.ondragover = (e) => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = async (e) => {
      e.preventDefault(); d.classList.remove('over');
      if (!drag || !canEdit()) return;
      const it = plan.items.find((x) => x.key === drag);
      const time = it?.at?.slice(11, 16) || slots.find((s) => s.rubric === it?.rubric)?.time || '19:00';
      await post('/api/plan/set', {key: drag, at: d.dataset.day ? `${d.dataset.day}T${time}` : ''});
      vPlan(offset);
    };
  });
}

    ${web ? step(tg ? (pin ? 4 : 3) : 1, tg ? 'Вход с компьютера' : 'Ссылка для входа', `${field(web)}<span class="small muted">Открыть в браузере на компьютере → «Войти». Вход запомнится на этом устройстве.</span>`) : ''}

// QR drawn by qrcodejs from cdnjs, loaded only when someone asks for a QR.
function showQr(btn) {
  const box = btn.closest('div').parentElement.querySelector('.qrbox');
  const draw = () => { box.innerHTML = ''; new window.QRCode(box, {text: btn.dataset.qr, width: 180, height: 180}); box.insertAdjacentHTML('beforeend', '<span class="small muted">Наведите камеру телефона — откроется бот</span>'); };
  if (window.QRCode) return draw();
  const sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  sc.onload = draw;
  sc.onerror = () => toast('QR не загрузился — отправьте ссылку');
  document.head.append(sc);
}
const wireCopy = (root) => { root.querySelectorAll('[data-copy]').forEach((b) => (b.onclick = () => navigator.clipboard.writeText(b.dataset.copy).then(() => toast('Скопировано')))); root.querySelectorAll('[data-qr]').forEach((b) => (b.onclick = () => showQr(b))); };

// ---------- folding the sidebar and the chat (remembered per browser) ----------
const UI = {get: (k) => { try { return localStorage.getItem('ui.' + k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem('ui.' + k, v); } catch {} }};
function foldSide(on = !document.body.classList.contains('side-mini')) {
  document.body.classList.toggle('side-mini', on);
  UI.set('side', on ? 'mini' : 'open');
  document.querySelectorAll('[data-fold="side"]').forEach((b) => { b.title = on ? 'Развернуть панель (⌘\\)' : 'Свернуть панель (⌘\\)'; b.setAttribute('aria-label', b.title); });
}
function foldChat(on = !document.body.classList.contains('chat-mini')) {
  document.body.classList.toggle('chat-mini', on);
  UI.set('chat', on ? 'mini' : 'open');
}
// Every chat column gets a fold button in its header and a thin rail to bring it back.
function decorateChat() {
  document.querySelectorAll('aside.chatcol').forEach((a) => {
    if (a.querySelector('.crail')) return;
    const name = a.getAttribute('aria-label') || 'Чат';
    a.insertAdjacentHTML('afterbegin', `<button type="button" class="crail" title="Развернуть чат (⌘⇧\\)" aria-label="Развернуть: ${esc(name)}">${svg('chat2', 18)}<span>${esc(name)}</span></button>`);
    a.querySelector('.crail').onclick = () => foldChat(false);
    const head = a.querySelector('.chead');
    if (head) { head.insertAdjacentHTML('beforeend', `<button type="button" class="fold" title="Свернуть чат (⌘⇧\\)" aria-label="Свернуть чат">${svg('panelR', 16)}</button>`); head.lastElementChild.onclick = () => foldChat(true); }
  });
}
document.addEventListener('click', (e) => { if (e.target.closest('[data-fold="side"]')) foldSide(); });
document.addEventListener('keydown', (e) => {
  if (!(e.metaKey || e.ctrlKey) || e.key !== '\\' && e.code !== 'Backslash') return;
  e.preventDefault();
  if (e.shiftKey) foldChat(); else foldSide();
});
new MutationObserver(decorateChat).observe(document.getElementById('view'), {childList: true, subtree: true});
document.body.classList.toggle('side-mini', UI.get('side') === 'mini');
document.body.classList.toggle('chat-mini', UI.get('chat') === 'mini');

async function route() {
  document.body.classList.remove('menu');
  const h = location.hash || '#/';
  try {
    await sidebar();
    foldSide(document.body.classList.contains('side-mini'));
    let m;
    view = $('#view');
    if (isMember()) await vMember(h);
    else if ((m = /^#\/reel\/([\w-]+)(?:\/(\w+))?/.exec(h))) await vReel(m[1], m[2]);
    else if ((m = /^#\/chat\/(_project)/.exec(h))) await vChat(m[1]);
    else if (h === '#/new') await vNew();
    else if ((m = /^#\/knowledge(?:\/(\w+))?(?:\/([\w-]+))?/.exec(h))) await vKnowledge(m[1], m[2]);
    else if ((m = /^#\/plan(?:\/(-?\d+))?$/.exec(h))) await vPlan(Number(m[1] || 0));
    else if ((m = /^#\/rubric\/([\w-]+)/.exec(h))) await vRubric(m[1]);
    else if ((m = /^#\/settings(?:\/(\w+))?(?:\/([\w-]+))?/.exec(h))) await vSettings(m[1], m[2]);
    else if (h === '#/inbox') await vInbox();
    else if (h === '#/tasks') await vTasks();
    else if (h === '#/ds') location.replace('#/settings/ds');
    else if (h === '#/files') location.replace('#/settings/files');
    else if (h === '#/access') location.replace('#/settings/access');
    else if ((m = /^#\/all(?:\/(reels|posts))?$/.exec(h))) await vAll(m[1]);
    else if ((m = /^#\/post\/([\w-]+)(?:\/(\w+))?/.exec(h))) await vPost(m[1], m[2]);
    else await vToday();
  } catch (e) {
    view.innerHTML = `<div class="page"><p class="muted">Не получилось загрузить: ${esc(e.message)}. <a href="#/">На главную</a></p></div>`;
  }
}
$('#menuBtn').onclick = () => document.body.classList.toggle('menu');
document.addEventListener('click', (e) => { if (document.body.classList.contains('menu') && !e.target.closest('nav.side, #menuBtn')) document.body.classList.remove('menu'); });
window.addEventListener('hashchange', route);
(async () => {
  await loadMe();
  route();
})();
</script>
</body>
</html>
